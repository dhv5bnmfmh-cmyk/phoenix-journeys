name: Temporary Summer Palace Six Stage Fix

on:
  push:
    branches:
      - fix/summer-palace-six-stage-flow

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: fix/summer-palace-six-stage-flow
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact flow correction
        shell: python
        run: |
          from pathlib import Path

          screen_path = Path('app/lib/screens/journey_screen.dart')
          screen = screen_path.read_text(encoding='utf-8')
          old_screen = "  bool get _isSummerPalacePilot =>\n      _experience.id == 'beijing-summer-palace';"
          new_screen = "  // Pilot N1 content remains, but every Journey now uses the stable six-stage flow.\n  bool get _isSummerPalacePilot => false;"
          if screen.count(old_screen) != 1:
              raise SystemExit(f'Expected exactly one Pilot flow anchor, found {screen.count(old_screen)}')
          screen_path.write_text(screen.replace(old_screen, new_screen), encoding='utf-8')

          state_path = Path('app/lib/state/app_state.dart')
          state = state_path.read_text(encoding='utf-8')
          old_state = """  String _journeyLabelFor(int step, JourneyCompositeSubstage substage) {
    if (activeJourneyId == 'beijing-summer-palace') {
      if (step == 3) {
        return substage == JourneyCompositeSubstage.challenge ? '挑战' : '思考';
      }
      if (step == 4) {
        return substage == JourneyCompositeSubstage.memory ? '回忆' : '表达';
      }
    }
    return journeyStepLabels[_safeJourneyStep(step)];
  }
"""
          new_state = """  String _journeyLabelFor(int step, JourneyCompositeSubstage substage) {
    return journeyStepLabels[_safeJourneyStep(step)];
  }
"""
          if state.count(old_state) != 1:
              raise SystemExit(f'Expected exactly one Journey label anchor, found {state.count(old_state)}')
          state_path.write_text(state.replace(old_state, new_state), encoding='utf-8')

          workflow = Path('.github/workflows/temporary-summer-palace-six-stage.yml')
          workflow.unlink()

      - name: Verify exact changed paths
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < <(git diff --name-only | sort)
          printf '%s\n' "${paths[@]}"
          test "${#paths[@]}" -eq 3
          test "${paths[0]}" = ".github/workflows/temporary-summer-palace-six-stage.yml"
          test "${paths[1]}" = "app/lib/screens/journey_screen.dart"
          test "${paths[2]}" = "app/lib/state/app_state.dart"
          git diff --check

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate application
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/screens/journey_screen.dart app/lib/state/app_state.dart .github/workflows/temporary-summer-palace-six-stage.yml
          git commit -m 'fix(journey): unify Summer Palace with six-stage flow'
          git push origin HEAD:fix/summer-palace-six-stage-flow
