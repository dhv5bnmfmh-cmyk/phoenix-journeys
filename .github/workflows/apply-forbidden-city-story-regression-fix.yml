name: Apply Forbidden City Story Regression Fix

on:
  push:
    branches:
      - preview/batch-1-final-founder-review
    paths:
      - '.github/workflows/apply-forbidden-city-story-regression-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview/batch-1-final-founder-review
          fetch-depth: 0

      - name: Restore standard Phoenix Story presentation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          interactive = Path('app/lib/widgets/interactive_story_text.dart')
          text = interactive.read_text()
          bypass = """  double _targetRevealCursor(int? revealEnd) {\n    if (widget.narrationContentId == 'story') {\n      return (widget.text.length + cinematicRevealTailLength).toDouble();\n    }\n    final resolved = (revealEnd ?? widget.text.length).clamp(\n"""
          normal = """  double _targetRevealCursor(int? revealEnd) {\n    final resolved = (revealEnd ?? widget.text.length).clamp(\n"""
          if bypass not in text:
              raise SystemExit('Story cinematic reveal bypass pattern not found')
          interactive.write_text(text.replace(bypass, normal, 1))

          journey = Path('app/lib/screens/journey_screen.dart')
          text = journey.read_text()

          text = text.replace('  int _storySegmentIndex = 0;\n', '', 1)
          text = text.replace('      _storySegmentIndex = 0;\n', '', 1)

          start = text.index('  int get _safeStorySegmentIndex {')
          end = text.index('  Future<void> _loadLanguageProfile() async {', start)
          replacement = """  List<NarrationItem> get _storyPlaybackItems => _storyNarrationItems;\n\n"""
          text = text[:start] + replacement + text[end:]

          start = text.index('  Widget _storyPage() {')
          end = text.index('  Widget _defaultStoryPage() {', start)
          replacement = """  Widget _storyPage() => _defaultStoryPage();\n\n"""
          text = text[:start] + replacement + text[end:]

          journey.write_text(text)
          PY

      - name: Guard scope and architecture
        shell: bash
        run: |
          git diff -- app/lib/widgets/interactive_story_text.dart app/lib/screens/journey_screen.dart
          ! grep -q "Widget _forbiddenCityStoryPage" app/lib/screens/journey_screen.dart
          ! grep -q "_storySegmentIndex" app/lib/screens/journey_screen.dart
          ! grep -A6 "double _targetRevealCursor" app/lib/widgets/interactive_story_text.dart | grep -q "narrationContentId == 'story'"
          grep -q "List<NarrationItem> get _storyPlaybackItems => _storyNarrationItems;" app/lib/screens/journey_screen.dart
          grep -q "Widget _storyPage() => _defaultStoryPage();" app/lib/screens/journey_screen.dart

      - name: Commit regression fix
        shell: bash
        run: |
          git config user.name "Phoenix CI"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/widgets/interactive_story_text.dart app/lib/screens/journey_screen.dart
          git commit -m "fix: restore standard Phoenix Story experience for Forbidden City"
          git push origin HEAD:preview/batch-1-final-founder-review
