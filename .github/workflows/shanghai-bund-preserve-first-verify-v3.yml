name: Shanghai Bund Preserve-First Verify V3

on:
  push:
    branches:
      - automation/shanghai-bund-preserve-first-verify-v3
    paths:
      - '.github/scripts/shanghai_bund_preserve_first_v3.py'
      - '.github/workflows/shanghai-bund-preserve-first-verify-v3.yml'

permissions:
  contents: write

env:
  BASE_SHA: 8385036ed574997bac5ee97a02e1230d90230d3c
  VALIDATED_BRANCH: automation/shanghai-bund-validated-product

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out helper only to capture generator
        uses: actions/checkout@v6
        with:
          ref: automation/shanghai-bund-preserve-first-verify-v3
          fetch-depth: 0

      - name: Capture helper generator outside repository tree
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/shanghai_bund_preserve_first_v3.py /tmp/shanghai_bund_preserve_first_v3.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('/tmp/shanghai_bund_preserve_first_v3.py')
          text = path.read_text()

          old = '''memory_match = re.search(r"^BatchOneJourneyMemorySpec\\? batchOneMemorySpecFor\\(", runtime, re.M)
          assert memory_match
          brace = runtime.find("{", memory_match.end())
          assert brace >= 0
          early = """'''
          new = '''memory_match = re.search(r"^BatchOneJourneyMemorySpec\\? batchOneMemorySpecFor\\(", runtime, re.M)
          assert memory_match
          parameter_open = runtime.find("(", memory_match.start())
          assert parameter_open >= 0
          parameter_close = find_matching(runtime, parameter_open, "(", ")")
          brace = runtime.find("{", parameter_close + 1)
          assert brace >= 0
          early = """'''
          if old not in text:
              raise SystemExit('helper structural-body patch target not found')
          text = text.replace(old, new, 1)

          replacements = {
              "外滩现海关大楼于1927年建成。它见证了更早开始、又持续变化的上海对外贸易与城市史，因此不能把1843年开埠时的外滩与1927年的现建筑当成同一个时间切片。":
                  "外滩现海关大楼于1927年建成。今天看到的这座建筑属于二十世纪的城市历史，理解外滩时要把现存建筑的建成年代与更早的滨水贸易历史分开。",
              "Tòa nhà Hải quan hiện nay ở Ngoại Than được hoàn thành năm 1927; không thể gộp Ngoại Than năm 1843 và công trình hiện tại vào cùng một lát cắt thời gian.":
                  "Tòa nhà Hải quan hiện nay ở Ngoại Than được hoàn thành năm 1927. Công trình còn thấy ngày nay thuộc lịch sử đô thị thế kỷ XX, vì vậy niên đại của công trình hiện hữu cần được phân biệt với lịch sử thương mại ven sông sớm hơn.",
              "The present Bund Customs House was completed in 1927, so the Bund of 1843 and the current building cannot be collapsed into the same historical moment.":
                  "The present Bund Customs House was completed in 1927. The building visible today belongs to twentieth-century urban history, so its construction date should be distinguished from earlier waterfront trade history on the Bund.",
              "Wàitān xiàn Hǎiguān Dàlóu yú yī jiǔ èr qī nián jiànchéng. Tā jiànzhèng le gèng zǎo kāishǐ, yòu chíxù biànhuà de Shànghǎi duìwài màoyì yǔ chéngshì shǐ, yīncǐ bùnéng bǎ yī bā sì sān nián kāibù shí de Wàitān yǔ yī jiǔ èr qī nián de xiàn jiànzhù dàngchéng tóng yí gè shíjiān qiēpiàn.":
                  "Wàitān xiàn Hǎiguān Dàlóu yú yī jiǔ èr qī nián jiànchéng. Jīntiān kàndào de zhè zuò jiànzhù shǔyú èrshí shìjì de chéngshì lìshǐ, lǐjiě Wàitān shí yào bǎ xiàncún jiànzhù de jiànchéng niándài yǔ gèng zǎo de bīnshuǐ màoyì lìshǐ fēnkāi.",
              "外滩现海关大楼于1927年建成；建筑、黄浦江航运与轮渡共同形成西岸的贸易城市界面，因此不能把1843年的外滩与现建筑混成同一时间切片。":
                  "外滩现海关大楼于1927年建成；这座二十世纪建筑与黄浦江航运、轮渡共同构成今天可见的西岸城市界面，现存建筑的年代需要与更早的外滩历史分开理解。",
              "  <int>[1, 6, 7],":
                  "  <int>[1, 7],",
              "      10: <String>['1843', '1927', '1990'],":
                  "      10: <String>['1843', '1990'],",
              "      expect(content.discoveries.length, level <= 2 ? 1 : level == 10 ? 3 : 2);":
                  "      expect(content.discoveries.length, level <= 2 ? 1 : 2);",
          }
          for old_value, new_value in replacements.items():
              count = text.count(old_value)
              if count != 1:
                  raise SystemExit(f'expected one candidate text occurrence, got {count}: {old_value[:30]}')
              text = text.replace(old_value, new_value, 1)

          prompt_old = """  if (level <= 5) {
            return '旧海运提单与陆家嘴结算工作在故事里共同组织了哪些流动？';
          }
          return '结合外滩长期形成的贸易金融功能与陆家嘴现代结算，解释“变化的是载体，不是流动本身”是否充分。';"""
          prompt_new = """  if (level <= 4) {
            return '旧海运提单与陆家嘴结算工作在故事里共同组织了哪些流动？';
          }
          if (level == 5) {
            return '旧海运提单与陆家嘴结算系统在故事里共同组织了哪些流动？';
          }
          return '结合外滩长期形成的贸易金融功能与陆家嘴现代结算，解释“变化的是载体，不是流动本身”是否充分。';"""
          if text.count(prompt_old) != 1:
              raise SystemExit('expected one Shanghai prompt block')
          text = text.replace(prompt_old, prompt_new, 1)

          path.write_text(text)
          PY
          python3 -m py_compile /tmp/shanghai_bund_preserve_first_v3.py

      - name: Reset validation checkout to exact main base
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          echo "SHANGHAI VALIDATION BASE SHA = $BASE_SHA"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate exact-source unified diff and validate apply
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          BASE_SHA="$BASE_SHA" python3 /tmp/shanghai_bund_preserve_first_v3.py

          dart format \
            app/lib/data/shanghai_bund_level_support.dart \
            app/lib/data/shanghai_bund_one_pass.dart \
            app/lib/data/batch_one_adaptive_story_levels.dart \
            app/test/shanghai_bund_preserve_first_contract_test.dart

          git add -A -- \
            app/lib/data/shanghai_bund_level_support.dart \
            app/lib/data/shanghai_bund_one_pass.dart \
            app/lib/data/batch_one_adaptive_story_levels.dart \
            app/test/shanghai_bund_preserve_first_contract_test.dart

          expected="$(printf '%s\n' \
            app/lib/data/batch_one_adaptive_story_levels.dart \
            app/lib/data/shanghai_bund_level_support.dart \
            app/lib/data/shanghai_bund_one_pass.dart \
            app/test/shanghai_bund_preserve_first_contract_test.dart | sort)"
          staged="$(git diff --cached --name-only "$BASE_SHA" | sort)"
          printf 'EXPECTED FILES\n%s\nACTUAL FILES\n%s\n' "$expected" "$staged"
          test "$staged" = "$expected"
          git diff --cached --check
          git diff --cached --binary "$BASE_SHA" > /tmp/shanghai-bund.patch
          test -s /tmp/shanghai-bund.patch

          git reset --hard "$BASE_SHA"
          git clean -fd
          test -z "$(git status --porcelain)"

          git apply --check /tmp/shanghai-bund.patch
          git apply /tmp/shanghai-bund.patch
          git diff --check
          dart format --output=none --set-exit-if-changed \
            app/lib/data/shanghai_bund_level_support.dart \
            app/lib/data/shanghai_bund_one_pass.dart \
            app/lib/data/batch_one_adaptive_story_levels.dart \
            app/test/shanghai_bund_preserve_first_contract_test.dart

          git add -N \
            app/lib/data/shanghai_bund_level_support.dart \
            app/test/shanghai_bund_preserve_first_contract_test.dart
          applied="$(git diff --name-only "$BASE_SHA" | sort)"
          printf 'APPLIED FILES\n%s\n' "$applied"
          test "$applied" = "$expected"

          if printf '%s\n' "$applied" | grep -E '(^|/)(screens|widgets)/|navigation|routing|router|journey_screen\.dart'; then
            echo 'UI scope violation' >&2
            exit 1
          fi

          BASE_SHA="$BASE_SHA" python3 <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          base_sha = os.environ['BASE_SHA']
          path = 'app/lib/data/shanghai_bund_one_pass.dart'
          before = subprocess.check_output(['git', 'show', f'{base_sha}:{path}'], text=True)
          after = Path(path).read_text()

          def story_payload(text):
              start = text.index('final shanghaiBundOnePassLevels')
              end = text.index('WordEntry _w(', start)
              section = text[start:end]
              calls = re.findall(r'_bundLevel\(\s*\[(.*?)\]\s*\)', section, re.S)
              levels = [re.findall(r"'((?:\\.|[^'])*)'", call) for call in calls]
              if len(levels) != 10:
                  raise SystemExit(f'Story parser expected 10 levels, got {len(levels)}')
              return levels

          def challenge_payload(text):
              start = text.index('const shanghaiBundOnePassChallenges')
              end = text.index('const shanghaiBundOnePassMemory', start)
              section = text[start:end]
              records = []
              for body in re.findall(r'RemediatedChallengeTrace\((.*?)\)', section, re.S):
                  type_match = re.search(r"type\s*:\s*'([^']+)'", body)
                  anchor_match = re.search(r"anchor\s*:\s*'([^']+)'", body)
                  ids_match = re.search(r'storyEventIds\s*:\s*<String>\[(.*?)\]', body, re.S)
                  if not (type_match and anchor_match and ids_match):
                      raise SystemExit('Challenge parser could not read canonical structure')
                  ids = tuple(re.findall(r"'([^']+)'", ids_match.group(1)))
                  records.append((type_match.group(1), ids, anchor_match.group(1)))
              if len(records) != 3:
                  raise SystemExit(f'Challenge parser expected 3 records, got {len(records)}')
              return records

          if story_payload(before) != story_payload(after):
              raise SystemExit('Story KEEP semantic violation')
          if challenge_payload(before) != challenge_payload(after):
              raise SystemExit('Challenge KEEP semantic violation')
          print('STORY KEEP SEMANTIC CONTENT = PASS')
          print('CHALLENGE KEEP SEMANTIC STRUCTURE = PASS')
          PY

          echo 'UNIFIED DIFF APPLY CHECK = PASS'
          echo 'NO UI CHANGES STATIC SCOPE = PASS'

      - name: Shanghai targeted contracts
        working-directory: app
        run: |
          set -euo pipefail
          flutter test \
            test/shanghai_bund_preserve_first_contract_test.dart \
            test/shanghai_bund_one_pass_gate_test.dart

      - name: All existing Shanghai tests
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find test -type f -iname '*shanghai*test.dart' -print | sort)
          printf 'SHANGHAI TEST FILES\n%s\n' "${tests[*]}"
          test "${#tests[@]}" -ge 2
          flutter test "${tests[@]}"

      - name: Flutter Analyze
        working-directory: app
        run: flutter analyze

      - name: Full Flutter Test
        working-directory: app
        run: flutter test

      - name: Recheck scope and create product-only validation commit
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            app/lib/data/batch_one_adaptive_story_levels.dart \
            app/lib/data/shanghai_bund_level_support.dart \
            app/lib/data/shanghai_bund_one_pass.dart \
            app/test/shanghai_bund_preserve_first_contract_test.dart | sort)"
          git reset
          changed="$(git status --porcelain | sed -E 's/^.. //' | sort)"
          printf 'FINAL VALIDATED FILES\n%s\n' "$changed"
          test "$changed" = "$expected"
          git diff --check

          git config user.name 'phoenix-validation-bot'
          git config user.email 'phoenix-validation-bot@users.noreply.github.com'
          git add -- \
            app/lib/data/shanghai_bund_level_support.dart \
            app/lib/data/shanghai_bund_one_pass.dart \
            app/lib/data/batch_one_adaptive_story_levels.dart \
            app/test/shanghai_bund_preserve_first_contract_test.dart
          git commit -m 'feat: complete Shanghai Bund preserve-first support'
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          committed="$(git diff-tree --no-commit-id --name-only -r HEAD | sort)"
          test "$committed" = "$expected"
          git push --force origin "HEAD:refs/heads/$VALIDATED_BRANCH"
          echo "SHANGHAI VALIDATED PRODUCT SHA = $(git rev-parse HEAD)"
          echo "SHANGHAI VALIDATED PRODUCT PARENT = $(git rev-parse HEAD^)"
