name: All-Gold Challenge Audit Snapshot Once

on:
  push:
    branches:
      - dev/current

permissions:
  contents: write

jobs:
  snapshot:
    if: contains(github.event.head_commit.message, 'freeze all-Gold Challenge audit inventory')
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit head
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Export all-Gold active Challenge snapshot
        working-directory: app
        env:
          PHOENIX_ALL_GOLD_SNAPSHOT_JSON: ${{ github.workspace }}/all-gold-challenge-snapshot.json
        run: >-
          flutter test test/all_gold_challenge_runtime_snapshot_test.dart
          --reporter expanded

      - name: Build complete defect matrix
        run: >-
          python3 tools/analyze_all_gold_challenge_snapshot.py
          all-gold-challenge-snapshot.json
          docs/PHOENIX_ALL_GOLD_CHALLENGE_MATRIX.csv
          docs/PHOENIX_ALL_GOLD_CHALLENGE_AUDIT_BASELINE.md

      - name: Upload frozen audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-all-gold-challenge-audit-inventory
          path: |
            all-gold-challenge-snapshot.json
            docs/PHOENIX_ALL_GOLD_CHALLENGE_MATRIX.csv
            docs/PHOENIX_ALL_GOLD_CHALLENGE_AUDIT_BASELINE.md
          if-no-files-found: error

      - name: Commit audit-first inventory
        shell: bash
        run: |
          git config user.name "Phoenix Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/PHOENIX_ALL_GOLD_CHALLENGE_MATRIX.csv docs/PHOENIX_ALL_GOLD_CHALLENGE_AUDIT_BASELINE.md
          git commit -m "audit: freeze all-Gold Challenge defect inventory"
          git push origin HEAD:dev/current
