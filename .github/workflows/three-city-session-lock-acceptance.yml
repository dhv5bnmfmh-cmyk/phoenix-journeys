name: Three-City Session-Lock Acceptance

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: three-city-session-lock-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PREVIEW_URL: https://phoenix-journeys-pr-${{ github.event.pull_request.number }}.7hn5tyrjgh.workers.dev/

jobs:
  three-city-session-lock:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - name: Verify exact candidate identity and product tree preservation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git diff --name-only 6454ffc5d46f0228af7f0cd793d1f142ca386fec..HEAD -- 'app/lib/**')"
          node --check .github/scripts/verify_three_city_session_lock.mjs
          node --check .github/scripts/verify_forbidden_city_mobile_webkit_discovery_depth.mjs
          node --check .github/scripts/measure_journey_open_visible.mjs
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify mounted session and narration contract
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter pub get
          flutter test test/settings_journey_session_lock_test.dart
      - name: Wait for exact Cloudflare preview release
        shell: bash
        run: |
          set -euo pipefail
          health_url="${PREVIEW_URL}api/health?commit=${CANDIDATE_SHA}"
          verified=false
          for attempt in {1..180}; do
            response="$(curl --fail --silent --show-error "$health_url" || true)"
            if node -e '
              let health;
              try { health = JSON.parse(process.argv[1]); } catch (_) { process.exit(1); }
              const expected = process.argv[2];
              if (!health.ok || !health.ai || health.service !== "phoenix-journeys" || health.release !== expected) process.exit(1);
            ' "$response" "$CANDIDATE_SHA"; then
              echo "HEALTH / RELEASE = PASS"
              echo "EXPECTED SHA = $CANDIDATE_SHA"
              echo "DEPLOYED SHA = $(node -e 'process.stdout.write(JSON.parse(process.argv[1]).release)' "$response")"
              verified=true
              break
            fi
            echo "Waiting for exact preview release ${attempt}/180"
            sleep 5
          done
          [[ "$verified" == true ]]
      - name: Install Chromium and WebKit functional drivers
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/three-city-node" playwright
          "$RUNNER_TEMP/three-city-node/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Run three-city exact-head session-lock acceptance
        shell: bash
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/three-city-node/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          mkdir -p test-results
          node .github/scripts/verify_three_city_session_lock.mjs "$PREVIEW_URL" "$CANDIDATE_SHA" 2>&1 | tee test-results/three-city-session-lock.log
      - name: Upload three-city evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: three-city-session-lock-${{ env.CANDIDATE_SHA }}
          path: test-results/
          if-no-files-found: warn
