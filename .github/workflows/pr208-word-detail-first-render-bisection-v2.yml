name: PR208 Word Detail First Render Bisection V2

on:
  push:
    branches:
      - validation/pr208-pronunciation-product-fix-49a088
    paths:
      - '.github/workflows/pr208-word-detail-first-render-bisection-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_SHA: d560fa1403e5c8ec14e4291eaf4ae34184a125b8
  PRODUCT_BRANCH: product/city-standard-v1-beijing-forbidden-city
  DIAGNOSTIC_PARENT: 2cad35de4c78a6cbc3265d9ab6df556695bee11f
  DIAGNOSTIC_BRANCH: diagnostic/pr208-founder-device-milestones-d560fa
  PREVIEW_WORKER: phoenix-journeys-pr-208-diagnostic
  PREVIEW_URL: https://phoenix-journeys-pr-208-diagnostic.7hn5tyrjgh.workers.dev

jobs:
  bisect-word-detail-example-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out validation harness
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preserve diagnostic tools outside worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr208-word-bisect
          cp .github/pr208/instrument_word_detail_first_render_bisection.py /tmp/pr208-word-bisect/
          cp .github/pr208/refine_word_detail_example_bisection.py /tmp/pr208-word-bisect/
          cp .github/scripts/pr208_word_detail_bisection_probe.mjs /tmp/pr208-word-bisect/
          cp .github/scripts/journey_level_session_harness.mjs /tmp/pr208-word-bisect/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/pr208-word-bisect/pr208_word_detail_bisection_probe.mjs')
          s = p.read_text()
          old = """  'speech',\n  'production',\n  'production-no-outer-fitted',"""
          new = """  'speech',\n  'production-bypass-example',\n  'production-bypass-context',\n  'production-active-only',\n  'production-bypass-bundled',\n  'production',\n  'production-no-outer-fitted',"""
          if s.count(old) != 1:
              raise SystemExit(f'probe variant anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Guard exact diagnostic parent and untouched product
        shell: bash
        run: |
          set -euo pipefail
          remote_product="$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | awk '{print $1}')"
          remote_diag="$(git ls-remote origin "refs/heads/${DIAGNOSTIC_BRANCH}" | awk '{print $1}')"
          echo "remote_product=$remote_product"
          echo "remote_diag=$remote_diag"
          test "$remote_product" = "$PRODUCT_SHA"
          test "$remote_diag" = "$DIAGNOSTIC_PARENT"
          git checkout -B "$DIAGNOSTIC_BRANCH" "$DIAGNOSTIC_PARENT"
          test "$(git merge-base "$PRODUCT_SHA" HEAD)" = "$PRODUCT_SHA"

      - name: Apply first-render and example-resolution diagnostics only
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/pr208-word-bisect/instrument_word_detail_first_render_bisection.py
          python3 /tmp/pr208-word-bisect/refine_word_detail_example_bisection.py
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'changed=%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "app/lib/screens/journey_screen.dart"
          test "${changed[1]}" = "app/lib/widgets/word_detail_sheet.dart"
          test -z "$(git diff --name-only | grep -E 'forbidden_city_story|pronunciation|narration_controller|app_state|phoenix_vocabulary_service|daily_journey_catalog' || true)"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze diagnostic only
        working-directory: app
        run: flutter analyze

      - name: Preserve visible one-tap regression
        working-directory: app
        run: flutter test --reporter expanded test/founder_device_story_continue_regression_test.dart

      - name: Worker governance contracts
        run: node --test worker/*.test.mjs

      - name: Commit isolated diagnostic bisection
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "phoenix-diagnostic"
          git config user.email "phoenix-diagnostic@users.noreply.github.com"
          git add app/lib/screens/journey_screen.dart app/lib/widgets/word_detail_sheet.dart
          git commit -m "diagnostic(pr208): isolate Word Detail example resolution"
          echo "DIAGNOSTIC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test "$(git merge-base "$PRODUCT_SHA" HEAD)" = "$PRODUCT_SHA"
          test "$(git rev-parse HEAD^)" = "$DIAGNOSTIC_PARENT"
          git push origin "HEAD:refs/heads/${DIAGNOSTIC_BRANCH}"

      - name: Build diagnostic artifact once
        working-directory: app
        run: flutter build web --release

      - name: Fingerprint diagnostic artifact
        shell: bash
        run: |
          set -euo pipefail
          find app/build/web -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/word-bisect-artifact.sha256
          test -s /tmp/word-bisect-artifact.sha256

      - name: Deploy same diagnostic artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SHA"
          sha256sum -c /tmp/word-bisect-artifact.sha256
          npx --yes wrangler@4 deploy --name "$PREVIEW_WORKER" --var "PHOENIX_RELEASE:$DIAGNOSTIC_SHA"
          sha256sum -c /tmp/word-bisect-artifact.sha256

      - name: Verify exact diagnostic deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            response="$(curl --fail --silent --show-error "$PREVIEW_URL/api/health" || true)"
            if node -e 'const h=JSON.parse(process.argv[1]); if(!h.ok || h.release!==process.argv[2]) process.exit(1)' "$response" "$DIAGNOSTIC_SHA"; then
              echo "verified diagnostic=$DIAGNOSTIC_SHA"
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Install iPhone WebKit driver
        shell: bash
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pr208-browser-node" playwright
          "$RUNNER_TEMP/pr208-browser-node/node_modules/.bin/playwright" install --with-deps webkit

      - name: Execute low-observer-effect bisection matrix
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/pr208-browser-node/node_modules/playwright/index.mjs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          node /tmp/pr208-word-bisect/pr208_word_detail_bisection_probe.mjs "$PREVIEW_URL" "$DIAGNOSTIC_SHA" \
            2>&1 | tee test-results/pr208-word-detail-bisection-v2.log

      - name: Reconfirm product branch untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/${PRODUCT_BRANCH}" | awk '{print $1}')" = "$PRODUCT_SHA"

      - name: Upload bisection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr208-word-detail-bisection-v2-${{ env.DIAGNOSTIC_SHA }}
          path: test-results/
          if-no-files-found: warn
