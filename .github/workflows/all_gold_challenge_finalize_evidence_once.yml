name: All-Gold Challenge Finalize Evidence Once

on:
  push:
    branches:
      - dev/current

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, 'finalize all-Gold AFTER evidence and clean transport')
    runs-on: ubuntu-latest
    steps:
      - name: Check out full remediation history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Export exact active runtime snapshot
        working-directory: app
        env:
          PHOENIX_ALL_GOLD_SNAPSHOT_JSON: ../all-gold-after-finalize.json
        run: flutter test test/all_gold_challenge_runtime_snapshot_test.dart --reporter expanded

      - name: Run profile integrity contracts
        working-directory: app
        run: flutter test test/all_gold_challenge_phase2_contract_test.dart --reporter expanded

      - name: Run de-skinned anti-template contracts
        working-directory: app
        run: flutter test test/all_gold_challenge_deskinned_template_test.dart --reporter expanded

      - name: Run cross-Gold DNA contracts
        working-directory: app
        run: flutter test test/all_gold_challenge_cross_gold_dna_test.dart --reporter expanded

      - name: Build separate AFTER evidence
        run: python3 tools/build_all_gold_challenge_after_evidence.py all-gold-after-finalize.json "$GITHUB_SHA"

      - name: Validate AFTER evidence dimensions
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          matrix = list(csv.DictReader(Path('docs/PHOENIX_ALL_GOLD_CHALLENGE_MATRIX_AFTER.csv').open(encoding='utf-8')))
          human = list(csv.DictReader(Path('docs/PHOENIX_ALL_GOLD_CHALLENGE_HUMAN_GATE_AFTER.csv').open(encoding='utf-8')))
          dna = list(csv.DictReader(Path('docs/PHOENIX_ALL_GOLD_CHALLENGE_DNA_AFTER.csv').open(encoding='utf-8')))
          assert len(matrix) == 360, len(matrix)
          assert len(human) == 108, len(human)
          assert len(dna) == 12, len(dna)
          assert all(row['RESULT'] == 'PASS' for row in matrix)
          assert all(row['RESULT'] == 'PASS' for row in human)
          assert all(row['RESULT'] == 'PASS' for row in dna)
          print('AFTER evidence dimensions: 360 / 108 / 12')
          PY

      - name: Prove frozen BEFORE evidence unchanged
        run: |
          git diff --exit-code abf381e1a756156f5361c6adfe87b2cb4cd62b5e -- \
            docs/PHOENIX_ALL_GOLD_CHALLENGE_MATRIX.csv \
            docs/PHOENIX_ALL_GOLD_CHALLENGE_AUDIT_BASELINE.md

      - name: Remove one-shot transport workflows and helpers
        run: |
          git rm \
            .github/workflows/all_gold_challenge_after_snapshot_once.yml \
            .github/workflows/all_gold_challenge_audit_snapshot_once.yml \
            .github/workflows/all_gold_challenge_deskinned_fix_once.yml \
            .github/workflows/all_gold_challenge_distractor_naturalize_once.yml \
            .github/workflows/all_gold_challenge_finalize_evidence_once.yml \
            .github/workflows/all_gold_challenge_human_checkpoint_polish_once.yml \
            .github/workflows/all_gold_challenge_human_refine_once.yml \
            .github/workflows/all_gold_challenge_phase2_apply_once.yml \
            .github/workflows/all_gold_challenge_quote_fix_once.yml \
            tools/all_gold_challenge_audit_trigger.txt \
            tools/apply_all_gold_challenge_phase2.py \
            tools/build_all_gold_challenge_after_evidence.py \
            tools/close_cross_gold_dna_defects.py \
            tools/close_datong_reference_grammar_collisions.py \
            tools/close_human_deskinned_grammar_collisions.py \
            tools/close_remaining_deskinned_collisions.py \
            tools/fix_challenge_quote_boundary.py \
            tools/fix_deskinned_helper_levels.py \
            tools/fix_human_gate_helper.py \
            tools/fix_naturalizer_dedup.py \
            tools/naturalize_all_gold_grammar_distractors.py \
            tools/polish_all_gold_human_checkpoint_grammar.py \
            tools/refine_all_gold_human_gate.py \
            tools/refine_longmen_challenge_profile.py \
            tools/update_all_gold_snapshot_harness.py
          rm -f all-gold-after-finalize.json

      - name: Verify final candidate whitespace
        run: git diff --check

      - name: Commit clean remediation candidate
        shell: bash
        run: |
          git config user.name "Phoenix Remediation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "remediate: finalize all-Gold Challenge convergence evidence"
          git push origin HEAD:dev/current
