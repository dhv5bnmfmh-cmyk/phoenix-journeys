name: Repair Second Story Runtime V4

on:
  push:
    branches:
      - product/city-standard-v1-beijing-forbidden-city
    paths:
      - '.github/workflows/repair-second-story-runtime-v4.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: product/city-standard-v1-beijing-forbidden-city

      - name: Verify failed baseline ancestry and temporary harness scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c6504508f34dffad0158d5c69ce0f33508061ace HEAD
          git diff --name-only c6504508f34dffad0158d5c69ce0f33508061ace..HEAD | sort >/tmp/temp-scope
          cat >/tmp/expected <<'EOF'
          .github/workflows/repair-second-story-runtime-v3.yml
          .github/workflows/repair-second-story-runtime-v4.yml
          .github/workflows/repair-second-story-runtime.yml
          EOF
          diff -u /tmp/expected /tmp/temp-scope

      - name: Apply already-defined minimum product repair
        shell: bash
        run: |
          set -euo pipefail

          # Reuse the already-defined Story presentation repair from V2,
          # but compile only its runtime-content prefix so harness quoting cannot leak forward.
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/repair-second-story-runtime.yml').read_text()
          begin = workflow.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          finish = workflow.index("\n          PY\n", begin)
          body = workflow[begin:finish]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in body.splitlines()
          )
          cut = script.index("journey_path = Path('app/lib/screens/journey_screen.dart')")
          Path('/tmp/runtime_repair.py').write_text(script[:cut] + '\n')
          PY
          python3 -m py_compile /tmp/runtime_repair.py
          python3 /tmp/runtime_repair.py
          sed -i 's/^  final paragraphs = _secondStoryVisibleParagraphs;$/  const paragraphs = _secondStoryVisibleParagraphs;/' app/lib/data/forbidden_city_story_runtime.dart
          sed -i 's/^  final visibleParagraphs = _secondStoryVisibleParagraphs;$/  const visibleParagraphs = _secondStoryVisibleParagraphs;/' app/lib/data/forbidden_city_story_runtime.dart

          python3 - <<'PY'
          from pathlib import Path

          journey_path = Path('app/lib/screens/journey_screen.dart')
          journey = journey_path.read_text()
          anchor = """@visibleForTesting
          ChineseProficiencyProfile snapshotJourneySessionProfile(
            PhoenixLevelController controller,
          ) =>
              controller.profile;

          """
          helper = """@visibleForTesting
          ChineseProficiencyProfile snapshotJourneySessionProfile(
            PhoenixLevelController controller,
          ) =>
              controller.profile;

          @visibleForTesting
          String resolveForbiddenCityStorySceneId({
            required bool isSecondStory,
            required int level,
            required List<String> paragraphs,
            required int paragraphIndex,
            required int characterOffset,
          }) {
            if (isSecondStory) {
              return forbiddenCitySceneForStage('story').sceneId;
            }
            return forbiddenCitySceneForStoryOffset(
              level: level,
              paragraphs: paragraphs,
              paragraphIndex: paragraphIndex,
              characterOffset: characterOffset,
            ).sceneId;
          }

          """
          if anchor not in journey:
              raise SystemExit('scene helper anchor not found')
          journey = journey.replace(anchor, helper, 1)

          old_scene = """    return forbiddenCitySceneForStoryOffset(
                level: _sessionLanguageProfile.phoenixLevel ?? 1,
                paragraphs: paragraphs,
                paragraphIndex: paragraphIndex.clamp(0, paragraphs.length - 1).toInt(),
                characterOffset: snapshot.start,
              ).sceneId;
          """
          new_scene = """    return resolveForbiddenCityStorySceneId(
                isSecondStory: _isForbiddenCitySecondStory,
                level: _sessionLanguageProfile.phoenixLevel ?? 1,
                paragraphs: paragraphs,
                paragraphIndex: paragraphIndex.clamp(0, paragraphs.length - 1).toInt(),
                characterOffset: snapshot.start,
              );
          """
          if old_scene not in journey:
              raise SystemExit('story scene resolver call not found')
          journey = journey.replace(old_scene, new_scene, 1)
          journey_path.write_text(journey)

          selection_path = Path('app/test/forbidden_city_story_selection_runtime_test.dart')
          selection = selection_path.read_text()
          old_expect = """    expect(
                content.storyParagraphs,
                forbiddenCityPipelineFixture.storyContent.lines
                    .map((line) => line.text)
                    .toList(growable: false),
              );
          """
          new_expect = """    expect(forbiddenCityPipelineFixture.storyContent.lines, hasLength(7));
              expect(content.storyParagraphs, hasLength(2));
              final visibleStory = content.storyParagraphs.join();
              expect(visibleStory.length, inInclusiveRange(280, 400));
              final sentenceLengths = content.storyParagraphs
                  .expand((paragraph) => paragraph.split(RegExp(r'[。！？]')))
                  .map((sentence) => sentence.trim().length)
                  .where((length) => length > 0);
              expect(sentenceLengths.every((length) => length <= 30), isTrue);
          """
          if old_expect not in selection:
              raise SystemExit('selection Story expectation not found')
          selection = selection.replace(old_expect, new_expect, 1)
          selection_path.write_text(selection)
          PY

          cat >app/test/forbidden_city_second_story_scene_routing_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';

          import 'package:phoenix_journeys/data/beijing_city_standard.dart';
          import 'package:phoenix_journeys/data/forbidden_city_story_runtime.dart';
          import 'package:phoenix_journeys/screens/journey_screen.dart';

          void main() {
            test('Second Story Lv5 presentation keeps seven beats internal and exposes two paragraphs', () {
              final content = forbiddenCitySecondStoryLevelContent();
              expect(content.storyParagraphs, hasLength(2));
              expect(content.storyParagraphs.join().length, inInclusiveRange(280, 400));
              final sentenceLengths = content.storyParagraphs
                  .expand((paragraph) => paragraph.split(RegExp(r'[。！？]')))
                  .map((sentence) => sentence.trim().length)
                  .where((length) => length > 0);
              expect(sentenceLengths.every((length) => length <= 30), isTrue);
            });

            test('Second Story narration uses independent Story scene routing', () {
              final content = forbiddenCitySecondStoryLevelContent();
              expect(
                resolveForbiddenCityStorySceneId(
                  isSecondStory: true,
                  level: 5,
                  paragraphs: content.storyParagraphs,
                  paragraphIndex: 1,
                  characterOffset: 24,
                ),
                forbiddenCitySceneForStage('story').sceneId,
              );
            });
          }
          DART

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format repair
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            app/lib/data/forbidden_city_story_runtime.dart \
            app/lib/screens/journey_screen.dart \
            app/test/forbidden_city_story_selection_runtime_test.dart \
            app/test/forbidden_city_second_story_scene_routing_test.dart

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Targeted tests
        working-directory: app
        run: >-
          flutter test
          test/forbidden_city_story_selection_runtime_test.dart
          test/forbidden_city_second_story_scene_routing_test.dart
          test/journey_memory_completion_narration_contract_test.dart

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Commit exact candidate and push
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-second-story-runtime.yml
          rm .github/workflows/repair-second-story-runtime-v3.yml
          rm .github/workflows/repair-second-story-runtime-v4.yml
          git diff --name-only | sort >/tmp/changed
          cat >/tmp/expected <<'EOF'
          .github/workflows/repair-second-story-runtime-v3.yml
          .github/workflows/repair-second-story-runtime-v4.yml
          .github/workflows/repair-second-story-runtime.yml
          app/lib/data/forbidden_city_story_runtime.dart
          app/lib/screens/journey_screen.dart
          app/test/forbidden_city_second_story_scene_routing_test.dart
          app/test/forbidden_city_story_selection_runtime_test.dart
          EOF
          diff -u /tmp/expected /tmp/changed
          git config user.name phoenix-agent
          git config user.email phoenix-agent@users.noreply.github.com
          git add -A
          git commit -m 'fix: stabilize Forbidden City second Story runtime'
          git push origin HEAD:product/city-standard-v1-beijing-forbidden-city
