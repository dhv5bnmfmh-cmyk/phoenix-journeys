name: Phoenix Agent Audit

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      task_contract_path:
        description: Repository-relative Task Contract path for a manual read-only audit
        required: true
        default: ai/development/examples/valid_read_only_task.json
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    name: Read-only governance audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact Candidate Head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Record Base and Head
        shell: bash
        run: |
          {
            echo "## Phoenix Agent Audit Identity"
            echo
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Event: \`${GITHUB_EVENT_NAME}\`"
            echo "- Base: \`${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}\`"
            echo "- Head: \`${{ github.event.pull_request.head.sha || github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate JSON, manifests, registry, schemas, and examples
        run: node tools/phoenix_agent_runner/src/cli.mjs validate-config --root .

      - name: Run Phoenix Agent Runner unit and fixture tests
        run: node --test tools/phoenix_agent_runner/test/*.test.mjs

      - name: Run read-only Phoenix Agent audit
        env:
          PHOENIX_NO_EXTERNAL_AI: '1'
        run: >-
          node tools/phoenix_agent_runner/src/cli.mjs audit
          --root .
          --repo-root .
          --event "$GITHUB_EVENT_PATH"
          --output-dir phoenix-agent-audit

      - name: Add audit summary
        if: always()
        shell: bash
        run: |
          if [[ -f phoenix-agent-audit/audit-summary.md ]]; then
            cat phoenix-agent-audit/audit-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Phoenix Agent Audit summary was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-agent-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: phoenix-agent-audit/
          if-no-files-found: warn
          retention-days: 30
