name: Phoenix Agent Audit

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  trusted-audit:
    name: Trusted read-only governance audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted Base audit source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Check out Candidate as untrusted data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Record immutable audit identities
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          echo "trusted_sha=$(git -C trusted rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "trusted_tree=$(git -C trusted rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "candidate_tree=$(git -C candidate rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          echo "rule_digest=$(find trusted/ai/development/policies -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "schema_digest=$(find trusted/ai/development/schemas -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Run trusted P0 tests
        run: node --test trusted/tools/phoenix_agent_runner/test/trusted-authority.test.mjs trusted/tools/phoenix_agent_runner/test/p0-security.test.mjs

      - name: Run trusted audit without executing Candidate
        env:
          GITHUB_TOKEN: ''
        run: >-
          node trusted/tools/phoenix_agent_runner/src/trusted-cli.mjs
          --candidate candidate
          --event "$GITHUB_EVENT_PATH"
          --output phoenix-agent-audit
          --base-sha "${{ github.event.pull_request.base.sha }}"
          --candidate-sha "${{ github.event.pull_request.head.sha }}"
          --candidate-tree "${{ steps.identity.outputs.candidate_tree }}"
          --trusted-runner-sha "${{ steps.identity.outputs.trusted_sha }}"
          --trusted-runner-tree "${{ steps.identity.outputs.trusted_tree }}"
          --rule-digest "${{ steps.identity.outputs.rule_digest }}"
          --schema-digest "${{ steps.identity.outputs.schema_digest }}"

      - name: Publish redacted Step Summary
        if: always()
        shell: bash
        run: |
          test -f phoenix-agent-audit/audit-summary.md
          cat phoenix-agent-audit/audit-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload trusted audit artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phoenix-trusted-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: phoenix-agent-audit/
          if-no-files-found: error
          retention-days: 30
