name: Apply three-mode and full special journeys

on:
  push:
    branches:
      - preview/stable-journey-bf5fdf
    paths:
      - tools/apply_three_mode_special_journeys.py
      - .github/workflows/apply-three-mode-special-journeys.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR118 branch
        uses: actions/checkout@v4
        with:
          ref: preview/stable-journey-bf5fdf

      - name: Set up Flutter formatter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply integration
        run: python3 tools/apply_three_mode_special_journeys.py

      - name: Format Dart files
        run: |
          dart format \
            app/lib/data/daily_journey_catalog.dart \
            app/lib/data/special_journey_catalog.dart \
            app/lib/data/world_geo_catalog.dart \
            app/lib/services/journey_location_binding.dart \
            app/lib/screens/journey_screen.dart \
            app/lib/widgets/destination_background.dart \
            app/lib/widgets/journey_challenge_panel.dart \
            app/lib/widgets/special_realm_background.dart

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/data/daily_journey_catalog.dart \
            app/lib/data/special_journey_catalog.dart \
            app/lib/data/world_geo_catalog.dart \
            app/lib/services/journey_location_binding.dart \
            app/lib/screens/journey_screen.dart \
            app/lib/widgets/destination_background.dart \
            app/lib/widgets/journey_challenge_panel.dart \
            app/lib/widgets/special_realm_background.dart
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "feat: integrate three-mode challenges and full special journeys"
          git push origin HEAD:preview/stable-journey-bf5fdf
