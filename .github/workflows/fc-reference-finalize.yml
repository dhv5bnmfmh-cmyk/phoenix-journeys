name: Forbidden City Reference Finalize

on:
  push:
    branches:
      - feature/forbidden-city-final-integration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forbidden-city-reference-finalize
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Reference branch
        uses: actions/checkout@v4
        with:
          ref: feature/forbidden-city-final-integration
          fetch-depth: 0

      - name: Apply final convergence
        run: |
          set -euo pipefail
          python3 tools/finalize_forbidden_city_reference.py
          git diff --check

      - name: Commit convergence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/finalize_forbidden_city_reference.py .github/workflows/fc-reference-finalize.yml
          git add -A
          git diff --cached --check
          git commit -m 'Finalize Forbidden City Reference Journey convergence'
          git push origin HEAD:feature/forbidden-city-final-integration
