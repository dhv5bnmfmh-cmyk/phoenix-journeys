              ShanghaiBundParagraphSupport(
                vietnamese: 'Lâm Ngạn 24 tuổi, lớn lên trong gia đình gắn với thương mại cảng Thượng Hải. Văn phòng giao nhận và chứng từ của cha mẹ không có huyền thoại, chỉ có xác nhận đặt chỗ, hồ sơ khai quan, bản sao vận đơn và những con số thanh toán phải kiểm tra nhiều lần. Ngày mai anh sẽ vào đội thanh toán công nghệ tài chính ở Lục Gia Chủy, tham gia thanh toán và giao nhận vốn giữa các tổ chức. Anh thích sự tức thời, rõ ràng và gần như không giấy tờ ấy, nên xem đó là đoạn tuyệt với ngành cũ của gia đình: bờ tây là tàu, hải quan và chứng từ giấy; bờ đông là dữ liệu, tài khoản và hạ tầng tài chính mới. Chiều tối, mẹ đưa anh bản sao vận đơn cũ của ông ngoại gần Tòa nhà Hải quan. Anh nói qua sông là rời Thượng Hải cũ để vào Thượng Hải mới. Mẹ hỏi anh có thật tin một con sông có thể chia cắt rạch ròi như vậy không. Họ đi về phía nam, với kiến trúc lịch sử, tiếng chuông Hải quan, đèn tàu và mặt kính bờ đông chồng lên nhau trong hoàng hôn.',
                english: 'Lin An is twenty-four and grew up in a family tied to Shanghai port trade. His parents’ freight-forwarding and document office has no legends, only booking confirmations, customs materials, bill copies, and settlement figures checked again and again. The next day he will join a fintech settlement team in Lujiazui for inter-institutional payments and fund settlement. He likes its immediate, clear, nearly paperless method and treats it as a break with the family’s old industry: the west bank is ships, customs, and paper credentials; the east bank is data, accounts, and new financial infrastructure. At dusk near the Customs House, his mother gives him an old bill-of-lading copy from his maternal grandfather. He says crossing the river will mean leaving old Shanghai for new Shanghai. His mother asks whether he truly thinks one river can divide things so cleanly. They walk south as historic architecture, the Customs House clock, vessel lights, and glass facades across the river overlap in the dusk.',
              ),
              ShanghaiBundParagraphSupport(
                vietnamese: 'Trên đường tới bến phà đường Đông Kim Lăng, Lâm Ngạn nhớ việc mở cảng năm 1843 nằm trong hệ thống điều ước bất bình đẳng thế kỷ XIX, và các chức năng thương mại, vận tải, hải quan, ngân hàng, kinh doanh hình thành qua nhiều thập kỷ chứ không bỗng xuất hiện trong một đêm. Anh hiểu điều đó nhưng vẫn xem là chuyện quá khứ. Vận đơn chạm cạnh máy tính và anh nhiều lần muốn trả lại. Mẹ không lên lớp, chỉ nhắc chuyện thuyền giấy bằng tờ khai bỏ đi. Hai người chia tay ở cửa soát vé; anh cất vận đơn vào túi máy tính và lên phà. Ngoại Than và tháp đồng hồ Hải quan lùi lại, tàu hàng đi theo luồng chính, Lục Gia Chủy cao dần phía trước. Khoảng cách trên sông khiến hai bờ cùng rõ hơn. Anh hiểu giấy tờ cũ viết hàng hóa, tín dụng, trách nhiệm và thanh toán trên giấy, hệ thống mới biến các quan hệ đó thành dữ liệu, thông điệp và thanh toán thời gian thực; hình thức đổi nhưng thành phố vẫn tổ chức lại dòng người, hàng hóa, thông tin và vốn. Sang bờ đông, anh không cần phủ định một bờ mới có thể đi tới bờ kia.',
                english: 'Walking toward the East Jinling Road ferry, Lin An recalls that the 1843 treaty-port opening occurred within the nineteenth-century unequal-treaty system and that trade, shipping, customs, banking, and commercial functions developed over decades rather than appearing overnight. He knows this but has still treated it as belonging only to the past. The bill touches the edge of his computer and he repeatedly wants to return it. His mother gives no lecture, only the paper-boat memory. They part at the gate; he slips the bill into the computer compartment and boards. The Bund and Customs House clock tower recede, cargo ships follow the main channel, and Lujiazui rises ahead. Distance makes both banks clearer at once. He sees that old documents put goods, credit, responsibility, and payment on paper, while the new system turns those relationships into data, messages, and real-time settlement; forms change, but the city still reorganizes flows of people, goods, information, and capital. On the east bank, he no longer needs to deny one side in order to move toward the other.',
              ),
            ],
            8: <ShanghaiBundParagraphSupport>[
              ShanghaiBundParagraphSupport(
                vietnamese: 'Lâm Ngạn 24 tuổi, lớn lên trong gia đình gắn với thương mại cảng Thượng Hải. Công việc giao nhận và chứng từ của cha mẹ rất đời thường: đổi lịch tàu, kiểm tra hồ sơ khai quan, đuổi theo bản sao vận đơn, xác nhận cước và điều kiện thanh toán. Ngày mai anh sẽ vào đội thanh toán công nghệ tài chính ở Lục Gia Chủy. Với anh, công việc mới tượng trưng cho tốc độ, tự động hóa và một cuộc sống không còn bị giấy tờ kéo chậm. Anh thậm chí chia hai bờ thành hai thời đại: bờ tây giữ tàu, hải quan, nhà ngân hàng cũ và tủ hồ sơ của cha mẹ; bờ đông đại diện dữ liệu, tài khoản và hạ tầng tài chính mới. Chiều tối gần Tòa nhà Hải quan, mẹ đưa anh bản sao vận đơn cũ đã ngả vàng của ông ngoại, chỉ ghi một lô hàng bình thường. Anh nói ngày mai mình sẽ rời Thượng Hải cũ để vào Thượng Hải mới. Mẹ hỏi anh đổi công việc hay muốn bỏ cả nguồn gốc ở bờ này. Họ đi về phía nam giữa kiến trúc Ngoại Than, tiếng chuông Hải quan, tàu thuyền và mặt kính bờ đông.',
                english: 'Lin An is twenty-four and grew up in a family tied to Shanghai port trade. His parents’ freight and document work is thoroughly ordinary: changing sailing dates, checking customs materials, chasing bill copies, and confirming freight and settlement terms. The next day he will join a fintech settlement team in Lujiazui. To him, the job means speed, automation, and a life no longer slowed by paper. He even divides the banks into two eras: the west bank keeps ships, customs, old bank buildings, and his parents’ filing cabinets; the east represents data, accounts, and new financial infrastructure. At dusk near the Customs House, his mother gives him a yellowing old bill copy from his maternal grandfather, recording nothing secret, only an ordinary shipment. He says tomorrow he will leave old Shanghai and enter new Shanghai. His mother asks whether he is changing jobs or trying to leave his own origins on this bank. They walk south among Bund architecture, the Customs House clock, river traffic, and glass facades across the water.',
              ),
              ShanghaiBundParagraphSupport(
                vietnamese: 'Gần bến phà đường Đông Kim Lăng, Lâm Ngạn nhớ việc mở cảng năm 1843 diễn ra trong hệ thống điều ước bất bình đẳng; sau đó các cơ quan thương mại, vận tải, hải quan, ngân hàng và kinh doanh ở bờ tây Hoàng Phố trải qua quá trình tập trung và biến đổi lâu dài, không phải một đường thẳng có thể xóa bằng ba chữ “hiện đại hóa”. Anh nhiều lần định trả vận đơn. Mẹ không giảng sử, chỉ cười nhắc chuyện anh từng gấp thuyền bằng tờ khai bỏ đi. Họ chia tay ở cửa soát vé, và anh mang tờ giấy lên phà. Khi bờ sáng của Ngoại Than lùi lại và đường chân trời Phố Đông dâng lên, khoảng cách mặt nước cho anh thấy hai bờ cùng lúc. Anh hiểu con sông không chia thành phố thành quá khứ và tương lai: vận đơn giấy ghi hàng hóa, tín dụng, trách nhiệm và thanh toán; hệ thống mới dùng dữ liệu, thông điệp và chỉ thị thời gian thực. Công cụ và tốc độ đổi, nhưng thành phố vẫn sắp xếp lại cách người, hàng, thông tin và vốn đến với nhau. Tới phía Đông Xương, anh vẫn rời công việc cũ và mong đợi nghề mới, chỉ không còn xem bờ tây là nền cũ phải xóa.',
                english: 'Near the East Jinling Road ferry, Lin An recalls that the 1843 opening occurred within the unequal-treaty system and that trade, shipping, customs, banking, and commercial institutions on the west bank of the Huangpu went through long processes of concentration and change, not a straight line that can be flattened into the word “modernization.” He repeatedly prepares to return the old bill. His mother gives no history lesson; she only laughs about the paper boats he folded from discarded customs forms. They part at the gate and he takes the document onto the ferry. As the bright Bund shoreline recedes and the Pudong skyline rises, the water lets him see both banks at once. He realizes that the river does not divide the city into past and future: paper bills record goods, credit, responsibility, and payment, while new systems use data, messages, and real-time instructions. Tools and speed change, but the city still reorganizes how people, goods, information, and capital reach one another. At Dongchang Road, he still leaves the family’s old work and looks forward to the new career, but no longer treats the west bank as a background that must be erased.',
              ),
            ],
            9: <ShanghaiBundParagraphSupport>[
              ShanghaiBundParagraphSupport(
                vietnamese: 'Lâm Ngạn 24 tuổi, lớn lên trong gia đình gắn với thương mại cảng Thượng Hải. Cha mẹ làm giao nhận và chứng từ, hằng ngày đổi lịch tàu, kiểm tra hồ sơ khai quan, đuổi theo bản sao vận đơn, xác nhận cước và điều kiện thanh toán. Khi nhỏ anh chỉ thấy giấy tờ chiếm bàn ăn; lớn lên anh chọn con đường khác. Ngày mai anh sẽ vào đội thanh toán công nghệ tài chính ở Lục Gia Chủy, tham gia hệ thống thanh toán và giao nhận vốn giữa các tổ chức. Kết nối tài khoản tự động khiến anh tin mình cuối cùng thoát khỏi sự chậm chạp của giấy tờ và cảng. Anh chia hai bờ thành hai thời đại: bờ tây là tàu, hải quan, nhà ngân hàng cũ và tủ hồ sơ; bờ đông là dữ liệu, thuật toán, thanh toán thời gian thực và hạ tầng tài chính mới. Chiều tối, mẹ đưa anh bản sao vận đơn cũ của ông ngoại gần Tòa nhà Hải quan. Tờ giấy không có giá trị sưu tầm, chỉ ghi một lô hàng bình thường. Anh nói ngày mai mình sẽ rời Thượng Hải cũ. Mẹ không bảo anh nối nghiệp, chỉ hỏi anh đổi công việc hay định để cả nguồn gốc lại ở bờ này. Họ đi về phía nam, để Hoàng Phố cùng lúc thu kiến trúc lịch sử, tiếng chuông Hải quan, tàu thuyền và mặt kính Phố Đông vào hoàng hôn.',
                english: 'Lin An is twenty-four and grew up in a family connected to Shanghai port trade. His parents’ freight and document work means changing sailing dates, checking customs files, chasing bill copies, and confirming freight and settlement terms. As a child he only saw paperwork taking over the dining table; as an adult he chose another path. The next day he will join a fintech settlement team in Lujiazui working on inter-institutional payment and fund-settlement systems. Automated account connections make him believe he has finally escaped the slowness of paper and port work. He divides the banks into two eras: ships, customs, old bank buildings, and filing cabinets on the west; data, algorithms, real-time settlement, and new financial infrastructure on the east. At dusk his mother gives him an old bill-of-lading copy from his maternal grandfather near the Customs House. The paper has no collectible value and records only an ordinary shipment. He says tomorrow he will leave old Shanghai. His mother does not ask him to inherit the business; she asks whether he is changing jobs or leaving his origins on this bank as well. Walking south, they see the Huangpu hold historic architecture, the Customs House clock, river traffic, and Pudong glass together in the dusk.',
              ),
              ShanghaiBundParagraphSupport(
                vietnamese: 'Gần bến phà đường Đông Kim Lăng, Lâm Ngạn nhớ việc mở cảng năm 1843 nằm trong hệ thống điều ước bất bình đẳng, sau đó các cơ quan thương mại, vận tải, hải quan, ngân hàng và kinh doanh ở Ngoại Than cùng vùng lân cận phát triển và tái tổ chức qua nhiều thập kỷ; đó tuyệt nhiên không phải câu chuyện nhẹ nhàng “thành phố cũ bỗng thành hiện đại”. Trước đây anh để kiến thức ấy trong sách giáo khoa. Anh nhiều lần muốn trả vận đơn nhưng mẹ chỉ nhắc chuyện thuyền giấy. Họ chia tay ở cửa soát vé và anh lên phà với tờ giấy trong túi máy tính. Ngoại Than lùi thành một dải sáng, tàu hàng tiếp tục trên luồng chính và Phố Đông dâng lên trước mặt. Khoảng cách mở hai bờ cùng lúc, khiến đường thẳng “cũ đến mới” anh từng tin trở nên quá hẹp. Vận đơn viết hàng hóa, tín dụng, trách nhiệm, thông tin và thanh toán trên giấy; hệ thống hôm nay biến chúng thành dữ liệu, thông điệp, quy tắc và thanh toán thời gian thực. Công cụ thay đổi nhưng nhu cầu tổ chức lưu chuyển liên tục tái cấu trúc. Sang phía Đông Xương, anh đi Lục Gia Chủy, không tiếp quản việc nhà nhưng cũng không nghi ngờ nghề mới; anh chỉ thấy Ngoại Than không phải nền cũ bị đường chân trời mới đào thải và Lục Gia Chủy không phải tương lai bắt đầu từ số không.',
                english: 'Near the East Jinling Road ferry, Lin An recalls that the 1843 treaty-port opening belonged to the unequal-treaty system and that trade, shipping, customs, banking, and commercial institutions around the Bund developed and reorganized over decades; this was never a light story of an “old city suddenly becoming modern.” He had kept that knowledge in textbooks. He repeatedly considers returning the bill, but his mother only mentions the paper boats. They part at the gate and he boards with the document in his computer bag. The Bund recedes into a bright line, cargo ships continue along the main channel, and Pudong rises ahead. The water opens both banks at once and makes his old straight line from “old to new” seem too narrow. The bill writes goods, credit, responsibility, information, and payment on paper; today’s system turns them into data, messages, rules, and real-time settlement. Tools change while the need to organize flows keeps being restructured. At Dongchang Road he walks toward Lujiazui, neither taking over the family business nor doubting the new career; he simply sees that the Bund is not an old background eliminated by a new skyline and Lujiazui is not a future that began from zero.',
              ),
            ],
            10: <ShanghaiBundParagraphSupport>[
              ShanghaiBundParagraphSupport(
                vietnamese: 'Lâm Ngạn 24 tuổi, lớn lên trong gia đình gắn với thương mại cảng Thượng Hải. Công việc giao nhận và chứng từ của cha mẹ hằng ngày là đổi lịch tàu gấp, kiểm tra đi kiểm tra lại hồ sơ khai quan, tìm bản sao vận đơn, xác nhận cước và điều kiện thanh toán. Khi nhỏ anh khó chịu vì giấy tờ chiếm bàn ăn; lên đại học anh càng tin rằng “mới” nghĩa là thoát khỏi quy trình giấy. Ngày mai anh sẽ vào đội thanh toán công nghệ tài chính ở Lục Gia Chủy, tham gia hệ thống thanh toán và giao nhận vốn giữa các tổ chức. Kết nối tài khoản tự động khiến anh xem nghề mới như một sự cắt đứt: bờ tây Hoàng Phố giữ tàu, hải quan, nhà ngân hàng cũ và tủ hồ sơ của cha mẹ; bờ đông thuộc về dữ liệu, thuật toán, thanh toán thời gian thực và hạ tầng tài chính mới. Chiều tối anh gặp mẹ gần Tòa nhà Hải quan ở Ngoại Than. Bà đưa bản sao vận đơn cũ đã ngả vàng của ông ngoại, chỉ ghi một lô hàng bình thường. Anh nói ngày mai sẽ rời Thượng Hải cũ để vào Thượng Hải mới. Mẹ không yêu cầu anh nối nghiệp cũng không biện hộ cho ngành cũ, chỉ hỏi anh đổi công việc hay muốn bỏ cả nguồn gốc ở bờ này. Khi họ đi về phía nam, kiến trúc lịch sử, tiếng chuông Hải quan, du thuyền, tàu công vụ và ánh chiều phản trên mặt kính bờ đông cùng nằm trong một hình ảnh chuyển động của Hoàng Phố.',
                english: 'Lin An is twenty-four and grew up in a family tied to Shanghai port trade. His parents’ freight and document work is the daily routine of last-minute sailing changes, repeated customs checks, chasing a bill copy, and confirming freight and settlement terms. As a child he resented paperwork covering the dining table; at university he became more willing to believe that “new” meant escaping paper processes. The next day he will join a fintech settlement team in Lujiazui working on inter-institutional payment and fund-settlement systems. Automated account connections make him interpret the new career as a complete cut: ships, customs, old bank buildings, and his parents’ filing cabinets remain on the west bank of the Huangpu; data, algorithms, real-time settlement, and new financial infrastructure belong to the east. At dusk he meets his mother on the Bund near the Customs House. She gives him a yellowing old bill-of-lading copy left by his maternal grandfather, recording only an ordinary shipment. He says tomorrow he will leave old Shanghai for new Shanghai. His mother neither asks him to inherit the business nor defends the old industry; she asks whether he is changing jobs or leaving his origins on this bank. As they walk south, historic architecture, the Customs House clock, tour boats, working vessels, and sunset reflected from glass across the river share one moving Huangpu scene.',
              ),
              ShanghaiBundParagraphSupport(
                vietnamese: 'Gần bến phà đường Đông Kim Lăng, Lâm Ngạn nhớ mình không hề thiếu kiến thức về thành phố dưới chân. Việc Thượng Hải mở cảng năm 1843 diễn ra trong hệ thống điều ước bất bình đẳng thế kỷ XIX; sau đó thương mại, vận tải, hải quan, ngân hàng và các cơ quan kinh doanh ở Ngoại Than cùng vùng lân cận tập trung và tái tổ chức trong thời gian dài. Kinh tế đô thị cận đại không khởi động trong một ngày, và Phố Đông hiện đại cũng không xóa sạch lịch sử tài chính, vận tải của bờ tây. Trước kia, lịch sử ấy chỉ nằm trong sách và bảng trưng bày. Vận đơn cũ chạm cạnh máy tính và anh nhiều lần muốn trả lại; mẹ chỉ cười nhắc chuyện thuyền giấy bằng tờ khai bỏ đi. Họ chia tay ở cửa soát vé, anh đặt vận đơn vào ngăn máy tính và lên phà một mình. Khi Ngoại Than và tháp đồng hồ Hải quan lùi thành dải sáng, tàu hàng vẫn chạy trên luồng chính và đường chân trời Phố Đông dâng lên. Hai bờ cùng rõ làm anh thấy con sông không chia Thượng Hải thành quá khứ và tương lai. Vận đơn viết hàng hóa, tín dụng, trách nhiệm, thông tin và thanh toán trên giấy; hệ thống hôm nay biến các quan hệ tương tự thành dữ liệu, thông điệp, quy tắc và thanh toán thời gian thực. Công cụ, tốc độ và đường chân trời thay đổi, nhưng thành phố vẫn tổ chức lại cách người, hàng, thông tin và vốn đến với nhau. Sang phía Đông Xương, anh vẫn đi Lục Gia Chủy, không tiếp quản việc nhà và vẫn mong đợi nghề mới; khi ngoái lại, Ngoại Than không còn là nền cũ chờ bị đào thải và Lục Gia Chủy cũng không cần độc chiếm chữ “tương lai”. Tờ chứng từ cũ đã cùng anh qua sông.',
                english: 'Near the East Jinling Road ferry, Lin An remembers that he is not ignorant of the city beneath his feet. Shanghai’s 1843 treaty-port opening occurred within the nineteenth-century unequal-treaty system; trade, shipping, customs, banking, and commercial institutions around the Bund then underwent long processes of concentration and reorganization. The modern urban economy did not start on a single day, and modern Pudong did not erase the west bank’s financial and shipping history. Previously, that history had stayed behind the glass of textbooks and displays. The old bill touches the edge of his computer and he repeatedly wants to return it; his mother only laughs about paper boats made from discarded customs forms. They part at the gate, and he puts the bill in the computer compartment before boarding alone. As the Bund and Customs House clock tower recede into a bright line, cargo ships continue along the main channel and the Pudong skyline rises. Seeing both banks clearly at once, he realizes that the river does not divide Shanghai into past and future. The old bill writes goods, credit, responsibility, information, and payment on paper; today’s system turns similar relationships into data, messages, rules, and real-time settlement. Tools, speed, and skylines change, but the city keeps reorganizing how people, goods, information, and capital reach one another. At Dongchang Road he still walks toward Lujiazui, does not take over the family business, and still looks forward to the new career; when he looks back, the Bund is no longer an old background waiting to be eliminated, and Lujiazui no longer needs to monopolize the word “future.” The old document has crossed the river with him.',
