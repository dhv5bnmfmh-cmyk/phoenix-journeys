                vietnamese: 'Lâm Ngạn 24 tuổi, từ nhỏ đã quen với việc giao nhận và tờ khai hải quan của gia đình. Ngày mai anh sẽ làm trong đội thanh toán của một công ty công nghệ tài chính ở Lục Gia Chủy. Chiều tối, anh gặp mẹ ở Ngoại Than gần Tòa nhà Hải quan. Bà đưa anh bản sao vận đơn đường biển cũ của ông ngoại. Nhìn sang bờ đối diện, anh nói qua Hoàng Phố là rời Thượng Hải cũ để bước vào Thượng Hải mới. Mẹ không giữ anh lại, chỉ hỏi anh có muốn mang vận đơn đi không. Hai người đi về phía nam, ánh đèn các công trình lịch sử phản xuống mặt nước và tàu thuyền đi qua trước mắt.',
                english: 'Lin An is twenty-four and has known his family freight-forwarding and customs paperwork since childhood. The next day he will join a fintech settlement team in Lujiazui. At dusk he first meets his mother on the Bund near the Customs House. She hands him a copy of an old maritime bill of lading left by his maternal grandfather. Looking across the river, he says that crossing the Huangpu means leaving old Shanghai and entering new Shanghai. His mother does not ask him to stay; she only asks whether he wants to take the bill. They walk south as lights from the historic buildings fall across the water and vessels pass in front of them.',
              ),
              ShanghaiBundParagraphSupport(
                vietnamese: 'Trước khi đến bến phà đường Đông Kim Lăng, Lâm Ngạn nhiều lần muốn trả vận đơn cho mẹ. Bà chỉ nhắc chuyện hồi nhỏ anh từng gấp thuyền giấy bằng tờ khai hải quan bỏ đi. Trước khi lên phà, anh vẫn cất vận đơn vào túi. Khi phà rời bờ tây, Ngoại Than lùi xa và Lục Gia Chủy tiến gần. Anh nhận ra con sông không chia Thượng Hải thành quá khứ và tương lai; hàng hóa, giấy tờ, tín dụng, thông tin và vốn chỉ đổi công cụ để tiếp tục lưu chuyển. Sang bờ đông, anh không quay về tiếp quản việc nhà cũng không từ bỏ công việc mới, mà mang tờ chứng từ bình thường ấy tiếp tục tới Lục Gia Chủy.',
                english: 'Before reaching the East Jinling Road ferry, Lin An repeatedly wants to return the bill to his mother. She only recalls how he used discarded customs forms to fold paper boats as a child. Before boarding, he still puts the bill in his bag. As the ferry leaves the west bank, the Bund recedes and Lujiazui approaches. He realizes that the river does not divide Shanghai into past and future; goods, documents, credit, information, and capital simply change tools as they continue to move. On the east bank, he neither returns to take over the family business nor abandons his new job. He carries the ordinary old document onward to Lujiazui.',
              ),
