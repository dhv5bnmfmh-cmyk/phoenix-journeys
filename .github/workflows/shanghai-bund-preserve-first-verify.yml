                vietnamese: 'Lâm Ngạn 24 tuổi, lớn lên trong một gia đình gắn với thương mại cảng Thượng Hải. Việc giao nhận của gia đình nhỏ nhưng bàn làm việc luôn có tài liệu đặt chỗ, khai báo hải quan, bản sao vận đơn và chứng từ thanh toán. Ngày mai anh sẽ vào đội thanh toán công nghệ tài chính ở Lục Gia Chủy. Anh coi đó là một đường cắt sạch: bờ tây thuộc về tàu, hải quan và giấy tờ; bờ đông thuộc về dữ liệu, tài khoản và hạ tầng tài chính mới. Chiều tối anh gặp mẹ gần Tòa nhà Hải quan. Bà đưa anh bản sao vận đơn cũ của ông ngoại, không phải đồ cổ mà chỉ ghi việc vận chuyển, giao hàng và trách nhiệm của một lô hàng bình thường. Anh nói qua sông là rời Thượng Hải cũ. Mẹ chỉ hỏi: “Vậy tờ giấy này thì sao?” Khi họ đi về phía nam, công trình lịch sử, đèn tàu và cao ốc Lục Gia Chủy cùng sáng lên.',
                english: 'Lin An is twenty-four and grew up in a family connected to Shanghai port trade. The family freight business is small, but booking records, customs documents, bill-of-lading copies, and settlement vouchers often cover the desk. The next day he will join a fintech settlement team in Lujiazui. He imagines a clean cut: the west bank belongs to ships, customs, and paper; the east bank to data, accounts, and new financial infrastructure. At dusk he meets his mother near the Bund Customs House. She gives him an old bill-of-lading copy left by his maternal grandfather, not an antique but a record of carriage, delivery, and responsibility for an ordinary shipment. He says crossing the river will mean leaving old Shanghai. His mother only asks, “Then what about this paper?” As they walk south, historic buildings, vessel lights, and Lujiazui towers all light up together.',
