                english: 'Lin An is twenty-four and grew up in a family tied to Shanghai port trade. His parents handle freight forwarding and trade documents, so he has long seen booking confirmations, customs materials, bill-of-lading copies, and settlement vouchers. The next day he will join a fintech settlement team in Lujiazui working on faster inter-institutional payments and fund settlement. He imagines a break: ships, customs, and paper remain on the west bank, while data, accounts, and new financial infrastructure belong to the east. At dusk he meets his mother near the Bund Customs House. She gives him an old bill-of-lading copy from his maternal grandfather, recording only the carriage, delivery, and responsibility for an ordinary shipment. He says tomorrow he will move from old Shanghai into new Shanghai. His mother asks whether changing tools really means leaving everything earlier on this bank. They walk south among historic buildings, clock sounds, vessel lights, and Pudong glass facades in the dusk.',
