            });

            test('Shanghai vocabulary examples are multilingual versions of the same sentence', () {
              for (final word in shanghaiBundOnePassWords) {
                expect(word.examples, hasLength(3), reason: word.word);
                for (final example in word.examples) {
                  expect(example.pinyin, pinyinFor(example.chinese), reason: '${word.word}: ${example.chinese}');
                  expect(example.vietnamese.trim(), isNotEmpty);
                  expect(example.english.trim(), isNotEmpty);
                }
                expect(word.examples.first.chinese, contains(word.word), reason: word.word);
              }
            });

            test('Shanghai Discovery follows current-level curriculum without future leakage', () {
              final expectedAnchors = <int, List<String>>{
                1: <String>['黄浦江西岸'],
                2: <String>['东金线'],
                3: <String>['海运提单', '黄浦江西岸'],
                4: <String>['海运提单', '东金线'],
                5: <String>['陆家嘴', '海运提单'],
                6: <String>['1843', '长期发展'],
                7: <String>['1843', '长期发展'],
                8: <String>['长期发展', '陆家嘴'],
                9: <String>['1843', '陆家嘴'],
                10: <String>['1843', '长期发展'],
              };
              for (var level = 1; level <= 10; level++) {
                final content = shanghaiBundOnePassLevelContent(level);
                final discoveryText = content.discoveries.map((entry) => entry.text).join('|');
                for (final anchor in expectedAnchors[level]!) {
                  expect(discoveryText, contains(anchor), reason: 'Lv$level $anchor');
                }
                if (level < 6) {
                  expect(discoveryText, isNot(contains('1843')), reason: 'Lv$level future history leakage');
                  expect(discoveryText, isNot(contains('不平等条约')), reason: 'Lv$level future treaty leakage');
                }
              }
            });

            test('Shanghai Memory and Completion respect current level', () {
              final closures = <String>{};
              for (var level = 1; level <= 10; level++) {
                final spec = batchOneMemorySpecFor(shanghaiBundJourneyId, phoenixLevel: level)!;
                closures.add('${spec.culturalPoint}|${spec.completionSummary}');
                expect(spec.reviews.map((entry) => entry.category).toSet(),
                    containsAll(<String>{'choice', 'relationship', 'place', 'memory'}));
                expect(spec.storyResult, contains('林岸'));
                expect(spec.longTermAnchor, '一张过江的旧提单');
                if (level < 6) {
                  final joined = '${spec.culturalPoint}${spec.completionSummary}${spec.reviews.map((e) => e.answer).join()}';
                  expect(joined, isNot(contains('1843')), reason: 'Lv$level history leakage');
                  expect(joined, isNot(contains('不平等条约')), reason: 'Lv$level treaty leakage');
                }
              }
              expect(closures, hasLength(10));
              expect(batchOneMemorySpecFor(shanghaiBundJourneyId, phoenixLevel: 2)!.culturalPoint,
                  contains('东金线'));
              expect(batchOneMemorySpecFor(shanghaiBundJourneyId, phoenixLevel: 6)!.culturalPoint,
                  allOf(contains('1843'), contains('不平等条约')));
            });

            test('Shanghai facts retain authoritative bill-of-lading boundary', () {
              final source = shanghaiBundOnePassSources.firstWhere(
                (entry) => entry.id == 'shanghai-port-trade-document-context',
              );
              expect(source.publisher, contains('全国人民代表大会'));
              expect(source.scope, contains('海上货物运输合同'));
              expect(source.scope, contains('货物收据'));
            });

            test('Shanghai keeps an independent narrative engine', () {
              final story = shanghaiBundOnePassLevels.map((level) => level.storyParagraphs.join()).join();
              expect(story, contains('旧海运提单'));
              expect(story, contains('黄浦江'));
              expect(story, contains('陆家嘴'));
              for (final forbiddenCityMechanism in <String>['中轴观察', '东侧记录', '错误路线', '标准路线']) {
                expect(story, isNot(contains(forbiddenCityMechanism)));
              }
              for (final summerPalaceMechanism in <String>['许澄', '周岚', '校展', '金光画面', '旧照片被风吹落']) {
                expect(story, isNot(contains(summerPalaceMechanism)));
              }
            });
          }
          DART

          dart format app/lib/data/shanghai_bund_level_support.dart \
            app/lib/data/shanghai_bund_one_pass.dart \
            app/lib/data/batch_one_adaptive_story_levels.dart \
            app/test/shanghai_bund_preserve_first_contract_test.dart

          git diff --check
          changed="$(git diff --name-only)"
          echo "$changed"
          test -n "$changed"
          if echo "$changed" | grep -E '(^|/)(screens|widgets)/|journey_screen\.dart|navigation|router|routing' ; then
            echo 'UI scope violation' >&2
            exit 1
          fi
          test "$(echo "$changed" | wc -l)" -eq 4
          grep -q 'shanghai_bund_level_support.dart' <<<"$changed"
          grep -q 'shanghai_bund_one_pass.dart' <<<"$changed"
          grep -q 'batch_one_adaptive_story_levels.dart' <<<"$changed"
          grep -q 'shanghai_bund_preserve_first_contract_test.dart' <<<"$changed"

