                vietnamese: 'Lâm Ngạn 24 tuổi, gia đình nhiều năm làm giao nhận và chứng từ hải quan. Ngày mai anh sẽ trình diện tại đội thanh toán của một công ty công nghệ tài chính ở Lục Gia Chủy. Anh xem công việc này là một bước ngoặt dứt khoát: từ tàu, hàng hóa và giấy tờ sang tài khoản và thanh toán số. Chiều tối anh gặp mẹ gần Tòa nhà Hải quan ở Ngoại Than. Bà vừa xong một ngày làm chứng từ và đưa anh bản sao vận đơn đường biển cũ của ông ngoại, chỉ là một giấy tờ thương mại bình thường. Nhìn sang bờ bên kia, anh nói mình cuối cùng cũng sắp “rời Thượng Hải cũ, bước vào Thượng Hải mới”. Mẹ không phản đối, chỉ hỏi có mang tờ giấy theo không. Khi họ đi về phía nam, các tòa nhà lịch sử, đèn tàu và cao ốc bờ đông cùng xuất hiện trong tầm mắt.',
                english: 'Lin An is twenty-four, and his family has worked for years with freight forwarding and customs documents. The next day he will report to a fintech settlement team in Lujiazui. He imagines the job as a complete turn: from ships, cargo, and paper into accounts and digital settlement. At dusk he meets his mother near the Bund Customs House. She has just finished a day of document work and gives him a copy of an old maritime bill of lading left by his maternal grandfather, an ordinary commercial document. Looking across the Huangpu, he says he is finally about to “leave old Shanghai and enter new Shanghai.” His mother does not object; she simply asks whether he wants to take the paper. As they walk south, historic Bund buildings, vessel lights, and towers on the east bank share the same view.',
              ),
              ShanghaiBundParagraphSupport(
                vietnamese: 'Gần bến phà đường Đông Kim Lăng, Lâm Ngạn liên tục chạm vào vận đơn trong túi và cho rằng hệ thống của công ty mới chẳng liên quan gì đến tờ giấy cũ. Mẹ không giảng lịch sử, chỉ cười nhắc chuyện anh từng gấp thuyền bằng tờ khai hải quan bỏ đi. Trước cửa soát vé, anh cất vận đơn vào túi máy tính và lên phà một mình. Tòa nhà Hải quan và ánh đèn Ngoại Than nhỏ dần, tàu hàng vẫn chạy trên sông và đường chân trời Phố Đông dâng lên trước mặt. Anh hiểu con sông không chia Thượng Hải thành quá khứ và tương lai: giấy tờ cũ ghi hàng hóa, tín dụng và trách nhiệm thanh toán, còn hệ thống mới xử lý dữ liệu và thanh toán nhanh hơn, nhưng cả hai đều tổ chức sự lưu chuyển. Sang bờ đông, anh vẫn chọn nghề mới nhưng không còn xem tờ chứng từ cũ là quá khứ bắt buộc phải bỏ lại.',
