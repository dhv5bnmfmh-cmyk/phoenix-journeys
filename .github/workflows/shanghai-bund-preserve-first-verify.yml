name: Shanghai Bund Preserve-First Verify

on:
  push:
    branches:
      - automation/shanghai-bund-preserve-first-verify

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/shanghai-bund-preserve-first-verify
          fetch-depth: 0

      - name: Apply evidence-scoped Shanghai refinement
        shell: bash
        run: |
          set -euo pipefail
          cat > app/lib/data/shanghai_bund_level_support.dart <<'DART'
          import 'package:pinyin/pinyin.dart';

          import 'journey_data.dart';

          class ShanghaiBundParagraphSupport {
            const ShanghaiBundParagraphSupport({
              required this.vietnamese,
              required this.english,
            });

            final String vietnamese;
            final String english;
          }

          const _paragraphSupport = <int, List<ShanghaiBundParagraphSupport>>{
            1: <ShanghaiBundParagraphSupport>[
              ShanghaiBundParagraphSupport(
                vietnamese: 'Lâm Ngạn 24 tuổi, lớn lên ở Ngoại Than và thường giúp gia đình sắp xếp chứng từ vận tải, khai báo hải quan. Tối nay anh chuẩn bị sang Lục Gia Chủy cho công việc mới ngày mai. Mẹ đợi gần Tòa nhà Hải quan, mang theo bản sao vận đơn đường biển cũ của ông ngoại. Anh nói qua Hoàng Phố là rời Thượng Hải cũ để bước vào Thượng Hải mới. Mẹ không giữ anh lại, chỉ đưa vận đơn. Hai người đi về phía nam dọc bờ sông. Đến bến phà đường Đông Kim Lăng, anh từng muốn trả tờ giấy nhưng cuối cùng vẫn cất vào túi. Khi phà rời bờ tây, Ngoại Than lùi xa và các tòa nhà Lục Gia Chủy tiến gần. Anh chợt thấy con sông không chia Thượng Hải thành quá khứ và tương lai; lên bờ đông, anh tiếp tục đi tới công việc mới cùng tờ chứng từ cũ.',
                english: 'Lin An is twenty-four, grew up on the Bund, and often helped his family sort freight and customs documents. Tonight he is preparing to cross to Lujiazui for a new job the next day. His mother waits near the Customs House with a copy of an old maritime bill of lading left by his maternal grandfather. Lin says crossing the Huangpu will mean leaving old Shanghai and entering new Shanghai. His mother does not ask him to stay; she simply hands him the bill. They walk south along the river. At the East Jinling Road ferry, he briefly wants to return the document but finally puts it in his bag. As the ferry leaves the west bank, the Bund recedes and Lujiazui draws nearer. He suddenly feels that the river does not divide Shanghai into past and future; after landing on the east bank, he continues toward his new work with the old document still with him.',
              ),
            ],
            2: <ShanghaiBundParagraphSupport>[
              ShanghaiBundParagraphSupport(
                vietnamese: 'Lâm Ngạn 24 tuổi, quen thuộc việc giao nhận và khai báo hải quan của gia đình. Ngày mai anh sẽ vào đội thanh toán của một công ty công nghệ tài chính ở Lục Gia Chủy. Tối nay anh gặp mẹ ở Ngoại Than, gần Tòa nhà Hải quan; bà mang theo bản sao vận đơn đường biển cũ của ông ngoại. Anh đùa rằng cuối cùng mình cũng qua sông, như đi từ Thượng Hải cũ sang Thượng Hải mới. Mẹ chỉ hỏi anh có muốn mang tờ vận đơn đi không. Họ đi về phía nam dọc bờ tây Hoàng Phố, giữa các tòa nhà lịch sử, ánh đèn tàu và Lục Gia Chủy sáng lên ở bờ đông. Anh nhiều lần muốn trả tờ giấy, nhưng tại bến phà đường Đông Kim Lăng vẫn cất nó vào túi. Khi phà rời bờ, anh hiểu rằng con sông không chia thành phố thành quá khứ và tương lai: người, hàng hóa, thông tin và tiền vẫn đổi cách thức để lưu chuyển giữa hai bờ. Anh không đổi lựa chọn nghề nghiệp, nhưng mang tờ chứng từ cũ tiếp tục đi Lục Gia Chủy.',
                english: 'Lin An, twenty-four, knows his family freight-forwarding and customs business well. The next day he will join a fintech settlement team in Lujiazui. That evening he meets his mother on the Bund near the Customs House; she brings a copy of an old maritime bill of lading left by his maternal grandfather. He jokes that he is finally crossing the river, as if moving from old Shanghai into new Shanghai. His mother only asks whether he wants to take the bill with him. They walk south along the west bank of the Huangpu, with historic Bund buildings behind them, vessel lights on the river, and Lujiazui lit across the water. He repeatedly considers returning the old paper, yet at the East Jinling Road ferry he puts it in his bag. Once the ferry leaves, he understands that the river does not divide the city into past and future: people, goods, information, and money keep moving between the banks through changing means. He keeps his new career choice and carries the old document toward Lujiazui.',
              ),
