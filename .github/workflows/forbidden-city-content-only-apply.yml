name: Forbidden City Content-Only Apply

on:
  push:
    branches:
      - feature/forbidden-city-content-only-reference
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[content-only-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact content-only branch
        uses: actions/checkout@v4
        with:
          ref: feature/forbidden-city-content-only-reference
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply content-only bindings
        run: python3 tools/forbidden_city_content_only_patch.py

      - name: Format only touched Dart files
        working-directory: app
        run: dart format lib/screens/journey_screen.dart test/forbidden_city_ten_level_content_contract_test.dart

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Verify 10 distinct levels
        working-directory: app
        run: flutter test test/forbidden_city_ten_level_content_contract_test.dart

      - name: Verify shared Journey UI still compiles
        working-directory: app
        run: flutter analyze lib/screens/journey_screen.dart

      - name: Commit verified content-only repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix: bind Forbidden City ten-level content without UI redesign [content-only-applied]"
          git push origin HEAD:feature/forbidden-city-content-only-reference
