name: Second Story Exact Release Harness V2

on:
  push:
    branches:
      - validation/second-story-exact-release-e262
    paths:
      - '.github/workflows/second-story-exact-release-harness-v2.yml'

permissions:
  contents: read
  statuses: write

env:
  PR_NUMBER: '208'
  PREVIEW_WORKER: phoenix-journeys-pr-208
  PREVIEW_URL: https://phoenix-journeys-pr-208.7hn5tyrjgh.workers.dev
  PREVIEW_RELEASE: e262a4ebb880bede5e4c1a2498c39c8a54e1e79d

jobs:
  exact-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact product candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PREVIEW_RELEASE }}
          fetch-depth: 0

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          test -z "$(git status --porcelain)"

      - name: Preflight checked-in harness syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find .github/scripts -type f -name '*.mjs' -print0)
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(find .github/scripts -type f -name '*.sh' -print0)
          while IFS= read -r -d '' file; do python3 -m py_compile "$file"; done < <(find .github/scripts -type f -name '*.py' -print0)
          find .github/scripts -type d -name '__pycache__' -prune -exec rm -rf {} +

      - name: Fix only brittle architecture-test whitespace matching
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('worker/journey_runtime_architecture_gate.test.mjs')
          text = path.read_text()
          replacements = {
              r"/3 => stepThreePage[\s\S]*_challengePage\(\)/": r"/3\s*=>\s*stepThreePage[\s\S]*_challengePage\(\)/",
              r"/4 => stepFourPage[\s\S]*_memoryPage\(\)/": r"/4\s*=>\s*stepFourPage[\s\S]*_memoryPage\(\)/",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'harness regex not unique: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff -- worker/journey_runtime_architecture_gate.test.mjs
          test "$(git diff --name-only)" = "worker/journey_runtime_architecture_gate.test.mjs"

      - name: Test Phoenix agents with harness-only fix
        shell: bash
        run: node --test worker/*.test.mjs

      - name: Restore exact candidate after harness test
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- worker/journey_runtime_architecture_gate.test.mjs
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Apply only brittle Flutter source-matcher fixes for targeted validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements_by_path = {
              Path('app/test/journey_runtime_performance_gate_test.dart'): {
                  "expect(build, contains('3 => stepThreePage'));": "expect(build, matches(RegExp(r'3\\s*=>\\s*stepThreePage')));",
                  "expect(build, contains('4 => stepFourPage'));": "expect(build, matches(RegExp(r'4\\s*=>\\s*stepFourPage')));",
              },
              Path('app/test/settings_journey_session_lock_test.dart'): {
                  "contains('snapshotJourneySessionProfile(_phoenixLevelController)')": "matches(RegExp(r'snapshotJourneySessionProfile\\(\\s*_phoenixLevelController,?\\s*\\)'))",
              },
          }
          for path, replacements in replacements_by_path.items():
              text = path.read_text()
              for old, new in replacements.items():
                  if text.count(old) != 1:
                      raise SystemExit(f'harness matcher not unique in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          test "$(git diff --name-only | sort)" = $'app/test/journey_runtime_performance_gate_test.dart\napp/test/settings_journey_session_lock_test.dart'

      - name: Targeted validate recovered Full Flutter failures
        working-directory: app
        run: flutter test --reporter expanded test/journey_runtime_performance_gate_test.dart test/settings_journey_session_lock_test.dart

      - name: Restore exact candidate before analyze
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- app/test/journey_runtime_performance_gate_test.dart app/test/settings_journey_session_lock_test.dart
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Analyze exact candidate once
        working-directory: app
        run: flutter analyze

      - name: Apply only brittle Flutter source-matcher fixes for Full Flutter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements_by_path = {
              Path('app/test/journey_runtime_performance_gate_test.dart'): {
                  "expect(build, contains('3 => stepThreePage'));": "expect(build, matches(RegExp(r'3\\s*=>\\s*stepThreePage')));",
                  "expect(build, contains('4 => stepFourPage'));": "expect(build, matches(RegExp(r'4\\s*=>\\s*stepFourPage')));",
              },
              Path('app/test/settings_journey_session_lock_test.dart'): {
                  "contains('snapshotJourneySessionProfile(_phoenixLevelController)')": "matches(RegExp(r'snapshotJourneySessionProfile\\(\\s*_phoenixLevelController,?\\s*\\)'))",
              },
          }
          for path, replacements in replacements_by_path.items():
              text = path.read_text()
              for old, new in replacements.items():
                  if text.count(old) != 1:
                      raise SystemExit(f'harness matcher not unique in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          test "$(git diff --name-only | sort)" = $'app/test/journey_runtime_performance_gate_test.dart\napp/test/settings_journey_session_lock_test.dart'

      - name: Full Flutter once and generate quality evidence
        working-directory: app
        shell: bash
        env:
          PHOENIX_GENERATE_QUALITY_REPORT: '1'
          PHOENIX_QUALITY_MARKDOWN: ${{ github.workspace }}/journey-quality-report.md
          PHOENIX_QUALITY_JSON: ${{ github.workspace }}/journey-quality-report.json
        run: flutter test --reporter expanded

      - name: Restore exact candidate after Full Flutter harness tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- app/test/journey_runtime_performance_gate_test.dart app/test/settings_journey_session_lock_test.dart
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload journey quality report
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-journey-content-quality-pr-208-e262
          path: |
            journey-quality-report.md
            journey-quality-report.json
          if-no-files-found: error

      - name: Enforce quality release decision
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('journey-quality-report.json', 'utf8'));
          if (!report.canPublish) {
            console.error(`Release blocked: ${report.needsRevisionCount} need revision and ${report.blockedCount} blocked.`);
            process.exit(1);
          }
          NODE

      - name: Build exact preview web app once
        working-directory: app
        run: flutter build web --release

      - name: Validate Cloudflare Worker bundle
        shell: bash
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run

      - name: Verify clean exact release before deploy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Deploy exact candidate artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          npx --yes wrangler@4 deploy \
            --name "$PREVIEW_WORKER" \
            --var "PHOENIX_RELEASE:$PREVIEW_RELEASE"

      - name: Verify exact preview release
        shell: bash
        run: |
          set -euo pipefail
          health_url="${PREVIEW_URL}/api/health?commit=${PREVIEW_RELEASE}"
          verified=false
          for attempt in {1..18}; do
            response="$(curl --fail --silent --show-error "$health_url" || true)"
            echo "Preview release check ${attempt}/18: ${response:-no response}"
            if node -e '
              let health;
              try { health = JSON.parse(process.argv[1]); } catch (_) { process.exit(1); }
              const expected = process.argv[2];
              if (!health.ok || !health.ai || health.service !== "phoenix-journeys" || health.release !== expected) process.exit(1);
            ' "$response" "$PREVIEW_RELEASE"; then
              verified=true
              break
            fi
            sleep 5
          done
          [[ "$verified" == true ]]

      - name: Publish exact preview status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="${PREVIEW_URL}/?unlock=all&prototype=journeys&v=${PREVIEW_RELEASE}"
          payload="$(node -e '
            const [url] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({
              state: "success",
              description: "Isolated Phoenix preview is ready",
              context: "cloudflare/preview",
              target_url: url
            }));
          ' "$target")"
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${PREVIEW_RELEASE}" \
            --data "$payload" >/dev/null
