name: PR194 Final Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  journey-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install browser driver
        run: npm install --no-save --prefix "$RUNNER_TEMP/pr194-final-node" puppeteer-core@24
      - name: Inject exact post-fix journey timings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/lib/services/journey_location_binding.dart')
          text = path.read_text(encoding='utf-8')
          anchor = "  return JourneyLocationBinding(\n    journey: journey,\n    placeNode: node,\n    geoPath: List<GeoNode>.unmodifiable(geoPath),\n  );\n}\n\nMap<String, JourneyLocationBinding> buildJourneyLocationBindingsForValidation"
          replacement = "  return JourneyLocationBinding(\n    // Keep the selected-only return distinct from the base probe's validator anchor.\n    journey: journey,\n    placeNode: node,\n    geoPath: List<GeoNode>.unmodifiable(geoPath),\n  );\n}\n\nMap<String, JourneyLocationBinding> buildJourneyLocationBindingsForValidation"
          count = text.count(anchor)
          print('selected-only return normalization count =', count)
          if count != 1:
              raise SystemExit(f'expected selected-only return once, found {count}')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          python3 .github/scripts/startup_instrument.py "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              print(f'{label} MATCH COUNT = {count}')
              if count != 1:
                  raise SystemExit(f'{label}: expected 1, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          explore = Path('app/lib/screens/explore_screen.dart')
          replace_one(
              explore,
              "    installStartupBenchmarkJourneyOpen(() async {\n      await openJourneyById(state.activeJourneyId);\n    });\n",
              "    installStartupBenchmarkJourneyOpen(() async {\n      await openJourneyById('luoyang-longmen-grottoes');\n    });\n",
              'fixed Luoyang benchmark',
          )

          location = Path('app/lib/services/journey_location_binding.dart')
          replace_one(
              location,
              "JourneyLocationBinding requireJourneyLocation(String journeyId) {\n  final cached = _journeyLocationBindingCache[journeyId];\n",
              "JourneyLocationBinding requireJourneyLocation(String journeyId) {\n  startupPerformanceMark('phoenix-selected-location-resolver-start');\n  final cached = _journeyLocationBindingCache[journeyId];\n",
              'selected location start',
          )
          replace_one(
              location,
              "  if (cached != null) return cached;\n  final journey = requireDailyJourneyExperience(journeyId);\n  final binding = _buildSelectedJourneyLocationBinding(journey);\n  _journeyLocationBindingCache[journeyId] = binding;\n  return binding;\n}\n",
              "  if (cached != null) {\n    startupPerformanceMark('phoenix-selected-location-resolver-end');\n    return cached;\n  }\n  final journey = requireDailyJourneyExperience(journeyId);\n  final binding = _buildSelectedJourneyLocationBinding(journey);\n  _journeyLocationBindingCache[journeyId] = binding;\n  startupPerformanceMark('phoenix-selected-location-resolver-end');\n  return binding;\n}\n",
              'selected location end',
          )
          PY
      - name: Build instrumented release
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release
      - name: Run exact Luoyang cold sample
        shell: bash
        env:
          PUPPETEER_CORE_PATH: ${{ runner.temp }}/pr194-final-node/node_modules/puppeteer-core/lib/esm/puppeteer/puppeteer-core.js
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --directory app/build/web >"$RUNNER_TEMP/pr194-final-server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do curl --fail --silent http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"; export CHROME_PATH
          node --input-type=module <<'JS'
          import {pathToFileURL} from 'node:url';
          const m = await import(pathToFileURL(process.env.PUPPETEER_CORE_PATH).href);
          const puppeteer = m.default ?? m;
          const browser = await puppeteer.launch({executablePath:process.env.CHROME_PATH,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          try {
            const page = await browser.newPage();
            await page.goto('http://127.0.0.1:8080/?unlock=all&prototype=journeys',{waitUntil:'load',timeout:90000});
            await page.waitForFunction(()=>performance.getEntriesByName('phoenix-first-meaningful-screen').length>0,{timeout:90000});
            await page.waitForFunction(()=>document.getElementById('phoenix-loading')==null,{timeout:20000});
            await page.evaluate(()=>window.dispatchEvent(new Event('phoenix-benchmark-open-current-journey')));
            await page.waitForFunction(()=>performance.getEntriesByName('phoenix-journey-story-usable').length>0,{timeout:90000});
            const entries=await page.evaluate(()=>performance.getEntriesByType('mark').map(e=>[e.name,e.startTime]).sort((a,b)=>a[1]-b[1]));
            const marks=Object.fromEntries(entries), start=marks['phoenix-journey-open-start'], ready=marks['phoenix-journey-content-ready'], usable=marks['phoenix-journey-story-usable'];
            console.log(`PR194 FINAL LUOYANG OPEN TOTAL = ${(usable-start).toFixed(1)}ms`);
            console.log(`PR194 FINAL CONTENT READY TO STORY USABLE = ${(usable-ready).toFixed(1)}ms`);
            console.log(`PR194 FINAL SELECTED LOCATION = ${(marks['phoenix-selected-location-resolver-end']-marks['phoenix-selected-location-resolver-start']).toFixed(1)}ms`);
            console.log('PR194 FINAL POST-CONTENT MARKS');
            for (const [n,v] of entries) if(v>=ready-2&&v<=usable+2) console.log(`${v.toFixed(1)}ms ${n}`);
          } finally { await browser.close(); }
          JS

  agent-gate-inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Inspect exact Phoenix agent gate source
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Phoenix gate files ==='
          find worker -maxdepth 2 -type f -iname '*phoenix*agent*' -print
          echo '=== dev-agent-native references ==='
          grep -R -n -C 6 -- 'dev-agent-native' worker .github app 2>/dev/null || true
          echo '=== repeated-domain assertion references ==='
          grep -R -n -C 8 -- 'repeated a resolved agent group\|assertNoRepeatedResolvedDomains\|canonical build' worker 2>/dev/null || true
          gate="$(find worker -maxdepth 1 -type f -name 'phoenix_agent_rule.test.mjs' -print -quit)"
          if [[ -n "$gate" ]]; then
            echo "=== $gate ==="
            sed -n '1,540p' "$gate"
          fi
