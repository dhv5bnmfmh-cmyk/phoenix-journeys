name: Lijiang Dev Integrate

on:
  push:
    branches:
      - dev/current

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev/current
          fetch-depth: 0
      - name: Apply Lijiang Gold bindings
        run: python .github/lijiang_patch.py
      - name: Validate patch formatting
        run: git diff --check
      - name: Commit integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/data
          if git diff --cached --quiet; then
            echo 'No integration delta.'
            exit 0
          fi
          git commit -m 'feat: integrate Lijiang Gold runtime and Challenge'
          git push origin HEAD:dev/current
