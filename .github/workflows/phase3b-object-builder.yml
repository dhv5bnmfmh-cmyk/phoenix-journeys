name: Phase 3B-1 Object Builder

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase3b-object-builder.yml

permissions:
  contents: write

env:
  EXPECTED_TREE: dec9cd9dd2e8f8184fc377d26cf2960789a3aa30
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  build-batch1-object:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 1

      - name: Verify complete content-addressed payload
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {existsSync} from 'node:fs';
          const expected={
            part01:'22a6d1f1caebc280703f738c2389d1b54d960df8',part02:'8fa3d5787cb46d33be5d95938d1b4fdddf2cfa5a',part03a:'68da2387a63880162b3955df6d9d71f3fa78acd3',part03b:'74439fda3c665ccd87d25dba2fb616761553d309',part04:'78e277d30509f20d946e83d348871ef9e6f11dfa',part05:'5f024f1a74d4517fec76a397f4f6fcd6540610af',part06:'39627618c28bd500ab2d0218f0172e46b3e8d8cb',part07:'e385c5a68181184fc4b65b079f243f29b0d9776b',part08:'daaf62f38367905c259b8318c867ba83f881f68e',part09:'4116174076971c675b68d9b273d02f59782017e2',part10:'f472c9bd7a4ce332514618de29a41e7e68ffb098',part11:'abdf515ca345e3e4fa16a66c217a1b378874c804',part12:'2e39e73cd1cc76da2afc8abae37b48701c06043b',
            part13a:'42106669d3f41d6f3c81d01ceee0de4a3c3d99a3',part13b:'68172d5c03a28ca298c73385cabc8e58acbe9119',part14a:'0fd07acef6befe93f03a2585c0da735acce3d49b',part14b:'bd1e7d8e854c7724bed756fb0860c1c903db5fd7',part15a:'abc33bc3bdc8908773a910a99f91387ef6527b21',part15b:'7112f4ac64dc22460d43e32a676599c508562496',part16a:'c8cd2cbbf31b39437cf78b34d01799594b62b938',part16b:'afbd95cd2345712a78127b8fa74e233419337007',part17a:'956f71f01b5227e88f3900734f35565b89a3ed0d',part17b:'c998a40cfa62823c0da8d9d2079857dedbb191c7',part18a:'c60d5e368d6b4920e9ba17abf544a9ebb6c02c5c',part18b:'9cd4cbf5d7d236e526f8e4c3a09844831854b762'};
          for(const [suffix,want] of Object.entries(expected)){
            const path=`worker/phase3b-batch1-full-patch.${suffix}`;
            if(!existsSync(path)) throw new Error(`Missing ${path}`);
            const got=execFileSync('git',['hash-object',path],{encoding:'utf8'}).trim();
            if(got!==want) throw new Error(`${path}: ${got} != ${want}`);
          }
          NODE

      - name: Apply exact tested Batch 1 text state
        shell: bash
        run: |
          set -euo pipefail
          {
            cat worker/phase3b-batch1-full-patch.part01 worker/phase3b-batch1-full-patch.part02
            cat worker/phase3b-batch1-full-patch.part03a worker/phase3b-batch1-full-patch.part03b
            for n in $(seq -w 4 12); do cat "worker/phase3b-batch1-full-patch.part${n}"; done
            for n in $(seq 13 18); do cat "worker/phase3b-batch1-full-patch.part${n}a" "worker/phase3b-batch1-full-patch.part${n}b"; done
          } | base64 -d | gzip -dc > /tmp/phase3b-batch1.patch
          git reset --hard "$HEAD_SHA"
          git clean -fdx
          git apply /tmp/phase3b-batch1.patch

      - name: Generate and verify Journey 1-9 assets
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false sharp@0.34.1
          node worker/scripts/generate_ordinary_learning_rights_safe_assets.mjs --jobs=4
          node --input-type=module <<'NODE'
          import {readFileSync,readdirSync,rmSync} from 'node:fs';
          const rows=JSON.parse(readFileSync('design/evidence/ordinary-learning-v1/journey-rows-1.json','utf8'));
          if(rows.length!==9) throw new Error(`Expected 9 journeys, got ${rows.length}`);
          for(const row of rows) for(const p of Object.values(row[8])) rmSync(p.oldPath,{force:true});
          for(const name of readdirSync('.github/workflows')) if(name.startsWith('phase3b-')) rmSync(`.github/workflows/${name}`,{force:true});
          for(const name of readdirSync('worker')) if(name.startsWith('phase3b-')&&!name.startsWith('phase3b-prep-bundle.')) rmSync(`worker/${name}`,{recursive:true,force:true});
          rmSync('worker/scripts/build_phase3b_commit_objects.mjs',{force:true});
          NODE
          git diff --check
          node --test worker/*.test.mjs
          git add -A
          TREE=$(git write-tree)
          echo "Candidate tree: $TREE"
          test "$TREE" = "$EXPECTED_TREE"

      - name: Create one Git commit object without moving branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync} from 'node:fs';
          const [owner,repo]=process.env.GITHUB_REPOSITORY.split('/');
          const apiBase=`https://api.github.com/repos/${owner}/${repo}`;
          async function api(method,path,body){const r=await fetch(apiBase+path,{method,headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const text=await r.text();if(!r.ok)throw new Error(`${method} ${path} ${r.status}: ${text}`);return text?JSON.parse(text):{};}
          const parent=process.env.HEAD_SHA;
          const baseCommit=await api('GET',`/git/commits/${parent}`);
          const fields=execFileSync('git',['diff','--cached','--name-status','-z',parent],{encoding:'utf8'}).split('\0').filter(Boolean);
          const entries=[];
          for(let i=0;i<fields.length;){const status=fields[i++];const path=fields[i++];if(status.startsWith('D')){entries.push({path,mode:'100644',type:'blob',sha:null});continue;}const data=readFileSync(path);const blob=await api('POST','/git/blobs',{content:data.toString('base64'),encoding:'base64'});entries.push({path,mode:'100644',type:'blob',sha:blob.sha});}
          const tree=await api('POST','/git/trees',{base_tree:baseCommit.tree.sha,tree:entries});
          if(tree.sha!==process.env.EXPECTED_TREE) throw new Error(`Remote tree ${tree.sha} != expected ${process.env.EXPECTED_TREE}`);
          const commit=await api('POST','/git/commits',{message:'feat(visual): replace ordinary Journey learning assets batch 1',tree:tree.sha,parents:[parent]});
          const result={parent,commit:commit.sha,tree:tree.sha,entries:entries.length};
          writeFileSync('phase3b-batch1-object.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: phase3b-batch1-object-${{ env.HEAD_SHA }}
          path: phase3b-batch1-object.json
          retention-days: 1
          if-no-files-found: error
