name: Phase 3B-1 Object Builder

on:
  push:
    branches:
      - agent/documentation-sprint-01-18-recovery
    paths:
      - .github/workflows/phase3b-object-builder.yml
      - worker/phase3b-batch1-full-patch.part05

permissions:
  contents: write

env:
  EXPECTED_TREE: dec9cd9dd2e8f8184fc377d26cf2960789a3aa30

jobs:
  build-batch1-object:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check complete Connector payload
        id: payload
        shell: bash
        run: |
          ready=true
          for n in 01 02 03 04 05; do
            [[ -f "worker/phase3b-batch1-full-patch.part${n}" ]] || ready=false
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          [[ "$ready" == true ]] || echo 'Batch 1 payload incomplete; no Git object created.'

      - name: Apply exact tested Batch 1 text state
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat worker/phase3b-batch1-full-patch.part0{1,2,3,4,5} | base64 -d | gzip -dc > /tmp/phase3b-batch1.patch
          git reset --hard "$GITHUB_SHA"
          git clean -fdx
          git apply /tmp/phase3b-batch1.patch

      - name: Generate only Journey 1-9 SVG and WebP
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts sharp@0.34.1
          node worker/scripts/generate_ordinary_learning_rights_safe_assets.mjs --jobs=4
          node --input-type=module <<'NODE'
          import {readFileSync,rmSync} from 'node:fs';
          const rows=JSON.parse(readFileSync('design/evidence/ordinary-learning-v1/journey-rows-1.json','utf8'));
          if(rows.length!==9) throw new Error(`Expected 9 journeys, got ${rows.length}`);
          for(const row of rows){for(const p of Object.values(row[8])) rmSync(p.oldPath,{force:true});}
          for(const p of [
            '.github/workflows/phase3b-materialize.yml','.github/workflows/phase3b-toolchain.yml','.github/workflows/phase3b-object-builder.yml',
            'worker/phase3b-compact-bundle.part01','worker/phase3b-compact-bundle.part02','worker/phase3b-compact-bundle.part03',
            'worker/phase3b-batch1-full-patch.part01','worker/phase3b-batch1-full-patch.part02','worker/phase3b-batch1-full-patch.part03',
            'worker/phase3b-batch1-full-patch.part04','worker/phase3b-batch1-full-patch.part05']) rmSync(p,{force:true});
          NODE

      - name: Verify Batch 1 candidate
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --test worker/*.test.mjs
          git add -A
          TREE=$(git write-tree)
          echo "Local candidate tree: $TREE"
          test "$TREE" = "$EXPECTED_TREE"

      - name: Create one Git commit object without moving branch
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync} from 'node:fs';
          const [owner,repo]=process.env.GITHUB_REPOSITORY.split('/');
          const apiBase=`https://api.github.com/repos/${owner}/${repo}`;
          async function api(method,path,body){const r=await fetch(apiBase+path,{method,headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const t=await r.text();if(!r.ok)throw new Error(`${method} ${path} ${r.status}: ${t}`);return t?JSON.parse(t):{};}
          const parent=process.env.GITHUB_SHA;
          const baseCommit=await api('GET',`/git/commits/${parent}`);
          const fields=execFileSync('git',['diff','--cached','--name-status','-z',parent],{encoding:'utf8'}).split('\0').filter(Boolean);
          const entries=[];
          for(let i=0;i<fields.length;){const status=fields[i++];const path=fields[i++];if(status.startsWith('D')){entries.push({path,mode:'100644',type:'blob',sha:null});continue;}const data=readFileSync(path);const blob=await api('POST','/git/blobs',{content:data.toString('base64'),encoding:'base64'});entries.push({path,mode:'100644',type:'blob',sha:blob.sha});}
          const tree=await api('POST','/git/trees',{base_tree:baseCommit.tree.sha,tree:entries});
          if(tree.sha!==process.env.EXPECTED_TREE) throw new Error(`Remote tree ${tree.sha} != expected ${process.env.EXPECTED_TREE}`);
          const commit=await api('POST','/git/commits',{message:'feat(visual): replace ordinary Journey learning assets batch 1',tree:tree.sha,parents:[parent]});
          const result={parent,commit:commit.sha,tree:tree.sha,entries:entries.length};
          writeFileSync('phase3b-batch1-object.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          NODE

      - name: Upload object evidence
        if: steps.payload.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase3b-batch1-object-${{ github.sha }}
          path: phase3b-batch1-object.json
          retention-days: 1
          if-no-files-found: error
