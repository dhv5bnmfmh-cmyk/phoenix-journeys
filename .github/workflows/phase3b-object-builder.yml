name: Phase 3B-1 Object Builder

on:
  push:
    branches:
      - agent/documentation-sprint-01-18-recovery
    paths:
      - .github/workflows/phase3b-object-builder.yml
      - worker/phase3b-batch1-text-patch.part03

permissions:
  contents: write

env:
  PHASE3B_BRANCH: agent/documentation-sprint-01-18-recovery
  EXPECTED_TREE: dec9cd9dd2e8f8184fc377d26cf2960789a3aa30

jobs:
  build-batch1-object:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Wait for complete connector payload
        id: payload
        shell: bash
        run: |
          if [[ -f worker/phase3b-batch1-text-patch.part01 && -f worker/phase3b-batch1-text-patch.part02 && -f worker/phase3b-batch1-text-patch.part03 ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Batch 1 patch payload is not complete yet; no object created.'
          fi

      - name: Restore approved preparation payload
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {mkdirSync,readFileSync,readdirSync,writeFileSync} from 'node:fs';
          import {dirname,resolve} from 'node:path';
          import {gunzipSync} from 'node:zlib';
          const root=process.cwd();
          const prep=readdirSync('worker').filter(n=>n.startsWith('phase3b-prep-bundle.part')).sort();
          if(prep.length!==9) throw new Error(`Expected 9 prep parts, got ${prep.length}`);
          const payload=JSON.parse(gunzipSync(Buffer.concat(prep.map(n=>readFileSync(resolve('worker',n))))).toString('utf8'));
          for(const [path,b64] of Object.entries(payload)){const full=resolve(path);mkdirSync(dirname(full),{recursive:true});writeFileSync(full,Buffer.from(b64,'base64'));}
          for(const gz of [
            'design/sources/ordinary-learning-v1/fragments/journeys-1.json.gz','design/sources/ordinary-learning-v1/fragments/journeys-2.json.gz','design/sources/ordinary-learning-v1/fragments/journeys-3.json.gz',
            'design/evidence/ordinary-learning-v1/asset-rows-1.json.gz','design/evidence/ordinary-learning-v1/asset-rows-2.json.gz','design/evidence/ordinary-learning-v1/asset-rows-3.json.gz',
            'design/evidence/ordinary-learning-v1/journey-rows-1.json.gz','design/evidence/ordinary-learning-v1/journey-rows-2.json.gz','design/evidence/ordinary-learning-v1/journey-rows-3.json.gz']){
            const full=resolve(gz);writeFileSync(full.replace(/\.gz$/,''),gunzipSync(readFileSync(full)));
          }
          const compact=readdirSync('worker').filter(n=>n.startsWith('phase3b-compact-bundle.part')).sort();
          if(compact.length!==3) throw new Error(`Expected 3 compact parts, got ${compact.length}`);
          const extra=JSON.parse(gunzipSync(Buffer.from(compact.map(n=>readFileSync(resolve('worker',n),'utf8')).join(''),'base64')).toString('utf8'));
          for(const [path,text] of Object.entries(extra)){const full=resolve(path);mkdirSync(dirname(full),{recursive:true});writeFileSync(full,text);}
          const gen=resolve('worker/scripts/generate_ordinary_learning_rights_safe_assets.mjs');
          let source=readFileSync(gen,'utf8');
          source=source.replace("const journeys = params.journeyFiles.flatMap(readJson);","const journeys = params.journeyFiles.flatMap(readJson).slice(0, 9);");
          writeFileSync(gen,source);
          NODE

      - name: Generate only Journey 1-9 assets
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts sharp@0.33.5
          node worker/scripts/generate_ordinary_learning_rights_safe_assets.mjs --jobs=4
          node worker/scripts/prepare_ordinary_learning_phase3b_artifacts.mjs phase3b-prepared-output
          tar -czf /tmp/phase3b-batch1-generated.tgz \
            app/assets/images/backgrounds/rights-safe-learning-v1 \
            design/sources/ordinary-learning-v1/masters
          cp phase3b-prepared-output/ASSET_REGISTER.phase3b-1.csv /tmp/ASSET_REGISTER.csv
          cp worker/phase3b-support/pubspec-phase3b-1.yaml /tmp/pubspec.yaml

      - name: Apply exact tested Batch 1 text patch
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat worker/phase3b-batch1-text-patch.part0{1,2,3} | base64 -d | gzip -dc > /tmp/phase3b-batch1.patch
          git reset --hard "$GITHUB_SHA"
          git clean -fdx
          tar -xzf /tmp/phase3b-batch1-generated.tgz
          git apply /tmp/phase3b-batch1.patch
          cp /tmp/ASSET_REGISTER.csv design/ASSET_REGISTER.csv
          cp /tmp/pubspec.yaml app/pubspec.yaml
          node --input-type=module <<'NODE'
          import {readFileSync,rmSync} from 'node:fs';
          const rows=JSON.parse(readFileSync('design/evidence/ordinary-learning-v1/journey-rows-1.json','utf8'));
          for(const row of rows){for(const p of Object.values(row[8])) rmSync(p.oldPath,{force:true});}
          for(const p of [
            '.github/workflows/phase3b-materialize.yml','.github/workflows/phase3b-toolchain.yml','.github/workflows/phase3b-object-builder.yml',
            'worker/phase3b-compact-bundle.part01','worker/phase3b-compact-bundle.part02','worker/phase3b-compact-bundle.part03',
            'worker/phase3b-batch1-text-patch.part01','worker/phase3b-batch1-text-patch.part02','worker/phase3b-batch1-text-patch.part03']) rmSync(p,{force:true});
          NODE
          git diff --check
          node --test worker/*.test.mjs
          git add -A
          TREE=$(git write-tree)
          echo "Local candidate tree: $TREE"
          test "$TREE" = "$EXPECTED_TREE"

      - name: Create one remote Git object without moving branch
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFileSync,writeFileSync} from 'node:fs';
          const [owner,repo]=process.env.GITHUB_REPOSITORY.split('/');
          const base=`https://api.github.com/repos/${owner}/${repo}`;
          const token=process.env.GH_TOKEN;
          async function api(method,path,body){const r=await fetch(base+path,{method,headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const t=await r.text();if(!r.ok)throw new Error(`${method} ${path} ${r.status}: ${t}`);return t?JSON.parse(t):{};}
          const parent=process.env.GITHUB_SHA;
          const commit0=await api('GET',`/git/commits/${parent}`);
          const lines=execFileSync('git',['diff','--cached','--name-status','-z',parent],{encoding:'utf8'}).split('\0').filter(Boolean);
          const entries=[];
          for(let i=0;i<lines.length;){const status=lines[i++];const path=lines[i++];if(status.startsWith('D')){entries.push({path,mode:'100644',type:'blob',sha:null});continue;}const data=readFileSync(path);const blob=await api('POST','/git/blobs',{content:data.toString('base64'),encoding:'base64'});entries.push({path,mode:'100644',type:'blob',sha:blob.sha});}
          const tree=await api('POST','/git/trees',{base_tree:commit0.tree.sha,tree:entries});
          if(tree.sha!==process.env.EXPECTED_TREE) throw new Error(`Remote tree ${tree.sha} != expected ${process.env.EXPECTED_TREE}`);
          const commit=await api('POST','/git/commits',{message:'feat(visual): replace ordinary Journey learning assets batch 1',tree:tree.sha,parents:[parent]});
          const result={parent,commit:commit.sha,tree:tree.sha,entries:entries.length,expectedTree:process.env.EXPECTED_TREE};
          writeFileSync('phase3b-batch1-object.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          NODE

      - name: Upload object evidence
        if: steps.payload.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase3b-batch1-object-${{ github.sha }}
          path: phase3b-batch1-object.json
          retention-days: 1
          if-no-files-found: error
