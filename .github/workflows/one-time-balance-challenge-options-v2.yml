name: One-time balance challenge options v2

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch-and-remove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/adaptive-level-content-v2
          fetch-depth: 0

      - name: Wire challenge option balancing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/lib/widgets/journey_challenge_panel.dart')
          source = path.read_text()

          def replace_once(old, new, label):
            global source
            if old not in source:
              raise SystemExit(f'{label} marker not found')
            source = source.replace(old, new, 1)
            print(f'PATCH_OK {label}')

          if "../services/challenge_option_balancer.dart" not in source:
            replace_once(
              "import '../models/language_proficiency.dart';\nimport '../services/narration_controller.dart';",
              "import '../models/language_proficiency.dart';\nimport '../services/challenge_option_balancer.dart';\nimport '../services/narration_controller.dart';",
              'import',
            )

          if 'constraints: const BoxConstraints(minHeight: 56)' not in source:
            replace_once(
              "        child: Container(\n          width: double.infinity,\n          padding: const EdgeInsets.fromLTRB(9, 8, 9, 8),",
              "        child: Container(\n          width: double.infinity,\n          constraints: const BoxConstraints(minHeight: 56),\n          padding: const EdgeInsets.fromLTRB(9, 8, 9, 8),",
              'option-height',
            )

          replace_once(
            '    final distractorTexts = _paragraphDistractors(journeyId);',
            '''    final distractorTexts = selectBalancedChallengeDistractors(
              correctAnswers: correctTexts,
              candidates: _paragraphDistractors(journeyId),
              count: journeyChallengeOptionCount - correctOptions.length,
            );''',
            'paragraph-balance',
          )

          grammar_old = '''    final replacementTexts = <String>[];
              for (final candidate in replacementCandidates) {
                final value = candidate.trim();
                if (value.isEmpty || replacementTexts.contains(value)) continue;
                replacementTexts.add(value);
                if (replacementTexts.length >= journeyChallengeOptionCount) break;
              }
              if (replacementTexts.length < journeyChallengeOptionCount) {
                throw StateError('Grammar challenge requires five unique options.');
              }'''
          grammar_new = '''    final distractorTexts = selectBalancedChallengeDistractors(
              correctAnswers: <String>[grammar.correctReplacement],
              candidates: replacementCandidates,
              count: journeyChallengeOptionCount - 1,
            );
            final replacementTexts = <String>[
              grammar.correctReplacement,
              ...distractorTexts,
            ];'''
          if grammar_old not in source:
            grammar_old = '''    final replacementTexts = <String>[];
            for (final candidate in replacementCandidates) {
              final value = candidate.trim();
              if (value.isEmpty || replacementTexts.contains(value)) continue;
              replacementTexts.add(value);
              if (replacementTexts.length >= journeyChallengeOptionCount) break;
            }
            if (replacementTexts.length < journeyChallengeOptionCount) {
              throw StateError('Grammar challenge requires five unique options.');
            }'''
          replace_once(grammar_old, grammar_new, 'grammar-balance')

          missing_pattern = re.compile(
            r"    final distractors = _missingDistractors\(\s*journeyId,\s*discoveryTexts,\s*difficulty,\s*\);"
          )
          missing_new = '''    final distractors = selectBalancedChallengeDistractors(
              correctAnswers: <String>[correct],
              candidates: _missingDistractors(
                journeyId,
                discoveryTexts,
                difficulty,
              ),
              count: journeyChallengeOptionCount - 1,
            );'''
          source, count = missing_pattern.subn(missing_new, source, count=1)
          if count != 1:
            raise SystemExit('missing-balance marker not found')
          print('PATCH_OK missing-balance')

          replace_once(
            "          '他很快离开了这里，故事也在这一刻结束。',",
            "          '他很快离开了这里，故事也在这一刻结束。',\n          '他继续向前走，却没有留意周围发生的变化。',",
            'beginner-pool',
          )
          replace_once(
            "          '他停下脚步，把沿途景色逐一写进记录里。',",
            "          '他停下脚步，把沿途景色逐一写进记录里。',\n          '他沿着原来的路线前进，却忽略了前后线索。',",
            'standard-pool',
          )
          replace_once(
            "          '他重新检查前文线索，却没有改变原来的判断。',",
            "          '他重新检查前文线索，却没有改变原来的判断。',\n          '他看似回应了前文，却无法解释后面出现的结果。',",
            'advanced-pool',
          )

          truncation_pattern = re.compile(
            r"\n      if \(result\.length >= journeyChallengeOptionCount - 1\) break;\n"
          )
          source, count = truncation_pattern.subn('\n', source, count=1)
          if count != 1:
            raise SystemExit('missing-truncation marker not found')
          print('PATCH_OK missing-truncation')

          shortage_pattern = re.compile(
            r"\n    if \(result\.length < journeyChallengeOptionCount - 1\) \{\s*throw StateError\(\s*'Missing-sentence challenge requires four distractors\.',\s*\);\s*\}\n"
          )
          source, count = shortage_pattern.subn('\n', source, count=1)
          if count != 1:
            raise SystemExit('missing-shortage marker not found')
          print('PATCH_OK missing-shortage')

          source = source.replace(
            '先点击病句位置，再从五个修改方案中选出最自然的一项。',
            '先点击病句位置，再从五个长度接近的修改方案中选出最自然的一项。',
            1,
          )
          source = source.replace(
            '阅读前后文，从五个相近答案中选出最能连接上下文的一句。',
            '阅读前后文，从五个长度接近的答案中选出最能连接上下文的一句。',
            1,
          )

          path.write_text(source)
          PY

      - name: Commit product changes and remove migration files
        shell: bash
        run: |
          rm -f .github/workflows/one-time-balance-challenge-options.yml
          rm -f .github/workflows/one-time-balance-challenge-options-v2.yml
          rm -f docs/trigger-balance-challenge-options.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/widgets/journey_challenge_panel.dart \
            .github/workflows/one-time-balance-challenge-options.yml \
            .github/workflows/one-time-balance-challenge-options-v2.yml \
            docs/trigger-balance-challenge-options.txt
          git commit -m "Balance adaptive challenge answer lengths"
          git push origin HEAD:agent/adaptive-level-content-v2
