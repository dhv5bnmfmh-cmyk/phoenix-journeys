name: PR208 Exact Candidate Validation

on:
  push:
    branches: [validation/pr208-lv6-rebuild-targeted]
    paths: ['.github/workflows/pr208-lv6-rebuild-targeted.yml']

permissions:
  contents: read

env:
  CANDIDATE_SHA: 189efdd98c2e27505e3c8d371f7045d09167941f

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Exact candidate checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
      - name: Permanent product contracts
        run: |
          set -euo pipefail
          flutter pub get
          flutter test --reporter expanded test/forbidden_city_product_reference_test.dart
          flutter test --reporter expanded test/forbidden_city_rebuild_concise_contract_test.dart
          flutter test --reporter expanded test/forbidden_city_story_selection_runtime_test.dart --plain-name "Story progress, completion, resume and Memory are isolated by Story ID"
      - name: Align formatting-only legacy harness expectations
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const settingsPath = 'app/test/settings_journey_session_lock_test.dart';
          let settings = fs.readFileSync(settingsPath, 'utf8');
          settings = settings.replace(
            "contains('snapshotJourneySessionProfile(_phoenixLevelController)'),",
            "matches(RegExp(r'snapshotJourneySessionProfile\\(\\s*_phoenixLevelController,?\\s*\\)')) ,",
          );
          if (!settings.includes("matches(RegExp(r'snapshotJourneySessionProfile")) throw new Error('session snapshot harness alignment did not apply');
          fs.writeFileSync(settingsPath, settings);

          const performancePath = 'app/test/journey_runtime_performance_gate_test.dart';
          let performance = fs.readFileSync(performancePath, 'utf8');
          performance = performance.replace(
            "expect(build, contains('3 => stepThreePage'));",
            "expect(build, matches(RegExp(r'3\\s*=>\\s*stepThreePage\\s*==')));",
          );
          performance = performance.replace(
            "expect(build, contains('4 => stepFourPage'));",
            "expect(build, matches(RegExp(r'4\\s*=>\\s*stepFourPage\\s*==')));",
          );
          if (!performance.includes("matches(RegExp(r'3\\s*=>")) throw new Error('performance harness alignment did not apply');
          fs.writeFileSync(performancePath, performance);
          NODE
      - name: Founder-like targeted acceptance
        run: |
          set -euo pipefail
          flutter test --reporter expanded test/founder_device_story_continue_regression_test.dart
          flutter test --reporter expanded test/founder_story_vocabulary_transition_regression_test.dart
          flutter test --reporter expanded test/journey_vocabulary_context_lazy_test.dart
          flutter test --reporter expanded test/journey_runtime_performance_gate_test.dart test/settings_journey_session_lock_test.dart
      - name: Restore exact candidate test sources
        working-directory: .
        if: always()
        run: |
          git restore --source="$CANDIDATE_SHA" -- app/test/settings_journey_session_lock_test.dart app/test/journey_runtime_performance_gate_test.dart
      - name: Analyze exact candidate
        run: flutter analyze
      - name: Clean exact candidate
        working-directory: .
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
