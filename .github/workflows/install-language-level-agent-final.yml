name: Install Phoenix Language Level Agent Final

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/install-language-level-agent-final.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/summer-palace-story-engine-pilot
          fetch-depth: 0

      - name: Apply tested Journey integration script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-language-level-agent.yml')
          lines = workflow.read_text().splitlines()
          start = next(
              index for index, line in enumerate(lines)
              if line.strip() == "python3 - <<'PY'"
          ) + 1
          end = next(
              index for index in range(start, len(lines))
              if lines[index].strip() == 'PY'
          )
          script_lines = []
          for line in lines[start:end]:
              script_lines.append(line[10:] if line.startswith('          ') else line)
          exec('\n'.join(script_lines), {'__name__': '__main__'})
          PY

      - name: Commit Journey integration only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/screens/journey_screen.dart
          git commit -m "feat: connect HSK TOCFL agent to Journey experience"
          git fetch origin feature/summer-palace-story-engine-pilot
          git rebase origin/feature/summer-palace-story-engine-pilot
          git push origin HEAD:feature/summer-palace-story-engine-pilot
