name: Founder Device Product Fix

on:
  push:
    branches:
      - validation/founder-preview-closeout-853cd1
    paths:
      - '.github/workflows/founder-device-product-fix.yml'

permissions:
  contents: write

env:
  PRODUCT_SHA: 853cd1e627ef43363f9d795f3dcac6720e99190f
  PRODUCT_BRANCH: product/city-standard-v1-beijing-forbidden-city

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out validation carrier
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Capture exact patch helper and regression test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/founder-device"
          cp .github/scripts/apply_founder_device_acceptance_fix.py "$RUNNER_TEMP/founder-device/apply.py"
          cp app/test/founder_challenge_device_regression_test.dart "$RUNNER_TEMP/founder-device/regression.dart"

      - name: Check out exact product SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0
          clean: true

      - name: Verify exact product identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"

      - name: Apply minimal Founder device product fix
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/founder-device/apply.py"
          cp "$RUNNER_TEMP/founder-device/regression.dart" app/test/founder_challenge_device_regression_test.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Canonical format and diff guard
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            app/lib/screens/journey_screen.dart \
            app/lib/widgets/hsk_story_challenge.dart \
            app/test/founder_challenge_device_regression_test.dart
          dart format --output=none --set-exit-if-changed \
            app/lib/screens/journey_screen.dart \
            app/lib/widgets/hsk_story_challenge.dart \
            app/test/founder_challenge_device_regression_test.dart
          git diff --check
          {
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u > /tmp/actual.txt
          printf '%s\n' \
            app/lib/screens/journey_screen.dart \
            app/lib/widgets/hsk_story_challenge.dart \
            app/test/founder_challenge_device_regression_test.dart \
            | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Targeted Founder device regression
        working-directory: app
        run: flutter test --reporter expanded test/founder_challenge_device_regression_test.dart

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Relevant Challenge Flutter tests
        working-directory: app
        run: |
          flutter test --reporter expanded \
            test/founder_challenge_device_regression_test.dart \
            test/authoritative_story_challenge_contract_test.dart

      - name: Create single product commit and fast-forward canonical
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$PRODUCT_BRANCH"
          test "$(git rev-parse "origin/$PRODUCT_BRANCH")" = "$PRODUCT_SHA"
          git add \
            app/lib/screens/journey_screen.dart \
            app/lib/widgets/hsk_story_challenge.dart \
            app/test/founder_challenge_device_regression_test.dart
          git diff --cached --name-only | sort > /tmp/staged.txt
          diff -u /tmp/expected.txt /tmp/staged.txt
          git config user.name phoenix-founder-validation
          git config user.email phoenix-founder-validation@users.noreply.github.com
          git commit -m "fix(challenge): isolate completion nav and feedback audio"
          new_sha="$(git rev-parse HEAD)"
          echo "NEW EXACT PRODUCT SHA = $new_sha"
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
