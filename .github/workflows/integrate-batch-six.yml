name: Integrate journey expansion batch six

on:
  push:
    branches:
      - agent/enable-missing-dynamic-backgrounds
    paths:
      - .github/workflows/integrate-batch-six.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/enable-missing-dynamic-backgrounds
      - name: Wire batch six into every journey surface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/lib/data/daily_journey_catalog.dart')
          s=p.read_text()
          imp="import 'journey_expansion_batch_six.dart';\n"
          if imp not in s:
              s=s.replace("import 'journey_expansion_batch_five.dart';\n", "import 'journey_expansion_batch_five.dart';\n"+imp)
          if '...journeyExpansionBatchSixSources,' not in s:
              s=s.replace('  ...journeyExpansionBatchFiveSources,\n', '  ...journeyExpansionBatchFiveSources,\n  ...journeyExpansionBatchSixSources,\n')
          if '...journeyExpansionBatchSixRecords,' not in s:
              s=s.replace('  ...journeyExpansionBatchFiveRecords,\n', '  ...journeyExpansionBatchFiveRecords,\n  ...journeyExpansionBatchSixRecords,\n')
          if '...journeyExpansionBatchSixExperiences,' not in s:
              s=s.replace('  ...journeyExpansionBatchFiveExperiences,\n', '  ...journeyExpansionBatchFiveExperiences,\n  ...journeyExpansionBatchSixExperiences,\n')
          p.write_text(s)

          t=Path('app/test/journey_expansion_batch_six_test.dart')
          t.write_text("""import 'package:flutter_test/flutter_test.dart';
import 'package:phoenix_journeys/data/daily_journey_catalog.dart';

void main() {
  test('five new journeys are synchronized across the full experience', () {
    const ids = <String>[
      'dunhuang-mogao-caves',
      'suzhou-classical-gardens',
      'quanzhou-maritime-emporium',
      'lhasa-potala-palace',
      'luoyang-longmen-grottoes',
    ];
    for (final id in ids) {
      final journey = requireDailyJourneyExperience(id);
      expect(journey.id, id);
      expect(journey.content.sections.length, greaterThanOrEqualTo(4));
      expect(journey.storyAnnotations.length, journey.content.sections.length);
      expect(journey.words.length, greaterThanOrEqualTo(8));
      expect(journey.discoveries.length, greaterThanOrEqualTo(4));
      expect(journey.stampSymbol, isNotEmpty);
      expect(dailyJourneyExperiences.any((item) => item.id == id), isTrue);
      expect(dailyJourneyRecords.any((item) => item.id == id), isTrue);
    }
  });
}
""")
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/integrate-batch-six.yml
      - name: Commit integrated journeys
        run: |
          git config user.name "Phoenix Journey Agent"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/data/daily_journey_catalog.dart app/test/journey_expansion_batch_six_test.dart .github/workflows/integrate-batch-six.yml
          git commit -m "Integrate five random journeys across Phoenix"
          git push origin HEAD:agent/enable-missing-dynamic-backgrounds
