name: Forbidden City PR Preview E2E

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: forbidden-city-preview-e2e-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
  PREVIEW_URL: https://phoenix-journeys-pr-${{ github.event.pull_request.number }}.7hn5tyrjgh.workers.dev/

jobs:
  forbidden-city-preview-e2e:
    if: github.event.pull_request.number == 197
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "FORBIDDEN CITY E2E CANDIDATE SHA = $CANDIDATE_SHA"

      - name: Wait for exact Cloudflare preview release
        shell: bash
        run: |
          set -euo pipefail
          health_url="${PREVIEW_URL}api/health?commit=${CANDIDATE_SHA}"
          verified=false
          for attempt in {1..180}; do
            response="$(curl --fail --silent --show-error "$health_url" || true)"
            if node -e '
              let health;
              try { health = JSON.parse(process.argv[1]); } catch (_) { process.exit(1); }
              const expected = process.argv[2];
              if (!health.ok || !health.ai || health.service !== "phoenix-journeys" || health.release !== expected) process.exit(1);
            ' "$response" "$CANDIDATE_SHA"; then
              echo "HEALTH / RELEASE = PASS"
              echo "EXPECTED SHA = $CANDIDATE_SHA"
              echo "DEPLOYED SHA = $(node -e 'process.stdout.write(JSON.parse(process.argv[1]).release)' "$response")"
              verified=true
              break
            fi
            echo "Waiting for exact preview release ${attempt}/180"
            sleep 5
          done
          if [[ "$verified" != true ]]; then
            echo "Exact PR preview release did not become healthy."
            exit 1
          fi

      - name: Install Chromium and WebKit functional drivers
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/forbidden-city-e2e-node" playwright
          "$RUNNER_TEMP/forbidden-city-e2e-node/node_modules/.bin/playwright" install --with-deps chromium webkit

      - name: Verify actual Forbidden City Lv1 Lv3 Lv5 Lv8 Lv10 experience
        shell: bash
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/forbidden-city-e2e-node/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          mkdir -p test-results
          node .github/scripts/verify_forbidden_city_preview_v2_level_race_fix.mjs \
            "$PREVIEW_URL" \
            "$CANDIDATE_SHA" \
            2>&1 | tee test-results/forbidden-city-preview-e2e.log

      - name: Verify Forbidden City Story Reading Support
        shell: bash
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/forbidden-city-e2e-node/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          mkdir -p test-results
          node .github/scripts/verify_forbidden_city_story_reading_support.mjs \
            "$PREVIEW_URL" \
            "$CANDIDATE_SHA" \
            2>&1 | tee test-results/forbidden-city-story-reading-support.log

      - name: Verify iPhone WebKit startup and Forbidden City entry
        shell: bash
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/forbidden-city-e2e-node/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          mkdir -p test-results
          node .github/scripts/verify_forbidden_city_mobile_webkit_discovery_depth.mjs \
            "$PREVIEW_URL" \
            "$CANDIDATE_SHA" \
            2>&1 | tee test-results/forbidden-city-mobile-webkit.log

      - name: Upload Forbidden City E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forbidden-city-preview-e2e-${{ env.CANDIDATE_SHA }}
          path: test-results/
          if-no-files-found: warn
