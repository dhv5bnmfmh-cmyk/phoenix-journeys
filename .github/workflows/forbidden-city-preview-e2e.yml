name: Reference Journey E2E

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/forbidden-city-preview-e2e.yml'
      - '.github/scripts/verify_shanghai_bund_exact_preview.mjs'
      - '.github/scripts/patch_shanghai_transient_modal_guard.mjs'
      - '.github/scripts/patch_shanghai_transient_modal_semantic_shape.mjs'
      - '.github/scripts/patch_shanghai_modal_close_settle.mjs'
      - '.github/scripts/patch_shanghai_stable_semantic_activation.mjs'
      - '.github/scripts/patch_shanghai_seek_action_safety.mjs'
      - '.github/scripts/patch_shanghai_seek_terminal_state.mjs'
      - '.github/scripts/patch_shanghai_terminal_corpus_authority.mjs'
      - '.github/scripts/patch_shanghai_semantic_remount_retry.mjs'
      - '.github/scripts/verify_shanghai_action_safety_preflight.mjs'

permissions:
  contents: read

concurrency:
  group: shanghai-bund-exact-head-browser-gates
  cancel-in-progress: true

env:
  CANDIDATE_SHA: 52f58542c72ae9c7c5021b3e2a4b9e5256e5c403
  PREVIEW_URL: https://phoenix-journeys-pr-199.7hn5tyrjgh.workers.dev/

jobs:
  reference-journey-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact formal Shanghai candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact formal candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "FORMAL SHANGHAI CANDIDATE SHA = $CANDIDATE_SHA"

      - name: Check out validation-only Shanghai browser harness
        uses: actions/checkout@v6
        with:
          ref: automation/shanghai-bund-exact-head-e2e
          path: .validation-harness
          fetch-depth: 1

      - name: Cheap validation harness patch and syntax preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check .validation-harness/.github/scripts/patch_shanghai_transient_modal_guard.mjs
          node --check .validation-harness/.github/scripts/patch_shanghai_transient_modal_semantic_shape.mjs
          node --check .validation-harness/.github/scripts/patch_shanghai_modal_close_settle.mjs
          node --check .validation-harness/.github/scripts/patch_shanghai_stable_semantic_activation.mjs
          node --check .validation-harness/.github/scripts/patch_shanghai_seek_action_safety.mjs
          node --check .validation-harness/.github/scripts/patch_shanghai_seek_terminal_state.mjs
          node --check .validation-harness/.github/scripts/patch_shanghai_terminal_corpus_authority.mjs
          node --check .validation-harness/.github/scripts/patch_shanghai_semantic_remount_retry.mjs
          node --check .validation-harness/.github/scripts/verify_shanghai_action_safety_preflight.mjs
          node .validation-harness/.github/scripts/patch_shanghai_transient_modal_guard.mjs \
            .validation-harness/.github/scripts/verify_shanghai_bund_exact_preview.mjs
          node .validation-harness/.github/scripts/patch_shanghai_transient_modal_semantic_shape.mjs \
            .validation-harness/.github/scripts/verify_shanghai_bund_exact_preview.mjs
          node .validation-harness/.github/scripts/patch_shanghai_modal_close_settle.mjs \
            .validation-harness/.github/scripts/verify_shanghai_bund_exact_preview.mjs
          node .validation-harness/.github/scripts/patch_shanghai_stable_semantic_activation.mjs \
            .validation-harness/.github/scripts/verify_shanghai_bund_exact_preview.mjs
          node .validation-harness/.github/scripts/patch_shanghai_seek_action_safety.mjs \
            .validation-harness/.github/scripts/verify_shanghai_bund_exact_preview.mjs
          node .validation-harness/.github/scripts/patch_shanghai_seek_terminal_state.mjs \
            .validation-harness/.github/scripts/verify_shanghai_bund_exact_preview.mjs
          node .validation-harness/.github/scripts/patch_shanghai_terminal_corpus_authority.mjs \
            .validation-harness/.github/scripts/verify_shanghai_bund_exact_preview.mjs
          node .validation-harness/.github/scripts/patch_shanghai_semantic_remount_retry.mjs \
            .validation-harness/.github/scripts/verify_shanghai_bund_exact_preview.mjs
          node --check .validation-harness/.github/scripts/verify_shanghai_bund_exact_preview.mjs

      - name: Cheap Shanghai action-safety static preflight
        shell: bash
        run: |
          set -euo pipefail
          node .validation-harness/.github/scripts/verify_shanghai_action_safety_preflight.mjs \
            .validation-harness/.github/scripts/verify_shanghai_bund_exact_preview.mjs

      - name: Cheap Shanghai Story semantic-anchor fixture preflight
        shell: bash
        run: |
          set -euo pipefail
          node .validation-harness/.github/scripts/verify_shanghai_bund_exact_preview.mjs --story-anchor-preflight

      - name: Cheap Shanghai Discovery corpus and TTS-unavailable fixture preflight
        shell: bash
        run: |
          set -euo pipefail
          node .validation-harness/.github/scripts/verify_shanghai_bund_exact_preview.mjs --discovery-corpus-preflight

      - name: Cheap known and unknown transient modal fixture preflight
        shell: bash
        run: |
          set -euo pipefail
          node .validation-harness/.github/scripts/verify_shanghai_bund_exact_preview.mjs --transient-modal-preflight

      - name: Cheap stable level, seek-rail reorder, remount, terminal corpus, and semantic-index fixture preflight
        shell: bash
        run: |
          set -euo pipefail
          node .validation-harness/.github/scripts/verify_shanghai_bund_exact_preview.mjs --level-settle-preflight

      - name: Verify PR 199 exact Cloudflare preview release
        shell: bash
        run: |
          set -euo pipefail
          health_url="${PREVIEW_URL}api/health?commit=${CANDIDATE_SHA}"
          verified=false
          for attempt in {1..60}; do
            response="$(curl --fail --silent --show-error "$health_url" || true)"
            if node -e '
              let health;
              try { health = JSON.parse(process.argv[1]); } catch (_) { process.exit(1); }
              const expected = process.argv[2];
              if (!health.ok || !health.ai || health.service !== "phoenix-journeys" || health.release !== expected) process.exit(1);
            ' "$response" "$CANDIDATE_SHA"; then
              echo "EXACT PREVIEW = PASS | $CANDIDATE_SHA"
              verified=true
              break
            fi
            sleep 2
          done
          [[ "$verified" == true ]]

      - name: Install Chromium and WebKit functional drivers
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/shanghai-exact-e2e-node" playwright
          "$RUNNER_TEMP/shanghai-exact-e2e-node/node_modules/.bin/playwright" install --with-deps chromium webkit

      - name: Cheap browser mode, Shanghai SPA open, and WebKit Lv3 settle preflight
        shell: bash
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/shanghai-exact-e2e-node/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          node .validation-harness/.github/scripts/verify_shanghai_bund_exact_preview.mjs \
            "$PREVIEW_URL" "$CANDIDATE_SHA" --browser-mode-preflight

      - name: Cheap WebKit Lv8 Discovery seek traversal preflight
        shell: bash
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/shanghai-exact-e2e-node/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          node .validation-harness/.github/scripts/verify_shanghai_bund_exact_preview.mjs \
            "$PREVIEW_URL" "$CANDIDATE_SHA" --webkit-lv8-discovery-preflight

      - name: Verify Shanghai Bund Chromium and WebKit full six-stage matrix
        shell: bash
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/shanghai-exact-e2e-node/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          mkdir -p test-results
          node .validation-harness/.github/scripts/verify_shanghai_bund_exact_preview.mjs \
            "$PREVIEW_URL" "$CANDIDATE_SHA" 2>&1 | tee test-results/shanghai-bund-exact-preview.log

      - name: Upload exact-head Shanghai browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shanghai-bund-exact-head-browser-${{ env.CANDIDATE_SHA }}
          path: test-results/
          if-no-files-found: warn
