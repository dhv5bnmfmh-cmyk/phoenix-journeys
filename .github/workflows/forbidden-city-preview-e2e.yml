name: Reference Journey E2E

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'app/lib/app.dart'
      - 'app/lib/screens/journey_screen.dart'
      - 'app/lib/widgets/**'
      - 'app/lib/data/adaptive_journey_level_runtime.dart'
      - 'app/lib/data/dedicated_adaptive_journey_catalog.dart'
      - 'app/lib/data/forbidden_city_*.dart'
      - 'app/test/forbidden_city_*.dart'
      - 'app/web/**'
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/scripts/**'
      - '.github/workflows/forbidden-city-preview-e2e.yml'
      - '.github/workflows/preview-cloudflare.yml'
      - '.github/workflows/flutter-ci.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: reference-journey-e2e-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
  PREVIEW_URL: https://phoenix-journeys-pr-${{ github.event.pull_request.number }}.7hn5tyrjgh.workers.dev/

jobs:
  reference-journey-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 105

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "REFERENCE JOURNEY E2E CANDIDATE SHA = $CANDIDATE_SHA"

      - name: Cheap Reference harness preflight
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            .github/scripts/exact_workflow_contract.mjs \
            .github/scripts/flutter_semantics_live.mjs \
            .github/scripts/journey_e2e_core.mjs \
            .github/scripts/verify_forbidden_city_reference_live.mjs \
            .github/scripts/verify_forbidden_city_story_reading_support.mjs \
            .github/scripts/verify_forbidden_city_mobile_live.mjs; do
            node --check "$file"
          done
          node --test \
            .github/scripts/exact_workflow_contract.test.mjs \
            .github/scripts/flutter_semantics_live.test.mjs \
            .github/scripts/semantic_action_safety_scan.test.mjs
          node .github/scripts/semantic_action_safety_scan.mjs \
            .github/scripts/flutter_semantics_live.mjs \
            .github/scripts/journey_e2e_core.mjs \
            .github/scripts/verify_forbidden_city_reference_live.mjs \
            .github/scripts/verify_forbidden_city_story_reading_support.mjs \
            .github/scripts/verify_forbidden_city_mobile_live.mjs

      - name: Resolve successful exact Preview producer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/exact_workflow_contract.mjs \
            await "Cloudflare PR Preview" "$CANDIDATE_SHA" 2700

      - name: Verify exact Preview health identity after producer success
        shell: bash
        run: |
          set -euo pipefail
          health_url="${PREVIEW_URL}api/health?commit=${CANDIDATE_SHA}"
          for attempt in {1..12}; do
            response="$(curl --fail --silent --show-error "$health_url" || true)"
            if RESPONSE="$response" EXPECTED="$CANDIDATE_SHA" node -e '
              const health = JSON.parse(process.env.RESPONSE);
              if (health.ok !== true || health.ai !== true || health.service !== "phoenix-journeys" || health.release !== process.env.EXPECTED) process.exit(1);
            '; then
              echo "HEALTH / RELEASE = PASS | SHA=$CANDIDATE_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "PREVIEW PRODUCER SUCCEEDED BUT EXACT HEALTH IDENTITY IS UNAVAILABLE" >&2
          exit 1

      - name: Install Chromium and WebKit functional drivers
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/reference-journey-e2e-node" playwright
          "$RUNNER_TEMP/reference-journey-e2e-node/node_modules/.bin/playwright" install --with-deps chromium webkit

      - name: Verify Forbidden City representative six-stage experience with live elements
        shell: bash
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/reference-journey-e2e-node/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          mkdir -p test-results
          node .github/scripts/verify_forbidden_city_reference_live.mjs \
            "$PREVIEW_URL" "$CANDIDATE_SHA" \
            2>&1 | tee test-results/forbidden-city-reference-live.log

      - name: Verify Forbidden City Story Reading Support
        shell: bash
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/reference-journey-e2e-node/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          node .github/scripts/verify_forbidden_city_story_reading_support.mjs \
            "$PREVIEW_URL" "$CANDIDATE_SHA" \
            2>&1 | tee test-results/forbidden-city-story-reading-support.log

      - name: Verify iPhone WebKit entry and canonical Discovery depth with live elements
        shell: bash
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/reference-journey-e2e-node/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          node .github/scripts/verify_forbidden_city_mobile_live.mjs \
            "$PREVIEW_URL" "$CANDIDATE_SHA" \
            2>&1 | tee test-results/forbidden-city-mobile-live.log

      - name: Upload Reference Journey E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-journey-e2e-${{ env.CANDIDATE_SHA }}
          path: test-results/
          if-no-files-found: warn
