name: Cloudflare PR Preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
      - 'app/**'
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/scripts/**'
      - '.github/workflows/**'

permissions:
  actions: read
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: cloudflare-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_WORKER: phoenix-journeys-pr-${{ github.event.pull_request.number }}
  PREVIEW_URL: https://phoenix-journeys-pr-${{ github.event.pull_request.number }}.7hn5tyrjgh.workers.dev
  PREVIEW_RELEASE: ${{ github.event.pull_request.head.sha }}

jobs:
  deploy-preview:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PREVIEW_RELEASE }}
          fetch-depth: 0

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"

      - name: Cheap orchestration preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/exact_workflow_contract.mjs
          node --check .github/scripts/validate_quality_artifact.mjs
          node --test \
            .github/scripts/exact_workflow_contract.test.mjs \
            .github/scripts/validate_quality_artifact.test.mjs

      - name: Resolve successful exact Flutter CI producer
        id: producer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/exact_workflow_contract.mjs \
            await "Flutter CI" "$PREVIEW_RELEASE" 2700
          test "${{ steps.producer.outputs.producer_sha }}" = "$PREVIEW_RELEASE"

      - name: Download exact tested web artifact
        uses: actions/download-artifact@v4
        with:
          name: phoenix-web-${{ env.PREVIEW_RELEASE }}
          path: app/build/web
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.producer.outputs.run_id }}

      - name: Download exact Journey quality artifact
        uses: actions/download-artifact@v4
        with:
          name: phoenix-journey-quality-${{ env.PREVIEW_RELEASE }}
          path: .phoenix-quality
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.producer.outputs.run_id }}

      - name: Verify downloaded exact artifact identity and quality contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const sha = process.env.PREVIEW_RELEASE;
          const manifest = JSON.parse(fs.readFileSync('app/build/web/phoenix-artifact.json', 'utf8'));
          if (manifest.schema !== 1 || manifest.type !== 'web' || manifest.sha !== sha) {
            throw new Error(`web artifact identity mismatch: ${JSON.stringify(manifest)}`);
          }
          NODE
          node .github/scripts/validate_quality_artifact.mjs \
            .phoenix-quality/journey-quality-report.json \
            .phoenix-quality/journey-quality-artifact.json \
            "$PREVIEW_RELEASE"

      - name: Add or update quality agent comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- phoenix-content-quality-agent-report -->';
            const body = fs.readFileSync('.phoenix-quality/journey-quality-report.md', 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Deploy exact tested web artifact to isolated preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          test "$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('app/build/web/phoenix-artifact.json','utf8')).sha)")" = "$PREVIEW_RELEASE"
          npx --yes wrangler@4 deploy \
            --name "$PREVIEW_WORKER" \
            --var "PHOENIX_RELEASE:$PREVIEW_RELEASE"

      - name: Verify exact preview release identity
        shell: bash
        run: |
          set -euo pipefail
          health_url="${PREVIEW_URL}/api/health?commit=${PREVIEW_RELEASE}"
          verified=false
          for attempt in {1..18}; do
            response="$(curl --fail --silent --show-error "$health_url" || true)"
            echo "Preview release check ${attempt}/18: ${response:-no response}"
            if RESPONSE="$response" node --input-type=module -e '
              import { validateHealthIdentity } from "./.github/scripts/exact_workflow_contract.mjs";
              validateHealthIdentity(JSON.parse(process.env.RESPONSE), process.env.PREVIEW_RELEASE);
            '; then
              verified=true
              break
            fi
            sleep 5
          done
          [[ "$verified" == true ]]

      - name: Publish preview status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          payload="$(node -e '
            const [url] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({
              state: "success",
              description: "Exact tested Phoenix preview is ready",
              context: "cloudflare/preview",
              target_url: url
            }));
          ' "${PREVIEW_URL}/?unlock=all&prototype=journeys&v=${PREVIEW_RELEASE}")"
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${PREVIEW_RELEASE}" \
            --data "$payload" >/dev/null

      - name: Add or update preview comment
        uses: actions/github-script@v7
        env:
          PHOENIX_PREVIEW_URL: ${{ env.PREVIEW_URL }}
          PHOENIX_PREVIEW_RELEASE: ${{ env.PREVIEW_RELEASE }}
        with:
          script: |
            const marker = '<!-- phoenix-pr-preview -->';
            const release = process.env.PHOENIX_PREVIEW_RELEASE;
            const shortRelease = release.slice(0, 8);
            const canonicalUrl = `${process.env.PHOENIX_PREVIEW_URL}/?unlock=all&prototype=journeys&v=${release}`;
            const body = `${marker}\n## Phoenix 独立体验版 ✅\n\n[打开 PR 体验链接](${canonicalUrl})\n\n- PR：#${context.issue.number}\n- Commit：\`${shortRelease}\`\n- Artifact：Flutter CI exact tested web + 360/360 quality report\n- 与正式版 main 完全隔离\n- 只有 Founder 明确同意后才会合并上线`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  remove-preview:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Delete isolated preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Cloudflare credentials unavailable; preview cleanup skipped."
            exit 0
          fi
          printf 'y\n' | npx --yes wrangler@4 delete --name "$PREVIEW_WORKER" || true
