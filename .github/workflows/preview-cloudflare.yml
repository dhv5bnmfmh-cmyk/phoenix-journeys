name: Cloudflare PR Preview

on:
  push:
    branches:
      - product/city-standard-v1-beijing-forbidden-city
    paths:
      - 'app/**'
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/scripts/**'
      - '.github/workflows/preview-cloudflare.yml'
      - '.github/workflows/flutter-ci.yml'
      - 'docs/PHOENIX_JOURNEY_ACCEPTANCE_CONTRACT.md'
      - 'CONTRIBUTING.md'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
      - 'app/**'
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/scripts/**'
      - '.github/workflows/preview-cloudflare.yml'
      - '.github/workflows/flutter-ci.yml'
      - 'docs/PHOENIX_JOURNEY_ACCEPTANCE_CONTRACT.md'
      - 'CONTRIBUTING.md'

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: cloudflare-preview-pr-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 208 }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  PREVIEW_WORKER: phoenix-journeys-pr-${{ github.event.pull_request.number }}
  PREVIEW_URL: https://phoenix-journeys-pr-${{ github.event.pull_request.number }}.7hn5tyrjgh.workers.dev
  PREVIEW_RELEASE: ${{ github.event.pull_request.head.sha }}

jobs:
  deploy-preview:
    if: >-
      github.event_name == 'push' ||
      (github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event_name == 'push' && '208' || github.event.pull_request.number }}
      PREVIEW_WORKER: ${{ github.event_name == 'push' && 'phoenix-journeys-pr-208' || format('phoenix-journeys-pr-{0}', github.event.pull_request.number) }}
      PREVIEW_URL: ${{ github.event_name == 'push' && 'https://phoenix-journeys-pr-208.7hn5tyrjgh.workers.dev' || format('https://phoenix-journeys-pr-{0}.7hn5tyrjgh.workers.dev', github.event.pull_request.number) }}
      PREVIEW_RELEASE: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PREVIEW_RELEASE }}
          fetch-depth: 0

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"

      - name: Preflight checked-in JavaScript harness syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find .github/scripts -type f -name '*.mjs' -print0)

      - name: Test Phoenix agents
        id: agents
        shell: bash
        run: |
          set -o pipefail
          node --test worker/*.test.mjs 2>&1 | tee phoenix-agents-preview.log

      - name: Upload Phoenix agent failure evidence
        if: steps.agents.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-agents-preview-${{ env.PREVIEW_RELEASE }}
          path: phoenix-agents-preview.log
          if-no-files-found: error

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test Flutter app once and generate quality evidence
        id: flutter_test
        working-directory: app
        shell: bash
        env:
          PHOENIX_GENERATE_QUALITY_REPORT: '1'
          PHOENIX_QUALITY_MARKDOWN: ${{ github.workspace }}/journey-quality-report.md
          PHOENIX_QUALITY_JSON: ${{ github.workspace }}/journey-quality-report.json
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee ../full_flutter.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [[ "$test_status" -ne 0 ]]; then
            {
              echo '## Full Flutter first useful failure'
              echo
              echo '```text'
              awk '
                BEGIN { capture=0; lines=0 }
                /\[E\]|TestFailure|Expected:|Actual:|Which:|package:.*test|test\/.*\.dart/ {
                  if (!capture) capture=1
                }
                capture && lines < 80 {
                  print
                  lines++
                }
              ' ../full_flutter.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            first_failure="$(awk '/\[E\]|TestFailure|Expected:|Actual:|Which:|test\/.*\.dart/ { print; exit }' ../full_flutter.log)"
            if [[ -n "$first_failure" ]]; then
              echo "::error title=Full Flutter first failure::$first_failure"
            else
              echo '::error title=Full Flutter first failure::See full-flutter failure artifact for complete output.'
            fi
          fi
          exit "$test_status"

      - name: Upload Full Flutter failure evidence
        if: steps.flutter_test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: full-flutter-${{ env.PREVIEW_RELEASE }}
          path: full_flutter.log
          if-no-files-found: error

      - name: Upload journey quality report
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-journey-content-quality-pr-${{ env.PR_NUMBER }}
          path: |
            journey-quality-report.md
            journey-quality-report.json
          if-no-files-found: error

      - name: Add or update quality agent comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- phoenix-content-quality-agent-report -->';
            const body = fs.readFileSync('journey-quality-report.md', 'utf8');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Enforce quality agent release decision
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('journey-quality-report.json', 'utf8'));
          console.log(
            `Phoenix quality gate: ${report.approvedCount}/${report.inspectionCount} approved; ` +
            `minimum ${report.minimumScore}; average ${report.averageScore}.`,
          );
          if (!report.canPublish) {
            console.error(
              `Release blocked: ${report.needsRevisionCount} need revision and ` +
              `${report.blockedCount} are blocked.`,
            );
            process.exit(1);
          }
          NODE

      - name: Validate Cloudflare Worker bundle
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run 2>&1 | tee worker-build.log

      - name: Build preview web app once
        working-directory: app
        run: flutter build web --release

      - name: Deploy isolated preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          npx --yes wrangler@4 deploy \
            --name "$PREVIEW_WORKER" \
            --var "PHOENIX_RELEASE:$PREVIEW_RELEASE"

      - name: Verify preview release
        shell: bash
        run: |
          set -euo pipefail
          health_url="${PREVIEW_URL}/api/health?commit=${PREVIEW_RELEASE}"
          verified=false
          for attempt in {1..18}; do
            response="$(curl --fail --silent --show-error "$health_url" || true)"
            echo "Preview release check ${attempt}/18: ${response:-no response}"
            if node -e '
              let health;
              try { health = JSON.parse(process.argv[1]); } catch (_) { process.exit(1); }
              const expected = process.argv[2];
              if (!health.ok || !health.ai || health.service !== "phoenix-journeys" || health.release !== expected) process.exit(1);
            ' "$response" "$PREVIEW_RELEASE"; then
              verified=true
              break
            fi
            sleep 5
          done
          [[ "$verified" == true ]]

      - name: Publish preview status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          payload="$(node -e '
            const [url] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({
              state: "success",
              description: "Isolated Phoenix preview is ready",
              context: "cloudflare/preview",
              target_url: url
            }));
          ' "${PREVIEW_URL}/?unlock=all&prototype=journeys&v=${PREVIEW_RELEASE}")"
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${PREVIEW_RELEASE}" \
            --data "$payload" >/dev/null

      - name: Add or update preview comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PHOENIX_PREVIEW_URL: ${{ env.PREVIEW_URL }}
          PHOENIX_PREVIEW_RELEASE: ${{ env.PREVIEW_RELEASE }}
        with:
          script: |
            const marker = '<!-- phoenix-pr-preview -->';
            const release = process.env.PHOENIX_PREVIEW_RELEASE;
            const shortRelease = release.slice(0, 8);
            const canonicalUrl = `${process.env.PHOENIX_PREVIEW_URL}/?unlock=all&prototype=journeys&v=${release}`;
            const body = `${marker}\n## Phoenix 独立体验版 ✅\n\n[打开 PR 体验链接](${canonicalUrl})\n\n- PR：#${context.issue.number}\n- Commit：\`${shortRelease}\`\n- 与正式版 main 完全隔离\n- 只有确认通过后才会合并上线`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  remove-preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Delete isolated preview Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Cloudflare credentials unavailable; preview cleanup skipped."
            exit 0
          fi
          printf 'y\n' | npx --yes wrangler@4 delete --name "$PREVIEW_WORKER" || true
