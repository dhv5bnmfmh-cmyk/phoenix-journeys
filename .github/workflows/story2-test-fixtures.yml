name: Story 2 test fixture correction
on:
  push:
    branches: [codex/beijing-forbidden-city-story-2]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[story2-test-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/beijing-forbidden-city-story-2
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/test/forbidden_city_story_two_integration_test.dart')
          s = p.read_text()
          s = s.replace("expect(find.text('哪里错？'), findsOneWidget);", "expect(find.text('STEP 1 · 哪里错？'), findsOneWidget);")
          s = s.replace("const ValueKey('challenge-grammar-segment-0')", "const ValueKey('grammar-location-0')")
          s = s.replace("expect(find.text('怎么改？'), findsOneWidget);", "expect(find.text('STEP 2 · 怎么改？'), findsOneWidget);")
          p.write_text(s)
          Path('.github/workflows/story2-test-fixtures.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/test/forbidden_city_story_two_integration_test.dart .github/workflows/story2-test-fixtures.yml
          git commit -m "[story2-test-fixed] Correct Grammar parity widget fixtures"
          git push origin HEAD:codex/beijing-forbidden-city-story-2
