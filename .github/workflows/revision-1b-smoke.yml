name: Revision 1B Apply
on:
  push:
    branches:
      - gold/guangzhou-chen-clan-story
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gold/guangzhou-chen-clan-story
          fetch-depth: 0
      - name: Patch exact advanced Story spans
        shell: bash
        run: |
          echo ' ' | base64 -d | python3
          git diff --check
          rm .github/workflows/founder-revision-1b-apply.yml .github/workflows/revision-1b-smoke.yml
      - name: Commit revision
        shell: bash
        run: |
          git config user.name 'Phoenix Founder Revision Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: naturalize Guangzhou advanced Story'
          git push origin HEAD:gold/guangzhou-chen-clan-story
