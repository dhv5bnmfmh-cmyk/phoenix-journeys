name: Xi'an City Wall Deployed Browser E2E

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'app/lib/data/xian_city_wall_one_pass.dart'
      - 'app/lib/data/batch_one_adaptive_story_levels.dart'
      - 'app/lib/data/dedicated_adaptive_journey_catalog.dart'
      - 'app/lib/data/all_journey_language_level_catalog.dart'
      - 'app/lib/screens/journey_screen.dart'
      - 'app/lib/screens/city_passport_screen.dart'
      - 'app/lib/state/**'
      - 'app/test/xian_city_wall_one_pass_gate_test.dart'
      - '.github/scripts/verify_xian_city_wall_preview.mjs'
      - '.github/workflows/xian-city-wall-preview-e2e.yml'
      - '.github/workflows/preview-cloudflare.yml'

permissions:
  contents: read

concurrency:
  group: xian-city-wall-deployed-browser-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
  PREVIEW_URL: https://phoenix-journeys-pr-${{ github.event.pull_request.number }}.7hn5tyrjgh.workers.dev/

jobs:
  xian-deployed-browser:
    if: github.head_ref == 'remediation/xian-city-wall-one-pass'
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out exact Xi'an candidate head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact Xi'an candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "XI'AN DEPLOYED BROWSER CANDIDATE SHA = $CANDIDATE_SHA"

      - name: Preflight Xi'an browser harness syntax
        run: node --check .github/scripts/verify_xian_city_wall_preview.mjs

      - name: Wait for exact Cloudflare preview release
        shell: bash
        run: |
          set -euo pipefail
          health_url="${PREVIEW_URL}api/health?commit=${CANDIDATE_SHA}"
          verified=false
          for attempt in {1..180}; do
            response="$(curl --fail --silent --show-error "$health_url" || true)"
            if node -e '
              let health;
              try { health = JSON.parse(process.argv[1]); } catch (_) { process.exit(1); }
              const expected = process.argv[2];
              if (!health.ok || !health.ai || health.service !== "phoenix-journeys" || health.release !== expected) process.exit(1);
            ' "$response" "$CANDIDATE_SHA"; then
              echo "XI'AN HEALTH / RELEASE = PASS"
              echo "EXPECTED SHA = $CANDIDATE_SHA"
              echo "DEPLOYED SHA = $(node -e 'process.stdout.write(JSON.parse(process.argv[1]).release)' "$response")"
              verified=true
              break
            fi
            sleep 5
          done
          [[ "$verified" == true ]]

      - name: Install Chromium and WebKit functional drivers
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/xian-deployed-browser-node" playwright
          "$RUNNER_TEMP/xian-deployed-browser-node/node_modules/.bin/playwright" install --with-deps chromium webkit

      - name: Verify Xi'an Lv1 Lv3 Lv5 Lv8 Lv10 deployed experience
        shell: bash
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/xian-deployed-browser-node/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          mkdir -p test-results
          node .github/scripts/verify_xian_city_wall_preview.mjs             "$PREVIEW_URL" "$CANDIDATE_SHA"             2>&1 | tee test-results/xian-city-wall-deployed-browser.log

      - name: Upload Xi'an deployed-browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xian-city-wall-deployed-browser-${{ env.CANDIDATE_SHA }}
          path: test-results/
          if-no-files-found: warn
