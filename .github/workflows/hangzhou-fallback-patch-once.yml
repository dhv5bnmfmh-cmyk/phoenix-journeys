name: Hangzhou Fallback Patch Once

on:
  push:
    branches:
      - remediation/hangzhou-west-lake-one-pass

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: route Hangzhou legacy fallback') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: remediation/hangzhou-west-lake-one-pass
          fetch-depth: 0
      - name: Patch shared legacy resolver
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/lib/data/journey_level_catalog.dart')
          text = path.read_text()
          import_line = "import 'hangzhou_west_lake_one_pass.dart';\n"
          if import_line not in text:
              text = text.replace("import 'daily_journey_experience.dart';\n", "import 'daily_journey_experience.dart';\n" + import_line, 1)
          marker = "JourneyLevelContent resolveJourneyLevel(\n  DailyJourneyExperience experience,\n  JourneyDifficulty difficulty,\n) {\n"
          block = "  if (experience.id == hangzhouWestLakeJourneyId) {\n    final level = switch (difficulty) {\n      JourneyDifficulty.easy => 1,\n      JourneyDifficulty.standard => 5,\n      JourneyDifficulty.challenge => 10,\n    };\n    return hangzhouWestLakeOnePassLevelContent(level);\n  }\n"
          if block not in text:
              if marker not in text:
                  raise SystemExit('resolveJourneyLevel marker not found')
              text = text.replace(marker, marker + block, 1)
          path.write_text(text)
      - name: Commit resolver repair
        shell: bash
        run: |
          test -n "$(git status --porcelain app/lib/data/journey_level_catalog.dart)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/data/journey_level_catalog.dart
          git commit -m "fix: route Hangzhou legacy fallback"
          git push origin HEAD:remediation/hangzhou-west-lake-one-pass
