name: PR202 Latest Intent Race Preflight V2

on:
  push:
    branches:
      - perf/pr202-latest-intent-race-preflight-v2

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: f3ce7b73bcfb28ea52aa63d5469a31c9e35b393c
    steps:
      - name: Check out exact race candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Run latest-intent targeted tests
        working-directory: app
        run: |
          flutter test \
            test/journey_level_selector_button_test.dart \
            test/journey_runtime_performance_gate_test.dart \
            test/journey_memory_completion_narration_contract_test.dart \
            test/journey_stage_narration_button_test.dart \
            test/narration_resume_offset_test.dart \
            test/narration_seek_test.dart \
            test/narration_progressive_reveal_test.dart \
            test/app_state_test.dart \
            --reporter expanded
