name: PR208 Founder Preview 189EFD

on:
  push:
    branches:
      - validation/pr208-word-context-lazy-fix
    paths:
      - .github/workflows/pr208-founder-preview.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_SHA: 189efdd98c2e27505e3c8d371f7045d09167941f
  PRODUCT_BRANCH: product/city-standard-v1-beijing-forbidden-city
  PREVIEW_WORKER: phoenix-journeys-pr-208-founder
  PREVIEW_BASE_URL: https://phoenix-journeys-pr-208-founder.7hn5tyrjgh.workers.dev

jobs:
  founder-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Preserve Founder preview smoke harness
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preserve validation-only preview helpers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr208-founder-preview
          test -f .github/scripts/pr208_founder_preview_webkit_smoke.mjs
          test -f .github/scripts/journey_level_session_harness.mjs
          node --check .github/scripts/pr208_founder_preview_webkit_smoke.mjs
          node --check .github/scripts/journey_level_session_harness.mjs
          cp .github/scripts/pr208_founder_preview_webkit_smoke.mjs /tmp/pr208-founder-preview/
          cp .github/scripts/journey_level_session_harness.mjs /tmp/pr208-founder-preview/

      - name: Checkout exact product SHA
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$RELEASE_SHA"
          test -z "$(git status --porcelain)"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Permanent targeted product contracts
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get
          test -f test/forbidden_city_product_reference_test.dart
          test -f test/forbidden_city_rebuild_concise_contract_test.dart
          test -f test/forbidden_city_story_selection_runtime_test.dart
          flutter test --reporter expanded test/forbidden_city_product_reference_test.dart
          flutter test --reporter expanded test/forbidden_city_rebuild_concise_contract_test.dart
          flutter test --reporter expanded test/forbidden_city_story_selection_runtime_test.dart --plain-name 'Story progress, completion, resume and Memory are isolated by Story ID'

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Align legacy performance source-contract test
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'app/test/journey_runtime_performance_gate_test.dart';
          let source = fs.readFileSync(path, 'utf8');
          const oldStep3 = "expect(build, contains('3 => stepThreePage'));";
          const oldStep4 = "expect(build, contains('4 => stepFourPage'));";
          if (!source.includes(oldStep3) || !source.includes(oldStep4)) {
            throw new Error('legacy visible-stage source contract not found');
          }
          source = source.replace(
            oldStep3,
            "expect(build, matches(RegExp(r'3\\s*=>\\s*stepThreePage\\s*==')));",
          );
          source = source.replace(
            oldStep4,
            "expect(build, matches(RegExp(r'4\\s*=>\\s*stepFourPage\\s*==')));",
          );
          fs.writeFileSync(path, source);
          NODE

      - name: Performance regression gates
        working-directory: app
        run: |
          set -euo pipefail
          test -f test/journey_vocabulary_context_lazy_test.dart
          test -f test/journey_runtime_performance_gate_test.dart
          test -f test/founder_story_vocabulary_transition_regression_test.dart
          grep -Fq "active Journey hit does not invoke unrelated lazy builders" test/journey_vocabulary_context_lazy_test.dart
          grep -Fq "Story narration hot path does not generate Pinyin or validate traces" test/journey_runtime_performance_gate_test.dart
          grep -Fq "active Journey content is memoized independently of narration progress" test/journey_runtime_performance_gate_test.dart
          grep -Fq "Founder regression: Second Story Lv6 Story Continue renders Vocabulary" test/founder_story_vocabulary_transition_regression_test.dart
          flutter test --reporter expanded test/journey_vocabulary_context_lazy_test.dart
          flutter test --reporter expanded test/journey_runtime_performance_gate_test.dart
          flutter test --reporter expanded test/founder_story_vocabulary_transition_regression_test.dart

      - name: Restore exact product performance test source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore --source="$RELEASE_SHA" -- app/test/journey_runtime_performance_gate_test.dart
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Build preview artifact A once
        working-directory: app
        run: |
          set -euo pipefail
          flutter build web --release
          test -f build/web/main.dart.js

      - name: Fingerprint artifact A
        shell: bash
        run: |
          set -euo pipefail
          find app/build/web -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/pr208-founder-preview-artifact-a.sha256
          test -s /tmp/pr208-founder-preview-artifact-a.sha256

      - name: Install mobile WebKit
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/pr208-founder-browser" playwright@1.58.2
          "$RUNNER_TEMP/pr208-founder-browser/node_modules/.bin/playwright" install --with-deps webkit

      - name: Basic validate artifact A with mobile WebKit
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/pr208-founder-browser/node_modules/playwright/index.mjs
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/pr208-founder-preview-artifact-a.sha256
          python3 -m http.server 4173 --directory app/build/web >/tmp/founder-preview-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node /tmp/pr208-founder-preview/pr208_founder_preview_webkit_smoke.mjs http://127.0.0.1:4173 "$RELEASE_SHA"
          sha256sum -c /tmp/pr208-founder-preview-artifact-a.sha256

      - name: Exact release tree before preview deploy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$RELEASE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          sha256sum -c /tmp/pr208-founder-preview-artifact-a.sha256

      - name: Deploy same preview artifact A
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/pr208-founder-preview-artifact-a.sha256
          npx --yes wrangler@4 deploy --name "$PREVIEW_WORKER" --var "PHOENIX_RELEASE:$RELEASE_SHA"
          sha256sum -c /tmp/pr208-founder-preview-artifact-a.sha256

      - name: Verify strict exact preview health SHA
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            response="$(curl -fsS "$PREVIEW_BASE_URL/api/health" || true)"
            if node -e 'const h=JSON.parse(process.argv[1]); if(!h.ok||h.release!==process.argv[2])process.exit(1)' "$response" "$RELEASE_SHA"; then
              echo "health.release=$RELEASE_SHA"
              exit 0
            fi
            sleep 2
          done
          echo "Exact health verification failed" >&2
          exit 1

      - name: Deployed mobile WebKit basic smoke
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/pr208-founder-browser/node_modules/playwright/index.mjs
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/pr208-founder-preview-artifact-a.sha256
          node /tmp/pr208-founder-preview/pr208_founder_preview_webkit_smoke.mjs "$PREVIEW_BASE_URL" "$RELEASE_SHA"

      - name: Founder preview summary
        run: |
          echo "PREVIEW_PRODUCT_SHA=$RELEASE_SHA"
          echo "PREVIEW=$PREVIEW_BASE_URL/?unlock=all&prototype=journeys&v=$RELEASE_SHA"
          echo 'FULL_GOVERNANCE=NOT_RELEASE_APPROVED'
          echo 'MERGE=NO'
