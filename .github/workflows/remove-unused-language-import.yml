name: Remove Unused Language Agent Import

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/remove-unused-language-import.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/summer-palace-story-engine-pilot
          fetch-depth: 0

      - name: Remove unused import
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/lib/data/adaptive_journey_level_runtime.dart')
          text = path.read_text()
          marker = "import 'summer_palace_journey.dart';\n"
          if marker not in text:
              raise SystemExit('unused import already absent')
          path.write_text(text.replace(marker, '', 1))
          PY

      - name: Commit static analysis fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/data/adaptive_journey_level_runtime.dart
          git commit -m "fix: remove unused adaptive Journey import"
          git fetch origin feature/summer-palace-story-engine-pilot
          git rebase origin/feature/summer-palace-story-engine-pilot
          git push origin HEAD:feature/summer-palace-story-engine-pilot
