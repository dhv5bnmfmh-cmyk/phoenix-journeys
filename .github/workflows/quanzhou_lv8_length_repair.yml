name: Quanzhou Lv8 Length Repair

on:
  push:
    branches:
      - dev/current

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/current
          fetch-depth: 0
      - name: Apply exact Lv8 repair
        run: python tools/quanzhou_lv8_length_repair.py
      - name: Verify and commit repair
        run: |
          git rm tools/quanzhou_lv8_length_repair.py .github/workflows/quanzhou_lv8_length_repair.yml
          git add app/lib/data/quanzhou_kaiyuan_gold_content.dart
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Trim redundant Quanzhou Lv8 explanation"
          git push origin HEAD:dev/current
