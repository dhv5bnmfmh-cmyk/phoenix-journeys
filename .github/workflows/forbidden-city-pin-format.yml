name: Forbidden City Pinned Format

on:
  push:
    branches:
      - feature/forbidden-city-final-integration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/forbidden-city-final-integration
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - name: Format exactly as Final Validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- app/lib app/test | grep '\.dart$' || true)
          cd app
          rel=()
          for f in "${files[@]}"; do rel+=("${f#app/}"); done
          dart format "${rel[@]}"
          dart format --output=none --set-exit-if-changed "${rel[@]}"
      - name: Commit formatter convergence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib app/test
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Converge Reference changes on Flutter 3.47.1 formatter"
          git push origin HEAD:feature/forbidden-city-final-integration
