  }
'''
          replace_once(old_story, new_story)

          path.write_text(source)
          PY

      - name: Remove transient patch workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/forbidden-city-performance-remediation.yml
          git add app/lib/screens/journey_screen.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: cache Journey content outside narration rebuilds'
          git push origin HEAD:preview/batch-1-final-founder-review
