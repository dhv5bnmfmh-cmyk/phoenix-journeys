name: Apply Journey Runtime Performance Remediation

on:
  push:
    branches:
      - preview/batch-1-final-founder-review
    paths:
      - '.github/workflows/forbidden-city-performance-remediation.yml'

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview/batch-1-final-founder-review
          fetch-depth: 0

      - name: Patch shared Journey hot path
        shell: bash
        run: echo '' | base64 --decode | python3

      - name: Remove transient patch workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/forbidden-city-performance-remediation.yml
          git add app/lib/screens/journey_screen.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: cache Journey content outside narration rebuilds'
          git push origin HEAD:preview/batch-1-final-founder-review
