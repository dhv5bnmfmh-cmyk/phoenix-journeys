name: Founder First Targeted PR208

on:
  push:
    branches:
      - validation/founder-first-pr208-fffddcf9

permissions:
  contents: read
  statuses: write

concurrency:
  group: founder-first-targeted-pr208
  cancel-in-progress: true

env:
  TARGET_SHA: 8643f6424d7a6af6ece3d4ae4be78356ea8b4987
  PREVIEW_URL: https://phoenix-journeys-pr-208.7hn5tyrjgh.workers.dev/

jobs:
  founder-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Verify exact preview release
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error "${PREVIEW_URL}api/health?commit=${TARGET_SHA}")"
          node -e '
            const health = JSON.parse(process.argv[1]);
            const expected = process.argv[2];
            if (!health.ok || !health.ai || health.service !== "phoenix-journeys" || health.release !== expected) process.exit(1);
          ' "$response" "$TARGET_SHA"

      - name: Prepare Grammar-only Lv5 harness
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path(".github/scripts/verify_forbidden_city_preview_v2.mjs")
          source = path.read_text()
          old = "    if (after.includes('回答错误')) {\n      const explicitMarker = before.includes('句子复原')\n        ? '位置错误'\n        : before.includes('语病修复')\n          ? '错误位置'\n          : '填错';\n      await findSemantic(page, explicitMarker, { timeout: 5000 });\n    }"
          new = "    if (after.includes('回答错误')) {\n      if (before.includes('句子复原')) {\n        await findSemantic(page, '位置错误', { timeout: 5000 });\n      } else if (before.includes('补全故事')) {\n        await findSemantic(page, '填错', { timeout: 5000 });\n      }\n    }"
          if old not in source:
              raise SystemExit("stale grammar final-marker harness anchor missing")
          path.write_text(source.replace(old, new))
          PY
          node --check .github/scripts/verify_forbidden_city_preview_v2.mjs
          node --check .github/scripts/journey_level_session_harness.mjs

      - name: Install Chromium targeted driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/founder-targeted-node" playwright
          "$RUNNER_TEMP/founder-targeted-node/node_modules/.bin/playwright" install --with-deps chromium

      - name: Lv5 Grammar iPhone viewport smoke
        shell: bash
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/founder-targeted-node/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          mkdir -p test-results
          node .github/scripts/verify_forbidden_city_preview_v2.mjs             "$PREVIEW_URL" "$TARGET_SHA" grammar-only             2>&1 | tee test-results/founder-lv5-grammar.log

      - name: Publish exact preview status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          payload="$(node -e '
            const [url] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({
              state: "success",
              description: "Founder Grammar preview is ready",
              context: "founder/grammar-preview",
              target_url: url
            }));
          ' "${PREVIEW_URL}?unlock=all&prototype=journeys&v=${TARGET_SHA}")"
          curl --fail --silent --show-error             --request POST             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer $GITHUB_TOKEN"             --header "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}"             --data "$payload" >/dev/null

      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: founder-grammar-browser-pr208-${{ env.TARGET_SHA }}
          path: test-results/
          if-no-files-found: warn
