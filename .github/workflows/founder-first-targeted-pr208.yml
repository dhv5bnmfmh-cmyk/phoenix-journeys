name: Founder First Targeted PR208

on:
  push:
    branches:
      - validation/founder-first-pr208-fffddcf9

permissions:
  contents: read
  statuses: write

concurrency:
  group: founder-first-targeted-pr208
  cancel-in-progress: true

env:
  TARGET_SHA: fffddcf9910bf39a4d46663e5ab53bfccc8a391a
  PREVIEW_WORKER: phoenix-journeys-pr-208
  PREVIEW_URL: https://phoenix-journeys-pr-208.7hn5tyrjgh.workers.dev/

jobs:
  founder-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact PR candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Preflight Lv5 browser harness syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/verify_forbidden_city_preview_v2.mjs
          node --check .github/scripts/journey_level_session_harness.mjs

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Founder targeted Flutter tests
        working-directory: app
        run: flutter test test/forbidden_city_product_reference_test.dart --reporter expanded

      - name: Build exact preview web app
        working-directory: app
        run: flutter build web --release

      - name: Deploy exact PR preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          npx --yes wrangler@4 deploy             --name "$PREVIEW_WORKER"             --var "PHOENIX_RELEASE:$TARGET_SHA"

      - name: Verify exact preview release
        shell: bash
        run: |
          set -euo pipefail
          health_url="${PREVIEW_URL}api/health?commit=${TARGET_SHA}"
          verified=false
          for attempt in {1..24}; do
            response="$(curl --fail --silent --show-error "$health_url" || true)"
            echo "Preview release check ${attempt}/24: ${response:-no response}"
            if node -e '
              let health;
              try { health = JSON.parse(process.argv[1]); } catch (_) { process.exit(1); }
              const expected = process.argv[2];
              if (!health.ok || !health.ai || health.service !== "phoenix-journeys" || health.release !== expected) process.exit(1);
            ' "$response" "$TARGET_SHA"; then
              verified=true
              break
            fi
            sleep 5
          done
          [[ "$verified" == true ]]

      - name: Install Chromium targeted driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/founder-targeted-node" playwright
          "$RUNNER_TEMP/founder-targeted-node/node_modules/.bin/playwright" install --with-deps chromium

      - name: Lv5 Founder browser smoke
        shell: bash
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/founder-targeted-node/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          mkdir -p test-results
          node .github/scripts/verify_forbidden_city_preview_v2.mjs             "$PREVIEW_URL" "$TARGET_SHA"             2>&1 | tee test-results/founder-lv5-preview.log

      - name: Publish exact preview status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          payload="$(node -e '
            const [url] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({
              state: "success",
              description: "Founder targeted preview is ready",
              context: "founder/targeted-preview",
              target_url: url
            }));
          ' "${PREVIEW_URL}?unlock=all&prototype=journeys&v=${TARGET_SHA}")"
          curl --fail --silent --show-error             --request POST             --header "Accept: application/vnd.github+json"             --header "Authorization: Bearer $GITHUB_TOKEN"             --header "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}"             --data "$payload" >/dev/null

      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: founder-targeted-pr208-${{ env.TARGET_SHA }}
          path: test-results/
          if-no-files-found: warn
