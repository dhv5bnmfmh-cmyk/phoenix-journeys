name: Phase 3B Toolchain Check

on:
  push:
    branches:
      - agent/documentation-sprint-01-18-recovery
    paths:
      - .github/workflows/phase3b-toolchain.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase3b-toolchain.yml

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report local-safe visual toolchain
        shell: bash
        run: |
          set -x
          node --version
          command -v inkscape || true
          inkscape --version || true
          command -v magick || true
          magick -version || true
          command -v convert || true
          convert -version || true
