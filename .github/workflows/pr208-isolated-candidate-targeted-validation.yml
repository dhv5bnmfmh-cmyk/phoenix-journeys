name: PR208 Isolated Candidate Targeted Governance Validation

on:
  push:
    branches:
      - validation/pr208-pronunciation-product-fix-49a088
    paths:
      - .github/workflows/pr208-isolated-candidate-targeted-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr208-isolated-candidate-targeted-governance
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 9c7d00a1ee80b2e50b40a3b6f4922a9d38b3753e

jobs:
  targeted:
    name: Targeted governance validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact isolated candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          echo "validated candidate=$actual"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Preserve semantic structural matchers for steps 3 and 4
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("test/journey_runtime_performance_gate_test.dart")
          text = path.read_text()

          old3 = "    expect(build, contains('3 => stepThreePage'));\n"
          new3 = r"""    expect(
              RegExp(
                r'3\s*=>[\s\S]*?stepThreePage\s*\(\s*context\s*\)',
              ).hasMatch(build),
              isTrue,
            );
          """
          old4 = "    expect(build, contains('4 => stepFourPage'));\n"
          new4 = r"""    expect(
              RegExp(
                r'4\s*=>[\s\S]*?stepFourPage\s*\(\s*context\s*\)',
              ).hasMatch(build),
              isTrue,
            );
          """

          if old3 not in text:
              raise SystemExit("expected step 3 stale matcher not found")
          if old4 not in text:
              raise SystemExit("expected step 4 stale matcher not found")

          text = text.replace(old3, new3).replace(old4, new4)
          path.write_text(text)

          patched = path.read_text()
          if "contains('3 => stepThreePage')" in patched:
              raise SystemExit("stale step 3 source-shape assertion remains")
          if "contains('4 => stepFourPage')" in patched:
              raise SystemExit("stale step 4 source-shape assertion remains")
          if r"3\s*=>[\s\S]*?stepThreePage" not in patched:
              raise SystemExit("step 3 semantic structural matcher missing")
          if r"4\s*=>[\s\S]*?stepFourPage" not in patched:
              raise SystemExit("step 4 semantic structural matcher missing")
          PY

      - name: Preserve Founder Story to Vocabulary fake-clock teardown
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("test/founder_story_vocabulary_transition_regression_test.dart")
          text = path.read_text()
          old = """    expect(
              find.byKey(const ValueKey('next-word-button')),
              findsOneWidget,
              reason: 'Vocabulary phase must render its first word after Continue.',
            );
          }
          """
          new = """    expect(
              find.byKey(const ValueKey('next-word-button')),
              findsOneWidget,
              reason: 'Vocabulary phase must render its first word after Continue.',
            );

            // Harness-only teardown: advance fake time through the production
            // WordDetailSheet 4-second TTS timeout before the test returns.
            await tester.pump(const Duration(seconds: 4));
            await tester.pump();
          }
          """
          if text.count(old) != 1:
              raise SystemExit("Story to Vocabulary teardown anchor is not unique")
          path.write_text(text.replace(old, new, 1))
          patched = path.read_text()
          if "await tester.pump(const Duration(seconds: 4));" not in patched:
              raise SystemExit("4-second fake-clock teardown missing")
          PY

      - name: Founder Story pronunciation and Story to Vocabulary regression
        working-directory: app
        run: flutter test test/founder_story_vocabulary_transition_regression_test.dart

      - name: Progress, memory, and resume isolation regressions
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter test test/progress_isolation_test.dart
          flutter test test/journey_progress_v2_test.dart
          flutter test test/session_state_notifier_test.dart

      - name: Grey-screen and equivalent navigation regressions
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter test test/proceed_to_stages_regression_test.dart
          flutter test test/entry_mode_semantics_test.dart
          flutter test test/discovery_gate_regression_test.dart

      - name: Runtime structural governance regression
        working-directory: app
        run: flutter test test/journey_runtime_performance_gate_test.dart

  analyze:
    name: Analyze exact candidate
    needs: targeted
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact isolated candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$CANDIDATE_SHA"
          echo "analyze candidate=$actual"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze exact candidate
        working-directory: app
        run: flutter analyze
