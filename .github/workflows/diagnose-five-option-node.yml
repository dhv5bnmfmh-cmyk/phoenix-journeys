name: Diagnose five-option Node rules

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/adaptive-level-content-v2
          fetch-depth: 0

      - name: Capture first failing Node rule
        shell: bash
        run: |
          set -uo pipefail
          report="docs/.five-option-node-failure.txt"
          : > "$report"
          for file in worker/*.test.mjs; do
            output="$(mktemp)"
            if node --test "$file" >"$output" 2>&1; then
              rm -f "$output"
              continue
            fi
            {
              echo "FAIL $file"
              echo "----- compact failure -----"
              tail -n 120 "$output"
              echo "----- end failure -----"
            } > "$report"
            rm -f "$output"
            break
          done
          test -s "$report" || echo "NO FAILURE" > "$report"

      - name: Commit report and remove diagnostics
        shell: bash
        run: |
          rm -f .github/workflows/diagnose-five-option-node.yml
          rm -f docs/five-option-node-diagnostic-trigger.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture five-option Node rule failure"
          git push origin HEAD:agent/adaptive-level-content-v2
