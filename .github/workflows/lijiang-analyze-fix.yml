name: Lijiang Analyze Fix

on:
  push:
    branches:
      - dev/current

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev/current
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python .github/lijiang_analyze_fix.py
      - run: git diff --check
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter analyze
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/data/journey_expansion_batch_two.dart app/lib/data/lijiang_old_town_gold_content.dart app/test/lijiang_old_town_gold_test.dart
          git commit -m 'fix: satisfy Lijiang analyzer gates'
          git push origin HEAD:dev/current
