name: PR194 Runtime Remediation Staging

on:
  push:
    branches:
      - pr194-runtime-staging

permissions:
  contents: write

concurrency:
  group: pr194-runtime-staging
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging harness
        uses: actions/checkout@v4
        with:
          ref: pr194-runtime-staging
          path: harness
      - name: Check out exact PR parent
        uses: actions/checkout@v4
        with:
          ref: 34484e4600f1ccadf52b89f7b7c73adc35aba248
          path: candidate
      - name: Check out exact performance baseline
        uses: actions/checkout@v4
        with:
          ref: eb4e36e6e4246b0e448ecc151f01a7bb3d272c2d
          path: baseline

      - name: Apply coherent runtime and benchmark remediation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "34484e4600f1ccadf52b89f7b7c73adc35aba248"
          python3 -m py_compile harness/.github/scripts/pr194_runtime_remediation.py
          sed -i "s/lazy_group('app\/lib\/data\/extended_journey_catalog.dart', 'extendedJourneyExperiences', 5)/lazy_group('app\/lib\/data\/extended_journey_catalog.dart', 'extendedJourneyExperiences', 4)/" harness/.github/scripts/pr194_runtime_remediation.py
          sed -i "s/if 'for (final journey in dailyJourneyExperiences) journey.id' in read(/if False and 'for (final journey in dailyJourneyExperiences) journey.id' in read(/" harness/.github/scripts/pr194_runtime_remediation.py
          sed -i 's/final journeyExpansionBatchFourExperiences=<DailyJourneyExperience>\[/final journeyExpansionBatchFourExperiences = <DailyJourneyExperience>[/' candidate/app/lib/data/journey_expansion_batch_four.dart
          sed -i 's/final journeyExpansionBatchFiveExperiences=<DailyJourneyExperience>\[/final journeyExpansionBatchFiveExperiences = <DailyJourneyExperience>[/' candidate/app/lib/data/journey_expansion_batch_five.dart
          python3 harness/.github/scripts/pr194_runtime_remediation.py candidate
          python3 - <<'PY'
          from pathlib import Path
          ext = Path('candidate/app/lib/data/extended_journey_catalog.dart')
          text = ext.read_text(encoding='utf-8')
          old = '  kaipingDiaolouExperience,\n]);'
          if text.count(old) != 1: raise SystemExit('Kaiping lazy wrapper anchor mismatch')
          ext.write_text(text.replace(old, '  () => kaipingDiaolouExperience,\n]);', 1), encoding='utf-8')
          access = Path('candidate/app/lib/state/access_controlled_app_state.dart')
          text = access.read_text(encoding='utf-8')
          old_any = 'dailyJourneyExperiences.any((journey) => journey.id == journeyId)'
          old_set = '<String>{for (final journey in dailyJourneyExperiences) journey.id}'
          if text.count(old_any) != 1 or text.count(old_set) != 1:
              raise SystemExit('Access-control heavy catalog anchors mismatch')
          text = text.replace(old_any, 'dailyJourneyIds.contains(journeyId)', 1)
          text = text.replace(old_set, '<String>{...dailyJourneyIds}', 1)
          access.write_text(text, encoding='utf-8')
          notifier = Path('candidate/app/lib/services/startup_readiness_notifier_web.dart')
          web = notifier.read_text(encoding='utf-8')
          ignore = '// ignore_for_file: avoid_web_libraries_in_flutter, deprecated_member_use\n\n'
          if not web.startswith(ignore): notifier.write_text(ignore + web, encoding='utf-8')
          bootstrap = Path('candidate/app/web/flutter_bootstrap.js')
          js = bootstrap.read_text(encoding='utf-8')
          if js.count('const minimumJourneyDurationMs = 3000;') != 1:
              raise SystemExit('bootstrap 3000ms staging hold anchor mismatch')
          bootstrap.write_text(js.replace('const minimumJourneyDurationMs = 3000;', 'const minimumJourneyDurationMs = 3200;', 1), encoding='utf-8')
          PY
          sed -i 's/getEntriesByName(name)/getEntriesByName(name, null)/g' harness/.github/scripts/startup_instrument_v2.py
          sed -i 's/getEntriesByName(prerequisite)/getEntriesByName(prerequisite, null)/g' harness/.github/scripts/startup_instrument_v2.py
          cp harness/.github/scripts/startup_instrument_v2.py candidate/.github/scripts/startup_instrument.py
          cp harness/.github/scripts/measure_startup_v2.mjs candidate/.github/scripts/measure_startup.mjs
          cp harness/.github/workflows/startup-performance-audit-v2.yml candidate/.github/workflows/startup-performance-audit.yml
          ! grep -q "dailyJourneyExperiences" candidate/app/lib/state/access_controlled_app_state.dart
          ! grep -q "minimumJourneyDurationMs = 11550" candidate/app/web/flutter_bootstrap.js
          ! grep -q "phoenix-time-flight-v2 12.4s" candidate/app/web/index.html
          echo 'HEAVY STARTUP REENTRY STATIC GATES = PASS'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Focused runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          cd candidate/app
          flutter pub get
          dart format lib/services/startup_readiness_notifier.dart lib/services/startup_readiness_notifier_stub.dart lib/services/startup_readiness_notifier_web.dart test/startup_lazy_runtime_test.dart
          flutter test test/startup_lazy_runtime_test.dart
          flutter test test/seven_day_journey_catalog_test.dart
          flutter test test/journey_location_binding_test.dart
          flutter test test/journey_access_daily_slots_test.dart
          flutter test test/journey_runtime_architecture_gate_test.dart
          flutter test test/journey_runtime_performance_gate_test.dart

      - name: Full Flutter validation and release build
        shell: bash
        run: |
          set -euo pipefail
          cd candidate/app
          flutter analyze
          flutter test
          flutter build web --release

      - name: Benchmark harness preflight on baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile candidate/.github/scripts/startup_instrument.py
          node --check candidate/.github/scripts/measure_startup.mjs
          python3 candidate/.github/scripts/startup_instrument.py baseline --check-only
          python3 candidate/.github/scripts/startup_instrument.py candidate --check-only
          rm -rf "$RUNNER_TEMP/pr194-instrumented"
          cp -a candidate "$RUNNER_TEMP/pr194-instrumented"
          python3 candidate/.github/scripts/startup_instrument.py "$RUNNER_TEMP/pr194-instrumented"
          cd "$RUNNER_TEMP/pr194-instrumented/app"
          flutter pub get
          flutter build web --release
          echo 'DUAL-ARCHITECTURE INSTRUMENTED RELEASE PREFLIGHT = PASS'

      - name: Audit final staged delta
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          git diff --name-only | tee "$RUNNER_TEMP/pr194-final-delta.txt"
          test -n "$(grep '^app/lib\|^app/web' "$RUNNER_TEMP/pr194-final-delta.txt")"
          test -z "$(grep -E '^app/lib/data/.*(gold|story_content|narrative_dna|semantic_fingerprint|challenge_profile)' "$RUNNER_TEMP/pr194-final-delta.txt" || true)"
          test -z "$(grep -E '^app/lib/(agents|generated|models|theme)/' "$RUNNER_TEMP/pr194-final-delta.txt" || true)"
          echo 'LEARNER CONTENT DELTA = NONE'

      - name: Publish one coherent runtime commit to PR branch
        shell: bash
        run: |
          set -euo pipefail
          live="$(git ls-remote origin refs/heads/dev/current | awk '{print $1}')"
          echo "LIVE DEV/CURRENT BEFORE PUBLISH = $live"
          test "$live" = "34484e4600f1ccadf52b89f7b7c73adc35aba248"
          cd candidate
          git config user.name dhv5bnmfmh-cmyk
          git config user.email dhv5bnmfmh@privaterelay.appleid.com
          git add -A
          git commit -m 'perf: lazily resolve startup Journey runtime'
          successor="$(git rev-parse HEAD)"
          git push origin HEAD:dev/current
          echo "PR194_RUNTIME_SUCCESSOR_SHA=$successor"

      - name: Record validation result on staging branch
        if: always()
        shell: bash
        env:
          VALIDATION_STATUS: ${{ job.status }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd harness
          printf 'status=%s\nrun_id=%s\nsource_sha=%s\n' "$VALIDATION_STATUS" "$SOURCE_RUN_ID" "${{ github.sha }}" > .github/pr194-staging-validation.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/pr194-staging-validation.txt
          git commit -m "ci: record PR194 staging validation $VALIDATION_STATUS" || exit 0
          git push origin HEAD:pr194-runtime-staging
