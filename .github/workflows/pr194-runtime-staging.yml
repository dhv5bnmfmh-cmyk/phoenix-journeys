name: PR194 Runtime Remediation Staging

on:
  push:
    branches:
      - pr194-runtime-staging

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging harness
        uses: actions/checkout@v4
        with:
          ref: pr194-runtime-staging
          path: harness

      - name: Check out exact PR parent
        uses: actions/checkout@v4
        with:
          ref: 34484e4600f1ccadf52b89f7b7c73adc35aba248
          path: candidate

      - name: Verify parent and apply remediation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "34484e4600f1ccadf52b89f7b7c73adc35aba248"
          python3 -m py_compile harness/.github/scripts/pr194_runtime_remediation.py
          python3 harness/.github/scripts/pr194_runtime_remediation.py candidate

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          cd candidate/app
          dart format lib test/startup_lazy_runtime_test.dart
          flutter pub get
          flutter test test/startup_lazy_runtime_test.dart
          flutter test test/seven_day_journey_catalog_test.dart
          flutter test test/journey_location_binding_test.dart
          flutter test test/journey_access_daily_slots_test.dart
          flutter test test/journey_runtime_architecture_gate_test.dart
          flutter test test/journey_runtime_performance_gate_test.dart

      - name: Analyze and full Flutter suite
        shell: bash
        run: |
          set -euo pipefail
          cd candidate/app
          flutter analyze
          flutter test

      - name: Release web build
        shell: bash
        run: |
          set -euo pipefail
          cd candidate/app
          flutter build web --release

      - name: Audit staged delta
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          echo '--- changed files ---'
          git diff --name-only
          test -z "$(git diff --name-only | grep -E 'app/lib/data/.*(gold|level|story|content).*\.dart$' || true)"
          echo 'LEARNER CONTENT SEMANTIC DELTA CHECK = PASS'

      - name: Record validation result on staging branch
        if: always()
        shell: bash
        env:
          VALIDATION_STATUS: ${{ job.status }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd harness
          printf 'status=%s\nrun_id=%s\nsource_sha=%s\n' \
            "$VALIDATION_STATUS" "$SOURCE_RUN_ID" "${{ github.sha }}" \
            > .github/pr194-staging-validation.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/pr194-staging-validation.txt
          git commit -m "ci: record PR194 staging validation $VALIDATION_STATUS" || exit 0
          git push origin HEAD:pr194-runtime-staging
