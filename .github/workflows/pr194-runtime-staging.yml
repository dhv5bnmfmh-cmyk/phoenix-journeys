name: PR194 Runtime Remediation Staging

on:
  push:
    branches:
      - pr194-runtime-staging

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging harness
        uses: actions/checkout@v4
        with:
          ref: pr194-runtime-staging
          path: harness

      - name: Check out exact PR parent
        uses: actions/checkout@v4
        with:
          ref: 34484e4600f1ccadf52b89f7b7c73adc35aba248
          path: candidate

      - name: Verify parent and apply remediation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "34484e4600f1ccadf52b89f7b7c73adc35aba248"
          python3 -m py_compile harness/.github/scripts/pr194_runtime_remediation.py
          sed -i "s/lazy_group('app\/lib\/data\/extended_journey_catalog.dart', 'extendedJourneyExperiences', 5)/lazy_group('app\/lib\/data\/extended_journey_catalog.dart', 'extendedJourneyExperiences', 4)/" harness/.github/scripts/pr194_runtime_remediation.py
          sed -i "s/if 'for (final journey in dailyJourneyExperiences) journey.id' in read(/if False and 'for (final journey in dailyJourneyExperiences) journey.id' in read(/" harness/.github/scripts/pr194_runtime_remediation.py
          sed -i 's/final journeyExpansionBatchFourExperiences=<DailyJourneyExperience>\[/final journeyExpansionBatchFourExperiences = <DailyJourneyExperience>[/' candidate/app/lib/data/journey_expansion_batch_four.dart
          sed -i 's/final journeyExpansionBatchFiveExperiences=<DailyJourneyExperience>\[/final journeyExpansionBatchFiveExperiences = <DailyJourneyExperience>[/' candidate/app/lib/data/journey_expansion_batch_five.dart
          python3 harness/.github/scripts/pr194_runtime_remediation.py candidate
          python3 - <<'PY'
          from pathlib import Path
          path = Path('candidate/app/lib/data/extended_journey_catalog.dart')
          text = path.read_text(encoding='utf-8')
          old = '  kaipingDiaolouExperience,\n]);'
          new = '  () => kaipingDiaolouExperience,\n]);'
          if text.count(old) != 1:
              raise SystemExit(f'Kaiping lazy wrapper anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          access = Path('candidate/app/lib/state/access_controlled_app_state.dart')
          value = access.read_text(encoding='utf-8')
          old_any = 'dailyJourneyExperiences.any((journey) => journey.id == journeyId)'
          if value.count(old_any) != 1:
              raise SystemExit(f'access any() heavy-catalog anchor count={value.count(old_any)}')
          value = value.replace(old_any, 'dailyJourneyIds.contains(journeyId)', 1)
          old_set = '<String>{for (final journey in dailyJourneyExperiences) journey.id}'
          if value.count(old_set) != 1:
              raise SystemExit(f'access set heavy-catalog anchor count={value.count(old_set)}')
          value = value.replace(old_set, '<String>{...dailyJourneyIds}', 1)
          access.write_text(value, encoding='utf-8')
          PY
          if grep -n "dailyJourneyExperiences" candidate/app/lib/state/access_controlled_app_state.dart; then
            echo 'ACCESS CONTROL STILL TOUCHES HEAVY DAILY CATALOG'
            exit 1
          fi
          echo 'ACCESS CONTROL DAILY CATALOG TOUCH = NONE'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          cd candidate/app
          dart format lib test/startup_lazy_runtime_test.dart
          flutter pub get
          flutter test test/startup_lazy_runtime_test.dart
          flutter test test/seven_day_journey_catalog_test.dart
          flutter test test/journey_location_binding_test.dart
          flutter test test/journey_access_daily_slots_test.dart
          flutter test test/journey_runtime_architecture_gate_test.dart
          flutter test test/journey_runtime_performance_gate_test.dart

      - name: Analyze and full Flutter suite
        shell: bash
        run: |
          set -euo pipefail
          cd candidate/app
          flutter analyze
          flutter test

      - name: Release web build
        shell: bash
        run: |
          set -euo pipefail
          cd candidate/app
          flutter build web --release

      - name: Audit staged delta
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          echo '--- changed files ---'
          git diff --name-only
          test -z "$(git diff --name-only | grep -E 'app/lib/data/.*(gold|level|story|content).*\.dart$' || true)"
          echo 'LEARNER CONTENT SEMANTIC DELTA CHECK = PASS'

      - name: Record validation result on staging branch
        if: always()
        shell: bash
        env:
          VALIDATION_STATUS: ${{ job.status }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd harness
          printf 'status=%s\nrun_id=%s\nsource_sha=%s\n' \
            "$VALIDATION_STATUS" "$SOURCE_RUN_ID" "${{ github.sha }}" \
            > .github/pr194-staging-validation.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/pr194-staging-validation.txt
          git commit -m "ci: record PR194 staging validation $VALIDATION_STATUS" || exit 0
          git push origin HEAD:pr194-runtime-staging
