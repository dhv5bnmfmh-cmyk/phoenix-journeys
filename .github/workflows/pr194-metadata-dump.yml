name: PR194 Metadata Dump

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dump lightweight runtime metadata source values
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          cat > test/pr194_metadata_dump_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:phoenix_journeys/data/daily_journey_catalog.dart';

          void main() {
            test('dump journey metadata', () {
              for (final journey in dailyJourneyExperiences) {
                print('PR194META|${journey.id}|${journey.description.replaceAll('|', '¦')}');
              }
            });
          }
          DART
          flutter test test/pr194_metadata_dump_test.dart -r expanded
