name: Quanzhou exact validation fix

on:
  push:
    branches: [dev/current]
    paths:
      - '.github/workflows/quanzhou_validation_fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/current
          fetch-depth: 0
      - name: Apply exact Quanzhou validation replacements
        run: python3 .github/scripts/quanzhou_validation_fix.py
      - name: Verify exact diff
        run: git diff --check
      - name: Commit exact Quanzhou validation repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/data/daily_journey_catalog.dart app/lib/data/quanzhou_kaiyuan_gold_content.dart
          git diff --cached --check
          git commit -m 'Resolve Quanzhou import ownership and remove explanatory ending'
          git push origin HEAD:dev/current
