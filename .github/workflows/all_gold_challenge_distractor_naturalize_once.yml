name: All-Gold Challenge Distractor Naturalize Once

on:
  push:
    branches:
      - dev/current

permissions:
  contents: write

jobs:
  naturalize:
    if: contains(github.event.head_commit.message, 'run all-Gold Challenge distractor naturalization')
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact remediation head
        uses: actions/checkout@v4

      - name: Make distractor naturalizer duplicate-safe
        run: python3 tools/fix_naturalizer_dedup.py

      - name: Naturalize all non-Datong grammar distractors
        run: python3 tools/naturalize_all_gold_grammar_distractors.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format Gold Challenge profile
        working-directory: app
        run: dart format lib/data/all_gold_challenge_gold_profiles.dart

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Run profile integrity contracts
        working-directory: app
        run: flutter test test/all_gold_challenge_phase2_contract_test.dart --reporter expanded

      - name: Run de-skinned template contracts
        working-directory: app
        run: flutter test test/all_gold_challenge_deskinned_template_test.dart --reporter expanded

      - name: Run cross-Gold DNA contracts
        working-directory: app
        run: flutter test test/all_gold_challenge_cross_gold_dna_test.dart --reporter expanded

      - name: Run all-Gold active runtime snapshot
        working-directory: app
        run: flutter test test/all_gold_challenge_runtime_snapshot_test.dart --reporter expanded

      - name: Analyze affected code
        working-directory: app
        run: flutter analyze lib/data/all_gold_challenge_gold_profiles.dart test/all_gold_challenge_phase2_contract_test.dart test/all_gold_challenge_deskinned_template_test.dart test/all_gold_challenge_cross_gold_dna_test.dart test/all_gold_challenge_runtime_snapshot_test.dart

      - name: Verify whitespace
        run: git diff --check

      - name: Commit validated distractor naturalization
        shell: bash
        run: |
          git config user.name "Phoenix Remediation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/data/all_gold_challenge_gold_profiles.dart
          git commit -m "remediate: naturalize all-Gold grammar distractors"
          git push origin HEAD:dev/current
