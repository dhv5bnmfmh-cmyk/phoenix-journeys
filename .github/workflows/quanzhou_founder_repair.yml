name: Quanzhou Founder Repair

on:
  push:
    branches:
      - dev/current

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/current
          fetch-depth: 0
      - name: Apply exact repair
        run: python tools/quanzhou_founder_repair.py
      - name: Verify and commit repair
        run: |
          git rm tools/quanzhou_founder_repair.py .github/workflows/quanzhou_founder_repair.yml
          git add app/lib/data/quanzhou_kaiyuan_gold_content.dart app/lib/data/journey_narrative_dna_catalog.dart app/lib/data/journey_semantic_fingerprint_catalog.dart app/test/quanzhou_kaiyuan_gold_runtime_test.dart
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair Quanzhou Founder review defects"
          git push origin HEAD:dev/current
