name: Chengdu Lv5 Adapter Repair

on:
  push:
    branches:
      - remediation/chengdu-kuanzhai-one-pass
    paths:
      - .github/workflows/chengdu-lv5-adapter-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: remediation/chengdu-kuanzhai-one-pass
          fetch-depth: 0
      - name: Apply repair
        shell: bash
        run: |
          python3 .github/scripts/chengdu_lv5_adapter_repair.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: bind Chengdu catalog to canonical Lv5"
          git push origin HEAD:remediation/chengdu-kuanzhai-one-pass
