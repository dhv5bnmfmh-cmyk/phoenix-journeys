name: Forbidden City Content-Only Finalize

on:
  push:
    branches:
      - feature/forbidden-city-content-only-reference

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', '[content-provenance-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content-only branch
        uses: actions/checkout@v4
        with:
          ref: feature/forbidden-city-content-only-reference
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply same-level vocabulary provenance
        run: python3 tools/forbidden_city_same_level_vocab_patch.py

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Format touched Dart files
        working-directory: app
        run: dart format lib/data/forbidden_city_journey_runtime.dart test/forbidden_city_ten_level_content_contract_test.dart

      - name: Verify ten-level content contract
        working-directory: app
        run: flutter test test/forbidden_city_ten_level_content_contract_test.dart

      - name: Analyze touched runtime
        working-directory: app
        run: flutter analyze lib/data/forbidden_city_journey_runtime.dart lib/screens/journey_screen.dart

      - name: Commit verified final content-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce same-level Forbidden City Story provenance [content-provenance-applied]"
          git push origin HEAD:feature/forbidden-city-content-only-reference
