name: Chengdu Adapter Repair

on:
  push:
    branches:
      - remediation/chengdu-kuanzhai-one-pass
    paths:
      - .github/workflows/chengdu-adapter-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: remediation/chengdu-kuanzhai-one-pass
          fetch-depth: 0
      - name: Apply published catalog repair
        shell: bash
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/chengdu_adapter_repair.py
          python3 /tmp/chengdu_adapter_repair.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/lib/data/extended_journey_catalog.dart .github/workflows
          git diff --cached --check
          git commit -m "fix: align Chengdu published catalog adapter"
          git push origin HEAD:remediation/chengdu-kuanzhai-one-pass
