name: Lijiang Worker Contract Fix

on:
  push:
    branches:
      - dev/current

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev/current
          fetch-depth: 0
      - run: python .github/lijiang_worker_contract_fix.py
      - run: git diff --check
      - run: node --test worker/journey_expansion_batch_two_rule.test.mjs
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/data/journey_expansion_batch_two.dart
          git commit -m 'fix: preserve Lijiang batch-two runtime contracts'
          git push origin HEAD:dev/current
