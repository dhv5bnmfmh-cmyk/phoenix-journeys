name: Temporary Pingyao Gold Activation

on:
  push:
    branches:
      - dev/current
    paths:
      - .github/workflows/_tmp_pingyao_gold_builder.yml
      - .github/phoenix-tmp/pingyao-payload-*.txt

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev/current
        uses: actions/checkout@v6
        with:
          ref: dev/current

      - name: Materialize candidate and patch active runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pingyao-payload
          cat .github/phoenix-tmp/pingyao-payload-*.txt | base64 --decode | tar -xzf - -C /tmp/pingyao-payload
          cp /tmp/pingyao-payload/pingyao_ancient_city_gold_content.dart app/lib/data/
          cp /tmp/pingyao-payload/pingyao_ancient_city_challenge_profile.dart app/lib/data/
          cp /tmp/pingyao-payload/pingyao_ancient_city_narrative_dna.dart app/lib/data/
          cp /tmp/pingyao-payload/pingyao_ancient_city_semantic_fingerprint.dart app/lib/data/
          cp /tmp/pingyao-payload/pingyao_ancient_city_gold_test.dart app/test/
          cp /tmp/pingyao-payload/PINGYAO_GOLD_CANDIDATE_AUDIT.md docs/

          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              p.write_text(s.replace(old, new, 1))

          # Dedicated adaptive Gold adapter.
          path = 'app/lib/data/batch_one_adaptive_story_levels.dart'
          replace_once(path,
              "import 'honghe_hani_rice_terraces_gold_content.dart';\n",
              "import 'honghe_hani_rice_terraces_gold_content.dart';\nimport 'pingyao_ancient_city_gold_content.dart';\n",
              'batch-one import')
          replace_once(path,
              "    journeyId == hongheHaniRiceTerracesJourneyId;",
              "    journeyId == hongheHaniRiceTerracesJourneyId ||\n    journeyId == pingyaoAncientCityJourneyId;",
              'batch-one membership')
          replace_once(path,
              "    hongheHaniRiceTerracesJourneyId =>\n      hongheHaniRiceTerracesGoldLevelContent(level),\n",
              "    hongheHaniRiceTerracesJourneyId =>\n      hongheHaniRiceTerracesGoldLevelContent(level),\n    pingyaoAncientCityJourneyId => pingyaoAncientCityGoldLevelContent(level),\n",
              'batch-one level switch')
          replace_once(path,
              "    hongheHaniRiceTerracesJourneyId => hongheHaniRiceTerracesGoldJourney,\n",
              "    hongheHaniRiceTerracesJourneyId => hongheHaniRiceTerracesGoldJourney,\n    pingyaoAncientCityJourneyId => pingyaoAncientCityGoldJourney,\n",
              'batch-one memory switch')
          replace_once(path,
              "    lijiangOldTownJourneyId || hongheHaniRiceTerracesJourneyId =>\n",
              "    lijiangOldTownJourneyId ||\n    hongheHaniRiceTerracesJourneyId ||\n    pingyaoAncientCityJourneyId =>\n",
              'batch-one cultural point')

          # Dedicated runtime and canonical Discovery depth only; not Approved Gold.
          path = 'app/lib/data/dedicated_adaptive_journey_catalog.dart'
          replace_once(path,
              "  'honghe-hani-rice-terraces',\n};",
              "  'honghe-hani-rice-terraces',\n  'pingyao-ancient-city',\n};",
              'dedicated runtime membership')
          # The same marker occurs in the second set after first replacement, so target the comment-bounded second set.
          p = Path(path)
          s = p.read_text()
          marker = "const canonicalExpandedDiscoveryJourneyIds = <String>{\n"
          start = s.index(marker) + len(marker)
          end = s.index("};", start)
          block = s[start:end]
          if "  'pingyao-ancient-city',\n" not in block:
              if "  'honghe-hani-rice-terraces',\n" not in block:
                  raise SystemExit('canonical Discovery set: Honghe marker missing')
              block = block.replace("  'honghe-hani-rice-terraces',\n", "  'honghe-hani-rice-terraces',\n  'pingyao-ancient-city',\n", 1)
              p.write_text(s[:start] + block + s[end:])

          # Candidate semantic mechanism families. No thresholds or Approved registry changes.
          path = 'app/lib/data/journey_semantic_fingerprint_catalog.dart'
          semantic_insert = """  communalWaterRuleForcesPrivateReciprocityCost,\n\n  // Reusable families introduced by Pingyao networked-credit responsibility.\n  lateQingShopDayCombinesIllnessAndDuePayment,\n  coownerReframingResponsibilityThroughNetworkedCredit,\n  coowningBrothersBoundBySharedRiskPractice,\n  settleDistantPaymentWhileRemainingWithSickMother,\n  bodilySilverCustodyVsNetworkedCreditPresence,\n  sendVerifiableDraftInsteadOfEscortSilver,\n  draftDepartsAsSharedLedgerSeparates,\n  paymentCanSettleWhileBusinessPartnershipSplits,\n  bodilyRiskProofToInstitutionalCreditResponsibility,\n  newLedgerBeginsWithoutBrotherlyVindication,\n  draftBankRemittanceSeparatesValueFromSilverTransport,\n  stationarySilverChestAndSeparatedLedgerShowChangedMobility,\n  draftMovesAcrossBranchNetworkWhileBodyStays,\n  sameDayIllnessAndDuePaymentPressure,\n  olderBrotherSeparatesAccountsAfterRemittanceChoice,\n  networkedCreditReassignsWhoMustTravelAtPrivateRelationshipCost,\n"""
          replace_once(path,
              "  communalWaterRuleForcesPrivateReciprocityCost,\n}",
              semantic_insert + "}",
              'semantic families')

          # Challenge profile wiring: candidate only, no approval signal.
          path = 'app/lib/data/all_gold_challenge_gold_profiles.dart'
          replace_once(path,
              "import 'all_gold_challenge_gold_profiles_base.dart' as base;\n",
              "import 'all_gold_challenge_gold_profiles_base.dart' as base;\nimport 'pingyao_ancient_city_challenge_profile.dart';\n",
              'challenge import')
          replace_once(path,
              "const _hongheHaniRiceTerracesJourneyId = 'honghe-hani-rice-terraces';\n",
              "const _hongheHaniRiceTerracesJourneyId = 'honghe-hani-rice-terraces';\nconst _pingyaoAncientCityJourneyId = 'pingyao-ancient-city';\n",
              'challenge id')
          replace_once(path,
              "    _hongheHaniRiceTerracesJourneyId: _hongheHaniRiceTerracesChallengeProfile,\n  },\n);",
              "    _hongheHaniRiceTerracesJourneyId: _hongheHaniRiceTerracesChallengeProfile,\n    _pingyaoAncientCityJourneyId: pingyaoAncientCityChallengeProfile,\n  },\n);",
              'challenge map')

          # Active expansion record: remove stale generic Pingyao package and bind Gold candidate.
          path = 'app/lib/data/journey_expansion_batch_four.dart'
          replace_once(path,
              "import 'honghe_hani_rice_terraces_gold_content.dart';\n",
              "import 'honghe_hani_rice_terraces_gold_content.dart';\nimport 'pingyao_ancient_city_gold_content.dart';\n",
              'batch-four import')
          p = Path(path)
          s = p.read_text()
          shanxi_source = "  StorySourceRecord(id: 'shanxi-pingyao', title: '平遥古城：2800岁正青春', publisher: '山西省文化和旅游厅', url: 'https://wlt.shanxi.gov.cn/xwzx/wlxx/202305/t20230517_8565714.shtml', kind: StorySourceKind.government, languageCode: 'zh-CN', geoNodeIds: ['cn-shanxi-jinzhong-pingyao-ancient-city'], verificationStatus: StoryVerificationStatus.verified, accessedOn: '2026-07-29'),\n"
          new_source = "  StorySourceRecord(id: 'gjbmj-jinshang-piaohao', title: '晋商票号：防伪保密制度的创制者', publisher: '国家保密局互联网门户网站', url: 'https://www.gjbmj.gov.cn/n1/2020/0911/c413725-31858628.html', kind: StorySourceKind.government, languageCode: 'zh-CN', geoNodeIds: ['cn-shanxi-jinzhong-pingyao-ancient-city'], verificationStatus: StoryVerificationStatus.verified, accessedOn: '2026-08-17'),\n"
          if s.count(shanxi_source) != 1:
              raise SystemExit('Pingyao government source marker mismatch')
          s = s.replace(shanxi_source, shanxi_source + new_source, 1)
          # Remove all stale generic Pingyao learner content constants.
          s, n = re.subn(r"const _pingyaoP = <String>\[.*?\nconst _qufuP = <String>\[", "const _qufuP = <String>[", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Pingyao generic block removal expected 1, got {n}')
          old_record = "final pingyaoJourney = _record('pingyao-ancient-city','平遥 · 古城：在灰砖街巷读懂晋商','cn-shanxi-jinzhong-pingyao-ancient-city',_pingyaoP,const ['unesco-pingyao','shanxi-pingyao'],const ['平遥','古城','晋商','票号','世界遗产']);"
          new_record = "final pingyaoJourney = _record(pingyaoAncientCityJourneyId,pingyaoAncientCityCanonicalTitle,'cn-shanxi-jinzhong-pingyao-ancient-city',pingyaoAncientCityGoldLevelContent(5).storyParagraphs,const ['unesco-pingyao','shanxi-pingyao','gjbmj-jinshang-piaohao'],const ['平遥','古城','晋商','票号','汇票','异地汇兑','世界遗产']);"
          if s.count(old_record) != 1:
              raise SystemExit(f'Pingyao record marker mismatch: {s.count(old_record)}')
          s = s.replace(old_record, new_record, 1)
          experience_pattern = re.compile(r"  DailyJourneyExperience\(id:pingyaoJourney\.id,.*?\),\n  DailyJourneyExperience\(id:qufuJourney\.id", re.S)
          new_experience = "  DailyJourneyExperience(id:pingyaoJourney.id,city:'平遥',cityCode:'PYG',place:'平遥古城',appBarTitle:'平遥 · 古城',storyTitle:pingyaoAncientCityCanonicalTitle,headline:'一张汇票让谁留下',description:'跟随程砚在票号、银箱与两本账之间，看异地汇兑怎样改变人的在场与责任。',discoveryTeaser:'银子没有上路，远方为什么仍能兑付？',distanceLabel:'1,660 km',stampSymbol:'票',content:pingyaoJourney,storyAnnotations:pingyaoAncientCityGoldLevelContent(5).storyAnnotations,words:pingyaoAncientCityWords,discoveries:pingyaoAncientCityGoldLevelContent(5).discoveries,wonderQuestion:pingyaoAncientCityGoldLevelContent(5).wonderQuestion,expressQuestion:pingyaoAncientCityGoldLevelContent(5).expressQuestion),\n  DailyJourneyExperience(id:qufuJourney.id"
          s, n = experience_pattern.subn(new_experience, s, count=1)
          if n != 1:
              raise SystemExit(f'Pingyao experience replacement expected 1, got {n}')
          p.write_text(s)

          # Generic catalog test now recognizes candidate's canonical Lv5 publication depth.
          path = 'app/test/seven_day_journey_catalog_test.dart'
          replace_once(path,
              "import 'package:phoenix_journeys/data/honghe_hani_rice_terraces_gold_content.dart';\n",
              "import 'package:phoenix_journeys/data/honghe_hani_rice_terraces_gold_content.dart';\nimport 'package:phoenix_journeys/data/pingyao_ancient_city_gold_content.dart';\n",
              'catalog test import')
          replace_once(path,
              "      } else if (journey.id == hongheHaniRiceTerracesJourneyId) {\n        expect(\n          journey.content.storyParagraphs,\n          hongheHaniRiceTerracesGoldLevelContent(5).storyParagraphs,\n          reason: journey.id,\n        );\n",
              "      } else if (journey.id == hongheHaniRiceTerracesJourneyId) {\n        expect(\n          journey.content.storyParagraphs,\n          hongheHaniRiceTerracesGoldLevelContent(5).storyParagraphs,\n          reason: journey.id,\n        );\n      } else if (journey.id == pingyaoAncientCityJourneyId) {\n        expect(\n          journey.content.storyParagraphs,\n          pingyaoAncientCityGoldLevelContent(5).storyParagraphs,\n          reason: journey.id,\n        );\n",
              'catalog test story')
          replace_once(path,
              "      } else if (journey.id == hongheHaniRiceTerracesJourneyId) {\n        expect(\n          journey.discoveries,\n          hasLength(hongheHaniRiceTerracesGoldLevelContent(5).discoveries.length),\n          reason: journey.id,\n        );\n",
              "      } else if (journey.id == hongheHaniRiceTerracesJourneyId) {\n        expect(\n          journey.discoveries,\n          hasLength(hongheHaniRiceTerracesGoldLevelContent(5).discoveries.length),\n          reason: journey.id,\n        );\n      } else if (journey.id == pingyaoAncientCityJourneyId) {\n        expect(\n          journey.discoveries,\n          hasLength(pingyaoAncientCityGoldLevelContent(5).discoveries.length),\n          reason: journey.id,\n        );\n",
              'catalog test Discovery')

          # Final candidate must not retain any temporary workflow/payload files.
          Path('.github/workflows/_tmp_pingyao_gold_builder.yml').unlink()
          for temp in Path('.github/phoenix-tmp').glob('pingyao-payload-*.txt'):
              temp.unlink()
          try:
              Path('.github/phoenix-tmp').rmdir()
          except OSError:
              pass
          PY

          git diff --check

      - name: Commit exact Pingyao candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: convert Pingyao Ancient City to Gold candidate"
          git push origin HEAD:dev/current
