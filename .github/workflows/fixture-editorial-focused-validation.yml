name: Fixture Editorial Focused Validation

on:
  push:
    branches:
      - agent/fixture-editorial-revision-v1-e210929

permissions:
  contents: read

jobs:
  validate-fixture-editorial:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact validation head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify isolated scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only e210929133cdc90a651509672415761505139f99 HEAD | sort | tee /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/fixture-editorial-focused-validation.yml
          app/lib/data/forbidden_city_content_pipeline_fixture.dart
          app/lib/data/forbidden_city_story_engine_v1.dart
          app/test/ai_content_pipeline_v1_test.dart
          app/test/story_engine_v1_test.dart
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Focused tests
        working-directory: app
        run: >-
          flutter test --reporter expanded
          test/ai_content_pipeline_v1_test.dart
          test/story_engine_v1_test.dart
          test/forbidden_city_discovery_authoritative_source_v1_test.dart
          test/story_discovery_no_yellow_dots_test.dart
          test/forbidden_city_ten_level_content_contract_test.dart
          test/multiple_choice_answer_position_contract_test.dart
          test/founder_real_device_ux_test.dart

      - name: Analyze
        working-directory: app
        run: flutter analyze
