name: Apply narration follow control

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-narration-follow-control.yml

permissions:
  contents: write

concurrency:
  group: apply-narration-follow-control-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/narration-voice-picker-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/narration-voice-picker-v1
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Connect reading text to follow coordinator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          story_path = Path('app/lib/widgets/interactive_story_text.dart')
          story = story_path.read_text(encoding='utf-8')

          import_anchor = "import '../services/narration_controller.dart';\n"
          import_insert = import_anchor + "import '../services/narration_follow_coordinator.dart';\n"
          if "narration_follow_coordinator.dart" not in story:
              if import_anchor not in story:
                  raise SystemExit('missing narration import anchor')
              story = story.replace(import_anchor, import_insert, 1)

          helper_pattern = re.compile(
              r"const Duration narrationAutoFollowManualHold = Duration\(milliseconds: 2400\);\n\n"
              r"@visibleForTesting\n"
              r"Duration narrationAutoFollowRemainingHold\(\{.*?\n\}\n\n",
              re.S,
          )
          story, helper_count = helper_pattern.subn('', story, count=1)
          if helper_count != 1:
              raise SystemExit(f'unexpected helper match count: {helper_count}')

          field_pattern = re.compile(
              r"  int _autoFollowRequest = 0;\n"
              r"  static final Expando<DateTime> _manualHoldUntilByController =\n"
              r"      Expando<DateTime>\('narration-manual-follow-hold'\);\n"
          )
          story, field_count = field_pattern.subn(
              "  int _autoFollowRequest = 0;\n"
              "  NarrationFollowCoordinator? _followCoordinator;\n",
              story,
              count=1,
          )
          if field_count != 1:
              raise SystemExit(f'unexpected field match count: {field_count}')

          getter_anchor = """  bool get _hasExplicitHighlight =>
              widget.highlightStart != null &&
              widget.highlightEnd != null &&
              widget.highlightEnd! > widget.highlightStart!;

          """
          getter_insert = getter_anchor + """  void _attachNarrationFollowCoordinator() {
            final controller = widget.narrationController;
            _followCoordinator = controller == null
                ? null
                : NarrationFollowCoordinator.forController(controller);
            _followCoordinator?.addListener(_handleNarrationFollowChanged);
          }

            void _detachNarrationFollowCoordinator() {
            _followCoordinator?.removeListener(_handleNarrationFollowChanged);
            _followCoordinator = null;
          }

            void _handleNarrationFollowChanged() {
            final coordinator = _followCoordinator;
            if (coordinator == null) return;
            if (coordinator.isManualHoldActive) {
              _autoFollowTimer?.cancel();
              _autoFollowRequest += 1;
              return;
            }
            if (_hasExplicitHighlight &&
                widget.narrationController?.status == NarrationStatus.playing) {
              _scheduleNarrationAutoFollow();
            }
          }

          """
          if getter_anchor not in story:
              raise SystemExit('missing highlight getter anchor')
          story = story.replace(getter_anchor, getter_insert, 1)

          init_pattern = re.compile(
              r"(?m)^(\s*)_buildSegments\(\);\n(\s*)if \(_hasExplicitHighlight &&"
          )
          story, init_count = init_pattern.subn(
              lambda match: (
                  f"{match.group(1)}_buildSegments();\n"
                  f"{match.group(1)}_attachNarrationFollowCoordinator();\n"
                  f"{match.group(2)}if (_hasExplicitHighlight &&"
              ),
              story,
              count=1,
          )
          if init_count != 1:
              raise SystemExit(f'unexpected init match count: {init_count}')

          update_pattern = re.compile(
              r"(?m)^(\s*)final isActive = _hasExplicitHighlight;\n"
          )
          story, update_count = update_pattern.subn(
              lambda match: (
                  f"{match.group(1)}final isActive = _hasExplicitHighlight;\n"
                  f"{match.group(1)}if (!identical(\n"
                  f"{match.group(1)}  oldWidget.narrationController,\n"
                  f"{match.group(1)}  widget.narrationController,\n"
                  f"{match.group(1)})) {{\n"
                  f"{match.group(1)}  _detachNarrationFollowCoordinator();\n"
                  f"{match.group(1)}  _attachNarrationFollowCoordinator();\n"
                  f"{match.group(1)}}}\n"
              ),
              story,
              count=1,
          )
          if update_count != 1:
              raise SystemExit(f'unexpected didUpdate match count: {update_count}')

          methods_pattern = re.compile(
              r"  void _suspendNarrationAutoFollow\(\) \{.*?\n"
              r"  Duration _remainingNarrationAutoFollowHold\(\) \{.*?\n"
              r"  \}\n\n(?=  void _scheduleNarrationAutoFollow)",
              re.S,
          )
          methods_insert = """  void _suspendNarrationAutoFollow() {
            if (widget.narrationController?.status != NarrationStatus.playing) {
              return;
            }
            _followCoordinator?.suspend();
          }

            Duration _remainingNarrationAutoFollowHold() {
            return _followCoordinator?.remainingHold ?? Duration.zero;
          }

          """
          story, methods_count = methods_pattern.subn(
              methods_insert,
              story,
              count=1,
          )
          if methods_count != 1:
              raise SystemExit(f'unexpected methods match count: {methods_count}')

          dispose_pattern = re.compile(
              r"(\s*_hideTimer\?\.cancel\(\);\n\s*_autoFollowTimer\?\.cancel\(\);\n)"
              r"(\s*_cinematicRevealController\.dispose\(\);)"
          )
          story, dispose_count = dispose_pattern.subn(
              lambda match: (
                  f"{match.group(1)}"
                  "    _detachNarrationFollowCoordinator();\n"
                  f"{match.group(2)}"
              ),
              story,
              count=1,
          )
          if dispose_count != 1:
              raise SystemExit(f'unexpected dispose match count: {dispose_count}')

          story_path.write_text(story, encoding='utf-8')

          test_path = Path('app/test/narration_auto_follow_test.dart')
          tests = test_path.read_text(encoding='utf-8')
          test_import_anchor = (
              "import 'package:phoenix_journeys/services/narration_controller.dart';\n"
          )
          test_import_insert = test_import_anchor + (
              "import 'package:phoenix_journeys/services/"
              "narration_follow_coordinator.dart';\n"
          )
          if 'narration_follow_coordinator.dart' not in tests:
              if test_import_anchor not in tests:
                  raise SystemExit('missing auto-follow test import anchor')
              tests = tests.replace(test_import_anchor, test_import_insert, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

          dart format \
            app/lib/widgets/interactive_story_text.dart \
            app/test/narration_auto_follow_test.dart
          git diff --check

      - name: Commit connected follow controls
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/widgets/interactive_story_text.dart \
            app/test/narration_auto_follow_test.dart
          git commit -m "Connect narration text to follow controls"
          git push origin HEAD:agent/narration-voice-picker-v1
