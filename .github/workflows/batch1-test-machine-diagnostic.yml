name: Batch 1 Flutter Test Machine Diagnostic

on:
  push:
    branches:
      - preview/batch-1-final-founder-review
    paths:
      - '.github/workflows/batch1-test-machine-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: app
        run: flutter pub get
      - name: Capture final trace diagnostics
        shell: bash
        run: |
          cd app
          cat > test/_batch1_trace_diagnostic_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:phoenix_journeys/agents/phoenix_language_level_agent.dart';
          import 'package:phoenix_journeys/data/adaptive_journey_level_runtime.dart';
          import 'package:phoenix_journeys/data/daily_journey_catalog.dart';
          import 'package:phoenix_journeys/data/forbidden_city_challenge_package.dart';
          import 'package:phoenix_journeys/data/forbidden_city_journey_runtime.dart';
          import 'package:phoenix_journeys/services/forbidden_city_quality_gate.dart';

          void main() {
            test('diagnose forbidden city level traces', () {
              const agent = PhoenixLanguageLevelAgent();
              final journey = requireDailyJourneyExperience(forbiddenCityJourneyId);
              for (final profile in agent.allProfiles) {
                final level = profile.phoenixLevel!;
                final content = resolveAdaptiveJourneyLevel(journey, profile: profile);
                final story = content.storyParagraphs.single;
                final rebuild = forbiddenCityParagraphRebuild[level - 1];
                final grammar = forbiddenCityGrammarRepair[level - 1];
                final missing = forbiddenCityMissingSentence[level - 1];
                final report = auditForbiddenCityLockedQuality(content, profile: profile);
                if (report.issues.isNotEmpty) {
                  print('LEVEL=$level');
                  for (final issue in report.issues) {
                    print('ISSUE=${issue.code} :: ${issue.message}');
                  }
                  for (var i = 0; i < rebuild.segments.length; i++) {
                    print('REBUILD[$i]=${story.contains(rebuild.segments[i])} :: ${rebuild.segments[i]}');
                  }
                  print('GRAMMAR=${story.contains(grammar.correct)} :: ${grammar.correct}');
                  print('MISSING_BEFORE=${story.contains(missing.before)} :: ${missing.before}');
                  print('MISSING_ANSWER=${story.contains(missing.answer)} :: ${missing.answer}');
                  print('MISSING_AFTER=${story.contains(missing.after)} :: ${missing.after}');
                }
              }
            });
          }
          DART
          flutter test test/_batch1_trace_diagnostic_test.dart --reporter expanded | tee /tmp/trace.txt
          cd ..
          cp /tmp/trace.txt .github/batch1-final-trace.txt
          git config user.name 'Phoenix Preview Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/batch1-final-trace.txt
          git commit -m 'diagnostic: capture final trace details'
          git push
