name: Batch 1 Flutter Test Machine Diagnostic

on:
  push:
    branches:
      - preview/batch-1-final-founder-review
    paths:
      - '.github/workflows/batch1-test-machine-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: app
        run: flutter pub get
      - name: Capture exact failed tests
        shell: bash
        run: |
          set +e
          cd app
          flutter test --machine > /tmp/tests.jsonl 2>/tmp/tests.stderr
          code=$?
          cd ..
          python - <<'PY'
          import json

          tests = {}
          failed = []
          errors = []

          def visit(e):
              if isinstance(e, list):
                  for item in e:
                      visit(item)
                  return
              if not isinstance(e, dict):
                  return
              t = e.get('type')
              if t == 'testStart':
                  test = e.get('test') or {}
                  tests[test.get('id')] = f"{test.get('url','')} :: {test.get('name','')}"
              elif t == 'testDone' and e.get('result') not in ('success', 'skipped'):
                  failed.append(tests.get(e.get('testID'), str(e.get('testID'))))
              elif t == 'error':
                  errors.append(
                      f"TEST={tests.get(e.get('testID'), e.get('testID'))}\n"
                      f"ERROR={e.get('error','')}\nSTACK={e.get('stackTrace','')}"
                  )

          for raw in open('/tmp/tests.jsonl', errors='replace'):
              try:
                  visit(json.loads(raw))
              except Exception:
                  continue

          with open('.github/batch1-failed-tests.txt', 'w') as f:
              f.write(
                  'FAILED TESTS\n' + '\n'.join(dict.fromkeys(failed)) +
                  '\n\nERRORS\n' + '\n\n'.join(errors)
              )
          PY
          git config user.name 'Phoenix Preview Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/batch1-failed-tests.txt
          git commit -m 'diagnostic: capture exact 27 Flutter failures' || true
          git push
          exit "$code"
