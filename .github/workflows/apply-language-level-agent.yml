name: Apply Phoenix Language Level Agent

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-language-level-agent.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/summer-palace-story-engine-pilot
          fetch-depth: 0

      - name: Integrate language level profile into Journey screen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/lib/screens/journey_screen.dart')
          text = path.read_text()

          def replace_once(label, old, new):
              global text
              if old not in text:
                  raise SystemExit(f'MARKER_NOT_FOUND:{label}')
              text = text.replace(old, new, 1)

          replace_once(
              'imports',
              "import '../data/daily_journey_catalog.dart';\n",
              "import '../agents/phoenix_language_level_agent.dart';\n"
              "import '../data/adaptive_journey_level_runtime.dart';\n"
              "import '../data/daily_journey_catalog.dart';\n",
          )
          replace_once(
              'model-service-imports',
              "import '../models/journey_background.dart';\n",
              "import '../models/journey_background.dart';\n"
              "import '../models/language_proficiency.dart';\n"
              "import '../services/language_level_preference_store.dart';\n",
          )
          replace_once(
              'fields',
              "  bool _difficultyPromptScheduled = false;\n",
              "  bool _difficultyPromptScheduled = false;\n"
              "  static const PhoenixLanguageLevelAgent _languageLevelAgent =\n"
              "      PhoenixLanguageLevelAgent();\n"
              "  static const LanguageLevelPreferenceStore _languageLevelStore =\n"
              "      LanguageLevelPreferenceStore();\n"
              "  ChineseProficiencyProfile? _languageProfile;\n"
              "  bool _languageProfileLoaded = false;\n",
          )
          replace_once(
              'initial-load',
              "    unawaited(_narration.setSpeechRate(_appState.journeyDifficulty.speechRate));\n"
              "    _scheduleDifficultyWelcome();\n",
              "    unawaited(_loadLanguageProfile());\n",
          )

          getter_start = text.index('  JourneyLevelContent get _levelContent')
          getter_end = text.index('  Future<void> _changeDifficulty', getter_start)
          adaptive_block = '''  JourneyLevelContent get _levelContent {
            final profile = _languageProfile;
            if (profile == null) {
              return resolveJourneyLevel(
                _experience,
                _appState.journeyDifficulty,
              );
            }
            return resolveAdaptiveJourneyLevel(
              _experience,
              profile: profile,
              knownWords: _appState.savedWords,
            );
          }

          ReadingGenerationPlan? get _generationPlan {
            final profile = _languageProfile;
            return profile == null ? null : _languageLevelAgent.planFor(profile);
          }

          List<JourneyDifficulty> get _supportedDifficulties =>
              supportedJourneyDifficulties(_experience);

          Future<void> _loadLanguageProfile() async {
            final profile = await _languageLevelStore.load();
            if (!mounted) return;
            final rate = profile == null
                ? _appState.journeyDifficulty.speechRate
                : _languageLevelAgent.planFor(profile).speechRate;
            await _narration.setSpeechRate(rate);
            if (!mounted) return;
            setState(() {
              _languageProfile = profile;
              _languageProfileLoaded = true;
            });
            _scheduleDifficultyWelcome();
          }

          Future<void> _selectLanguageProfile(
            ChineseProficiencyProfile profile,
          ) async {
            await _narration.stop();
            await _languageLevelStore.save(profile);
            await _narration.setSpeechRate(
              _languageLevelAgent.planFor(profile).speechRate,
            );
            if (!mounted) return;
            setState(() {
              _languageProfile = profile;
              _languageProfileLoaded = true;
              _discoveryAutoStarted = false;
            });
            if (step == 2) _scheduleDiscoveryAutoStart();
          }

          Future<void> _showLanguageProfilePicker({bool showIntro = false}) async {
            if (!mounted) return;
            final track = await showModalBottomSheet<ChineseExamTrack>(
              context: context,
              useSafeArea: true,
              showDragHandle: true,
              builder: (sheetContext) => Padding(
                padding: const EdgeInsets.fromLTRB(16, 0, 16, 20),
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Text(
                      _appState.displayText(
                        showIntro ? '先选择你的中文考试路线' : '选择中文考试路线',
                      ),
                      style: const TextStyle(
                        fontSize: 18,
                        fontWeight: FontWeight.w900,
                      ),
                    ),
                    const SizedBox(height: 4),
                    Text(
                      _appState.displayText(
                        'Phoenix 会调整短文长度、句子复杂度和重点生词数量。',
                      ),
                      style: const TextStyle(fontSize: 12, height: 1.35),
                    ),
                    const SizedBox(height: 10),
                    for (final item in ChineseExamTrack.values)
                      ListTile(
                        contentPadding: EdgeInsets.zero,
                        leading: CircleAvatar(
                          backgroundColor:
                              PhoenixTheme.red.withValues(alpha: .12),
                          child: Text(
                            item == ChineseExamTrack.hsk ? '汉' : '华',
                            style: const TextStyle(
                              color: PhoenixTheme.red,
                              fontWeight: FontWeight.w900,
                            ),
                          ),
                        ),
                        title: Text(
                          item.label,
                          style: const TextStyle(fontWeight: FontWeight.w900),
                        ),
                        subtitle: Text(
                          _appState.displayText(
                            item == ChineseExamTrack.hsk
                                ? 'HSK 1 至 HSK 7–9'
                                : '准备级至 TOCFL Level 6',
                          ),
                        ),
                        trailing: const Icon(Icons.chevron_right_rounded),
                        onTap: () => Navigator.of(sheetContext).pop(item),
                      ),
                  ],
                ),
              ),
            );
            if (!mounted || track == null) return;

            final selected = await showModalBottomSheet<ChineseProficiencyProfile>(
              context: context,
              useSafeArea: true,
              showDragHandle: true,
              isScrollControlled: true,
              builder: (sheetContext) => FractionallySizedBox(
                heightFactor: .78,
                child: ListView(
                  padding: const EdgeInsets.fromLTRB(16, 0, 16, 20),
                  children: [
                    Text(
                      _appState.displayText('选择 ${track.label} 等级'),
                      style: const TextStyle(
                        fontSize: 18,
                        fontWeight: FontWeight.w900,
                      ),
                    ),
                    const SizedBox(height: 4),
                    Text(
                      _appState.displayText(
                        '两套考试独立映射，不把 HSK 和 TOCFL 强行画等号。',
                      ),
                      style: const TextStyle(fontSize: 12, height: 1.35),
                    ),
                    const SizedBox(height: 8),
                    for (final profile in _languageLevelAgent.profilesFor(track))
                      ListTile(
                        contentPadding: EdgeInsets.zero,
                        title: Text(
                          profile.displayLabel,
                          style: const TextStyle(fontWeight: FontWeight.w900),
                        ),
                        subtitle: Text(
                          _appState.displayText(
                            '${profile.band.label} · '
                            '${_languageLevelAgent.planFor(profile).targetVocabularyCount} 个重点生词',
                          ),
                        ),
                        trailing: _languageProfile?.storageValue ==
                                profile.storageValue
                            ? const Icon(
                                Icons.check_rounded,
                                color: PhoenixTheme.red,
                              )
                            : const Icon(Icons.chevron_right_rounded),
                        onTap: () => Navigator.of(sheetContext).pop(profile),
                      ),
                  ],
                ),
              ),
            );
            if (selected != null) await _selectLanguageProfile(selected);
          }

          '''
          text = text[:getter_start] + adaptive_block + text[getter_end:]

          schedule_start = text.index('  void _scheduleDifficultyWelcome() {')
          welcome_end = text.index('  Future<void> _goToStep', schedule_start)
          text = (
              text[:schedule_start]
              + '''  void _scheduleDifficultyWelcome() {
            if (_difficultyPromptScheduled ||
                !_languageProfileLoaded ||
                _languageProfile != null ||
                _experience.id != 'beijing-summer-palace') {
              return;
            }
            _difficultyPromptScheduled = true;
            WidgetsBinding.instance.addPostFrameCallback((_) {
              if (mounted) unawaited(_showDifficultyWelcome());
            });
          }

          Future<void> _showDifficultyWelcome() async {
            await _showLanguageProfilePicker(showIntro: true);
          }

          '''
              + text[welcome_end:]
          )

          replace_once(
              'ai-profile',
              "      'currentLevel': _appState.journeyDifficulty.label,\n",
              "      'currentLevel':\n"
              "          _languageProfile?.displayLabel ?? _appState.journeyDifficulty.label,\n"
              "      'readingBand': _languageProfile?.band.label,\n"
              "      'targetVocabularyCount': _generationPlan?.targetVocabularyCount,\n"
              "      'targetCharacterRange': _generationPlan == null\n"
              "          ? null\n"
              "          : '${_generationPlan!.minTotalCharacters}-'\n"
              "              '${_generationPlan!.maxTotalCharacters}',\n",
          )

          replace_once(
              'actions-selector',
              "          actions: [\n            Consumer<AppState>(\n",
              "          actions: [\n"
              "            if (_experience.id == 'beijing-summer-palace')\n"
              "              TextButton(\n"
              "                key: const ValueKey('journey-language-level-selector'),\n"
              "                onPressed: () => unawaited(_showLanguageProfilePicker()),\n"
              "                style: TextButton.styleFrom(\n"
              "                  visualDensity: VisualDensity.compact,\n"
              "                  padding: const EdgeInsets.symmetric(horizontal: 6),\n"
              "                ),\n"
              "                child: Text(\n"
              "                  _languageProfile?.displayLabel ?? 'HSK / TOCFL',\n"
              "                  style: const TextStyle(\n"
              "                    color: Colors.white,\n"
              "                    fontSize: 9.5,\n"
              "                    fontWeight: FontWeight.w900,\n"
              "                  ),\n"
              "                ),\n"
              "              ),\n"
              "            Consumer<AppState>(\n",
          )
          replace_once(
              'hide-old-selector',
              "                if (_supportedDifficulties.length < 2) {\n",
              "                if (_experience.id == 'beijing-summer-palace' ||\n"
              "                    _supportedDifficulties.length < 2) {\n",
          )

          path.write_text(text)
          PY

      - name: Format Journey screen
        run: dart format app/lib/screens/journey_screen.dart

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-language-level-agent.yml

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/screens/journey_screen.dart .github/workflows/apply-language-level-agent.yml
          git commit -m "feat: connect HSK TOCFL agent to Journey experience"
          git push origin HEAD:feature/summer-palace-story-engine-pilot
