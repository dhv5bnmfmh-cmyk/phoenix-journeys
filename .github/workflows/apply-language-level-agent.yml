name: Apply Phoenix Language Level Agent

on:
  push:
    branches:
      - feature/summer-palace-story-engine-pilot
    paths:
      - .github/workflows/apply-language-level-agent.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-language-level-agent.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/summer-palace-story-engine-pilot
          fetch-depth: 0

      - name: Integrate language level profile into Journey screen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/lib/screens/journey_screen.dart')
          text = path.read_text()

          old_imports = """import '../data/daily_journey_catalog.dart';
          import '../data/journey_data.dart';
          import '../data/journey_level_catalog.dart';
          import '../models/journey_background.dart';
          import '../services/narration_controller.dart';
          """
          new_imports = """import '../agents/phoenix_language_level_agent.dart';
          import '../data/adaptive_journey_level_runtime.dart';
          import '../data/daily_journey_catalog.dart';
          import '../data/journey_data.dart';
          import '../data/journey_level_catalog.dart';
          import '../models/journey_background.dart';
          import '../models/language_proficiency.dart';
          import '../services/language_level_preference_store.dart';
          import '../services/narration_controller.dart';
          """
          assert old_imports in text
          text = text.replace(old_imports, new_imports, 1)

          old_fields = """  bool _discoveryAutoStarted = false;
            bool _difficultyPromptScheduled = false;
          """
          new_fields = """  bool _discoveryAutoStarted = false;
            bool _difficultyPromptScheduled = false;
            static const PhoenixLanguageLevelAgent _languageLevelAgent =
                PhoenixLanguageLevelAgent();
            static const LanguageLevelPreferenceStore _languageLevelStore =
                LanguageLevelPreferenceStore();
            ChineseProficiencyProfile? _languageProfile;
            bool _languageProfileLoaded = false;
          """
          assert old_fields in text
          text = text.replace(old_fields, new_fields, 1)

          old_init = """    _initialized = true;
              unawaited(_narration.setSpeechRate(_appState.journeyDifficulty.speechRate));
              _scheduleDifficultyWelcome();
          """
          new_init = """    _initialized = true;
              unawaited(_loadLanguageProfile());
          """
          assert old_init in text
          text = text.replace(old_init, new_init, 1)

          old_getters = """  JourneyLevelContent get _levelContent =>
                resolveJourneyLevel(_experience, _appState.journeyDifficulty);

            List<JourneyDifficulty> get _supportedDifficulties =>
                supportedJourneyDifficulties(_experience);
          """
          new_getters = """  JourneyLevelContent get _levelContent {
              final profile = _languageProfile;
              if (profile == null) {
                return resolveJourneyLevel(
                  _experience,
                  _appState.journeyDifficulty,
                );
              }
              return resolveAdaptiveJourneyLevel(
                _experience,
                profile: profile,
                knownWords: _appState.savedWords,
              );
            }

            ReadingGenerationPlan? get _generationPlan {
              final profile = _languageProfile;
              return profile == null ? null : _languageLevelAgent.planFor(profile);
            }

            List<JourneyDifficulty> get _supportedDifficulties =>
                supportedJourneyDifficulties(_experience);

            Future<void> _loadLanguageProfile() async {
              final profile = await _languageLevelStore.load();
              if (!mounted) return;
              final rate = profile == null
                  ? _appState.journeyDifficulty.speechRate
                  : _languageLevelAgent.planFor(profile).speechRate;
              await _narration.setSpeechRate(rate);
              if (!mounted) return;
              setState(() {
                _languageProfile = profile;
                _languageProfileLoaded = true;
              });
              _scheduleDifficultyWelcome();
            }

            Future<void> _selectLanguageProfile(
              ChineseProficiencyProfile profile,
            ) async {
              await _narration.stop();
              await _languageLevelStore.save(profile);
              await _narration.setSpeechRate(
                _languageLevelAgent.planFor(profile).speechRate,
              );
              if (!mounted) return;
              setState(() {
                _languageProfile = profile;
                _languageProfileLoaded = true;
                _discoveryAutoStarted = false;
              });
              if (step == 2) _scheduleDiscoveryAutoStart();
            }

            Future<void> _showLanguageProfilePicker({bool showIntro = false}) async {
              if (!mounted) return;
              final track = await showModalBottomSheet<ChineseExamTrack>(
                context: context,
                useSafeArea: true,
                showDragHandle: true,
                builder: (sheetContext) => Padding(
                  padding: const EdgeInsets.fromLTRB(16, 0, 16, 20),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(
                        _appState.displayText(
                          showIntro ? '先选择你的中文考试路线' : '选择中文考试路线',
                        ),
                        style: const TextStyle(
                          fontSize: 18,
                          fontWeight: FontWeight.w900,
                        ),
                      ),
                      const SizedBox(height: 4),
                      Text(
                        _appState.displayText(
                          'Phoenix 会据此调整短文长度、句子复杂度和重点生词数量。',
                        ),
                        style: const TextStyle(fontSize: 12, height: 1.35),
                      ),
                      const SizedBox(height: 10),
                      for (final item in ChineseExamTrack.values)
                        ListTile(
                          contentPadding: EdgeInsets.zero,
                          leading: CircleAvatar(
                            backgroundColor:
                                PhoenixTheme.red.withValues(alpha: .12),
                            child: Text(
                              item == ChineseExamTrack.hsk ? '汉' : '华',
                              style: const TextStyle(
                                color: PhoenixTheme.red,
                                fontWeight: FontWeight.w900,
                              ),
                            ),
                          ),
                          title: Text(
                            item.label,
                            style: const TextStyle(fontWeight: FontWeight.w900),
                          ),
                          subtitle: Text(
                            _appState.displayText(
                              item == ChineseExamTrack.hsk
                                  ? 'HSK 1 至 HSK 7–9'
                                  : '准备级至 TOCFL Level 6',
                            ),
                          ),
                          trailing: const Icon(Icons.chevron_right_rounded),
                          onTap: () => Navigator.of(sheetContext).pop(item),
                        ),
                    ],
                  ),
                ),
              );
              if (!mounted || track == null) return;

              final selected = await showModalBottomSheet<ChineseProficiencyProfile>(
                context: context,
                useSafeArea: true,
                showDragHandle: true,
                isScrollControlled: true,
                builder: (sheetContext) => FractionallySizedBox(
                  heightFactor: .78,
                  child: ListView(
                    padding: const EdgeInsets.fromLTRB(16, 0, 16, 20),
                    children: [
                      Text(
                        _appState.displayText('选择 ${track.label} 等级'),
                        style: const TextStyle(
                          fontSize: 18,
                          fontWeight: FontWeight.w900,
                        ),
                      ),
                      const SizedBox(height: 4),
                      Text(
                        _appState.displayText('两套考试各自独立映射，不把 HSK 和 TOCFL 强行画等号。'),
                        style: const TextStyle(fontSize: 12, height: 1.35),
                      ),
                      const SizedBox(height: 8),
                      for (final profile in _languageLevelAgent.profilesFor(track))
                        ListTile(
                          contentPadding: EdgeInsets.zero,
                          title: Text(
                            profile.displayLabel,
                            style: const TextStyle(fontWeight: FontWeight.w900),
                          ),
                          subtitle: Text(
                            _appState.displayText(
                              '${profile.band.label} · '
                              '${_languageLevelAgent.planFor(profile).targetVocabularyCount} 个重点生词',
                            ),
                          ),
                          trailing: _languageProfile?.storageValue ==
                                  profile.storageValue
                              ? const Icon(
                                  Icons.check_rounded,
                                  color: PhoenixTheme.red,
                                )
                              : const Icon(Icons.chevron_right_rounded),
                          onTap: () => Navigator.of(sheetContext).pop(profile),
                        ),
                    ],
                  ),
                ),
              );
              if (selected != null) await _selectLanguageProfile(selected);
            }
          """
          assert old_getters in text
          text = text.replace(old_getters, new_getters, 1)

          schedule_start = text.index('  void _scheduleDifficultyWelcome() {')
          schedule_end = text.index('  Future<void> _showDifficultyWelcome() async {', schedule_start)
          new_schedule = """  void _scheduleDifficultyWelcome() {
              if (_difficultyPromptScheduled ||
                  !_languageProfileLoaded ||
                  _languageProfile != null ||
                  _experience.id != 'beijing-summer-palace') {
                return;
              }
              _difficultyPromptScheduled = true;
              WidgetsBinding.instance.addPostFrameCallback((_) {
                if (mounted) unawaited(_showDifficultyWelcome());
              });
            }

          """
          text = text[:schedule_start] + new_schedule + text[schedule_end:]

          welcome_start = text.index('  Future<void> _showDifficultyWelcome() async {')
          welcome_end = text.index('  Future<void> _goToStep', welcome_start)
          new_welcome = """  Future<void> _showDifficultyWelcome() async {
              await _showLanguageProfilePicker(showIntro: true);
            }

          """
          text = text[:welcome_start] + new_welcome + text[welcome_end:]

          old_level = """      'currentLevel': _appState.journeyDifficulty.label,
          """
          new_level = """      'currentLevel':
                  _languageProfile?.displayLabel ?? _appState.journeyDifficulty.label,
              'readingBand': _languageProfile?.band.label,
              'targetVocabularyCount': _generationPlan?.targetVocabularyCount,
              'targetCharacterRange': _generationPlan == null
                  ? null
                  : '${_generationPlan!.minTotalCharacters}-'
                      '${_generationPlan!.maxTotalCharacters}',
          """
          assert old_level in text
          text = text.replace(old_level, new_level, 1)

          old_builder = """              builder: (_, state, __) {
                        if (_supportedDifficulties.length < 2) {
          """
          new_builder = """              builder: (_, state, __) {
                        if (_experience.id == 'beijing-summer-palace' &&
                            _languageProfile != null) {
                          return TextButton(
                            key: const ValueKey('journey-language-level-selector'),
                            onPressed: () =>
                                unawaited(_showLanguageProfilePicker()),
                            style: TextButton.styleFrom(
                              visualDensity: VisualDensity.compact,
                              padding: const EdgeInsets.symmetric(horizontal: 5),
                            ),
                            child: Container(
                              padding: const EdgeInsets.symmetric(
                                horizontal: 8,
                                vertical: 4,
                              ),
                              decoration: BoxDecoration(
                                color: Colors.black.withValues(alpha: .22),
                                borderRadius: BorderRadius.circular(99),
                                border: Border.all(
                                  color: Colors.white.withValues(alpha: .2),
                                ),
                              ),
                              child: Text(
                                state.displayText(
                                  '${_languageProfile!.displayLabel} ▾',
                                ),
                                style: const TextStyle(
                                  color: Colors.white,
                                  fontSize: 9.5,
                                  fontWeight: FontWeight.w900,
                                ),
                              ),
                            ),
                          );
                        }
                        if (_supportedDifficulties.length < 2) {
          """
          assert old_builder in text
          text = text.replace(old_builder, new_builder, 1)

          path.write_text(text)
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/apply-language-level-agent.yml

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/screens/journey_screen.dart .github/workflows/apply-language-level-agent.yml
          git commit -m "feat: connect HSK TOCFL agent to Journey experience"
          git push origin HEAD:feature/summer-palace-story-engine-pilot
