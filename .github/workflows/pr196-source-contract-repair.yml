name: PR196 Source Contract Repair

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 196
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Align source-contract tests with split runtimes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, *, count=None):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if count is not None and actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences of {old!r}, found {actual}')
              if actual == 0:
                  raise SystemExit(f'{path}: missing expected source contract {old!r}')
              p.write_text(text.replace(old, new))

          for path in [
              'worker/adaptive_challenge_pedagogy_rule.test.mjs',
              'worker/four_option_challenge_rule.test.mjs',
              'worker/phoenix_six_stage_journey_standard.test.mjs',
              'worker/pr118_product_rules.test.mjs',
              'worker/story_content_mapping.test.mjs',
          ]:
              replace(
                  path,
                  'app/lib/widgets/journey_challenge_panel.dart',
                  'app/lib/widgets/journey_challenge_panel_legacy.dart',
                  count=1,
              )

          p = Path('worker/four_option_challenge_rule.test.mjs')
          text = p.read_text()
          text = text.replace("    'beijing-forbidden-city',\n", '')
          text = text.replace("    '午门和中轴线',\n", '')
          p.write_text(text)

          for path in [
              'worker/journey_expansion_batch_five_rule.test.mjs',
              'worker/journey_expansion_batch_four_rule.test.mjs',
              'worker/journey_expansion_batch_three_rule.test.mjs',
              'worker/journey_expansion_batch_two_rule.test.mjs',
              'worker/journey_expansion_rule.test.mjs',
              'worker/summer_palace_destination_rule.test.mjs',
          ]:
              replace(
                  path,
                  'world_geo_catalog.dart',
                  'world_geo_catalog_base.dart',
                  count=1,
              )

          replace(
              'worker/story_culture_level_standard.test.mjs',
              "const forbiddenCity = read('app/lib/data/forbidden_city_journey_runtime.dart');",
              "const forbiddenCity = read('app/lib/data/forbidden_city_journey_runtime_base.dart');",
              count=1,
          )
          PY

      - name: Commit worker source-contract repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker
          git diff --cached --check
          git commit -m "test: align source contracts with split runtimes"
          git push origin HEAD:feature/forbidden-city-final-integration
