name: Chengdu Integration Repair

on:
  push:
    branches:
      - remediation/chengdu-kuanzhai-one-pass
    paths:
      - .github/workflows/chengdu-integration-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: remediation/chengdu-kuanzhai-one-pass
          fetch-depth: 0

      - name: Apply minimal integration repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Legacy publication test now recognizes the dedicated Chengdu Gold
          # package instead of forcing the old generic four-card contract.
          path = Path('app/test/daily_journey_engine_test.dart')
          text = path.read_text()
          old_import = "import 'package:phoenix_journeys/data/daily_journey_catalog.dart';\n"
          new_import = old_import + "import 'package:phoenix_journeys/data/chengdu_kuanzhai_one_pass.dart';\n"
          if "chengdu_kuanzhai_one_pass.dart" not in text:
              if old_import not in text:
                  raise SystemExit('daily journey import marker missing')
              text = text.replace(old_import, new_import, 1)

          old = """      expect(\n        journey.discoveries.length,\n        journey.id == 'beijing-summer-palace' ? 2 : 4,\n        reason: journey.id,\n      );\n"""
          new = """      if (journey.id == chengduKuanzhaiJourneyId) {\n        expect(\n          journey.content.storyParagraphs,\n          chengduKuanzhaiOnePassLevels[4].storyParagraphs,\n          reason: 'Chengdu catalog metadata must bind canonical Gold Lv5 Story',\n        );\n        expect(\n          journey.discoveries.length,\n          chengduKuanzhaiOnePassDiscoveries.length,\n          reason: journey.id,\n        );\n      } else {\n        expect(\n          journey.discoveries.length,\n          journey.id == 'beijing-summer-palace' ? 2 : 4,\n          reason: journey.id,\n        );\n      }\n"""
          if old not in text and new not in text:
              raise SystemExit('daily journey discovery assertion marker missing')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # 2) Seven-day catalog test preserves the generic contract, but binds
          # Chengdu specifically to the canonical two-paragraph Lv5 snapshot and
          # ten level-bound Discovery entries.
          path = Path('app/test/seven_day_journey_catalog_test.dart')
          text = path.read_text()
          old_import = "import 'package:phoenix_journeys/data/daily_journey_catalog.dart';\n"
          new_import = old_import + "import 'package:phoenix_journeys/data/chengdu_kuanzhai_one_pass.dart';\n"
          if "chengdu_kuanzhai_one_pass.dart" not in text:
              if old_import not in text:
                  raise SystemExit('seven-day import marker missing')
              text = text.replace(old_import, new_import, 1)

          old = """      if (journey.id == 'beijing-summer-palace') {\n        expect(journey.content.storyParagraphs, hasLength(2), reason: journey.id);\n        for (final paragraph in journey.content.storyParagraphs) {\n          expect(\n            paragraph.length,\n            inInclusiveRange(260, 380),\n            reason: journey.id,\n          );\n        }\n      } else {\n        expect(journey.content.storyParagraphs.length, 4, reason: journey.id);\n      }\n"""
          new = """      if (journey.id == chengduKuanzhaiJourneyId) {\n        expect(\n          journey.content.storyParagraphs,\n          chengduKuanzhaiOnePassLevels[4].storyParagraphs,\n          reason: journey.id,\n        );\n      } else if (journey.id == 'beijing-summer-palace') {\n        expect(journey.content.storyParagraphs, hasLength(2), reason: journey.id);\n        for (final paragraph in journey.content.storyParagraphs) {\n          expect(\n            paragraph.length,\n            inInclusiveRange(260, 380),\n            reason: journey.id,\n          );\n        }\n      } else {\n        expect(journey.content.storyParagraphs.length, 4, reason: journey.id);\n      }\n"""
          if old not in text and new not in text:
              raise SystemExit('seven-day story assertion marker missing')
          text = text.replace(old, new, 1)

          old = """      if (journey.id == 'beijing-summer-palace') {\n        expect(journey.discoveries, hasLength(2), reason: journey.id);\n      } else {\n        expect(\n          journey.discoveries.length,\n          greaterThanOrEqualTo(4),\n          reason: journey.id,\n        );\n      }\n"""
          new = """      if (journey.id == chengduKuanzhaiJourneyId) {\n        expect(\n          journey.discoveries,\n          hasLength(chengduKuanzhaiOnePassDiscoveries.length),\n          reason: journey.id,\n        );\n      } else if (journey.id == 'beijing-summer-palace') {\n        expect(journey.discoveries, hasLength(2), reason: journey.id);\n      } else {\n        expect(\n          journey.discoveries.length,\n          greaterThanOrEqualTo(4),\n          reason: journey.id,\n        );\n      }\n"""
          if old not in text and new not in text:
              raise SystemExit('seven-day discovery assertion marker missing')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # 3) Supply offline, reviewed contexts for the two Chengdu Words that
          # are intentionally introduced outside the static Lv5 Story snapshot.
          path = Path('app/lib/services/phoenix_vocabulary_service.dart')
          text = path.read_text()
          if "'茶馆': PhoenixVocabularyExample(" not in text:
              map_start = text.index('  static const Map<String, PhoenixVocabularyExample> _bundledExamples = {')
              map_end = text.index('\n  };', map_start)
              addition = r'''
    '茶馆': PhoenixVocabularyExample(
      chinese: '窄巷子的茶馆把院落继续变成喝茶、交谈和停留的日常空间。',
      pinyin:
          'Zhǎi Xiàngzi de cháguǎn bǎ yuànluò jìxù biàn chéng hēchá, jiāotán hé tíngliú de rìcháng kōngjiān.',
      native:
          'Quán trà trong Ngõ Hẹp tiếp tục biến sân nhà thành không gian thường nhật để uống trà, trò chuyện và dừng chân.',
      english:
          'A teahouse in Zhai Alley keeps the courtyard in everyday use for tea, conversation, and lingering.',
      usageNote: '“茶馆”在成都历史街区语境中指提供饮茶、停留和社交的经营空间。',
      isOfflineFallback: true,
      provider: 'phoenix-preloaded-pack',
      model: 'bundled',
      qualityReviewed: true,
      qualityScore: 100,
    ),
    '砖木建筑': PhoenixVocabularyExample(
      chinese: '宽窄巷子的砖木建筑与院落仍保留可辨认的历史空间特征。',
      pinyin:
          'Kuānzhǎi Xiàngzi de zhuānmù jiànzhù yǔ yuànluò réng bǎoliú kě biànrèn de lìshǐ kōngjiān tèzhēng.',
      native:
          'Các công trình gạch và gỗ cùng sân nhà ở Kuanzhai vẫn giữ những đặc trưng không gian lịch sử có thể nhận biết.',
      english:
          'The brick-and-timber buildings and courtyards of Kuanzhai Alley retain legible historic spatial features.',
      usageNote: '“砖木建筑”用于描述以砖和木为主要材料并保留历史空间特征的建筑。',
      isOfflineFallback: true,
      provider: 'phoenix-preloaded-pack',
      model: 'bundled',
      qualityReviewed: true,
      qualityScore: 100,
    ),'''
              text = text[:map_end] + addition + text[map_end:]
              path.write_text(text)

          PY

          rm .github/workflows/chengdu-integration-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/test/daily_journey_engine_test.dart \
                  app/test/seven_day_journey_catalog_test.dart \
                  app/lib/services/phoenix_vocabulary_service.dart \
                  .github/workflows/chengdu-integration-repair.yml
          git diff --cached --check
          git commit -m "fix: align Chengdu Gold integration contracts"
          git push origin HEAD:remediation/chengdu-kuanzhai-one-pass
