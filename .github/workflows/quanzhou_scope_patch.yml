name: Quanzhou exact scope patch

on:
  push:
    branches:
      - dev/current
    paths:
      - .github/workflows/quanzhou_scope_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/current
          fetch-depth: 0
      - name: Apply exact replacements
        run: python3 .github/scripts/quanzhou_scope_patch.py
      - name: Commit exact replacements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/data app/test/journey_semantic_anti_template_gate_test.dart docs/PHOENIX_GOLD_SEMANTIC_AUDIT.md
          git diff --cached --check
          git commit -m "Complete Quanzhou Gold registry wiring"
          git push origin HEAD:dev/current
