name: Phase 3B Candidate Tree Stage

on:
  push:
    branches:
      - agent/documentation-sprint-01-18-recovery
    paths:
      - .github/workflows/phase3b-materialize.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase3b-materialize.yml

permissions:
  contents: write
  actions: read

env:
  PHASE3B_PREPARATION_BASE_SHA: 93cc4a6d87c961714c2c57e468bc40fa3602dda5

jobs:
  stage-candidate-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current safe head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Materialize approved Phase 3B preparation result
        shell: bash
        run: |
          set -euo pipefail
          cp roadmap/ROADMAP.md /tmp/phase3b-base-ROADMAP.md
          cp TODO.md /tmp/phase3b-base-TODO.md
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import {
            mkdirSync,
            readFileSync,
            readdirSync,
            writeFileSync,
          } from 'node:fs';
          import { dirname, resolve } from 'node:path';
          import { gunzipSync } from 'node:zlib';

          const root = process.cwd();
          const parts = readdirSync(resolve(root, 'worker'))
            .filter((name) => name.startsWith('phase3b-prep-bundle.part'))
            .sort();
          if (parts.length !== 9) {
            throw new Error(`Expected 9 approved bundle parts, got ${parts.length}`);
          }

          const payload = JSON.parse(
            gunzipSync(Buffer.concat(parts.map((name) => readFileSync(resolve(root, 'worker', name)))))
              .toString('utf8'),
          );
          for (const [path, b64] of Object.entries(payload)) {
            const full = resolve(root, path);
            if (!full.startsWith(`${root}/`) || path === '.git' || path.startsWith('.git/')) {
              throw new Error(`Unsafe payload path: ${path}`);
            }
            mkdirSync(dirname(full), { recursive: true });
            writeFileSync(full, Buffer.from(b64, 'base64'));
          }

          const prep = resolve(root, 'worker/scripts/prepare_ordinary_learning_phase3b_artifacts.mjs');
          let source = readFileSync(prep, 'utf8');
          const oldBlock = `  for (const j of selected) for (const s of j.stages) {\n    if (!stageByOldPath.has(s.currentOldRuntimePath)) stageByOldPath.set(s.currentOldRuntimePath,[]);\n    stageByOldPath.get(s.currentOldRuntimePath).push(s.newAssetId);\n  }`;
          const newBlock = [
            '  for (const j of selected) for (const [stage,path] of Object.entries(j.currentRuntimeMapping)) {',
            '    if (!stageByOldPath.has(path)) stageByOldPath.set(path,[]);',
            '    const asset=manifest.assets.find(a=>a.journeyId===j.journeyId&&a.learningStage===stage);',
            "    if (!asset) throw new Error(`Missing stage asset ${j.journeyId}/${stage}`);",
            '    stageByOldPath.get(path).push(asset.assetId);',
            '  }',
          ].join('\n');
          if (!source.includes(oldBlock)) {
            throw new Error('Expected preparation mapping source block not found');
          }
          writeFileSync(prep, source.replace(oldBlock, newBlock));

          const out = resolve(root, 'phase3b-prepared-output');
          mkdirSync(out, { recursive: true });
          execFileSync(process.execPath, [prep, out], { cwd: root, stdio: 'inherit' });
          NODE

      - name: Build pending-CI implementation candidate
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/phase3b-base-ROADMAP.md roadmap/ROADMAP.md
          cp /tmp/phase3b-base-TODO.md TODO.md
          rm -f \
            design/evidence/ORDINARY_LEARNING_V1_MANIFEST.verified.json \
            design/evidence/ORDINARY_LEARNING_V1_COMPLETION_REPORT.md \
            worker/ordinary_learning_phase3b_rule.test.mjs \
            .github/workflows/phase3b-materialize.yml
          rm -rf phase3b-prepared-output

          node --input-type=module <<'NODE'
          import { readFileSync, unlinkSync } from 'node:fs';
          import { gunzipSync } from 'node:zlib';

          const manifest = JSON.parse(readFileSync('design/evidence/ORDINARY_LEARNING_V1_MANIFEST.json', 'utf8'));
          const retirementPaths = [];
          for (const fragment of manifest.journeyFiles) {
            const rows = JSON.parse(gunzipSync(readFileSync(fragment)).toString('utf8'));
            for (const row of rows) {
              for (const retirement of row[7]) retirementPaths.push(retirement.path);
            }
          }
          if (retirementPaths.length !== 81 || new Set(retirementPaths).size !== 81) {
            throw new Error(`Expected 81 unique retirement paths, got ${retirementPaths.length}/${new Set(retirementPaths).size}`);
          }
          for (const path of retirementPaths) {
            try { unlinkSync(path); } catch (error) {
              if (error?.code !== 'ENOENT') throw error;
            }
          }
          NODE

      - name: Verify local candidate gates
        shell: bash
        run: |
          set -euo pipefail
          node --test worker/*.test.mjs | tee /tmp/phase3b-node-pending.log
          git diff --check
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { existsSync, readFileSync, readdirSync, statSync } from 'node:fs';
          import { extname, join } from 'node:path';

          const walk = (dir) => readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
            const path = join(dir, entry.name);
            return entry.isDirectory() ? walk(path) : [path];
          });
          const svg = walk('design/sources/ordinary-learning-v1/masters').filter((p) => extname(p) === '.svg');
          const webp = walk('app/assets/images/backgrounds/rights-safe-learning-v1').filter((p) => extname(p) === '.webp');
          if (svg.length !== 81 || webp.length !== 81) throw new Error(`Asset count mismatch SVG=${svg.length} WebP=${webp.length}`);
          if (new Set(svg.map((p) => createHash('sha256').update(readFileSync(p)).digest('hex'))).size !== 81) throw new Error('SVG duplicate detected');
          if (new Set(webp.map((p) => createHash('sha256').update(readFileSync(p)).digest('hex'))).size !== 81) throw new Error('WebP duplicate detected');
          for (const path of webp) {
            const out = execFileSync('file', [path], { encoding: 'utf8' });
            if (!out.includes('Web/P image')) throw new Error(`WebP decode signature failed: ${path}`);
          }
          if (!existsSync('app/lib/data/journey_background_generated.dart')) throw new Error('Runtime mapping missing');
          console.log(JSON.stringify({ svg: svg.length, webp: webp.length, totalWebpBytes: webp.reduce((n,p)=>n+statSync(p).size,0) }));
          NODE

      - name: Stage content-addressed candidate tree
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { existsSync, lstatSync, readFileSync, writeFileSync } from 'node:fs';

          const [owner, repo] = process.env.GH_REPOSITORY.split('/');
          const token = process.env.GH_TOKEN;
          const baseHead = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const baseTree = execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim();
          const status = execFileSync('git', ['status', '--porcelain=v1', '-z'], { encoding: 'buffer' })
            .toString('utf8').split('\0').filter(Boolean);
          const changes = [];
          for (let index = 0; index < status.length; index += 1) {
            const record = status[index];
            const code = record.slice(0, 2);
            const path = record.slice(3);
            if (code.includes('R') || code.includes('C')) throw new Error(`Unexpected rename/copy: ${record}`);
            changes.push({ path, deleted: !existsSync(path) });
          }
          const unique = [...new Map(changes.map((item) => [item.path, item])).values()].sort((a,b)=>a.path.localeCompare(b.path));
          if (unique.length < 250) throw new Error(`Candidate diff unexpectedly small: ${unique.length}`);

          async function api(path, init = {}, attempt = 0) {
            const response = await fetch(`https://api.github.com${path}`, {
              ...init,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json',
                ...(init.headers ?? {}),
              },
            });
            if (!response.ok) {
              const text = await response.text();
              if ((response.status === 429 || response.status >= 500) && attempt < 5) {
                await new Promise((resolve) => setTimeout(resolve, 1000 * (attempt + 1)));
                return api(path, init, attempt + 1);
              }
              throw new Error(`${init.method ?? 'GET'} ${path}: ${response.status} ${text}`);
            }
            return response.json();
          }

          const output = new Array(unique.length);
          let cursor = 0;
          async function worker() {
            while (true) {
              const index = cursor++;
              if (index >= unique.length) return;
              const item = unique[index];
              if (item.deleted) {
                output[index] = { path: item.path, mode: '100644', type: 'blob', sha: null, status: 'deleted' };
                continue;
              }
              const data = readFileSync(item.path);
              const localBlobSha = createHash('sha1').update(Buffer.concat([Buffer.from(`blob ${data.length}\0`), data])).digest('hex');
              const created = await api(`/repos/${owner}/${repo}/git/blobs`, {
                method: 'POST',
                body: JSON.stringify({ content: data.toString('base64'), encoding: 'base64' }),
              });
              if (created.sha !== localBlobSha) throw new Error(`Blob mismatch ${item.path}: ${localBlobSha} != ${created.sha}`);
              output[index] = {
                path: item.path,
                mode: (lstatSync(item.path).mode & 0o111) ? '100755' : '100644',
                type: 'blob',
                sha: created.sha,
                sha256: createHash('sha256').update(data).digest('hex'),
                size: data.length,
                status: 'written',
              };
            }
          }
          await Promise.all(Array.from({ length: 8 }, () => worker()));
          const tree = await api(`/repos/${owner}/${repo}/git/trees`, {
            method: 'POST',
            body: JSON.stringify({
              base_tree: baseTree,
              tree: output.map(({ path, mode, type, sha }) => ({ path, mode, type, sha })),
            }),
          });
          const aggregate = createHash('sha256');
          for (const entry of output) aggregate.update(`${entry.status}\0${entry.path}\0${entry.sha ?? ''}\0${entry.sha256 ?? ''}\n`);
          writeFileSync('/tmp/phase3b-implementation-tree.json', `${JSON.stringify({
            preparationBase: process.env.PHASE3B_PREPARATION_BASE_SHA,
            baseHead,
            baseTree,
            candidateTree: tree.sha,
            changedPaths: output.length,
            aggregateSha256: aggregate.digest('hex'),
            entries: output,
          }, null, 2)}\n`);
          console.log(`Candidate tree ${tree.sha} from ${output.length} changed paths`);
          NODE

      - name: Upload candidate tree evidence
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-phase3b-implementation-tree-${{ github.sha }}
          path: |
            /tmp/phase3b-implementation-tree.json
            /tmp/phase3b-node-pending.log
          retention-days: 1
          if-no-files-found: error
