name: PR208 Founder Device Navigation Product Fix

on:
  push:
    branches:
      - validation/pr208-pronunciation-product-fix-49a088
    paths:
      - '.github/workflows/pr208-founder-device-navigation-product-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  OLD_PRODUCT_SHA: 9c7d00a1ee80b2e50b40a3b6f4922a9d38b3753e
  PRODUCT_BRANCH: product/city-standard-v1-beijing-forbidden-city

jobs:
  fix-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact failed-device-acceptance product
        uses: actions/checkout@v6
        with:
          ref: ${{ env.OLD_PRODUCT_SHA }}
          fetch-depth: 0

      - name: Guard authoritative product branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$OLD_PRODUCT_SHA"
          git fetch origin "$PRODUCT_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$OLD_PRODUCT_SHA"
          test -z "$(git status --porcelain)"

      - name: Apply minimum bounded navigation fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/lib/screens/journey_screen.dart')
          text = path.read_text()
          old = """    await _stopJourneyNarration();
    if (!mounted || safeStep == step) return;

    setState(() => step = safeStep);
"""
          new = """    try {
      await _stopJourneyNarration().timeout(const Duration(milliseconds: 500));
    } on TimeoutException {
      // External speech cleanup must never block Journey step navigation.
    }
    if (!mounted || safeStep == step) return;

    setState(() => step = safeStep);
"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one transition anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Add checked-in Founder device transition regression
        shell: bash
        run: |
          set -euo pipefail
          cat > app/test/founder_device_story_continue_regression_test.dart <<'DART'
          import 'dart:async';

          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:provider/provider.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:phoenix_journeys/data/forbidden_city_story_runtime.dart';
          import 'package:phoenix_journeys/screens/journey_screen.dart';
          import 'package:phoenix_journeys/services/phoenix_level_controller.dart';
          import 'package:phoenix_journeys/state/app_state.dart';

          void main() {
            const journeyId = 'beijing-forbidden-city';
            const flutterTtsChannel = MethodChannel('flutter_tts');

            setUp(() {
              SharedPreferences.setMockInitialValues(<String, Object>{});
            });

            Future<AppState> pumpStory(
              WidgetTester tester, {
              required String storyId,
              required int level,
              required List<String> calls,
            }) async {
              final previousLevel = PhoenixLevelController.instance.level;
              addTearDown(
                () => PhoenixLevelController.instance.setLevel(previousLevel),
              );
              PhoenixLevelController.instance.setLevel(level);

              final pendingStop = Completer<dynamic>();
              var speakCalls = 0;
              var hangingStopIssued = false;
              TestDefaultBinaryMessengerBinding.instance.defaultBinaryMessenger
                  .setMockMethodCallHandler(flutterTtsChannel, (call) async {
                calls.add(call.method);
                if (call.method == 'getVoices') return <dynamic>[];
                if (call.method == 'speak') {
                  speakCalls += 1;
                  return 1;
                }
                if (call.method == 'stop' &&
                    speakCalls > 0 &&
                    !hangingStopIssued) {
                  hangingStopIssued = true;
                  calls.add('stop:HANG');
                  return pendingStop.future;
                }
                return 1;
              });
              addTearDown(() {
                TestDefaultBinaryMessengerBinding.instance.defaultBinaryMessenger
                    .setMockMethodCallHandler(flutterTtsChannel, null);
              });

              final state = AppState();
              addTearDown(state.dispose);
              await state.load();
              await state.activateJourney(journeyId, storyId: storyId);

              await tester.binding.setSurfaceSize(const Size(390, 844));
              addTearDown(() => tester.binding.setSurfaceSize(null));
              await tester.pumpWidget(
                ChangeNotifierProvider<AppState>.value(
                  value: state,
                  child: MaterialApp(
                    home: JourneyScreen(journeyId: journeyId, storyId: storyId),
                  ),
                ),
              );
              await tester.pump();
              await tester.pump(const Duration(milliseconds: 180));
              return state;
            }

            Future<void> startStoryNarration(WidgetTester tester) async {
              final narration = find.byKey(
                const ValueKey('narration-main-control'),
              );
              expect(narration, findsOneWidget);
              await tester.tap(narration);
              await tester.pump();
              await tester.pump(const Duration(milliseconds: 260));
              expect(
                find.byTooltip('暂停朗读'),
                findsOneWidget,
                reason: 'Story narration must be active before Continue.',
              );
            }

            Future<void> expectContinueRendersVocabulary(
              WidgetTester tester, {
              required String storyId,
              required int level,
              required String label,
            }) async {
              final calls = <String>[];
              final state = await pumpStory(
                tester,
                storyId: storyId,
                level: level,
                calls: calls,
              );
              await startStoryNarration(tester);

              final continueButton = find.widgetWithText(FilledButton, '继续');
              expect(continueButton, findsOneWidget);
              expect(
                tester.widget<FilledButton>(continueButton).onPressed,
                isNotNull,
              );
              expect(state.beijingJourneyStep, 0);

              await tester.tap(continueButton);
              await tester.pump();
              await tester.pump(const Duration(milliseconds: 900));

              expect(
                calls.contains('stop:HANG'),
                isTrue,
                reason: '$label must exercise a never-returning speech stop.',
              );
              expect(
                tester.takeException(),
                isNull,
                reason: '$label must not throw during transition.',
              );
              expect(
                state.beijingJourneyStep,
                1,
                reason: '$label must commit Story -> Vocabulary.',
              );
              expect(
                find.byKey(const ValueKey('next-word-button')),
                findsOneWidget,
                reason: '$label must render the next phase, not only mutate state.',
              );

              // Consume production Word Detail / narration fail-open timers.
              await tester.pump(const Duration(seconds: 9));
              await tester.pump(const Duration(milliseconds: 500));
              await tester.pump();
            }

            testWidgets(
              'Second Story Lv5 Continue renders Vocabulary when narration stop never returns',
              (tester) async {
                await expectContinueRendersVocabulary(
                  tester,
                  storyId: forbiddenCitySecondStoryId,
                  level: 5,
                  label: 'Second Story Lv5',
                );
              },
            );

            testWidgets(
              'Second Story Lv6 Continue renders Vocabulary when narration stop never returns',
              (tester) async {
                await expectContinueRendersVocabulary(
                  tester,
                  storyId: forbiddenCitySecondStoryId,
                  level: 6,
                  label: 'Second Story Lv6',
                );
              },
            );

            testWidgets(
              'Existing Story Lv5 Continue renders Vocabulary when narration stop never returns',
              (tester) async {
                await expectContinueRendersVocabulary(
                  tester,
                  storyId: forbiddenCityPrimaryStoryId,
                  level: 5,
                  label: 'Existing Story Lv5',
                );
              },
            );
          }
          DART

      - name: Protect product scope before validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$OLD_PRODUCT_SHA"
          mapfile -t changed < <(git status --porcelain | sed -E 's/^...//')
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx 'app/lib/screens/journey_screen.dart'
          printf '%s\n' "${changed[@]}" | grep -Fx 'app/test/founder_device_story_continue_regression_test.dart'
          git diff -- app/lib/screens/journey_screen.dart
          git diff --exit-code -- app/lib/widgets/word_detail_sheet.dart
          git diff --exit-code -- app/lib/data/forbidden_city_story_runtime.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Targeted Founder device regressions
        working-directory: app
        run: flutter test --reporter expanded test/founder_device_story_continue_regression_test.dart

      - name: Existing Story isolation control
        working-directory: app
        run: flutter test test/forbidden_city_story_selection_runtime_test.dart --plain-name "Story progress, completion, resume and Memory are isolated by Story ID"

      - name: Analyze fixed product
        working-directory: app
        run: flutter analyze

      - name: Commit and push new exact product SHA
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$PRODUCT_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$OLD_PRODUCT_SHA"
          git config user.name "Phoenix Release Governance"
          git config user.email "actions@github.com"
          git add app/lib/screens/journey_screen.dart app/test/founder_device_story_continue_regression_test.dart
          git commit -m "fix: bound narration cleanup before Journey navigation"
          NEW_SHA="$(git rev-parse HEAD)"
          test "$NEW_SHA" != "$OLD_PRODUCT_SHA"
          git push origin "HEAD:refs/heads/$PRODUCT_BRANCH"
          echo "NEW_PRODUCT_SHA=$NEW_SHA"
          test -z "$(git status --porcelain)"
