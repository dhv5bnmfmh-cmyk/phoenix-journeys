name: Story 2 background integration
on:
  push:
    branches: [codex/beijing-forbidden-city-story-2]
permissions:
  contents: write
jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[story2-art-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/beijing-forbidden-city-story-2
          fetch-depth: 0
      - name: Split reviewed Story 2 contact art and wire catalog
        shell: bash
        run: |
          set -euo pipefail
          payload='app/assets/images/backgrounds/generated/beijing/forbidden-city/wuying-hall-light-limit/contact.webp.b64'
          src='app/assets/images/backgrounds/generated/beijing/forbidden-city/wuying-hall-light-limit/contact.webp'
          out='app/assets/images/backgrounds/generated/beijing/forbidden-city/wuying-hall-light-limit'
          test -f "$payload"
          base64 -d "$payload" > "$src"
          names=(
            01-palace-axis-soft-morning
            02-roofline-haze
            03-red-wall-eaves
            04-doorway-observer
            05-golden-courtyard
            06-courtyard-profile
            07-old-paper-shadow
            08-old-paper-light
            09-palace-wall-sunset
            10-quiet-palace-edge
          )
          for i in $(seq 0 9); do
            col=$((i % 5)); row=$((i / 5)); x=$((col * 90)); y=$((row * 160))
            ffmpeg -hide_banner -loglevel error -y -i "$src" \
              -vf "crop=90:160:${x}:${y},scale=360:640:flags=lanczos" \
              -frames:v 1 -c:v libwebp -quality 68 "$out/${names[$i]}.webp"
          done
          rm "$src" "$payload"
          python3 - <<'PY'
          from pathlib import Path
          catalog = Path('app/lib/data/journey_background_catalog.dart')
          s = catalog.read_text()
          if "journey_background_story_two.dart" not in s:
              s = s.replace("import 'journey_background_generated.dart';", "import 'journey_background_generated.dart';\nimport 'journey_background_story_two.dart';")
          if '...forbiddenCityStoryTwoBackgrounds,' not in s:
              s = s.replace('final journeyBackgroundCatalog = <JourneyBackgroundAsset>[\n', 'final journeyBackgroundCatalog = <JourneyBackgroundAsset>[\n  ...forbiddenCityStoryTwoBackgrounds,\n')
          catalog.write_text(s)

          pubspec = Path('app/pubspec.yaml')
          s = pubspec.read_text()
          line = '    - assets/images/backgrounds/generated/beijing/forbidden-city/wuying-hall-light-limit/\n'
          if line not in s:
              anchor = '    - assets/images/backgrounds/generated/beijing/forbidden-city/\n'
              s = s.replace(anchor, anchor + line)
          pubspec.write_text(s)

          test = Path('app/test/forbidden_city_story_two_background_test.dart')
          test.write_text("""import 'package:flutter_test/flutter_test.dart';
import 'package:phoenix_journeys/data/journey_background_catalog.dart';
import 'package:phoenix_journeys/data/journey_background_story_two.dart';
import 'package:phoenix_journeys/data/journey_story_identity.dart';
import 'package:phoenix_journeys/models/journey_background.dart';
import 'package:phoenix_journeys/services/journey_background_policy.dart';
import 'package:phoenix_journeys/services/journey_location_binding.dart';

void main() {
  test('Story 2 owns ten reviewed backgrounds in its story-scoped directory', () {
    final binding = requireJourneyLocation(forbiddenCityStoryTwoJourneyId);
    expect(forbiddenCityStoryTwoBackgrounds.length, 10);
    expect(binding.generatedBackgroundDirectory,
        'assets/images/backgrounds/generated/beijing/forbidden-city/wuying-hall-light-limit/');
    expect(forbiddenCityStoryTwoBackgrounds.map((asset) => asset.id).toSet().length, 10);
    for (final asset in forbiddenCityStoryTwoBackgrounds) {
      expect(asset.journeyId, forbiddenCityStoryTwoJourneyId);
      expect(asset.assetPath.startsWith(binding.generatedBackgroundDirectory), isTrue);
      expect(asset.approved, isTrue);
    }
  });

  test('shared background policy resolves Story 2 art for every Journey page', () {
    final binding = requireJourneyLocation(forbiddenCityStoryTwoJourneyId);
    const policy = JourneyBackgroundPolicy();
    for (final page in JourneyBackgroundPage.values) {
      final selected = policy.select(
        journeyId: forbiddenCityStoryTwoJourneyId,
        locationPath: binding.locationPath,
        page: page,
        localDate: DateTime.utc(2026, 9, 16),
        catalog: journeyBackgroundCatalog,
      );
      expect(selected, isNotNull, reason: page.name);
      expect(selected!.journeyId, forbiddenCityStoryTwoJourneyId);
    }
  });
}
""")
          PY
          rm .github/workflows/story2-background-integrate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/assets/images/backgrounds/generated/beijing/forbidden-city/wuying-hall-light-limit app/lib/data/journey_background_catalog.dart app/lib/data/journey_background_story_two.dart app/pubspec.yaml app/test/forbidden_city_story_two_background_test.dart .github/workflows/story2-background-integrate.yml
          git commit -m '[story2-art-integrated] Integrate reviewed Story 2 backgrounds'
          git push origin HEAD:codex/beijing-forbidden-city-story-2
