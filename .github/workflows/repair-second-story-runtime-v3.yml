name: Repair Second Story Runtime V3

on:
  push:
    branches:
      - product/city-standard-v1-beijing-forbidden-city
    paths:
      - '.github/workflows/repair-second-story-runtime-v3.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: product/city-standard-v1-beijing-forbidden-city

      - name: Verify failed SHA ancestry and temporary scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c6504508f34dffad0158d5c69ce0f33508061ace HEAD
          git diff --name-only c6504508f34dffad0158d5c69ce0f33508061ace..HEAD | sort >/tmp/temp-scope
          cat >/tmp/expected <<'EOF'
          .github/workflows/repair-second-story-runtime-v3.yml
          .github/workflows/repair-second-story-runtime.yml
          EOF
          diff -u /tmp/expected /tmp/temp-scope

      - name: Apply exact repair script with harness correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/repair-second-story-runtime.yml').read_text()
          begin = workflow.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          finish = workflow.index("\n          PY\n", begin)
          body = workflow[begin:finish]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in body.splitlines()
          )

          test_start = script.index("test_path = Path('app/test/forbidden_city_story_selection_runtime_test.dart')")
          test_end_marker = 'test_path.write_text(test)'
          test_end = script.index(test_end_marker, test_start) + len(test_end_marker)
          test_patch = r'''test_path = Path('app/test/forbidden_city_story_selection_runtime_test.dart')
          test = test_path.read_text()
          assertion_start = test.index("    expect(\n      content.storyParagraphs,")
          assertion_end = test.index("    );", assertion_start) + len("    );")
          replacement_assertion = r'''    expect(forbiddenCityPipelineFixture.storyContent.lines, hasLength(7));
              expect(content.storyParagraphs, hasLength(2));
              expect(
                content.storyParagraphs.length,
                isNot(forbiddenCityPipelineFixture.storyContent.lines.length),
              );
              final visibleStory = content.storyParagraphs.join();
              expect(visibleStory.length, inInclusiveRange(280, 400));
              final sentenceLengths = content.storyParagraphs
                  .expand((paragraph) => paragraph.split(RegExp(r'[。！？]')))
                  .map((sentence) => sentence.trim().length)
                  .where((length) => length > 0);
              expect(sentenceLengths.every((length) => length <= 30), isTrue);
              for (final marker in <String>[
                '林乔',
                '许澄',
                '中轴',
                '景运门',
                '乾清门前广场西侧',
                '乾清门前广场东侧',
                '核对',
                '交接',
                '先留空',
                '下一页一起看完',
              ]) {
                expect(visibleStory, contains(marker));
              }'''
          test = test[:assertion_start] + replacement_assertion + test[assertion_end:]
          test_path.write_text(test)'''
          script = script[:test_start] + test_patch + script[test_end:]

          smoke_start = script.index("smoke = r'''", test_start)
          smoke_patch = r'''smoke = r'''import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:provider/provider.dart';
          import 'package:shared_preferences/shared_preferences.dart';

          import 'package:phoenix_journeys/data/forbidden_city_journey_runtime.dart';
          import 'package:phoenix_journeys/data/forbidden_city_story_runtime.dart';
          import 'package:phoenix_journeys/models/journey_challenge.dart';
          import 'package:phoenix_journeys/screens/journey_screen.dart';
          import 'package:phoenix_journeys/services/journey_challenge_engine.dart';
          import 'package:phoenix_journeys/services/language_level_preference_store.dart';
          import 'package:phoenix_journeys/services/narration_controller.dart';
          import 'package:phoenix_journeys/state/app_state.dart';

          Future<void> pumpNoException(WidgetTester tester) async {
            await tester.pump();
            await tester.pump(const Duration(milliseconds: 250));
            expect(tester.takeException(), isNull);
          }

          Future<void> tapText(WidgetTester tester, String text) async {
            final finder = find.text(text);
            expect(finder, findsWidgets);
            await tester.ensureVisible(finder.last);
            await tester.tap(finder.last);
            await pumpNoException(tester);
          }

          List<String> correctRebuildOrder(StoryChallengeQuestion question) {
            final available = List<String>.of(question.characterTiles);
            final ordered = <String>[];
            var cursor = 0;
            while (available.isNotEmpty && cursor < question.answer.length) {
              final index = available.indexWhere(
                (tile) => question.answer.startsWith(tile, cursor),
              );
              expect(index, isNonNegative);
              final tile = available.removeAt(index);
              ordered.add(tile);
              cursor += tile.length;
            }
            expect(cursor, question.answer.length);
            return ordered;
          }

          Future<void> completeChallengeQuestion(
            WidgetTester tester,
            StoryChallengeQuestion question,
            bool last,
          ) async {
            switch (question.mode) {
              case StoryChallengeMode.sentenceRebuild:
                for (final tile in correctRebuildOrder(question)) {
                  final chip = find.widgetWithText(ActionChip, tile);
                  expect(chip, findsWidgets);
                  await tester.ensureVisible(chip.first);
                  await tester.tap(chip.first);
                  await tester.pump();
                }
              case StoryChallengeMode.grammarRepair:
                final errorIndex = question.errorSegmentIndex!;
                await tapText(
                  tester,
                  '${String.fromCharCode(65 + errorIndex)}  ${question.errorSegments[errorIndex]}',
                );
                await tapText(tester, '确认位置');
                await tapText(tester, '继续修改');
                final answerIndex = question.options.indexOf(question.answer);
                expect(answerIndex, isNonNegative);
                await tapText(
                  tester,
                  '${String.fromCharCode(65 + answerIndex)}  ${question.options[answerIndex]}',
                );
              case StoryChallengeMode.storyCompletion:
                for (final blank in question.completionBlanks) {
                  final answerIndex = blank.options.indexOf(blank.answer);
                  expect(answerIndex, isNonNegative);
                  await tapText(
                    tester,
                    '${String.fromCharCode(65 + answerIndex)}  ${blank.options[answerIndex]}',
                  );
                }
            }
            await tapText(tester, '提交');
            if (!last) await tapText(tester, '下一题');
          }

          void main() {
            TestWidgetsFlutterBinding.ensureInitialized();

            testWidgets(
              'Second Story restored narration traverses Story Vocabulary Discovery Challenge Memory without blank screen',
              (tester) async {
                SharedPreferences.setMockInitialValues(<String, Object>{
                  'phoenix.level': 5,
                });
                await const LanguageLevelPreferenceStore().initializePhoenixLevel();
                final state = AppState(
                  clock: () => DateTime(2026, 9, 6, 20),
                  preferencesLoader: SharedPreferences.getInstance,
                );
                await state.load();
                await state.activateJourney(
                  forbiddenCityJourneyId,
                  storyId: forbiddenCitySecondStoryId,
                );

                final content = forbiddenCitySecondStoryLevelContent();
                final narrationItems = content.storyParagraphs
                    .asMap()
                    .entries
                    .map(
                      (entry) => NarrationItem(
                        id: 'story-${entry.key}',
                        text: entry.value,
                        label: '故事第 ${entry.key + 1} 段',
                      ),
                    )
                    .toList(growable: false);
                await state.saveJourneyNarrationPosition(
                  contentId: 'story',
                  contentSignature: narrationContentSignature(narrationItems),
                  offset: 8,
                );

                await tester.pumpWidget(
                  ChangeNotifierProvider<AppState>.value(
                    value: state,
                    child: const MaterialApp(
                      home: JourneyScreen(
                        journeyId: forbiddenCityJourneyId,
                        storyId: forbiddenCitySecondStoryId,
                      ),
                    ),
                  ),
                );
                await pumpNoException(tester);
                expect(find.text('交接前的标记'), findsOneWidget);
                expect(find.textContaining('2 段'), findsOneWidget);
                expect(state.activeStoryId, forbiddenCitySecondStoryId);

                await tapText(tester, '继续');
                await tester.binding.handlePopRoute();
                await pumpNoException(tester);
                expect(find.text('单词'), findsWidgets);
                expect(state.activeStoryId, forbiddenCitySecondStoryId);

                await tapText(tester, '继续');
                expect(find.text('发现'), findsWidgets);
                expect(state.activeStoryId, forbiddenCitySecondStoryId);

                await tapText(tester, '继续');
                expect(find.text('挑战'), findsWidgets);
                expect(state.activeStoryId, forbiddenCitySecondStoryId);

                final challenge = const JourneyChallengeEngine().build(
                  journeyId: forbiddenCitySecondStoryId,
                  sessionLevel: 5,
                  storyParagraphs: forbiddenCitySecondStoryChallengeSourceMaterial,
                );
                for (var index = 0; index < challenge.questions.length; index++) {
                  await completeChallengeQuestion(
                    tester,
                    challenge.questions[index],
                    index == challenge.questions.length - 1,
                  );
                }
                await pumpNoException(tester);
                await tapText(tester, '继续留下回忆');
                expect(find.text('回忆 · 完成'), findsWidgets);
                expect(state.activeStoryId, forbiddenCitySecondStoryId);
                expect(tester.takeException(), isNull);
              },
            );
          }
          '''
          Path('app/test/forbidden_city_second_story_navigation_smoke_test.dart').write_text(
              '\n'.join(line[10:] if line.startswith('          ') else line for line in smoke.splitlines()) + '\n')'''
          script = script[:smoke_start] + smoke_patch
          Path('/tmp/repair.py').write_text(script + '\n')
          PY

          python3 /tmp/repair.py
          dart format app/lib/data/forbidden_city_story_runtime.dart app/lib/screens/journey_screen.dart app/test/forbidden_city_story_selection_runtime_test.dart app/test/forbidden_city_second_story_navigation_smoke_test.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Targeted tests
        working-directory: app
        run: >-
          flutter test
          test/forbidden_city_story_selection_runtime_test.dart
          test/forbidden_city_second_story_navigation_smoke_test.dart
          test/journey_memory_completion_narration_contract_test.dart

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Scope and commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-second-story-runtime.yml
          rm .github/workflows/repair-second-story-runtime-v3.yml
          git diff --name-only | sort >/tmp/changed
          cat >/tmp/expected <<'EOF'
          .github/workflows/repair-second-story-runtime-v3.yml
          .github/workflows/repair-second-story-runtime.yml
          app/lib/data/forbidden_city_story_runtime.dart
          app/lib/screens/journey_screen.dart
          app/test/forbidden_city_second_story_navigation_smoke_test.dart
          app/test/forbidden_city_story_selection_runtime_test.dart
          EOF
          diff -u /tmp/expected /tmp/changed
          git config user.name phoenix-agent
          git config user.email phoenix-agent@users.noreply.github.com
          git add -A
          git commit -m 'fix: stabilize Forbidden City second Story runtime'
          git push origin HEAD:product/city-standard-v1-beijing-forbidden-city
