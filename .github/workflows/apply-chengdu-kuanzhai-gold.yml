name: Apply Chengdu Kuanzhai Gold Remediation

on:
  push:
    branches:
      - remediation/chengdu-kuanzhai-one-pass

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply remaining scoped integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match for {old[:80]!r}, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          path = 'app/lib/data/journey_level_catalog.dart'
          replace_once(path, "import 'daily_journey_experience.dart';\n", "import 'chengdu_kuanzhai_one_pass.dart';\nimport 'daily_journey_experience.dart';\n")
          replace_once(path, "  if (experience.id == hangzhouWestLakeJourneyId) {\n", "  if (experience.id == chengduKuanzhaiJourneyId) {\n    final level = switch (difficulty) {\n      JourneyDifficulty.easy => 1,\n      JourneyDifficulty.standard => 5,\n      JourneyDifficulty.challenge => 10,\n    };\n    return chengduKuanzhaiOnePassLevelContent(level);\n  }\n  if (experience.id == hangzhouWestLakeJourneyId) {\n")

          path = 'app/lib/data/extended_journey_catalog.dart'
          p = Path(path)
          text = p.read_text()
          text = text.replace("import 'daily_journey_experience.dart';\n", "import 'chengdu_kuanzhai_one_pass.dart';\nimport 'daily_journey_experience.dart';\n", 1)
          pattern = re.compile(r"const chengduStoryParagraphs = <String>\[.*?const nanjingStoryParagraphs = <String>\[", re.S)
          replacement = "final chengduStoryParagraphs = chengduKuanzhaiOnePassLevels[4].storyParagraphs;\nfinal chengduStoryAnnotations = chengduKuanzhaiOnePassLevels[4].storyAnnotations;\nfinal chengduWords = chengduKuanzhaiOnePassWords;\nfinal chengduDiscoveries = chengduKuanzhaiOnePassDiscoveries;\n\nconst nanjingStoryParagraphs = <String>["
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'{path}: Chengdu legacy block replacement count={count}')
          text = text.replace("title: '成都 · 宽窄巷子：在院落里读懂慢生活',", "title: '成都 · 宽窄巷子：仍在使用',", 1)
          text = text.replace("tags: const ['成都', '宽窄巷子', '院落', '茶文化', '城市更新'],", "tags: const ['成都', '宽窄巷子', '使用痕迹', '院落', '保护更新'],", 1)
          p.write_text(text)

          path = 'app/lib/data/journey_narrative_dna_catalog.dart'
          p = Path(path)
          text = p.read_text()
          text = text.replace("import 'hangzhou_west_lake_one_pass.dart';\n", "import 'chengdu_kuanzhai_one_pass.dart';\nimport 'hangzhou_west_lake_one_pass.dart';\n", 1)
          marker = "  ),\n]);\n\nint duplicatedMajorDimensions"
          record = "  ),\n  JourneyNarrativeDnaRecord(\n    journeyId: chengduKuanzhaiJourneyId,\n    narrativeIdentity: chengduKuanzhaiNarrativeDna.narrativeIdentity,\n    protagonistIdentity: 'Lin-Xia-Chengdu-local-architecture-graduate-researcher',\n    protagonistAgeIdentity: 'twenty-four-year-old-local-graduate-student',\n    protagonistArchetype: chengduKuanzhaiNarrativeDna.protagonistArchetype,\n    openingSituation: 'use-trace-field-survey-with-commerce-preclassified-as-authenticity-interference',\n    storyGoal: chengduKuanzhaiNarrativeDna.storyGoal,\n    locationMechanism: 'three-alley-courtyard-system-read-through-doors-thresholds-tea-tables-and-use-traces',\n    movementPattern: chengduKuanzhaiNarrativeDna.movementPattern,\n    conflictType: chengduKuanzhaiNarrativeDna.conflictType,\n    choiceType: 'cross-out-commerce-as-automatic-negative-category-and-write-still-in-use',\n    climaxType: chengduKuanzhaiNarrativeDna.climaxType,\n    consequenceType: 'marked-survey-page-preserves-original-judgment-and-evidence-driven-reclassification',\n    emotionalArc: 'rigid-analytic-framework-to-more-precise-evidence-based-preservation-judgment',\n    historicalLearningMechanism: 'lane-courtyard-fabric-and-renewal-are-understood-through-observed-use-rather-than-lecture',\n    resolutionType: chengduKuanzhaiNarrativeDna.resolutionType,\n    endingMechanism: chengduKuanzhaiNarrativeDna.endingMechanism,\n    memoryAnchorType: chengduKuanzhaiNarrativeDna.memoryAnchorType,\n    achievementType: 'courtyard-use-trace-observer',\n    rewardSymbolism: 'survey-mark-and-courtyard-use-trace-imprint',\n    temporalPattern: chengduKuanzhaiNarrativeDna.temporalPattern,\n    supportingStructure: chengduKuanzhaiNarrativeDna.supportingStructure,\n    centralMetaphor: chengduKuanzhaiNarrativeDna.centralMetaphor,\n    narrativeVoice: 'third-person-architectural-field-observation',\n    storyRhythm: 'preclassification-measurement-comparison-tea-table-reclassification-submission',\n  ),\n]);\n\nint duplicatedMajorDimensions"
          if text.count(marker) != 1:
              raise SystemExit(f'{path}: catalog tail marker count={text.count(marker)}')
          p.write_text(text.replace(marker, record, 1))
          PY
          rm .github/workflows/apply-chengdu-kuanzhai-gold.yml
          git diff --check
          git add app/lib/data/journey_level_catalog.dart app/lib/data/extended_journey_catalog.dart app/lib/data/journey_narrative_dna_catalog.dart .github/workflows/apply-chengdu-kuanzhai-gold.yml
          git commit -m "feat: finish Chengdu Gold catalog integration"
          git push origin HEAD:remediation/chengdu-kuanzhai-one-pass
