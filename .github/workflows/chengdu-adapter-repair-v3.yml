name: Chengdu Adapter Repair V3

on:
  push:
    branches:
      - remediation/chengdu-kuanzhai-one-pass
    paths:
      - .github/workflows/chengdu-adapter-repair-v3.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: remediation/chengdu-kuanzhai-one-pass
          fetch-depth: 0
      - name: Apply published catalog repair
        shell: bash
        env:
          PATCH_GZ_HEX:   dbe5ea8c2b50bf3b8480a1adfb38a52b0f7712880bf353ac8a498b1b71b746aacf c2620b27702b3f22ae9c1f38e04cbfb6ff0ccef9084c4efa0dae7e04e5c15c57c09c2ae1d44075fb006b358843db807d93b812b42f613ab7cc74802f98f1268f2b437941bf65d47ed0efe22d8529a727845a53d6f50a16748387f1ac6eaa06037419d5992f76b5b416bf3736bba4f3e12b88a7288ebb835a3ca4bee2379387a6a946f7c533359b7fda35d1cc66dd19af40bdd   ead80983e7d0f0568d76171bba2a09b1e044c89b0fe1c20697919bf3f63059983c6dd163ca2a65c0967eb3e0760a5722588310e7689499c43268b6cad78790c2079b47bdc fdf05f13b07149ef7b30d16b565de94c206ad08c1e57e2ffc2273f5e5066e0ee8c96112119d9b5bcc3a1c922c0a6f1a1edf ee33 9f0d83473a037c5681ded2d235593aba77257682d9f4ceddfc01775181fad3e209cd85f13beda93df2b6c8b478ec3a57ab37c1cff6f140a7270afc68144255f305db5ae1af5ca3da36642e668dad50961729234f7853083863ae692c07a1d0ecf9d518fad544e7cbd  e ffb0e786c819c29cd1cb3c0aeb8a1cc37880ddeb  f630004e83e69393670af600964ba1377dc0ff7ff0075b7d0738d84df0b6cef17cf4ffc457e217f45eff9936677d0f f aa5c512d1120000
        run: |
          printf '%s' "$PATCH_GZ_HEX" | tr -d '[:space:]' | xxd -r -p | gzip --decompress > /tmp/chengdu_adapter_repair.py
          python3 /tmp/chengdu_adapter_repair.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/lib/data/extended_journey_catalog.dart .github/workflows
          git diff --cached --check
          git commit -m "fix: align Chengdu published catalog adapter"
          git push origin HEAD:remediation/chengdu-kuanzhai-one-pass
