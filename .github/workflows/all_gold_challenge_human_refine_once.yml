name: All-Gold Challenge Human Refine Once

on:
  push:
    branches:
      - dev/current

permissions:
  contents: write

jobs:
  refine:
    if: contains(github.event.head_commit.message, 'run all-Gold Challenge human refine')
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact remediation head
        uses: actions/checkout@v4

      - name: Apply human-gate Challenge refinements
        run: python3 tools/refine_all_gold_human_gate.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format affected Dart files
        working-directory: app
        run: >-
          dart format
          lib/data/all_gold_challenge_gold_profiles.dart
          lib/widgets/journey_challenge_panel.dart
          test/all_gold_challenge_phase2_contract_test.dart
          test/all_gold_challenge_cross_gold_dna_test.dart
          test/all_gold_challenge_runtime_snapshot_test.dart

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Run profile integrity contracts
        working-directory: app
        run: flutter test test/all_gold_challenge_phase2_contract_test.dart --reporter expanded

      - name: Run cross-Gold DNA contracts
        working-directory: app
        run: flutter test test/all_gold_challenge_cross_gold_dna_test.dart --reporter expanded

      - name: Run all-Gold active runtime snapshot
        working-directory: app
        run: flutter test test/all_gold_challenge_runtime_snapshot_test.dart --reporter expanded

      - name: Analyze affected runtime
        working-directory: app
        run: >-
          flutter analyze
          lib/data/all_gold_challenge_gold_profiles.dart
          lib/widgets/journey_challenge_panel.dart
          test/all_gold_challenge_phase2_contract_test.dart
          test/all_gold_challenge_cross_gold_dna_test.dart
          test/all_gold_challenge_runtime_snapshot_test.dart

      - name: Verify whitespace
        run: git diff --check

      - name: Commit validated human-gate refinements
        shell: bash
        run: |
          git config user.name "Phoenix Remediation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/lib/data/all_gold_challenge_gold_profiles.dart \
            app/lib/widgets/journey_challenge_panel.dart
          git commit -m "remediate: close all-Gold Challenge human-gate defects"
          git push origin HEAD:dev/current
