name: Apply instant offline vocabulary fix

on:
  push:
    branches:
      - feature/summer-palace-story-engine-pilot
    paths:
      - .github/workflows/apply-instant-offline-vocabulary-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/summer-palace-story-engine-pilot
          fetch-depth: 0

      - name: Patch vocabulary runtime and offline examples
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'missing expected block: {label}')
              return text.replace(old, new, 1)

          service_path = Path('app/lib/services/phoenix_vocabulary_service.dart')
          service = service_path.read_text()
          old_service = '''  /// Explorer runtime path.
  ///
  /// Published vocabulary examples are prepared before release and bundled
  /// with the Journey pack. Opening a word must never wait for a model request.
  Future<PhoenixVocabularyExample> generateExample({
    required WordEntry entry,
    required String language,
    required String journeyId,
    required String contextChinese,
    required String contextPinyin,
    required String contextNative,
    required String contextEnglish,
    required PhoenixVocabularyExample fallback,
  }) {
    final bundled = bundledExampleForWord(entry.word);
    final preloaded = bundled ??
        PhoenixVocabularyExample(
          chinese: fallback.chinese,
          pinyin: fallback.pinyin,
          native: fallback.native,
          english: fallback.english,
          usageNote:
              '已随旅程内容预先下载；例句展示“${entry.word}”在完整语境中的实际用法。',
          isOfflineFallback: true,
          provider: 'phoenix-preloaded-pack',
          model: 'bundled',
          qualityReviewed: true,
          qualityScore: 100,
        );
    _validate(preloaded, entry.word);
    return SynchronousFuture<PhoenixVocabularyExample>(preloaded);
  }
'''
          new_service = '''  /// Explorer runtime path.
  ///
  /// Published vocabulary examples are prepared before release and bundled
  /// with the Journey pack. This synchronous method is the only runtime path
  /// used by the word sheet, so opening or switching words never shows an AI
  /// loading state and never waits for a network request.
  PhoenixVocabularyExample preloadedExample({
    required WordEntry entry,
    required PhoenixVocabularyExample fallback,
  }) {
    final bundled = bundledExampleForWord(entry.word);
    final preloaded = bundled ??
        PhoenixVocabularyExample(
          chinese: fallback.chinese,
          pinyin: fallback.pinyin,
          native: fallback.native,
          english: fallback.english,
          usageNote:
              '已随旅程内容预先下载；例句展示“${entry.word}”在完整语境中的实际用法。',
          isOfflineFallback: true,
          provider: 'phoenix-preloaded-pack',
          model: 'bundled',
          qualityReviewed: true,
          qualityScore: 100,
        );
    _validate(preloaded, entry.word);
    return preloaded;
  }

  Future<PhoenixVocabularyExample> generateExample({
    required WordEntry entry,
    required String language,
    required String journeyId,
    required String contextChinese,
    required String contextPinyin,
    required String contextNative,
    required String contextEnglish,
    required PhoenixVocabularyExample fallback,
  }) {
    return SynchronousFuture<PhoenixVocabularyExample>(
      preloadedExample(entry: entry, fallback: fallback),
    );
  }
'''
          service = replace_once(service, old_service, new_service, 'vocabulary service runtime')
          service_path.write_text(service)

          sheet_path = Path('app/lib/widgets/word_detail_sheet.dart')
          sheet = sheet_path.read_text()
          sheet = replace_once(
              sheet,
              '''  PhoenixVocabularyExample? _generatedExample;
  bool _isSpeaking = false;
  bool _speechUnavailable = false;
  bool _exampleLoading = false;
  int _exampleRequest = 0;
''',
              '''  PhoenixVocabularyExample? _generatedExample;
  bool _isSpeaking = false;
  bool _speechUnavailable = false;
''',
              'word sheet state fields',
          )
          sheet = replace_once(
              sheet,
              '''  @override
  void initState() {
    super.initState();
    _index = widget.initialIndex;
    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (!mounted) return;
      unawaited(_speak());
      unawaited(_loadExample());
    });
  }

  @override
  void dispose() {
    _exampleRequest += 1;
    _vocabularyService.close();
    super.dispose();
  }
''',
              '''  @override
  void initState() {
    super.initState();
    _index = widget.initialIndex;
    _generatedExample = _resolvePreloadedExample();
    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (!mounted) return;
      unawaited(_speak());
    });
  }

  @override
  void dispose() {
    _vocabularyService.close();
    super.dispose();
  }
''',
              'word sheet init and dispose',
          )
          load_pattern = re.compile(
              r'''  Future<void> _loadExample\(\) async \{[\s\S]*?^  \}\n\n  Future<void> _previousWord''',
              re.MULTILINE,
          )
          load_replacement = '''  PhoenixVocabularyExample _resolvePreloadedExample() {
    final entry = _entry;
    final state = context.read<AppState>();
    final contextData = _findVocabularyContext(state, entry);
    final curated = entry.examples.isEmpty ? null : entry.examples.first;
    final fallback = curated == null
        ? contextData.toFallback(language: state.translationLanguage)
        : PhoenixVocabularyExample(
            chinese: curated.chinese,
            pinyin: curated.pinyin,
            native: curated.nativeText(state.translationLanguage),
            english: curated.english,
            usageNote: '来自 Phoenix 已审核并随旅程下载的实际应用例句。',
            isOfflineFallback: true,
            provider: 'phoenix-preloaded-pack',
            model: 'bundled',
            qualityReviewed: true,
            qualityScore: 100,
          );
    return _vocabularyService.preloadedExample(
      entry: entry,
      fallback: fallback,
    );
  }

  Future<void> _previousWord'''
          sheet, count = load_pattern.subn(load_replacement, sheet, count=1)
          if count != 1:
              raise SystemExit('missing expected block: word sheet load method')
          sheet = replace_once(
              sheet,
              '''  Future<void> _previousWord() async {
    if (_isSpeaking || _isFirst) return;
    setState(() {
      _index -= 1;
      _speechUnavailable = false;
      _generatedExample = null;
    });
    unawaited(_loadExample());
    await _speak();
  }
''',
              '''  Future<void> _previousWord() async {
    if (_isSpeaking || _isFirst) return;
    setState(() {
      _index -= 1;
      _speechUnavailable = false;
      _generatedExample = _resolvePreloadedExample();
    });
    await _speak();
  }
''',
              'previous word navigation',
          )
          sheet = replace_once(
              sheet,
              '''  Future<void> _nextWord() async {
    if (_isSpeaking) return;
    if (_isLast) {
      Navigator.of(context).pop();
      return;
    }
    setState(() {
      _index += 1;
      _speechUnavailable = false;
      _generatedExample = null;
    });
    unawaited(_loadExample());
    await _speak();
  }
''',
              '''  Future<void> _nextWord() async {
    if (_isSpeaking) return;
    if (_isLast) {
      Navigator.of(context).pop();
      return;
    }
    setState(() {
      _index += 1;
      _speechUnavailable = false;
      _generatedExample = _resolvePreloadedExample();
    });
    await _speak();
  }
''',
              'next word navigation',
          )
          sheet = replace_once(
              sheet,
              '''                isLoading: _exampleLoading,
                isOfflineFallback: generated?.isOfflineFallback ?? false,
                qualityReviewed: generated?.qualityReviewed ?? false,
                usageNote: generated?.usageNote ?? '',
                onRetry: _loadExample,
''',
              '''                isOfflineFallback: generated?.isOfflineFallback ?? true,
                qualityReviewed: generated?.qualityReviewed ?? true,
                usageNote: generated?.usageNote ?? '',
''',
              'example card call',
          )
          sheet = replace_once(
              sheet,
              '''    required this.compact,
    required this.isLoading,
    required this.isOfflineFallback,
    required this.qualityReviewed,
    required this.usageNote,
    required this.onRetry,
''',
              '''    required this.compact,
    required this.isOfflineFallback,
    required this.qualityReviewed,
    required this.usageNote,
''',
              'example card constructor',
          )
          sheet = replace_once(
              sheet,
              '''  final bool compact;
  final bool isLoading;
  final bool isOfflineFallback;
  final bool qualityReviewed;
  final String usageNote;
  final Future<void> Function() onRetry;
''',
              '''  final bool compact;
  final bool isOfflineFallback;
  final bool qualityReviewed;
  final String usageNote;
''',
              'example card fields',
          )
          card_pattern = re.compile(
              r'''      child: isLoading[\s\S]*?          : Column\(''',
              re.MULTILINE,
          )
          card_replacement = '''      child: example == null || example!.chinese.trim().isEmpty
          ? const Text(
              '离线例句包中缺少该词例句。',
              style: TextStyle(color: _popupMuted, fontSize: 10.5),
            )
          : Column('''
          sheet, count = card_pattern.subn(card_replacement, sheet, count=1)
          if count != 1:
              raise SystemExit('missing expected block: example card loading branch')
          sheet = sheet.replace(
              "isOfflineFallback ? '旅程真实语境' : 'AI 实际用法'",
              "'已下载例句'",
              1,
          )
          sheet = sheet.replace(
              '''                    if (!isOfflineFallback)
                      Text(
                        qualityReviewed ? 'AI 已复核' : 'AI 生成',
''',
              '''                    if (qualityReviewed)
                      Text(
                        '已审核',
''',
              1,
          )
          if 'AI 正在查询实际用法' in sheet or '_exampleLoading' in sheet or '_loadExample' in sheet:
              raise SystemExit('word sheet still contains runtime AI loading state')
          sheet_path.write_text(sheet)

          catalog_path = Path('app/lib/data/summer_palace_language_level_catalog.dart')
          catalog = catalog_path.read_text()
          additions = {
              "    englishDefinition: 'to compose a view; visual composition',\n    symbol: '🖼️',": """    englishDefinition: 'to compose a view; visual composition',
    examples: [
      WordExample(
        chinese: '长廊的廊柱把湖面和远山重新构图。',
        pinyin: 'Chángláng de lángzhù bǎ húmiàn hé yuǎnshān chóngxīn gòutú.',
        vietnamese: 'Các cột của Trường Lang sắp xếp lại mặt hồ và núi xa thành một bố cục mới.',
        english: 'The Long Corridor columns recompose the lake and distant hills into a new view.',
      ),
    ],
    symbol: '🖼️',""",
              "    englishDefinition: 'a framed or opposite view in garden design',\n    symbol: '🎯',": """    englishDefinition: 'a framed or opposite view in garden design',
    examples: [
      WordExample(
        chinese: '站在长廊的开口处，佛香阁正好成为对景。',
        pinyin: 'Zhàn zài Chángláng de kāikǒu chù, Fóxiāng Gé zhènghǎo chéngwéi duìjǐng.',
        vietnamese: 'Đứng tại một khoảng mở của Trường Lang, Phật Hương Các vừa khéo trở thành cảnh đối diện.',
        english: 'From an opening in the Long Corridor, the Tower of Buddhist Incense becomes the framed opposite view.',
      ),
    ],
    symbol: '🎯',""",
              "    englishDefinition: 'a trace, mark, or sign left behind',\n    symbol: '🪶',": """    englishDefinition: 'a trace, mark, or sign left behind',
    examples: [
      WordExample(
        chinese: '修复后的园林仍保留着历史损毁的痕迹。',
        pinyin: 'Xiūfù hòu de yuánlín réng bǎoliúzhe lìshǐ sǔnhuǐ de hénjì.',
        vietnamese: 'Khu vườn sau khi phục hồi vẫn lưu giữ dấu vết hư hại trong lịch sử.',
        english: 'The restored garden still preserves traces of historical damage.',
      ),
    ],
    symbol: '🪶',""",
              "    englishDefinition: 'to plan systematically; planning',\n    symbol: '📐',": """    englishDefinition: 'to plan systematically; planning',
    examples: [
      WordExample(
        chinese: '颐和园的规划以万寿山和昆明湖为中心。',
        pinyin: 'Yíhéyuán de guīhuà yǐ Wànshòu Shān hé Kūnmíng Hú wéi zhōngxīn.',
        vietnamese: 'Quy hoạch Di Hòa Viên lấy núi Vạn Thọ và hồ Côn Minh làm trung tâm.',
        english: 'The Summer Palace plan is organized around Longevity Hill and Kunming Lake.',
      ),
    ],
    symbol: '📐',""",
              "    englishDefinition: 'layers, levels, or visual depth',\n    symbol: '🪜',": """    englishDefinition: 'layers, levels, or visual depth',
    examples: [
      WordExample(
        chinese: '十七孔桥把近处湖岸和远处山景组织成丰富的层次。',
        pinyin: 'Shíqīkǒng Qiáo bǎ jìnchù hú\'àn hé yuǎnchù shānjǐng zǔzhī chéng fēngfù de céngcì.',
        vietnamese: 'Cầu Thập Thất Khổng sắp xếp bờ hồ gần và cảnh núi xa thành nhiều lớp phong phú.',
        english: 'The Seventeen-Arch Bridge organizes the nearby shore and distant hills into rich visual layers.',
      ),
    ],
    symbol: '🪜',""",
          }
          for old, new in additions.items():
              catalog = replace_once(catalog, old, new, old)
          catalog_path.write_text(catalog)

          test_path = Path('worker/vocabulary_example_agent.test.mjs')
          test_text = test_path.read_text()
          start = test_text.index("test('explorers read bundled examples and never wait for a model request'")
          new_test = '''test('explorers read bundled examples instantly and never enter an AI loading state', () => {
  const sheet = readFileSync('app/lib/widgets/word_detail_sheet.dart', 'utf8');
  const service = readFileSync(
    'app/lib/services/phoenix_vocabulary_service.dart',
    'utf8',
  );
  const catalog = readFileSync(
    'app/lib/data/summer_palace_language_level_catalog.dart',
    'utf8',
  );
  const runtime = service.match(
    /PhoenixVocabularyExample preloadedExample\\([\\s\\S]*?\\n  }\\n\\n  Future<PhoenixVocabularyExample> generateExample/,
  )?.[0] ?? '';

  assert.match(sheet, /_resolvePreloadedExample/);
  assert.doesNotMatch(sheet, /AI 正在查询实际用法|_exampleLoading|_loadExample/);
  assert.match(runtime, /phoenix-preloaded-pack/);
  assert.doesNotMatch(runtime, /_client\\s*\\.post/);
  assert.match(service, /generateExampleForContentPipeline/);
  assert.match(service, /forbidden\\.any/);
  assert.match(catalog, /word: '规划'[\\s\\S]*?颐和园的规划以万寿山和昆明湖为中心/);
  assert.match(catalog, /word: '层次'[\\s\\S]*?组织成丰富的层次/);
});
'''
          test_path.write_text(test_text[:start] + new_test)
          PY

      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/apply-instant-offline-vocabulary-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/widgets/word_detail_sheet.dart \
                  app/lib/services/phoenix_vocabulary_service.dart \
                  app/lib/data/summer_palace_language_level_catalog.dart \
                  worker/vocabulary_example_agent.test.mjs \
                  .github/workflows/apply-instant-offline-vocabulary-fix.yml
          git commit -m "fix: show downloaded vocabulary examples instantly"
          git push origin HEAD:feature/summer-palace-story-engine-pilot
