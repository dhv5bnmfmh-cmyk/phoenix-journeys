name: One-time five-option adaptive challenges v2

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch-and-remove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/adaptive-level-content-v2
          fetch-depth: 0

      - name: Upgrade adaptive challenges to five options
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          path = Path('app/lib/widgets/journey_challenge_panel.dart')
          text = path.read_text()

          if 'const int journeyChallengeOptionCount = 5;' not in text:
              pattern = re.compile(
                  r'(const fixedJourneyChallengeTypes = <JourneyChallengeType>\[[\s\S]*?\n\];)'
              )
              text, count = pattern.subn(
                  r'\1\n\nconst int journeyChallengeOptionCount = 5;',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('challenge option count insertion failed')

          old_status = "'第 ${_session.attempts + 1} / 3 次 · 候选答案固定为 4 个'"
          new_status = "'第 ${_session.attempts + 1} / 3 次 · 候选答案 ${_session.options.length} 个'"
          if old_status not in text:
              raise SystemExit('challenge status text not found')
          text = text.replace(old_status, new_status, 1)
          text = text.replace('_fourOptions()', '_challengeOptions()')
          text = text.replace(
              'assert(_session.options.length == 4);',
              'assert(_session.options.length == journeyChallengeOptionCount);',
              1,
          )
          text = text.replace(
              "key: const ValueKey('challenge-four-options'),",
              "key: const ValueKey('challenge-five-options'),",
              1,
          )

          paragraph_start = text.index('  static _ChallengeSession _buildParagraph(')
          grammar_start = text.index('  static _ChallengeSession _buildGrammar(', paragraph_start)
          paragraph = text[paragraph_start:grammar_start]
          paragraph = paragraph.replace(
              'while (options.length < 4) {',
              'while (options.length < journeyChallengeOptionCount) {',
              1,
          )
          paragraph = paragraph.replace(
              '四个候选句中有 ${correctOptions.length} 句属于原文。',
              '五个候选句中有 ${correctOptions.length} 句属于原文。',
              1,
          )
          text = text[:paragraph_start] + paragraph + text[grammar_start:]

          grammar_start = text.index('  static _ChallengeSession _buildGrammar(')
          missing_start = text.index('  static _ChallengeSession _buildMissing(', grammar_start)
          grammar = text[grammar_start:missing_start]
          options_start = grammar.index('    final replacementTexts = <String>[')
          options_end = grammar.index('    return _ChallengeSession(', options_start)
          grammar_options = dedent("""
              final replacementCandidates = <String>[
                grammar.correctReplacement,
                ...grammar.distractors,
                grammar.segments[grammar.problemSegmentIndex],
                ...switch (difficulty) {
                  JourneyChallengeDifficulty.beginner => <String>[
                      '因此${grammar.correctReplacement}',
                      '而且${grammar.correctReplacement}',
                    ],
                  JourneyChallengeDifficulty.standard => <String>[
                      '同时${grammar.correctReplacement}',
                      '${grammar.correctReplacement}还',
                    ],
                  JourneyChallengeDifficulty.advanced => <String>[
                      '从而${grammar.correctReplacement}',
                      '由此${grammar.correctReplacement}',
                    ],
                },
              ];
              final replacementTexts = <String>[];
              for (final candidate in replacementCandidates) {
                final value = candidate.trim();
                if (value.isEmpty || replacementTexts.contains(value)) continue;
                replacementTexts.add(value);
                if (replacementTexts.length >= journeyChallengeOptionCount) break;
              }
              if (replacementTexts.length < journeyChallengeOptionCount) {
                throw StateError('Grammar challenge requires five unique options.');
              }
              final options = <_ChallengeOption>[
                for (var index = 0;
                    index < journeyChallengeOptionCount;
                    index++)
                  _ChallengeOption(
                    id: index == 0 ? 'correct' : 'distractor-$index',
                    text: replacementTexts[index],
                    isCorrect: index == 0,
                  ),
              ]..shuffle(math.Random(seed + 31));

          """)
          grammar_options = ''.join(
              f'    {line}\n' if line else '\n'
              for line in grammar_options.splitlines()
          )
          grammar = grammar[:options_start] + grammar_options + grammar[options_end:]
          grammar = grammar.replace(
              '从四个修改方案中选出最自然的一项。',
              '从五个修改方案中选出最自然的一项。',
              1,
          )
          text = text[:grammar_start] + grammar + text[missing_start:]

          missing_start = text.index('  static _ChallengeSession _buildMissing(')
          grammar_catalog_start = text.index('  static _GrammarSpec _grammarForJourney(', missing_start)
          missing = text[missing_start:grammar_catalog_start]
          missing = missing.replace(
              'final distractors = _missingDistractors(journeyId, discoveryTexts);',
              dedent("""
              final distractors = _missingDistractors(
                journeyId,
                discoveryTexts,
                difficulty,
              );
              """).strip(),
              1,
          )
          missing = missing.replace(
              'for (var index = 0; index < 4; index++)',
              'for (var index = 0; index < journeyChallengeOptionCount; index++)',
              1,
          )
          missing = missing.replace(
              '从四个相近答案中选出最能连接上下文的一句。',
              '从五个相近答案中选出最能连接上下文的一句。',
              1,
          )
          text = text[:missing_start] + missing + text[grammar_catalog_start:]

          paragraph_helper_start = text.index('  static List<String> _paragraphDistractors(')
          missing_helper_start = text.index(
              '  static List<String> _missingDistractors(',
              paragraph_helper_start,
          )
          paragraph_helper = dedent("""
            static List<String> _paragraphDistractors(String journeyId) {
              return switch (journeyId) {
                'literary-roaming' => [
                  '蝴蝶停在原地，竹林也从来没有出现变化。',
                  '探索者没有做梦，也没有看见任何岔路。',
                  '他只沿着直路前进，始终没有回头寻找梦的入口。',
                ],
                'myth-tracing' => [
                  '太阳升起以后，遗简才第一次从海底出现。',
                  '白兔离开桂林，故事也没有留下任何选择。',
                  '探索者把空匣留在岸边，没有继续辨认月光中的文字。',
                ],
                'strange-night-talks' => [
                  '客栈从来没有下雨，夜客也一直拥有清楚的影子。',
                  '天刚亮时，门外才第一次有人轻轻敲门。',
                  '掌柜点亮所有灯火，走廊立刻恢复了白日的安静。',
                ],
                'folk-secret-land' => [
                  '所有河灯都停在岸上，从未进入水中。',
                  '写着名字的灯顺流远去，没有出现任何倒影。',
                  '探索者把灯放回石阶，河面也没有改变流动方向。',
                ],
                _ => [
                  '游客没有停留，很快就离开了这里。',
                  '所有景色完全相同，不需要继续观察。',
                  '故事突然中断，也没有留下任何结果。',
                ],
              };
            }

          """)
          paragraph_helper = ''.join(
              f'  {line}\n' if line else '\n'
              for line in paragraph_helper.splitlines()
          )
          text = (
              text[:paragraph_helper_start]
              + paragraph_helper
              + text[missing_helper_start:]
          )

          missing_helper_start = text.index('  static List<String> _missingDistractors(')
          starts_helper = text.index('  static bool _startsWithCorrectOrder(', missing_helper_start)
          missing_helper = dedent("""
            static List<String> _missingDistractors(
              String journeyId,
              List<String> discoveries,
              JourneyChallengeDifficulty difficulty,
            ) {
              final specific = switch (journeyId) {
                'literary-roaming' => [
                  '他决定统计竹子的数量，不再观察蝴蝶。',
                  '梦境立刻消失，故事也不再讨论醒来。',
                  '所有路牌都被收走，因此没有出现选择。',
                ],
                'myth-tracing' => [
                  '他把遗简交给山下的商店换了一把雨伞。',
                  '月光消失以后，海边突然出现现代高楼。',
                  '白兔没有等待任何东西，也没有守着空匣。',
                ],
                'strange-night-talks' => [
                  '他打开窗户计算雨滴，没有听见任何声音。',
                  '客栈立刻变成白天，夜客也离开了故事。',
                  '门外的人只询问房价，从未叫出你的名字。',
                ],
                'folk-secret-land' => [
                  '他把所有河灯吹灭，河面从此没有倒影。',
                  '灯纸上写的是菜单，与前后的名字无关。',
                  '河水完全停止流动，因此不存在上游和下游。',
                ],
                _ => [
                  '他没有进入景区，直接回到了住处。',
                  '所有建筑完全一样，所以不必继续观察。',
                  '天气突然改变，但这与前后内容没有关系。',
                ],
              };
              final discoverySentences = _extractSentences(discoveries);
              final discoveryCandidate = discoverySentences.isEmpty
                  ? null
                  : discoverySentences.last;
              final levelCandidates = switch (difficulty) {
                JourneyChallengeDifficulty.beginner => <String>[
                    ...specific,
                    '他很快离开了这里，故事也在这一刻结束。',
                  ],
                JourneyChallengeDifficulty.standard => <String>[
                    ...specific,
                    if (discoveryCandidate != null) discoveryCandidate,
                    '他停下脚步，把沿途景色逐一写进记录里。',
                  ],
                JourneyChallengeDifficulty.advanced => <String>[
                    if (discoveryCandidate != null) discoveryCandidate,
                    ...specific,
                    '他重新检查前文线索，却没有改变原来的判断。',
                  ],
              };
              final result = <String>[];
              for (final candidate in levelCandidates) {
                final value = candidate.trim();
                if (value.isEmpty || result.contains(value)) continue;
                result.add(value);
                if (result.length >= journeyChallengeOptionCount - 1) break;
              }
              if (result.length < journeyChallengeOptionCount - 1) {
                throw StateError(
                  'Missing-sentence challenge requires four distractors.',
                );
              }
              return result;
            }

          """)
          missing_helper = ''.join(
              f'  {line}\n' if line else '\n'
              for line in missing_helper.splitlines()
          )
          text = text[:missing_helper_start] + missing_helper + text[starts_helper:]
          path.write_text(text)

          Path('app/test/journey_challenge_option_count_test.dart').write_text(
              dedent("""
              import 'package:flutter_test/flutter_test.dart';
              import 'package:phoenix_journeys/models/language_proficiency.dart';
              import 'package:phoenix_journeys/widgets/journey_challenge_panel.dart';

              void main() {
                const beginner = ChineseProficiencyProfile(
                  track: ChineseExamTrack.hsk,
                  levelCode: '1',
                  levelLabel: '1',
                  band: PhoenixReadingBand.beginner,
                );
                const standard = ChineseProficiencyProfile(
                  track: ChineseExamTrack.tocfl,
                  levelCode: '3',
                  levelLabel: 'Level 3',
                  band: PhoenixReadingBand.intermediate,
                );
                const advanced = ChineseProficiencyProfile(
                  track: ChineseExamTrack.hsk,
                  levelCode: '7-9',
                  levelLabel: '7–9',
                  band: PhoenixReadingBand.mastery,
                );

                test('every adaptive challenge exposes five candidate answers', () {
                  expect(journeyChallengeOptionCount, 5);
                });

                test('challenge difficulty follows the selected reading band', () {
                  expect(
                    challengeDifficultyForProfile(beginner),
                    JourneyChallengeDifficulty.beginner,
                  );
                  expect(
                    challengeDifficultyForProfile(standard),
                    JourneyChallengeDifficulty.standard,
                  );
                  expect(
                    challengeDifficultyForProfile(advanced),
                    JourneyChallengeDifficulty.advanced,
                  );
                });
              }
              """).lstrip()
          )

          Path('worker/five_option_challenge_rule.test.mjs').write_text(
              dedent("""
              import assert from 'node:assert/strict';
              import { readFileSync } from 'node:fs';
              import test from 'node:test';

              const panel = readFileSync(
                'app/lib/widgets/journey_challenge_panel.dart',
                'utf8',
              );

              test('every challenge mode keeps five candidate answers', () => {
                assert.match(panel, /journeyChallengeOptionCount = 5/);
                assert.match(panel, /options\.length == journeyChallengeOptionCount/);
                assert.match(panel, /while \(options\.length < journeyChallengeOptionCount\)/);
                assert.match(panel, /index < journeyChallengeOptionCount/);
                assert.doesNotMatch(panel, /候选答案固定为 4 个/);
                assert.doesNotMatch(panel, /_fourOptions/);
              });

              test('higher-level distractors stay tied to current content', () => {
                assert.match(panel, /grammar\.segments\[grammar\.problemSegmentIndex\]/);
                assert.match(panel, /discoveryCandidate/);
                assert.match(panel, /JourneyChallengeDifficulty\.advanced/);
                assert.match(panel, /five unique options/);
                assert.match(panel, /four distractors/);
              });
              """).lstrip()
          )

          docs = Path('docs/adaptive-level-content-v2.md')
          doc_text = docs.read_text()
          marker = '- Keep the legacy three-level catalog only as a safe fallback until an explorer selects an exam profile.\n'
          addition = '- Give every adaptive challenge five candidate answers, with closer content-based distractors at higher levels.\n'
          if addition not in doc_text:
              if marker not in doc_text:
                  raise SystemExit('documentation marker not found')
              docs.write_text(doc_text.replace(marker, marker + addition, 1))
          PY

      - name: Commit product changes and remove migration files
        shell: bash
        run: |
          rm -f .github/workflows/one-time-five-option-challenges.yml
          rm -f .github/workflows/one-time-five-option-challenges-v2.yml
          rm -f docs/five-option-challenge-migration-trigger.md
          rm -f docs/five-option-challenge-migration-trigger-v2.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Upgrade adaptive challenges to five options"
          git push origin HEAD:agent/adaptive-level-content-v2
