name: Flutter CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/scripts/**'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate identity
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "FLUTTER CI CANDIDATE SHA = $CANDIDATE_SHA"

      - name: Preflight checked-in JavaScript harness syntax
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find .github/scripts -type f -name '*.mjs' -print0)

      - name: Test Phoenix agents
        id: agents
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          node --test worker/*.test.mjs 2>&1 | tee worker-test.log

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log

      - name: Test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee test.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [[ "$test_status" -ne 0 ]]; then
            {
              echo '## Full Flutter first useful failure'
              echo
              echo '```text'
              awk '
                BEGIN { capture=0; lines=0 }
                /\[E\]|TestFailure|Expected:|Actual:|Which:|package:.*test|test\/.*\.dart/ {
                  if (!capture) capture=1
                }
                capture && lines < 80 {
                  print
                  lines++
                }
              ' test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            first_failure="$(awk '/\[E\]|TestFailure|Expected:|Actual:|Which:|test\/.*\.dart/ { print; exit }' test.log)"
            if [[ -n "$first_failure" ]]; then
              echo "::error title=Full Flutter first failure::$first_failure"
            else
              echo '::error title=Full Flutter first failure::See verification log artifact for complete output.'
            fi
          fi
          exit "$test_status"

      - name: Build web release
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build web --release 2>&1 | tee build-web.log

      - name: Validate Cloudflare Worker bundle
        id: worker
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run 2>&1 | tee worker-build.log

      - name: Upload exact tested web artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-web-${{ env.CANDIDATE_SHA }}
          path: app/build/web
          if-no-files-found: error
          retention-days: 7

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-verification-logs-${{ env.CANDIDATE_SHA }}
          path: |
            worker-test.log
            worker-build.log
            app/analyze.log
            app/test.log
            app/build-web.log
          if-no-files-found: error

      - name: Enforce verification results
        shell: bash
        run: |
          failures=0
          for result in \
            "${{ steps.agents.outcome }}" \
            "${{ steps.analyze.outcome }}" \
            "${{ steps.test.outcome }}" \
            "${{ steps.build.outcome }}" \
            "${{ steps.worker.outcome }}"; do
            if [[ "$result" != "success" ]]; then
              failures=1
            fi
          done
          exit "$failures"
