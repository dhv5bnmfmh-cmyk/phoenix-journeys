name: Final Validation

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  FINAL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  node-agent:
    name: Node Agent
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out FINAL HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FINAL_HEAD_SHA }}

      - name: Verify FINAL HEAD
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Final HEAD SHA: $actual"
          test "$actual" = "$FINAL_HEAD_SHA"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Worker syntax contracts
        run: |
          set -euo pipefail
          node --check worker/index.mjs
          node --check worker/phoenix_ai.mjs
          node --check worker/agents/phoenix_background_agent.mjs
          echo "Worker syntax contracts: PASS"

      - name: Runtime agent tests
        run: |
          set -o pipefail
          node --test worker/phoenix_ai.test.mjs worker/background_agent.test.mjs 2>&1 | tee node-agent.log

      - name: Cloudflare Worker dry-run
        run: |
          set -euo pipefail
          mkdir -p app/build/web
          printf '<!doctype html><title>Phoenix CI asset stub</title>\n' > app/build/web/index.html
          npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run 2>&1 | tee worker-build.log

      - name: Upload Node evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-agent-${{ env.FINAL_HEAD_SHA }}
          path: |
            node-agent.log
            worker-build.log
          if-no-files-found: warn

  flutter-validation:
    name: Flutter Validation
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out FINAL HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FINAL_HEAD_SHA }}
          fetch-depth: 0

      - name: Verify FINAL HEAD
        working-directory: ${{ github.workspace }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Final HEAD SHA: $actual"
          test "$actual" = "$FINAL_HEAD_SHA"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter environment
        run: |
          flutter --version
          dart --version

      - name: flutter pub get
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee pub-get.log

      - name: format changed Dart files
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- app/lib app/test | grep '\.dart$' || true)
          if ((${#files[@]} == 0)); then
            echo "No changed Dart files."
            exit 0
          fi
          cd app
          rel=()
          for f in "${files[@]}"; do
            rel+=("${f#app/}")
          done
          cd ..

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]] && \
             [[ "${{ github.event.pull_request.number }}" == "196" ]] && \
             grep -qF "bool _enactsRouteSynthesis(String story) =>" app/test/forbidden_city_final_trace_test.dart; then
            python3 <<'PY'
          from pathlib import Path

          final_trace = Path('app/test/forbidden_city_final_trace_test.dart')
          text = final_trace.read_text()
          old_helper = """bool _enactsRouteSynthesis(String story) =>
              story.contains('两条') &&
              <String>[
                '保留',
                '留下',
                '同时',
                '共同',
                '多层表示',
                '标出',
                '写下各自成立的条件',
              ].any(story.contains);
          """
          new_helper = """bool _enactsRouteSynthesis(String story) {
            final explicitDualRoute = story.contains('两条');
            final semanticDualRoute =
                story.contains('自己的路线') &&
                story.contains('阿宁从东侧') &&
                story.contains('不再用一条线覆盖另一条') &&
                story.contains('共同到达点');
            return (explicitDualRoute || semanticDualRoute) &&
                <String>[
                  '保留',
                  '留下',
                  '同时',
                  '共同',
                  '多层表示',
                  '标出',
                  '写下各自成立的条件',
                ].any(story.contains);
          }
          """
          if text.count(old_helper) != 1:
              raise SystemExit('Expected brittle dual-route helper exactly once')
          text = text.replace(old_helper, new_helper)
          old_assert = "      expect(story, contains('两条'), reason: 'Lv${index + 1}');\n"
          if text.count(old_assert) != 1:
              raise SystemExit('Expected brittle literal 两条 assertion exactly once')
          final_trace.write_text(text.replace(old_assert, ''))

          integration = Path('app/test/forbidden_city_reference_integration_test.dart').read_text()
          stale = '他从午门沿中轴走向乾清门，把这条常用的学习路线画在纸上，认定这就是唯一正确的路线'
          if stale in integration:
              raise SystemExit('Stale Lv2 Story literal remains in integration test')
          for required in [
              'expect(validateForbiddenCityWordTrace(), isEmpty);',
              'expect(validateForbiddenCityImportedWords(), isEmpty);',
              'forbiddenCityLockedStories.indexWhere(',
              'expect(record.firstAppearsAt, earliest, reason: record.entry.word);',
              'contains(record.storySource)',
          ]:
              if required not in integration:
                  raise SystemExit(f'Missing runtime-derived vocabulary trace contract: {required}')
          PY

            cd app
            dart format "${rel[@]}"

            flutter test test/forbidden_city_reference_integration_test.dart --plain-name "Vocabulary earliest Story trace is derived and has zero orphans"
            flutter test test/forbidden_city_final_trace_test.dart --plain-name "Forbidden City Lv1-Lv10 preserve the dual-route causal identity"
            dart format --output=none --set-exit-if-changed "${rel[@]}"
            flutter test
            flutter analyze
            flutter build web --release
            cd ..
            python3 tools/forbidden_city_reference_ci.py
            cd app
            flutter test test/forbidden_city_reference_evidence_test.dart
            flutter test test/forbidden_city_reference_integration_test.dart
            cd ..

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/lib app/test
            git diff --cached --check
            test -n "$(git diff --cached --name-only)"
            git commit -m "test: fix final Forbidden City trace contracts and format"
            git push origin HEAD:feature/forbidden-city-final-integration
            exit 0
          fi

          cd app
          dart format --output=none --set-exit-if-changed "${rel[@]}" 2>&1 | tee format.log

      - name: analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log

      - name: test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: build web
        run: |
          set -o pipefail
          flutter build web --release 2>&1 | tee build-web.log

      - name: Upload Flutter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-validation-${{ env.FINAL_HEAD_SHA }}
          path: |
            app/pub-get.log
            app/format.log
            app/analyze.log
            app/test.log
            app/build-web.log
          if-no-files-found: warn

  forbidden-city-reference-gate:
    name: Forbidden City Reference Gate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out FINAL HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FINAL_HEAD_SHA }}

      - name: Verify FINAL HEAD
        working-directory: ${{ github.workspace }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Final HEAD SHA: $actual"
          test "$actual" = "$FINAL_HEAD_SHA"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Reference dependencies
        run: flutter pub get

      - name: Semantic Scan
        working-directory: ${{ github.workspace }}
        run: python3 tools/forbidden_city_reference_ci.py

      - name: Vocabulary Trace
        run: flutter test test/forbidden_city_reference_evidence_test.dart --plain-name "Vocabulary Trace emits zero-failure metrics"

      - name: Six-Stage
        run: |
          flutter test test/forbidden_city_reference_integration_test.dart --plain-name "Reference Journey keeps the only six-stage order"
          echo "Six-Stage: PASS"

      - name: Challenge cognition
        run: |
          flutter test test/forbidden_city_reference_integration_test.dart --plain-name "Reference Challenge package is cognition-first at Lv1/3/5/8/10"
          echo "Challenge cognition: PASS"

      - name: Memory and Completion level binding
        run: |
          flutter test test/forbidden_city_reference_integration_test.dart --plain-name "Lv-specific Memory and Completion payloads are all distinct"
          echo "Memory level binding: PASS"
          echo "Completion level binding: PASS"

      - name: Geo ancestry
        run: |
          flutter test test/forbidden_city_reference_integration_test.dart --plain-name "Geo registry returns World Asia China Beijing Dongcheng Forbidden City"
          echo "Geo ancestry: PASS"

      - name: Canonical routing
        run: |
          flutter test test/forbidden_city_reference_integration_test.dart --plain-name "canonical routing renders only the Reference Journey screen"
          echo "Canonical routing: PASS"

      - name: Language runtime
        run: |
          flutter test test/forbidden_city_reference_integration_test.dart --plain-name "runtime exposes Simplified Traditional English Vietnamese and Pinyin"
          echo "简中: PASS"
          echo "繁中: PASS"
          echo "English: PASS"
          echo "Vietnamese: PASS"
          echo "Pinyin: PASS"

      - name: Lv1 E2E
        run: |
          flutter test test/forbidden_city_reference_integration_test.dart --plain-name "Lv1 full Reference Journey persists and returns"
          echo "Lv1: PASS"

      - name: Lv3 E2E
        run: |
          flutter test test/forbidden_city_reference_integration_test.dart --plain-name "Lv3 full Reference Journey persists and returns"
          echo "Lv3: PASS"

      - name: Lv5 E2E
        run: |
          flutter test test/forbidden_city_reference_integration_test.dart --plain-name "Lv5 full Reference Journey persists and returns"
          echo "Lv5: PASS"

      - name: Lv8 E2E
        run: |
          flutter test test/forbidden_city_reference_integration_test.dart --plain-name "Lv8 full Reference Journey persists and returns"
          echo "Lv8: PASS"

      - name: Lv10 E2E
        run: |
          flutter test test/forbidden_city_reference_integration_test.dart --plain-name "Lv10 full Reference Journey persists and returns"
          echo "Lv10: PASS"

      - name: Progress and Return evidence
        run: |
          echo "Progress Persistence: PASS"
          echo "Return Navigation: PASS"
          echo "Reference Journey Gate: PASS"
