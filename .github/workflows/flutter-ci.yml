name: Flutter CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate identity
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "FLUTTER CI CANDIDATE SHA = $CANDIDATE_SHA"

      - name: Cheap harness contract preflight
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find .github/scripts -type f -name '*.mjs' -print0)
          node --test \
            .github/scripts/exact_workflow_contract.test.mjs \
            .github/scripts/validate_quality_artifact.test.mjs \
            .github/scripts/flutter_semantics_live.test.mjs \
            .github/scripts/semantic_action_safety_scan.test.mjs
          node .github/scripts/semantic_action_safety_scan.mjs \
            .github/scripts/flutter_semantics_live.mjs \
            .github/scripts/journey_e2e_core.mjs \
            .github/scripts/verify_forbidden_city_reference_live.mjs \
            .github/scripts/verify_forbidden_city_mobile_live.mjs \
            .github/scripts/verify_xian_city_wall_live.mjs

      - name: Test Phoenix agents
        id: agents
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          node --test worker/*.test.mjs 2>&1 | tee worker-test.log

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log

      - name: Full Flutter Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: Dedicated isolated Journey quality report
        id: quality
        continue-on-error: true
        env:
          PHOENIX_GENERATE_QUALITY_REPORT: '1'
          PHOENIX_QUALITY_MARKDOWN: ${{ github.workspace }}/journey-quality-report.md
          PHOENIX_QUALITY_JSON: ${{ github.workspace }}/journey-quality-report.json
        run: |
          set -o pipefail
          flutter test test/journey_quality_report_ci_test.dart --reporter expanded \
            2>&1 | tee quality-report-test.log

      - name: Bind and enforce exact quality artifact
        id: quality_contract
        if: always()
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.quality.outcome }}" = success
          cat > journey-quality-artifact.json <<JSON
          {"schema":1,"type":"journey-quality","sha":"$CANDIDATE_SHA"}
          JSON
          node .github/scripts/validate_quality_artifact.mjs \
            journey-quality-report.json \
            journey-quality-artifact.json \
            "$CANDIDATE_SHA"

      - name: Upload exact Journey quality artifact
        if: steps.quality.outcome == 'success' && steps.quality_contract.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-journey-quality-${{ env.CANDIDATE_SHA }}
          path: |
            journey-quality-report.md
            journey-quality-report.json
            journey-quality-artifact.json
          if-no-files-found: error
          retention-days: 7

      - name: Build web release
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build web --release 2>&1 | tee build-web.log

      - name: Bind exact web artifact identity
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          cat > build/web/phoenix-artifact.json <<JSON
          {"schema":1,"type":"web","sha":"$CANDIDATE_SHA"}
          JSON

      - name: Validate Cloudflare Worker bundle
        id: worker
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run 2>&1 | tee worker-build.log

      - name: Upload exact tested web artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-web-${{ env.CANDIDATE_SHA }}
          path: app/build/web
          if-no-files-found: error
          retention-days: 7

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-verification-logs-${{ env.CANDIDATE_SHA }}
          path: |
            worker-test.log
            worker-build.log
            app/analyze.log
            app/test.log
            app/quality-report-test.log
          if-no-files-found: error

      - name: Enforce verification results
        if: always()
        shell: bash
        run: |
          failures=0
          for result in \
            "${{ steps.agents.outcome }}" \
            "${{ steps.analyze.outcome }}" \
            "${{ steps.test.outcome }}" \
            "${{ steps.quality.outcome }}" \
            "${{ steps.quality_contract.outcome }}" \
            "${{ steps.build.outcome }}" \
            "${{ steps.worker.outcome }}"; do
            if [[ "$result" != "success" ]]; then
              failures=1
            fi
          done
          exit "$failures"
