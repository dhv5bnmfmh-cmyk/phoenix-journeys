name: Apply lore battle persistence fix

on:
  push:
    branches:
      - feature/summer-palace-lore-battle-prototype
    paths:
      - .github/apply-lore-battle-persistence-fix

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip lore-persistence-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/summer-palace-lore-battle-prototype
          fetch-depth: 0

      - name: Apply persistence fix
        run: python3 .github/apply-lore-battle-persistence-fix

      - name: Remove one-shot patch files
        run: |
          rm .github/apply-lore-battle-persistence-fix
          rm .github/workflows/apply-lore-battle-persistence-fix.yml

      - name: Commit persistence fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/screens/journey_screen.dart .github
          git commit -m "fix: persist completed lore battle progress [skip lore-persistence-fix]"
          git push origin HEAD:feature/summer-palace-lore-battle-prototype
