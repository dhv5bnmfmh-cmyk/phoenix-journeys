name: PR196 Persist Dart Format

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  format-persist:
    if: github.event.pull_request.number == 196
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact PR head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          echo "Format input HEAD: $actual"
          test "$actual" = "$expected"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve app dependencies
        working-directory: app
        run: flutter pub get

      - name: Format changed Dart files with resolved package config
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mapfile -t files < <(git diff --name-only origin/main...HEAD -- app/lib app/test | grep '\.dart$' || true)
          if ((${#files[@]} == 0)); then
            echo "No changed Dart files."
            exit 0
          fi
          cd app
          rel=()
          for f in "${files[@]}"; do
            rel+=("${f#app/}")
          done
          dart format "${rel[@]}"
          dart format --output=none --set-exit-if-changed "${rel[@]}"

      - name: Commit persistent formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/lib app/test; then
            echo "Dart formatting already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib app/test
          git diff --cached --check
          git commit -m "style: format PR196 Dart sources"
          git push origin HEAD:feature/forbidden-city-final-integration
