name: Phoenix macOS Fallback Preview

on:
  push:
    branches:
      - feature/batch-one-remediation-preview

permissions:
  contents: read
  statuses: write

concurrency:
  group: phoenix-macos-fallback-${{ github.ref }}
  cancel-in-progress: true

env:
  PREVIEW_WORKER: phoenix-journeys-pr-152-fallback
  PREVIEW_URL: https://phoenix-journeys-pr-152-fallback.7hn5tyrjgh.workers.dev
  PREVIEW_RELEASE: ${{ github.sha }}

jobs:
  validate-and-preview:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Check out exact Head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact Head
        shell: bash
        run: |
          tested_sha="$(git rev-parse HEAD)"
          test "$tested_sha" = "$GITHUB_SHA"
          echo "Exact Head: $tested_sha"

      - name: Test Phoenix agents
        run: node --test worker/*.test.mjs

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test Flutter app
        working-directory: app
        run: flutter test

      - name: Generate and enforce Journey quality report
        working-directory: app
        env:
          PHOENIX_GENERATE_QUALITY_REPORT: '1'
          PHOENIX_QUALITY_MARKDOWN: ${{ github.workspace }}/journey-quality-report.md
          PHOENIX_QUALITY_JSON: ${{ github.workspace }}/journey-quality-report.json
        shell: bash
        run: |
          flutter test test/journey_quality_report_ci_test.dart --reporter expanded
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('../journey-quality-report.json', 'utf8'));
          console.log(`Quality: ${report.approvedCount}/${report.inspectionCount}`);
          if (!report.canPublish) process.exit(1);
          NODE

      - name: Build web release
        working-directory: app
        run: flutter build web --release

      - name: Deploy isolated fallback Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy \
            --name "$PREVIEW_WORKER" \
            --var "PHOENIX_RELEASE:$PREVIEW_RELEASE"

      - name: Verify Preview release health
        shell: bash
        run: |
          health_url="${PREVIEW_URL}/api/health?commit=${PREVIEW_RELEASE}"
          for attempt in {1..24}; do
            response="$(curl --fail --silent --show-error "$health_url" || true)"
            echo "Health ${attempt}/24: ${response:-no response}"
            if node -e '
              let health;
              try { health = JSON.parse(process.argv[1]); } catch (_) { process.exit(1); }
              if (!health.ok || !health.ai || health.service !== "phoenix-journeys" || health.release !== process.argv[2]) process.exit(1);
            ' "$response" "$PREVIEW_RELEASE"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Publish fallback Preview status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          target="${PREVIEW_URL}/?unlock=all&prototype=journeys&v=${PREVIEW_RELEASE}"
          payload="$(node -e 'process.stdout.write(JSON.stringify({state:"success",description:"macOS fallback Preview ready",context:"cloudflare/fallback-preview",target_url:process.argv[1]}))' "$target")"
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${PREVIEW_RELEASE}" \
            --data "$payload"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-pr-152-macos-fallback-${{ github.sha }}
          path: |
            journey-quality-report.md
            journey-quality-report.json
          if-no-files-found: warn
