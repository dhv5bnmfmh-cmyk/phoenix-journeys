name: Reference convergence patch

on:
  push:
    branches:
      - reference/forbidden-city-final-convergence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reference/forbidden-city-final-convergence
      - name: Apply convergence patch
        run: python3 tools/apply_forbidden_city_final_convergence.py
      - name: Check patch
        run: git diff --check
      - name: Commit patched runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/apply_forbidden_city_final_convergence.py .github/workflows/reference-convergence-patch.yml
          git add -A
          git commit -m "Wire Forbidden City Reference Journey final convergence"
          git push
