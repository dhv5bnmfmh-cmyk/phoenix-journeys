name: Optimize Interactive Story Hot Path

on:
  push:
    branches:
      - preview/batch-1-final-founder-review
    paths:
      - '.github/workflows/interactive-story-hotpath-cleanup.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: preview/batch-1-final-founder-review
          fetch-depth: 0
      - name: Add immutable entries identity fast path
        run: python3 -c "from pathlib import Path; p=Path('app/lib/widgets/interactive_story_text.dart'); s=p.read_text(); old='    final entriesChanged = !vocabularyWordListsEquivalent(\n      oldWidget.entries.map((entry) => entry.word),\n      widget.entries.map((entry) => entry.word),\n    );'; new='    final entriesChanged =\n        !identical(oldWidget.entries, widget.entries) &&\n        !vocabularyWordListsEquivalent(\n          oldWidget.entries.map((entry) => entry.word),\n          widget.entries.map((entry) => entry.word),\n        );'; assert s.count(old)==1; p.write_text(s.replace(old,new))"
      - name: Commit optimization
        run: |
          git rm .github/workflows/interactive-story-hotpath-cleanup.yml
          git add app/lib/widgets/interactive_story_text.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: skip unchanged Story vocabulary parsing'
          git push origin HEAD:preview/batch-1-final-founder-review
