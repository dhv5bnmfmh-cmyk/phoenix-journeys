name: Insert special story intro

on:
  push:
    branches:
      - preview/stable-journey-bf5fdf
    paths:
      - tools/insert_special_story_intro.py
      - .github/workflows/insert-special-story-intro.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/stable-journey-bf5fdf
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python3 tools/insert_special_story_intro.py
      - run: dart format app/lib/screens/journey_screen.dart app/lib/widgets/special_realm_story_intro.dart
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/screens/journey_screen.dart app/lib/widgets/special_realm_story_intro.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add cinematic story prologues to special journeys"
          git push origin HEAD:preview/stable-journey-bf5fdf
