name: Apply Founder Revision 1B
on:
  push:
    branches:
      - gold/guangzhou-chen-clan-story
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gold/guangzhou-chen-clan-story
          fetch-depth: 0
      - name: Apply exact revision
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('app/lib/data/guangzhou_chen_clan_one_pass.dart')
          s=p.read_text()
          pairs=[
          ('梁遥没有向贺真解释一套理论，也没有把失败碎片重新分类。她直接换第二张纸，在主要形体的关系不变的前提下改变连接方法：停止逐线切割，在容易断开的节点保留纸桥。','梁遥把散开的几片并回原来的位置，看了一遍断口，随后直接换上第二张纸。她在主要形体的关系不变的前提下改变连接方法：停止逐线切割，在容易断开的节点保留纸桥。'),
          ('梁遥没有接受“断开也算作品”，更没有因为时间压力拒绝一个可行机会。她要的是成功的纸对象，只是成功条件必须改写。她在第二张纸上重画连接：保留形体的相对位置和主要方向，在原本会被彻底切开的地方留下纸桥，让结构先满足纸的连续性。剪完以后，她捏住一个角把原型提起，整张纸悬在手里仍是一件完整对象。贺真作为同伴而不是导师，没有替她下结论；他只是看着成品，准确指出两组主要形体之间的关系仍然可读。','梁遥把散开的第一件放到桌边，重新铺开第二张纸。她仍要做成一件可以完整拿起的纸作品，只是连接方法必须改变。她在第二张纸上重画连接：保留形体的相对位置和主要方向，在原本会被彻底切开的地方留下纸桥，让结构先满足纸的连续性。剪完以后，她捏住一个角把原型提起，整张纸悬在手里仍是一件完整对象。贺真没有看她的底稿，只看着成品。几秒后，他准确指出两组主要形体之间仍然可读的相接关系。'),
          ('成功来自改变编码，而不是牺牲结果。','第二张纸的局部轮廓已经改变，但整张纸仍连在一起，那组重要关系也没有消失。')]
          for a,b in pairs:
            assert s.count(a)==1,(a[:20],s.count(a))
            s=s.replace(a,b)
          p.write_text(s)
          p=Path('app/test/guangzhou_chen_clan_one_pass_gate_test.dart')
          s=p.read_text()
          a="""  test('Lv9/Lv10 reader Story excludes semantic-governance meta language', () {
    final advancedStory = <String>[
      ...guangzhouChenClanOnePassLevels[8].storyParagraphs,
      ...guangzhouChenClanOnePassLevels[9].storyParagraphs,
    ].join();
    const forbiddenMeta = <String>[
      '历史证据',
      '重新分类',
      '历史解释',
      '导师',
      '妥协',
      '改分类',
      '故意残缺',
    ];
    for (final phrase in forbiddenMeta) {
      expect(advancedStory, isNot(contains(phrase)), reason: phrase);
    }
    expect(advancedStory, contains('把断开的几片重新并在桌上'));
    expect(advancedStory, contains('把草图扣在桌面，只看成品'));
    expect(advancedStory, contains('纸桥改变了局部轮廓'));
  });
"""
          b="""  test('Lv6-Lv10 reader Story excludes semantic-governance meta language', () {
    final advancedStory = <String>[
      for (var index = 5; index <= 9; index++)
        ...guangzhouChenClanOnePassLevels[index].storyParagraphs,
    ].join();
    const forbiddenMeta = <String>[
      '历史证据',
      '重新分类',
      '历史解释',
      '导师',
      '妥协',
      '改分类',
      '故意残缺',
      '时间压力拒绝',
      '因为时间压力拒绝',
      '牺牲结果',
    ];
    for (final phrase in forbiddenMeta) {
      expect(advancedStory, isNot(contains(phrase)), reason: phrase);
    }
    expect(guangzhouChenClanOnePassLevels[5].storyParagraphs.join(), contains('把散开的几片并回原来的位置'));
    expect(guangzhouChenClanOnePassLevels[6].storyParagraphs.join(), contains('贺真没有看她的底稿，只看着成品'));
    expect(guangzhouChenClanOnePassLevels[7].storyParagraphs.join(), contains('第二张纸的局部轮廓已经改变'));
    expect(guangzhouChenClanOnePassLevels[8].storyParagraphs.join(), contains('把断开的几片重新并在桌上'));
    expect(guangzhouChenClanOnePassLevels[8].storyParagraphs.join(), contains('把草图扣在桌面，只看成品'));
    expect(guangzhouChenClanOnePassLevels[9].storyParagraphs.join(), contains('纸桥改变了局部轮廓'));
  });
"""
          assert s.count(a)==1,s.count(a)
          p.write_text(s.replace(a,b))
          PY
          git diff --check
          rm .github/workflows/founder-revision-1b-apply.yml
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Phoenix Founder Revision Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: naturalize Guangzhou advanced Story'
          git push origin HEAD:gold/guangzhou-chen-clan-story
