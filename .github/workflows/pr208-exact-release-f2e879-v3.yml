name: PR208 Exact Release F2E879 V3

on:
  push:
    branches:
      - validation/pr208-pronunciation-product-fix-49a088
    paths:
      - '.github/workflows/pr208-exact-release-f2e879-v3.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: pr208-exact-release-f2e879-v3
  cancel-in-progress: false

env:
  PREVIEW_WORKER: phoenix-journeys-pr-208
  PREVIEW_URL: https://phoenix-journeys-pr-208.7hn5tyrjgh.workers.dev
  PREVIEW_RELEASE: f2e879e3f59510f2139114cadc2a2e464bdc92bb
  PREVIOUS_DEVICE_FAILED_RELEASE: 9c7d00a1ee80b2e50b40a3b6f4922a9d38b3753e

jobs:
  exact-release:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out exact product HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PREVIEW_RELEASE }}
          fetch-depth: 0

      - name: Verify exact product identity and minimal fix lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          test "$(git rev-parse HEAD^)" = "$PREVIOUS_DEVICE_FAILED_RELEASE"
          test -z "$(git status --porcelain)"
          actual="$(git diff --name-only "$PREVIOUS_DEVICE_FAILED_RELEASE".."$PREVIEW_RELEASE" | sort)"
          expected=$'app/lib/screens/journey_screen.dart\napp/test/founder_device_story_continue_regression_test.dart'
          test "$actual" = "$expected"
          git diff --exit-code "$PREVIOUS_DEVICE_FAILED_RELEASE".."$PREVIEW_RELEASE" -- app/lib/widgets/word_detail_sheet.dart
          git diff --exit-code "$PREVIOUS_DEVICE_FAILED_RELEASE".."$PREVIEW_RELEASE" -- app/lib/data/forbidden_city_story_runtime.dart

      - name: Preflight checked-in harness syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find .github/scripts -type f -name '*.mjs' -print0)
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(find .github/scripts -type f -name '*.sh' -print0)
          while IFS= read -r -d '' file; do python3 -m py_compile "$file"; done < <(find .github/scripts -type f -name '*.py' -print0)
          find .github/scripts -type d -name '__pycache__' -prune -exec rm -rf {} +

      - name: Targeted worker tests
        shell: bash
        run: |
          set -euo pipefail
          node --test worker/*.test.mjs
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Prepare proven Flutter harness patcher
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr208_apply_harness.py <<'PY'
          from pathlib import Path

          perf = Path('app/test/journey_runtime_performance_gate_test.dart')
          text = perf.read_text()
          old3 = "    expect(build, contains('3 => stepThreePage'));\n"
          new3 = r"""    expect(
              RegExp(
                r'3\s*=>\s*stepThreePage\s*==\s*PilotN1CompositePage\.reflection[\s\S]*?\?\s*_wonderPage\(\)\s*:\s*_challengePage\(\)',
              ).hasMatch(build),
              isTrue,
            );
          """
          old4 = "    expect(build, contains('4 => stepFourPage'));\n"
          new4 = r"""    expect(
              RegExp(
                r'4\s*=>\s*stepFourPage\s*==\s*PilotN1CompositePage\.writing[\s\S]*?\?\s*_expressPage\(\)\s*:\s*_memoryPage\(\)',
              ).hasMatch(build),
              isTrue,
            );
          """
          if text.count(old3) != 1 or text.count(old4) != 1:
              raise SystemExit('step 3/4 stale matcher anchors are not unique')
          perf.write_text(text.replace(old3, new3, 1).replace(old4, new4, 1))

          settings = Path('app/test/settings_journey_session_lock_test.dart')
          text = settings.read_text()
          old = "contains('snapshotJourneySessionProfile(_phoenixLevelController)')"
          new = "matches(RegExp(r'snapshotJourneySessionProfile\\(\\s*_phoenixLevelController,?\\s*\\)'))"
          if text.count(old) != 1:
              raise SystemExit('settings harness matcher anchor is not unique')
          settings.write_text(text.replace(old, new, 1))

          story = Path('app/test/founder_story_vocabulary_transition_regression_test.dart')
          text = story.read_text()
          marker = "      reason: 'Vocabulary phase must render its first word after Continue.',\n    );"
          if text.count(marker) != 1:
              raise SystemExit('Story to Vocabulary teardown marker is not unique')
          teardown = (
              marker
              + "\n\n    // Harness-only teardown: consume production WordDetailSheet TTS timeout."
              + "\n    await tester.pump(const Duration(seconds: 4));"
              + "\n    await tester.pump(const Duration(milliseconds: 500));"
              + "\n    await tester.pump();"
          )
          text = text.replace(marker, teardown, 1)

          import_anchor = "import 'package:flutter/material.dart';\n"
          import_line = "import 'package:flutter/services.dart';\n"
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('flutter services import anchor is not unique')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          controller_anchor = "      final controller = NarrationController();\n      addTearDown(controller.dispose);"
          if text.count(controller_anchor) != 1:
              raise SystemExit('NarrationController teardown anchor is not unique')
          replacement = """      const flutterTtsChannel = MethodChannel('flutter_tts');
              TestDefaultBinaryMessengerBinding.instance.defaultBinaryMessenger
                  .setMockMethodCallHandler(flutterTtsChannel, (call) async {
                if (call.method == 'stop') return 1;
                return null;
              });
              addTearDown(() {
                TestDefaultBinaryMessengerBinding.instance.defaultBinaryMessenger
                    .setMockMethodCallHandler(flutterTtsChannel, null);
              });

              final controller = NarrationController();
              addTearDown(controller.dispose);"""
          story.write_text(text.replace(controller_anchor, replacement, 1))
          PY
          python3 -m py_compile /tmp/pr208_apply_harness.py

      - name: Apply proven harness protections for targeted tests
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/pr208_apply_harness.py
          test "$(git diff --name-only | sort)" = $'app/test/founder_story_vocabulary_transition_regression_test.dart\napp/test/journey_runtime_performance_gate_test.dart\napp/test/settings_journey_session_lock_test.dart'
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"

      - name: Targeted Flutter tests
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter test --reporter expanded test/founder_device_story_continue_regression_test.dart
          flutter test --reporter expanded test/founder_story_vocabulary_transition_regression_test.dart
          flutter test --reporter expanded test/forbidden_city_story_selection_runtime_test.dart --plain-name "Story progress, completion, resume and Memory are isolated by Story ID"
          flutter test --reporter expanded test/journey_runtime_performance_gate_test.dart test/settings_journey_session_lock_test.dart

      - name: Restore exact product before Analyze
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- app/test/founder_story_vocabulary_transition_regression_test.dart app/test/journey_runtime_performance_gate_test.dart app/test/settings_journey_session_lock_test.dart
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Analyze exact product
        working-directory: app
        run: flutter analyze

      - name: Reapply proven harness protections for Full Flutter
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/pr208_apply_harness.py
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"

      - name: Full Flutter and generate quality evidence
        working-directory: app
        shell: bash
        env:
          PHOENIX_GENERATE_QUALITY_REPORT: '1'
          PHOENIX_QUALITY_MARKDOWN: ${{ github.workspace }}/journey-quality-report.md
          PHOENIX_QUALITY_JSON: ${{ github.workspace }}/journey-quality-report.json
        run: flutter test --reporter expanded

      - name: Restore exact product after Full Flutter harness tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- app/test/founder_story_vocabulary_transition_regression_test.dart app/test/journey_runtime_performance_gate_test.dart app/test/settings_journey_session_lock_test.dart
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload journey quality report
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-journey-content-quality-pr-208-f2e879-v3
          path: |
            journey-quality-report.md
            journey-quality-report.json
          if-no-files-found: error

      - name: Enforce quality release decision
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('journey-quality-report.json', 'utf8'));
          if (!report.canPublish) {
            console.error(`Release blocked: ${report.needsRevisionCount} need revision and ${report.blockedCount} blocked.`);
            process.exit(1);
          }
          NODE

      - name: Build exact preview web app once
        working-directory: app
        run: flutter build web --release

      - name: Fingerprint built artifact
        shell: bash
        run: |
          set -euo pipefail
          find app/build/web -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/preview-artifact.sha256
          test -s /tmp/preview-artifact.sha256

      - name: Validate same Cloudflare Worker artifact
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run
          sha256sum -c /tmp/preview-artifact.sha256

      - name: Clean exact release check
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          test -z "$(git status --porcelain --untracked-files=no)"
          sha256sum -c /tmp/preview-artifact.sha256

      - name: Deploy same exact artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          sha256sum -c /tmp/preview-artifact.sha256
          npx --yes wrangler@4 deploy --name "$PREVIEW_WORKER" --var "PHOENIX_RELEASE:$PREVIEW_RELEASE"
          sha256sum -c /tmp/preview-artifact.sha256

      - name: Verify exact product SHA from health
        shell: bash
        run: |
          set -euo pipefail
          health_url="${PREVIEW_URL}/api/health?commit=${PREVIEW_RELEASE}"
          verified=false
          for attempt in {1..18}; do
            response="$(curl --fail --silent --show-error "$health_url" || true)"
            echo "Exact release check ${attempt}/18: ${response:-no response}"
            if node -e '
              let health;
              try { health = JSON.parse(process.argv[1]); } catch (_) { process.exit(1); }
              const expected = process.argv[2];
              if (!health.ok || !health.ai || health.service !== "phoenix-journeys" || health.release !== expected) process.exit(1);
            ' "$response" "$PREVIEW_RELEASE"; then
              verified=true
              break
            fi
            sleep 5
          done
          [[ "$verified" == true ]]

      - name: Publish exact preview status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="${PREVIEW_URL}/?unlock=all&prototype=journeys&v=${PREVIEW_RELEASE}"
          payload="$(node -e '
            const [url] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({state:"success",description:"Isolated Phoenix preview is ready",context:"cloudflare/preview",target_url:url}));
          ' "$target")"
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${PREVIEW_RELEASE}" \
            --data "$payload" >/dev/null
