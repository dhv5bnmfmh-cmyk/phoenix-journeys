name: Authoritative Story Development Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authoritative-story-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authoritative-story-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Enforce single authoritative standard and route
        run: .github/scripts/enforce_authoritative_story_contract.sh
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: app
        run: flutter pub get
      - name: Mandatory Story governance regressions
        working-directory: app
        run: >-
          flutter test --reporter expanded
          test/beijing_temple_of_heaven_runtime_test.dart
          test/authoritative_story_challenge_contract_test.dart
          test/forbidden_city_content_uniqueness_remediation_test.dart
          test/journey_semantic_anti_template_gate_test.dart
          test/forbidden_city_grammar_feedback_marker_test.dart
          test/founder_story_lifecycle_resume_test.dart
          test/narration_resume_offset_test.dart
          test/founder_level_switch_journey_reset_test.dart
          test/founder_device_story_continue_regression_test.dart
          test/founder_challenge_device_regression_test.dart
          test/founder_device_fix_v1_test.dart
          test/forbidden_city_full_lifecycle_level_consistency_test.dart
          test/forbidden_city_story_standard_test.dart
          test/journey_memory_completion_narration_contract_test.dart
      - name: Analyze Golden product
        working-directory: app
        run: flutter analyze
