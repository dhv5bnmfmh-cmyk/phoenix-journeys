name: Phoenix Exact Head Recovery Preview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recovery-exact-head-preview.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_SHA: 65b30d519e31c0725d7fd4d6a2579e6d67682a9c
  PREVIEW_WORKER: phoenix-journeys-pr-152-recovery
  PREVIEW_URL: https://phoenix-journeys-pr-152-recovery.7hn5tyrjgh.workers.dev

jobs:
  validate-and-preview:
    runs-on: macos-14
    steps:
      - name: Check out exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Verify exact identity
        shell: bash
        run: |
          tested_sha="$(git rev-parse HEAD)"
          test "$tested_sha" = "$TARGET_SHA"
          echo "Exact target: $tested_sha"

      - name: Test Phoenix agents
        shell: bash
        run: node --test worker/*.test.mjs

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test Flutter app
        working-directory: app
        run: flutter test

      - name: Generate journey quality report
        working-directory: app
        env:
          PHOENIX_GENERATE_QUALITY_REPORT: '1'
          PHOENIX_QUALITY_MARKDOWN: ${{ github.workspace }}/journey-quality-report.md
          PHOENIX_QUALITY_JSON: ${{ github.workspace }}/journey-quality-report.json
        run: flutter test test/journey_quality_report_ci_test.dart --reporter expanded

      - name: Enforce journey quality gate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('journey-quality-report.json', 'utf8'));
          console.log(`Phoenix quality gate: ${report.approvedCount}/${report.inspectionCount}; minimum ${report.minimumScore}; average ${report.averageScore}.`);
          if (!report.canPublish) process.exit(1);
          NODE

      - name: Build web release
        working-directory: app
        run: flutter build web --release

      - name: Deploy recovery preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --name "$PREVIEW_WORKER" --var "PHOENIX_RELEASE:$TARGET_SHA"

      - name: Verify release health
        shell: bash
        run: |
          health_url="${PREVIEW_URL}/api/health?commit=${TARGET_SHA}"
          for attempt in {1..24}; do
            response="$(curl --fail --silent --show-error "$health_url" || true)"
            echo "Health check ${attempt}/24: ${response:-no response}"
            if node -e '
              let health;
              try { health = JSON.parse(process.argv[1]); } catch (_) { process.exit(1); }
              const expected = process.argv[2];
              if (!health.ok || !health.ai || health.service !== "phoenix-journeys" || health.release !== expected) process.exit(1);
            ' "$response" "$TARGET_SHA"; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Publish result summary
        shell: bash
        run: |
          {
            echo "## Phoenix Exact-Head Recovery PASS"
            echo
            echo "- Target: \`$TARGET_SHA\`"
            echo "- Preview: ${PREVIEW_URL}/?unlock=all&prototype=journeys&v=${TARGET_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
