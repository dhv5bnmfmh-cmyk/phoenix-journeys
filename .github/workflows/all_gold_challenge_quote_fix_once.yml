name: All-Gold Challenge Quote Boundary Fix Once

on:
  push:
    branches:
      - dev/current

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'run all-Gold Challenge quote boundary fix')
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact remediation head
        uses: actions/checkout@v4

      - name: Apply quoted sentence boundary fix
        run: python3 tools/fix_challenge_quote_boundary.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format affected Dart files
        working-directory: app
        run: dart format lib/widgets/journey_challenge_panel.dart test/all_gold_challenge_runtime_snapshot_test.dart

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Run all-Gold active runtime snapshot
        working-directory: app
        run: flutter test test/all_gold_challenge_runtime_snapshot_test.dart --reporter expanded

      - name: Run cross-Gold DNA contracts
        working-directory: app
        run: flutter test test/all_gold_challenge_cross_gold_dna_test.dart --reporter expanded

      - name: Analyze affected runtime
        working-directory: app
        run: flutter analyze lib/widgets/journey_challenge_panel.dart test/all_gold_challenge_runtime_snapshot_test.dart

      - name: Verify whitespace
        run: git diff --check

      - name: Commit validated quote-boundary fix
        shell: bash
        run: |
          git config user.name "Phoenix Remediation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/widgets/journey_challenge_panel.dart app/test/all_gold_challenge_runtime_snapshot_test.dart
          git commit -m "remediate: fix quoted Challenge sentence boundaries"
          git push origin HEAD:dev/current
