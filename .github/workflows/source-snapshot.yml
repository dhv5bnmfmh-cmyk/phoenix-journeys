name: Temporary source snapshot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'feature/batch-1-forbidden-city-bund-remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-source-${{ github.event.pull_request.head.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
