name: Temporary Honghe governance patch

on:
  push:
    branches:
      - dev/current
    paths:
      - .github/workflows/_tmp_honghe_governance_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev/current
          fetch-depth: 0
      - name: Apply exact Honghe post-merge governance closure
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/honghe_patch.py
          python3 /tmp/honghe_patch.py
          git diff --check
          git rm .github/workflows/_tmp_honghe_governance_patch.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/lib/data/journey_narrative_dna_catalog.dart app/lib/data/journey_semantic_fingerprint_catalog.dart app/test/honghe_hani_rice_terraces_gold_test.dart app/test/guangzhou_future_gold_candidate_test.dart app/test/journey_semantic_anti_template_gate_test.dart app/test/longmen_kaiping_compliance_closure_test.dart .github/workflows/_tmp_honghe_governance_patch.yml
          git commit -m 'chore: close Honghe Gold governance lifecycle'
          git push origin HEAD:dev/current