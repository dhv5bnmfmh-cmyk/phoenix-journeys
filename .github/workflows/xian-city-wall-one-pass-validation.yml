name: Xi'an City Wall Exact-Release E2E

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'app/lib/data/xian_city_wall_one_pass.dart'
      - 'app/lib/data/batch_one_adaptive_story_levels.dart'
      - 'app/lib/data/dedicated_adaptive_journey_catalog.dart'
      - 'app/lib/data/adaptive_journey_level_runtime.dart'
      - 'app/lib/data/journey_startup_metadata.dart'
      - 'app/lib/data/journey_city_catalog.dart'
      - 'app/lib/data/journey_geography_catalog.dart'
      - 'app/lib/services/journey_location_binding.dart'
      - 'app/lib/screens/city_passport_screen.dart'
      - 'app/lib/screens/home_shell.dart'
      - 'app/lib/screens/journey_screen.dart'
      - 'app/lib/widgets/**'
      - 'app/test/xian_city_wall_one_pass_gate_test.dart'
      - 'app/web/**'
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/scripts/**'
      - '.github/workflows/xian-city-wall-one-pass-validation.yml'
      - '.github/workflows/preview-cloudflare.yml'
      - '.github/workflows/flutter-ci.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: xian-city-wall-e2e-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
  PREVIEW_URL: https://phoenix-journeys-pr-${{ github.event.pull_request.number }}.7hn5tyrjgh.workers.dev/

jobs:
  xian-city-wall-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 125

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "XI'AN E2E CANDIDATE SHA = $CANDIDATE_SHA"

      - name: Cheap Xi'an harness preflight
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            .github/scripts/exact_workflow_contract.mjs \
            .github/scripts/flutter_semantics_live.mjs \
            .github/scripts/journey_e2e_core.mjs \
            .github/scripts/verify_xian_city_wall_live.mjs; do
            node --check "$file"
          done
          node --test \
            .github/scripts/exact_workflow_contract.test.mjs \
            .github/scripts/flutter_semantics_live.test.mjs \
            .github/scripts/semantic_action_safety_scan.test.mjs
          node .github/scripts/semantic_action_safety_scan.mjs \
            .github/scripts/flutter_semantics_live.mjs \
            .github/scripts/journey_e2e_core.mjs \
            .github/scripts/verify_xian_city_wall_live.mjs

      - name: Resolve successful exact Preview producer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/exact_workflow_contract.mjs \
            await "Cloudflare PR Preview" "$CANDIDATE_SHA" 2700

      - name: Verify exact Preview health identity after producer success
        shell: bash
        run: |
          set -euo pipefail
          health_url="${PREVIEW_URL}api/health?commit=${CANDIDATE_SHA}"
          for attempt in {1..12}; do
            response="$(curl --fail --silent --show-error "$health_url" || true)"
            if RESPONSE="$response" EXPECTED="$CANDIDATE_SHA" node -e '
              const health = JSON.parse(process.env.RESPONSE);
              if (health.ok !== true || health.ai !== true || health.service !== "phoenix-journeys" || health.release !== process.env.EXPECTED) process.exit(1);
            '; then
              echo "XI'AN EXACT PREVIEW HEALTH = PASS | SHA=$CANDIDATE_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "PREVIEW PRODUCER SUCCEEDED BUT XI'AN EXACT HEALTH IDENTITY IS UNAVAILABLE" >&2
          exit 1

      - name: Install Chromium and WebKit functional drivers
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/xian-e2e-node" playwright
          "$RUNNER_TEMP/xian-e2e-node/node_modules/.bin/playwright" install --with-deps chromium webkit

      - name: Verify Xi'an deterministic Passport entry and representative six-stage experience
        shell: bash
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/xian-e2e-node/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          mkdir -p test-results
          node .github/scripts/verify_xian_city_wall_live.mjs \
            "$PREVIEW_URL" "$CANDIDATE_SHA" \
            2>&1 | tee test-results/xian-city-wall-exact-release-e2e.log

      - name: Upload Xi'an exact-release E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xian-city-wall-e2e-${{ env.CANDIDATE_SHA }}
          path: test-results/
          if-no-files-found: warn
