name: Apply vocabulary popover persistence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: vocabulary-popover-persistence
  cancel-in-progress: false

jobs:
  patch:
    if: github.head_ref == 'agent/narration-voice-picker-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/narration-voice-picker-v1
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extend and preserve vocabulary explanations
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('app/lib/widgets/interactive_story_text.dart')
          text = path.read_text(encoding='utf-8')

          class_anchor = 'class InteractiveStoryText extends StatefulWidget {'
          if 'vocabularyPopoverAutoHideDuration' not in text:
              if class_anchor not in text:
                  raise SystemExit('missing InteractiveStoryText class anchor')
              text = text.replace(
                  class_anchor,
                  'const Duration vocabularyPopoverAutoHideDuration = Duration(seconds: 12);\n\n' + class_anchor,
                  1,
              )

          if '_scheduleEntryHide(WordEntry entry)' not in text:
              show_pattern = re.compile(
                  r'  void _showEntry\(WordEntry entry\) \{.*?\n  void _hideEntry\(\)',
                  re.S,
              )
              new_show = '''  void _showEntry(WordEntry entry) {
            setState(() => _selectedEntry = entry);
            WidgetsBinding.instance.addPostFrameCallback((_) {
              if (!mounted) return;
              Scrollable.ensureVisible(
                context,
                alignment: .18,
                duration: const Duration(milliseconds: 240),
                curve: Curves.easeOutCubic,
              );
            });
            _scheduleEntryHide(entry);
          }

          void _scheduleEntryHide(WordEntry entry) {
            _hideTimer?.cancel();
            _hideTimer = Timer(vocabularyPopoverAutoHideDuration, () {
              if (mounted && identical(_selectedEntry, entry)) {
                setState(() => _selectedEntry = null);
              }
            });
          }

          void _keepEntryVisible() {
            final entry = _selectedEntry;
            if (entry != null) _scheduleEntryHide(entry);
          }

          void _hideEntry()'''
              text, count = show_pattern.subn(new_show, text, count=1)
              if count != 1:
                  raise SystemExit(f'unexpected vocabulary timer match count: {count}')

          if 'word-popover-reading-hold-' not in text:
              popover_pattern = re.compile(
                  r'(?P<indent>\s*)child: _VocabularyPopover\(\s*'
                  r'entry: selectedEntry,\s*'
                  r'state: state,\s*'
                  r'onClose: _hideEntry,\s*'
                  r'\),'
              )

              def wrap_popover(match):
                  indent = match.group('indent')
                  return (
                      f"{indent}child: Listener(\n"
                      f"{indent}  key: ValueKey(\n"
                      f"{indent}    'word-popover-reading-hold-${{selectedEntry.word}}',\n"
                      f"{indent}  ),\n"
                      f"{indent}  behavior: HitTestBehavior.translucent,\n"
                      f"{indent}  onPointerDown: (_) => _keepEntryVisible(),\n"
                      f"{indent}  child: _VocabularyPopover(\n"
                      f"{indent}    entry: selectedEntry,\n"
                      f"{indent}    state: state,\n"
                      f"{indent}    onClose: _hideEntry,\n"
                      f"{indent}  ),\n"
                      f"{indent}),"
                  )

              text, count = popover_pattern.subn(wrap_popover, text, count=1)
              if count != 1:
                  raise SystemExit(f'unexpected vocabulary widget match count: {count}')

          path.write_text(text, encoding='utf-8')
          PY

          cat > app/test/vocabulary_popover_persistence_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:phoenix_journeys/widgets/interactive_story_text.dart';

          void main() {
            test('inline vocabulary explanation stays visible long enough to read', () {
              expect(
                vocabularyPopoverAutoHideDuration,
                const Duration(seconds: 12),
              );
              expect(
                vocabularyPopoverAutoHideDuration > const Duration(seconds: 8),
                isTrue,
              );
            });
          }
          DART

          cat > worker/vocabulary_popover_persistence_rule.test.mjs <<'JS'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const storyText = readFileSync(
            'app/lib/widgets/interactive_story_text.dart',
            'utf8',
          );

          test('inline vocabulary explanation remains readable and user-controlled', () => {
            assert.match(
              storyText,
              /vocabularyPopoverAutoHideDuration = Duration\(seconds: 12\)/,
            );
            assert.match(storyText, /void _scheduleEntryHide\(WordEntry entry\)/);
            assert.match(storyText, /void _keepEntryVisible\(\)/);
            assert.match(storyText, /word-popover-reading-hold-/);
            assert.match(storyText, /onPointerDown: \(_\) => _keepEntryVisible\(\)/);
            assert.match(storyText, /onClose: _hideEntry/);
          });
          JS

          dart format \
            app/lib/widgets/interactive_story_text.dart \
            app/test/vocabulary_popover_persistence_test.dart

      - name: Commit vocabulary explanation timing
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No vocabulary popover changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/lib/widgets/interactive_story_text.dart \
            app/test/vocabulary_popover_persistence_test.dart \
            worker/vocabulary_popover_persistence_rule.test.mjs
          git commit -m 'Keep inline vocabulary explanations readable longer'
          git push origin HEAD:agent/narration-voice-picker-v1