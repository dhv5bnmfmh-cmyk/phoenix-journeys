name: Complete challenge speakers

on:
  push:
    branches:
      - preview/stable-journey-bf5fdf
    paths:
      - tools/complete_challenge_speakers.py
      - .github/workflows/complete-challenge-speakers.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/stable-journey-bf5fdf
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: python3 tools/complete_challenge_speakers.py
      - run: dart format app/lib/widgets/journey_challenge_panel.dart
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/widgets/journey_challenge_panel.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add narration controls to every challenge surface"
          git push origin HEAD:preview/stable-journey-bf5fdf

# Triggered after the workflow file was available on the branch.
