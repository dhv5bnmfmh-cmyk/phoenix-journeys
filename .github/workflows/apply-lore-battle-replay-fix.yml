name: Apply lore battle replay fix

on:
  push:
    branches:
      - feature/summer-palace-lore-battle-prototype
    paths:
      - .github/apply-lore-battle-replay-fix

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip lore-replay-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/summer-palace-lore-battle-prototype
          fetch-depth: 0

      - name: Apply replay fix
        run: python3 .github/apply-lore-battle-replay-fix

      - name: Remove one-shot patch files
        run: |
          rm .github/apply-lore-battle-replay-fix
          rm .github/workflows/apply-lore-battle-replay-fix.yml

      - name: Commit replay fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/widgets/summer_palace_lore_battle.dart .github
          git commit -m "fix: allow replaying completed lore battle [skip lore-replay-fix]"
          git push origin HEAD:feature/summer-palace-lore-battle-prototype
