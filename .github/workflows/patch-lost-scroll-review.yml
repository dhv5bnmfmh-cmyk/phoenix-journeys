name: Patch lost scroll review

on:
  push:
    branches:
      - feature/summer-palace-lost-scroll-prototype
    paths:
      - .github/scripts/patch_lost_scroll_review.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v4
        with:
          ref: feature/summer-palace-lost-scroll-prototype
          fetch-depth: 0

      - name: Apply review fixes
        run: python3 .github/scripts/patch_lost_scroll_review.py

      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/screens/lost_scroll_prototype_screen.dart app/analysis_options.yaml
          git rm .github/scripts/patch_lost_scroll_review.py
          git rm .github/workflows/patch-lost-scroll-review.yml
          git commit -m "fix: optimize and localize lost scroll prototype"
          git push origin HEAD:feature/summer-palace-lost-scroll-prototype
