name: Forbidden City Architecture E2E Repair

on:
  push:
    branches:
      - feature/forbidden-city-final-integration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/forbidden-city-final-integration
          fetch-depth: 0

      - name: Restore shared Journey architecture and harden Reference UI tests
        shell: bash
        run: |
          set -euo pipefail
          cp app/lib/screens/journey_screen_legacy.dart app/lib/screens/journey_screen.dart
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'app/lib/screens/journey_screen.dart',
              "import '../widgets/word_detail_sheet.dart';\n",
              "import '../widgets/word_detail_sheet.dart';\nimport 'forbidden_city_reference_journey_screen.dart';\n",
          )
          replace_once(
              'app/lib/screens/journey_screen.dart',
              "  Widget build(BuildContext context) {\n    final stepThreePage = _isSummerPalacePilot",
              "  Widget build(BuildContext context) {\n    if (_isForbiddenCity) {\n      return const ForbiddenCityReferenceJourneyScreen();\n    }\n    final stepThreePage = _isSummerPalacePilot",
          )

          ref_screen = Path('app/lib/screens/forbidden_city_reference_journey_screen.dart')
          ref_text = ref_screen.read_text()
          watch = "  Widget build(BuildContext context) {\n    context.watch<AppState>();\n"
          if watch not in ref_text:
              old = "  Widget build(BuildContext context) {\n    if (_loading) {"
              if old not in ref_text:
                  raise SystemExit('Reference screen build marker not found')
              ref_text = ref_text.replace(
                  old,
                  "  Widget build(BuildContext context) {\n    context.watch<AppState>();\n    if (_loading) {",
                  1,
              )
              ref_screen.write_text(ref_text)

          test_path = Path('app/test/forbidden_city_reference_integration_test.dart')
          text = test_path.read_text()
          old = """      final state = await _pumpHarness(tester);\n      await _tapKey(tester, 'forbidden-city-level-$level');\n\n      expect(\n"""
          if old in text:
              text = text.replace(
                  old,
                  """      SharedPreferences.setMockInitialValues(<String, Object>{\n        'phoenix.reference.cn-beijing-dongcheng-forbidden-city.level': level,\n      });\n      final state = await _pumpHarness(tester);\n\n      expect(\n""",
                  1,
              )

          old_return = """      await _tapKey(tester, 'forbidden-city-return');\n      expect(\n        find.byKey(const ValueKey('launch-forbidden-city')),\n        findsOneWidget,\n      );\n"""
          if old_return in text:
              text = text.replace(
                  old_return,
                  """      final completionList = find.byKey(\n        ValueKey('forbidden-city-stage-completion-lv-$level'),\n      );\n      for (var attempt = 0;\n          attempt < 4 &&\n              find.byKey(const ValueKey('forbidden-city-return')).evaluate().isEmpty;\n          attempt++) {\n        await tester.drag(completionList, const Offset(0, -420));\n        await tester.pumpAndSettle();\n      }\n      await _tapKey(tester, 'forbidden-city-return');\n      expect(\n        find.byKey(const ValueKey('launch-forbidden-city')),\n        findsOneWidget,\n      );\n""",
                  1,
              )
          test_path.write_text(text)
          PY

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/screens/journey_screen.dart app/lib/screens/forbidden_city_reference_journey_screen.dart app/test/forbidden_city_reference_integration_test.dart
          if git diff --cached --quiet; then
            echo "Repair already applied"
            exit 0
          fi
          git commit -m "Restore shared Journey architecture and harden Reference E2E"
          git push origin HEAD:feature/forbidden-city-final-integration
