name: Honghe Candidate Patch

on:
  push:
    branches:
      - dev/current
    paths:
      - scripts/apply_honghe_candidate_patch.py
      - .github/workflows/honghe-candidate-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/current
          fetch-depth: 0
      - name: Apply exact Honghe candidate integration
        run: python scripts/apply_honghe_candidate_patch.py
      - name: Verify intended files changed
        run: |
          git diff --check
          git diff -- app/lib/data/journey_expansion_batch_four.dart app/lib/data/journey_semantic_fingerprint_catalog.dart
      - name: Commit integration patch
        run: |
          git config user.name "phoenix-ci"
          git config user.email "actions@users.noreply.github.com"
          git add app/lib/data/journey_expansion_batch_four.dart app/lib/data/journey_semantic_fingerprint_catalog.dart
          git commit -m "feat: integrate Honghe Gold candidate runtime" || exit 0
          git push origin HEAD:dev/current
