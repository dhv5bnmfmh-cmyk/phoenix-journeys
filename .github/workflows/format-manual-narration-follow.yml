name: Format manual narration follow changes

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/format-manual-narration-follow.yml

permissions:
  contents: write

concurrency:
  group: format-manual-narration-follow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.ref == 'agent/narration-voice-picker-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/narration-voice-picker-v1
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: |
          dart format \
            app/lib/widgets/interactive_story_text.dart \
            app/test/narration_auto_follow_test.dart

      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/widgets/interactive_story_text.dart \
            app/test/narration_auto_follow_test.dart
          git commit -m "Format manual narration follow changes"
          git push origin HEAD:agent/narration-voice-picker-v1
