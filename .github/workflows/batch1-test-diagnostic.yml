name: Batch 1 Flutter Test Diagnostic

on:
  push:
    branches:
      - preview/batch-1-final-founder-review
    paths:
      - '.github/workflows/batch1-test-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Capture exact full-test failure
        shell: bash
        run: |
          set +e
          cd app
          flutter test --reporter expanded 2>&1 | tee /tmp/flutter-tests.log
          code=${PIPESTATUS[0]}
          cd ..
          if [[ "$code" -ne 0 ]]; then
            tail -n 400 /tmp/flutter-tests.log > .github/batch1-test-failure.txt
            git config user.name 'Phoenix Preview Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add .github/batch1-test-failure.txt
            git commit -m 'diagnostic: capture Batch 1 full test failure'
            git push
          fi
          exit "$code"
