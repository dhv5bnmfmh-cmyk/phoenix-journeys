name: Startup Performance Regression Audit

on:
  push:
    branches:
      - product/city-standard-v1-beijing-forbidden-city
    paths:
      - 'app/lib/app.dart'
      - 'app/lib/startup_performance_probe.dart'
      - 'app/lib/data/daily_journey_experience.dart'
      - 'app/lib/data/journey_startup_metadata.dart'
      - 'app/lib/screens/explore_screen.dart'
      - 'app/lib/screens/journey_screen.dart'
      - 'app/lib/widgets/interactive_story_text.dart'
      - 'app/web/**'
      - '.github/scripts/startup_instrument.py'
      - '.github/scripts/measure_startup.mjs'
      - '.github/scripts/measure_journey_open_visible.mjs'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'app/lib/app.dart'
      - 'app/lib/startup_performance_probe.dart'
      - 'app/lib/data/daily_journey_experience.dart'
      - 'app/lib/data/journey_startup_metadata.dart'
      - 'app/lib/screens/explore_screen.dart'
      - 'app/lib/screens/journey_screen.dart'
      - 'app/lib/widgets/interactive_story_text.dart'
      - 'app/web/**'
      - '.github/scripts/startup_instrument.py'
      - '.github/scripts/measure_startup.mjs'
      - '.github/scripts/measure_journey_open_visible.mjs'
      - '.github/workflows/startup-performance-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: startup-performance-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '84960f28c3b4c2fa0612e02cb8dcaf02517dc391' }}

jobs:
  benchmark:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 0
      - name: Check out exact current base
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_SHA }}
          path: baseline
          fetch-depth: 0
      - name: Verify exact identities and preflight harness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "$BASE_SHA"
          python3 -m py_compile candidate/.github/scripts/startup_instrument.py
          node --check candidate/.github/scripts/measure_startup.mjs
          node --check candidate/.github/scripts/measure_journey_open_visible.mjs
          python3 candidate/.github/scripts/startup_instrument.py "$GITHUB_WORKSPACE/baseline" --check-only
          python3 candidate/.github/scripts/startup_instrument.py "$GITHUB_WORKSPACE/candidate" --check-only
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install benchmark browser driver
        run: npm install --no-save --prefix "$RUNNER_TEMP/startup-audit-node" puppeteer-core@24
      - name: Benchmark exact base and candidate
        shell: bash
        env:
          PUPPETEER_CORE_PATH: ${{ runner.temp }}/startup-audit-node/node_modules/puppeteer-core/lib/esm/puppeteer/puppeteer-core.js
        run: |
          set -euo pipefail
          mkdir -p startup-performance-results
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_PATH
          benchmark_tree() {
            local tree="$1" label="$2" source_sha="$3"
            test "$(git -C "$tree" rev-parse HEAD)" = "$source_sha"
            python3 candidate/.github/scripts/startup_instrument.py "$tree"
            pushd "$tree/app" >/dev/null
            flutter pub get
            flutter build web --release
            python3 -m http.server 8080 --directory build/web >"$RUNNER_TEMP/${label}-server.log" 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' RETURN
            for _ in {1..30}; do curl --fail --silent http://127.0.0.1:8080/ >/dev/null && break; sleep 1; done
            node "$GITHUB_WORKSPACE/candidate/.github/scripts/measure_startup.mjs" http://127.0.0.1:8080/ "$GITHUB_WORKSPACE/startup-performance-results/${label}-timings.json" "$source_sha"
            node "$GITHUB_WORKSPACE/candidate/.github/scripts/measure_journey_open_visible.mjs" http://127.0.0.1:8080/ "$GITHUB_WORKSPACE/startup-performance-results/${label}-journey-open-visible.json" "$source_sha"
            kill "$server_pid"
            trap - RETURN
            popd >/dev/null
          }
          benchmark_tree "$GITHUB_WORKSPACE/baseline" baseline "$BASE_SHA"
          benchmark_tree "$GITHUB_WORKSPACE/candidate" candidate "$CANDIDATE_SHA"
      - name: Enforce no material startup regression
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('startup-performance-results')
          before = json.loads((root / 'baseline-timings.json').read_text())
          after = json.loads((root / 'candidate-timings.json').read_text())
          before_visible = json.loads((root / 'baseline-journey-open-visible.json').read_text())
          after_visible = json.loads((root / 'candidate-journey-open-visible.json').read_text())
          failed = []
          for scenario in ('cold_new','warm_new','cold_existing','warm_existing'):
              b = before['stats'][scenario]['totalToMeaningfulMs']['median']
              a = after['stats'][scenario]['totalToMeaningfulMs']['median']
              print(f'[{scenario}] total BEFORE={b} AFTER={a}')
              if b is None or a is None: failed.append(f'{scenario}: missing total startup evidence')
              elif a > b * 1.15: failed.append(f'{scenario}: total startup regressed >15%')
              ready = after['stats'][scenario]['homeReadyBeforeBrandingDeadlineMs']['median']
              fade = after['stats'][scenario]['brandingDeadlineToFadeStartMs']['max']
              removal = after['stats'][scenario]['coverRemovalAfterFadeStartMs']['max']
              if ready is None or ready < 0: failed.append(f'{scenario}: Home not ready before branding deadline')
              if fade is None or fade > 250: failed.append(f'{scenario}: branding deadline to fade >250ms')
              if removal is None or removal > 1000: failed.append(f'{scenario}: cover removal after fade >1000ms')
          b_open = before_visible['medianMs']
          a_open = after_visible['medianMs']
          print(f'[learner-visible] Journey-open BEFORE={b_open} AFTER={a_open}')
          print(f'[instrumentation] candidate legacy Journey-open={after["stats"]["warm_existing"]["journeyOpenStoryUsableMs"]["median"]}')
          if a_open > max(5000, b_open * 1.15): failed.append('learner-visible Journey-open regressed materially')
          if a_open < 5000 and after['stats']['warm_existing']['journeyOpenStoryUsableMs']['median'] > 5000:
              print('INSTRUMENTATION FALSE POSITIVE = CONFIRMED')
          if before_visible.get('pageErrors') or after_visible.get('pageErrors'): failed.append('browser page errors in learner-visible metric')
          if before_visible.get('failedRequests') or after_visible.get('failedRequests'): failed.append('failed requests in learner-visible metric')
          if failed:
              print('STARTUP PERFORMANCE REGRESSION = FAIL')
              for item in failed: print('FAIL:', item)
              raise SystemExit(1)
          print('STARTUP PERFORMANCE REGRESSION = PASS')
          PY
      - name: Upload startup regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-performance-${{ env.CANDIDATE_SHA }}
          path: startup-performance-results/
          if-no-files-found: error
