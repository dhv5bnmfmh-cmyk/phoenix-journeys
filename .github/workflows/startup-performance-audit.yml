name: Startup Performance Audit

on:
  push:
    branches:
      - dev/current
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: startup-performance-${{ github.ref }}
  cancel-in-progress: true

env:
  STARTUP_BASELINE_SHA: eb4e36e6e4246b0e448ecc151f01a7bb3d272c2d

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate harness
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Check out exact startup baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STARTUP_BASELINE_SHA }}
          path: baseline

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install browser driver dependency
        run: npm install --no-save --prefix "$RUNNER_TEMP/startup-audit-node" puppeteer-core@24

      - name: Write measurement helpers
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/instrument_startup.py" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          lib = root / 'app' / 'lib'
          (lib / 'startup_performance_probe.dart').write_text(
              "import 'dart:html' as html;\n\n"
              "void startupPerformanceMark(String name) {\n"
              "  html.window.performance.mark(name);\n"
              "}\n",
              encoding='utf-8',
          )

          main_path = lib / 'main.dart'
          main = main_path.read_text(encoding='utf-8')
          main = main.replace(
              "import 'app.dart';\n",
              "import 'app.dart';\nimport 'startup_performance_probe.dart';\n",
              1,
          )
          old = """Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await const LanguageLevelPreferenceStore().initializePhoenixLevel();
          """
          new = """Future<void> main() async {
            startupPerformanceMark('phoenix-main-entry');
            WidgetsFlutterBinding.ensureInitialized();
            startupPerformanceMark('phoenix-language-init-start');
            await const LanguageLevelPreferenceStore().initializePhoenixLevel();
            startupPerformanceMark('phoenix-language-init-end');
          """
          if old not in main:
              raise SystemExit('main startup shape changed; refusing ambiguous instrumentation')
          main = main.replace(old, new, 1)
          old = """    () {
                runApp(
          """
          new = """    () {
                startupPerformanceMark('phoenix-runapp-start');
                runApp(
          """
          if old not in main:
              raise SystemExit('runApp startup shape changed; refusing ambiguous instrumentation')
          main = main.replace(old, new, 1)
          old = """        ),
              );
            },
          """
          new = """        ),
              );
              WidgetsBinding.instance.addPostFrameCallback((_) {
                startupPerformanceMark('phoenix-first-frame');
              });
            },
          """
          if old not in main:
              raise SystemExit('runApp close shape changed; refusing ambiguous instrumentation')
          main = main.replace(old, new, 1)
          main_path.write_text(main, encoding='utf-8')

          state_path = lib / 'state' / 'access_controlled_app_state.dart'
          state = state_path.read_text(encoding='utf-8')
          state = state.replace(
              "import 'package:flutter/foundation.dart';\n",
              "import 'package:flutter/foundation.dart';\nimport 'package:flutter/scheduler.dart';\n",
              1,
          )
          state = state.replace(
              "import '../data/daily_journey_catalog.dart';\n",
              "import '../data/daily_journey_catalog.dart';\nimport '../startup_performance_probe.dart';\n",
              1,
          )
          old = """  Future<void> load() async {
              loadStatus = AppLoadStatus.loading;
          """
          new = """  Future<void> load() async {
              startupPerformanceMark('phoenix-state-load-start');
              loadStatus = AppLoadStatus.loading;
          """
          if old not in state:
              raise SystemExit('state load shape changed; refusing ambiguous instrumentation')
          state = state.replace(old, new, 1)
          old = """      final preferences = await _preferencesLoader();
              _preferences = preferences;
              _restoreNonCriticalPreferences(preferences);
          """
          new = """      startupPerformanceMark('phoenix-preferences-start');
              final preferences = await _preferencesLoader();
              startupPerformanceMark('phoenix-preferences-ready');
              _preferences = preferences;
              _restoreNonCriticalPreferences(preferences);
              startupPerformanceMark('phoenix-noncritical-preferences-restored');
          """
          if old not in state:
              raise SystemExit('preferences restore shape changed; refusing ambiguous instrumentation')
          state = state.replace(old, new, 1)
          old = """      var committed = await _criticalStore!.readCommitted();
              if (committed == null) {
          """
          new = """      startupPerformanceMark('phoenix-critical-read-start');
              var committed = await _criticalStore!.readCommitted();
              startupPerformanceMark('phoenix-critical-read-end');
              if (committed == null) {
                startupPerformanceMark('phoenix-legacy-build-start');
          """
          if old not in state:
              raise SystemExit('critical read shape changed; refusing ambiguous instrumentation')
          state = state.replace(old, new, 1)
          old = """        committed = await _criticalStore!.commitInitial(
                  legacy.snapshot.toJson(),
                );
              } else if (committed.schemaVersion ==
          """
          new = """        committed = await _criticalStore!.commitInitial(
                  legacy.snapshot.toJson(),
                );
                startupPerformanceMark('phoenix-legacy-build-end');
              } else if (committed.schemaVersion ==
          """
          if old not in state:
              raise SystemExit('legacy commit shape changed; refusing ambiguous instrumentation')
          state = state.replace(old, new, 1)
          old = """      _applyCommitted(
                snapshot,
                revision: committed.revision,
                schemaVersion: committed.schemaVersion,
              );
          """
          new = """      startupPerformanceMark('phoenix-apply-committed-start');
              _applyCommitted(
                snapshot,
                revision: committed.revision,
                schemaVersion: committed.schemaVersion,
              );
              startupPerformanceMark('phoenix-apply-committed-end');
          """
          if old not in state:
              raise SystemExit('apply committed shape changed; refusing ambiguous instrumentation')
          state = state.replace(old, new, 1)
          old = """      _activeIdentityReady = true;
              loadStatus = AppLoadStatus.ready;
            } catch (error, stackTrace) {
          """
          new = """      _activeIdentityReady = true;
              loadStatus = AppLoadStatus.ready;
              startupPerformanceMark('phoenix-state-ready');
            } catch (error, stackTrace) {
          """
          if old not in state:
              raise SystemExit('state-ready shape changed; refusing ambiguous instrumentation')
          state = state.replace(old, new, 1)
          old = """    notifyListeners();
            }

            @override
            Future<void> activateJourney"""
          new = """    notifyListeners();
              if (loadStatus == AppLoadStatus.ready) {
                SchedulerBinding.instance.addPostFrameCallback((_) {
                  startupPerformanceMark('phoenix-first-meaningful-screen');
                });
              }
            }

            @override
            Future<void> activateJourney"""
          if old not in state:
              raise SystemExit('final load notification shape changed; refusing ambiguous instrumentation')
          state = state.replace(old, new, 1)
          state_path.write_text(state, encoding='utf-8')
          PY

          cat > "$RUNNER_TEMP/measure_startup.mjs" <<'JS'
          import puppeteer from process.env.PUPPETEER_CORE_PATH;
          import fs from 'node:fs';

          const url = process.argv[2];
          const output = process.argv[3];
          const chrome = process.env.CHROME_PATH;
          const browser = await puppeteer.launch({
            executablePath: chrome,
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });
          const page = await browser.newPage();
          const client = await page.createCDPSession();
          await client.send('Network.enable');
          await client.send('Network.setCacheDisabled', {cacheDisabled: false});

          async function clearHttpAndWorkerCache() {
            await client.send('Network.clearBrowserCache');
            await client.send('Storage.clearDataForOrigin', {
              origin: new URL(url).origin,
              storageTypes: 'cache_storage,service_workers',
            });
          }

          async function clearLocalState() {
            await client.send('Storage.clearDataForOrigin', {
              origin: new URL(url).origin,
              storageTypes: 'local_storage,indexeddb',
            });
          }

          async function sample(label, {cold, freshState}) {
            if (cold) await clearHttpAndWorkerCache();
            if (freshState) await clearLocalState();
            await page.goto(url, {waitUntil: 'load', timeout: 60000});
            await page.waitForFunction(
              () => performance.getEntriesByName('phoenix-first-meaningful-screen').length > 0,
              {timeout: 60000},
            );
            const result = await page.evaluate(() => {
              const marks = Object.fromEntries(
                performance.getEntriesByType('mark').map((entry) => [entry.name, entry.startTime]),
              );
              const nav = performance.getEntriesByType('navigation')[0];
              const paints = Object.fromEntries(
                performance.getEntriesByType('paint').map((entry) => [entry.name, entry.startTime]),
              );
              const resources = performance.getEntriesByType('resource');
              const wanted = ['flutter_bootstrap.js', 'main.dart.js', 'canvaskit.js', 'canvaskit.wasm'];
              const startupResources = {};
              for (const wantedName of wanted) {
                const entry = resources.find((item) => item.name.includes(wantedName));
                if (entry) {
                  startupResources[wantedName] = {
                    durationMs: entry.duration,
                    transferSize: entry.transferSize,
                    encodedBodySize: entry.encodedBodySize,
                  };
                }
              }
              const diff = (a, b) => marks[a] != null && marks[b] != null ? marks[b] - marks[a] : null;
              return {
                totalToMeaningfulMs: marks['phoenix-first-meaningful-screen'],
                mainEntryToMeaningfulMs: diff('phoenix-main-entry', 'phoenix-first-meaningful-screen'),
                preRunAppMs: diff('phoenix-main-entry', 'phoenix-runapp-start'),
                languageInitMs: diff('phoenix-language-init-start', 'phoenix-language-init-end'),
                firstFrameMs: diff('phoenix-runapp-start', 'phoenix-first-frame'),
                appStateRestoreMs: diff('phoenix-state-load-start', 'phoenix-state-ready'),
                sharedPreferencesMs: diff('phoenix-preferences-start', 'phoenix-preferences-ready'),
                criticalReadMs: diff('phoenix-critical-read-start', 'phoenix-critical-read-end'),
                applyCommittedMs: diff('phoenix-apply-committed-start', 'phoenix-apply-committed-end'),
                firstContentfulPaintMs: paints['first-contentful-paint'] ?? null,
                domContentLoadedMs: nav?.domContentLoadedEventEnd ?? null,
                loadEventMs: nav?.loadEventEnd ?? null,
                responseEndMs: nav?.responseEnd ?? null,
                transferSize: nav?.transferSize ?? null,
                startupResources,
                marks,
              };
            });
            return {label, ...result};
          }

          async function runScenario(label, options, count = 5) {
            const samples = [];
            for (let i = 0; i < count; i += 1) {
              samples.push(await sample(label, options));
            }
            return samples;
          }

          // Warm the HTTP/SW cache once without preserving local state as user state.
          await clearHttpAndWorkerCache();
          await clearLocalState();
          await sample('prewarm', {cold: false, freshState: true});

          const all = {
            cold_new: await runScenario('cold_new', {cold: true, freshState: true}),
            warm_new: await runScenario('warm_new', {cold: false, freshState: true}),
          };
          // warm_new leaves a valid initialized local state for the existing-user paths.
          all.cold_existing = await runScenario('cold_existing', {cold: true, freshState: false});
          all.warm_existing = await runScenario('warm_existing', {cold: false, freshState: false});

          function median(values) {
            const clean = values.filter((v) => Number.isFinite(v)).sort((a, b) => a - b);
            if (!clean.length) return null;
            const mid = Math.floor(clean.length / 2);
            return clean.length % 2 ? clean[mid] : (clean[mid - 1] + clean[mid]) / 2;
          }
          const fields = [
            'totalToMeaningfulMs', 'mainEntryToMeaningfulMs', 'preRunAppMs',
            'languageInitMs', 'firstFrameMs', 'appStateRestoreMs', 'sharedPreferencesMs',
            'criticalReadMs', 'applyCommittedMs', 'firstContentfulPaintMs',
            'domContentLoadedMs', 'loadEventMs', 'responseEndMs',
          ];
          const medians = {};
          for (const [scenario, samples] of Object.entries(all)) {
            medians[scenario] = Object.fromEntries(
              fields.map((field) => [field, median(samples.map((sample) => sample[field]))]),
            );
          }
          fs.writeFileSync(output, JSON.stringify({medians, samples: all}, null, 2));
          console.log(JSON.stringify(medians, null, 2));
          await browser.close();
          JS

      - name: Benchmark baseline and candidate
        shell: bash
        env:
          PUPPETEER_CORE_PATH: ${{ runner.temp }}/startup-audit-node/node_modules/puppeteer-core/lib/esm/puppeteer/puppeteer-core.js
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_PATH
          mkdir -p startup-performance-results

          benchmark_tree() {
            local tree="$1"
            local label="$2"
            pushd "$tree/app" >/dev/null
            flutter pub get
            flutter build web --release
            python3 - "$label" "$GITHUB_WORKSPACE/startup-performance-results/${label}-bundle.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          label, output = sys.argv[1], Path(sys.argv[2])
          build = Path('build/web')
          def size(name):
              path = build / name
              return path.stat().st_size if path.exists() else None
          files = [p for p in build.rglob('*') if p.is_file()]
          report = {
              'label': label,
              'main.dart.js': size('main.dart.js'),
              'flutter_bootstrap.js': size('flutter_bootstrap.js'),
              'flutter.js': size('flutter.js'),
              'asset_manifest': size('assets/AssetManifest.bin'),
              'total_build_bytes': sum(p.stat().st_size for p in files),
              'file_count': len(files),
          }
          output.write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY
            popd >/dev/null

            python3 "$RUNNER_TEMP/instrument_startup.py" "$tree"
            pushd "$tree/app" >/dev/null
            flutter build web --release
            python3 -m http.server 8080 --directory build/web >"$RUNNER_TEMP/${label}-server.log" 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' RETURN
            for _ in {1..30}; do
              curl --fail --silent http://127.0.0.1:8080/ >/dev/null && break
              sleep 1
            done
            PUPPETEER_CORE_PATH="$PUPPETEER_CORE_PATH" \
              node "$RUNNER_TEMP/measure_startup.mjs" \
              http://127.0.0.1:8080/ \
              "$GITHUB_WORKSPACE/startup-performance-results/${label}-timings.json"
            kill "$server_pid"
            trap - RETURN
            popd >/dev/null
          }

          benchmark_tree "$GITHUB_WORKSPACE/baseline" baseline
          benchmark_tree "$GITHUB_WORKSPACE/candidate" candidate

      - name: Summarize startup measurements
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('startup-performance-results')
          baseline = json.loads((root / 'baseline-timings.json').read_text())['medians']
          candidate = json.loads((root / 'candidate-timings.json').read_text())['medians']
          baseline_bundle = json.loads((root / 'baseline-bundle.json').read_text())
          candidate_bundle = json.loads((root / 'candidate-bundle.json').read_text())
          print('STARTUP_BASELINE_SHA =', '${{ env.STARTUP_BASELINE_SHA }}')
          print('CANDIDATE_SHA =', '${{ github.event.pull_request.head.sha || github.sha }}')
          for scenario in ('cold_new', 'warm_new', 'cold_existing', 'warm_existing'):
              print(f'[{scenario}]')
              for field, before in baseline[scenario].items():
                  after = candidate[scenario].get(field)
                  delta = None if before is None or after is None else after - before
                  print(f'{field}: before={before} after={after} delta={delta}')
          print('[bundle]')
          for key, before in baseline_bundle.items():
              if isinstance(before, (int, float)):
                  after = candidate_bundle.get(key)
                  delta = None if after is None else after - before
                  print(f'{key}: before={before} after={after} delta={delta}')
          PY

      - name: Upload startup audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: startup-performance-audit
          path: startup-performance-results/
          if-no-files-found: error
