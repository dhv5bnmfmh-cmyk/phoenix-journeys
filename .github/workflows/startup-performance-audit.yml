name: Startup Performance Regression Audit

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'app/lib/app.dart'
      - 'app/lib/startup_performance_probe.dart'
      - 'app/lib/data/daily_journey_experience.dart'
      - 'app/lib/data/journey_startup_metadata.dart'
      - 'app/lib/screens/explore_screen.dart'
      - 'app/lib/screens/journey_screen.dart'
      - 'app/lib/widgets/interactive_story_text.dart'
      - 'app/web/**'
      - '.github/scripts/startup_instrument.py'
      - '.github/scripts/measure_startup.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: startup-performance-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

jobs:
  benchmark:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 0

      - name: Check out exact current base
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_SHA }}
          path: baseline
          fetch-depth: 0

      - name: Verify exact identities and preflight harness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C baseline rev-parse HEAD)" = "$BASE_SHA"
          python3 -m py_compile candidate/.github/scripts/startup_instrument.py
          node --check candidate/.github/scripts/measure_startup.mjs
          python3 candidate/.github/scripts/startup_instrument.py "$GITHUB_WORKSPACE/baseline" --check-only
          python3 candidate/.github/scripts/startup_instrument.py "$GITHUB_WORKSPACE/candidate" --check-only

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install benchmark browser driver
        run: npm install --no-save --prefix "$RUNNER_TEMP/startup-audit-node" puppeteer-core@24

      - name: Benchmark exact base and candidate
        shell: bash
        env:
          PUPPETEER_CORE_PATH: ${{ runner.temp }}/startup-audit-node/node_modules/puppeteer-core/lib/esm/puppeteer/puppeteer-core.js
        run: |
          set -euo pipefail
          mkdir -p startup-performance-results
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME_PATH

          benchmark_tree() {
            local tree="$1" label="$2" source_sha="$3"
            test "$(git -C "$tree" rev-parse HEAD)" = "$source_sha"
            python3 candidate/.github/scripts/startup_instrument.py "$tree"
            pushd "$tree/app" >/dev/null
            flutter pub get
            flutter build web --release
            python3 -m http.server 8080 --directory build/web >"$RUNNER_TEMP/${label}-server.log" 2>&1 &
            server_pid=$!
            trap 'kill "$server_pid" 2>/dev/null || true' RETURN
            for _ in {1..30}; do
              curl --fail --silent http://127.0.0.1:8080/ >/dev/null && break
              sleep 1
            done
            node "$GITHUB_WORKSPACE/candidate/.github/scripts/measure_startup.mjs" \
              http://127.0.0.1:8080/ \
              "$GITHUB_WORKSPACE/startup-performance-results/${label}-timings.json" \
              "$source_sha"
            kill "$server_pid"
            trap - RETURN
            popd >/dev/null
          }

          benchmark_tree "$GITHUB_WORKSPACE/baseline" baseline "$BASE_SHA"
          benchmark_tree "$GITHUB_WORKSPACE/candidate" candidate "$CANDIDATE_SHA"

      - name: Enforce no material startup regression
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('startup-performance-results')
          before = json.loads((root / 'baseline-timings.json').read_text())
          after = json.loads((root / 'candidate-timings.json').read_text())
          scenarios = ('cold_new', 'warm_new', 'cold_existing', 'warm_existing')
          failed = []

          for scenario in scenarios:
              b_total = before['stats'][scenario]['totalToMeaningfulMs']['median']
              a_total = after['stats'][scenario]['totalToMeaningfulMs']['median']
              b_open = before['stats'][scenario]['journeyOpenStoryUsableMs']['median']
              a_open = after['stats'][scenario]['journeyOpenStoryUsableMs']['median']

              print(f'[{scenario}] total BEFORE={b_total} AFTER={a_total}')
              print(f'[{scenario}] journey-open BEFORE={b_open} AFTER={a_open}')

              if b_total is None or a_total is None:
                  failed.append(f'{scenario}: missing total startup evidence')
              elif a_total > b_total * 1.15:
                  failed.append(f'{scenario}: total startup regressed >15%')

              if b_open is None or a_open is None:
                  failed.append(f'{scenario}: missing Journey-open evidence')
              elif a_open > max(5000, b_open * 1.15):
                  failed.append(f'{scenario}: Journey-open regressed materially')

              ready_margin = after['stats'][scenario]['homeReadyBeforeBrandingDeadlineMs']['median']
              fade_delay = after['stats'][scenario]['brandingDeadlineToFadeStartMs']['max']
              removal_delay = after['stats'][scenario]['coverRemovalAfterFadeStartMs']['max']
              if ready_margin is None or ready_margin < 0:
                  failed.append(f'{scenario}: Home not ready before branding deadline')
              if fade_delay is None or fade_delay > 250:
                  failed.append(f'{scenario}: branding deadline to fade >250ms')
              if removal_delay is None or removal_delay > 1000:
                  failed.append(f'{scenario}: cover removal after fade >1000ms')

          if failed:
              print('STARTUP PERFORMANCE REGRESSION = FAIL')
              for item in failed:
                  print('FAIL:', item)
              raise SystemExit(1)
          print('STARTUP PERFORMANCE REGRESSION = PASS')
          PY

      - name: Upload startup regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-performance-${{ env.CANDIDATE_SHA }}
          path: startup-performance-results/
          if-no-files-found: error
