name: PR208 Level Completeness Candidate V2

on:
  push:
    branches: [validation/pr208-level-stage-completeness-audit]
    paths: ['.github/workflows/pr208-level-completeness-candidate-v2.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE_PRODUCT_SHA: ac471fe477aac3afd4bb9276dd1cb64ae7a7a4a5
  PRODUCT_BRANCH: product/city-standard-v1-beijing-forbidden-city
  CANDIDATE_BRANCH: validation/pr208-full-level-completion-v2

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard frozen product and exact candidate lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$BASE_PRODUCT_SHA"
          git fetch origin "$CANDIDATE_BRANCH"
          git checkout -B "$CANDIDATE_BRANCH" "origin/$CANDIDATE_BRANCH"
          test "$(git merge-base "$BASE_PRODUCT_SHA" HEAD)" = "$BASE_PRODUCT_SHA"

      - name: Apply only audit-confirmed runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/lib/data/forbidden_city_story_runtime.dart')
          s = p.read_text()
          anchor = "import 'forbidden_city_content_pipeline_fixture.dart';\n"
          imp = "import 'forbidden_city_second_story_levels.dart';\n"
          if imp not in s:
              assert anchor in s
              s = s.replace(anchor, anchor + imp, 1)
          s = s.replace(
              'JourneyLevelContent forbiddenCitySecondStoryLevelContent() {',
              'JourneyLevelContent forbiddenCitySecondStoryLevelContent({int phoenixLevel = 6}) {',
              1,
          )
          start = s.find('    words: List<WordEntry>.unmodifiable(')
          end = s.find('    wonderQuestion:', start)
          if start >= 0 and end >= 0:
              s = s[:start] + '''    words: forbiddenCitySecondStoryWordsForLevel(phoenixLevel),
              discoveries: forbiddenCitySecondStoryDiscoveriesForLevel(
                phoenixLevel,
                sourceRefs: List<String>.unmodifiable(
                  package.discoveries.expand((item) => item.sourceRefs).toSet(),
                ),
              ),
          ''' + s[end:]
          assert 'forbiddenCitySecondStoryWordsForLevel(phoenixLevel)' in s

          for helper in (
              '_vocabularyVietnamese',
              '_vocabularyEnglish',
              '_vocabularySymbol',
              '_discoveryVietnamese',
              '_discoveryEnglish',
          ):
              pattern = re.compile(
                  rf"\n(?:// ignore: unused_element\n)?String {re.escape(helper)}\(String id\) => switch \(id\) \{{.*?\n\s*\}};\n",
                  re.S,
              )
              s, count = pattern.subn('\n', s, count=1)
              if count == 0 and f'String {helper}(String id)' in s:
                  raise SystemExit(f'Unable to remove dead helper {helper}')

          s = s.replace(
              '  final content = forbiddenCitySecondStoryLevelContent();',
              '''  final content = forbiddenCitySecondStoryLevelContent(
            phoenixLevel: phoenixLevel,
          );''',
              1,
          )
          assert 'phoenixLevel: phoenixLevel' in s
          p.write_text(s)

          p = Path('app/lib/services/journey_challenge_engine.dart')
          s = p.read_text()
          anchor = "import 'challenge_option_balancer.dart';\n"
          imp = "import 'forbidden_city_challenge_level_standard.dart';\n"
          if imp not in s:
              assert anchor in s
              s = s.replace(anchor, anchor + imp, 1)
          s = s.replace(
              '    if (journeyId != _forbiddenCityJourneyId) return balanced;',
              '''    if (journeyId != _forbiddenCityJourneyId) {
                return applyForbiddenCityLevelChallengeStandard(balanced);
              }''',
              1,
          )
          pattern = re.compile(
              r"    return StoryChallengeSet\(\n"
              r"      journeyId: balanced\.journeyId,\n"
              r"      sessionLevel: balanced\.sessionLevel,\n"
              r"      questions: List<StoryChallengeQuestion>\.unmodifiable\(questions\),\n"
              r"    \);",
          )
          replacement = '''    return applyForbiddenCityLevelChallengeStandard(
              StoryChallengeSet(
                journeyId: balanced.journeyId,
                sessionLevel: balanced.sessionLevel,
                questions: List<StoryChallengeQuestion>.unmodifiable(questions),
              ),
            );'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1 and 'return applyForbiddenCityLevelChallengeStandard(\n      StoryChallengeSet(' not in s:
              raise SystemExit(f'Challenge final return patch count={count}')
          p.write_text(s)

          p = Path('app/test/pr208_level_completeness_contract_test.dart')
          s = p.read_text()
          old = '      if (blank.options.length == 4) positions.add(blank.options.indexOf(blank.answer));\n'
          new = '''      if (blank.options.length == 4) {
                positions.add(blank.options.indexOf(blank.answer));
              }
          '''
          if old in s:
              s = s.replace(old, new, 1)
          if old in s:
              raise SystemExit('Contract test single-line if lint remains')
          p.write_text(s)
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve, format and run permanent level gates
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format \
            lib/data/forbidden_city_second_story_levels.dart \
            lib/data/forbidden_city_story_runtime.dart \
            lib/services/forbidden_city_challenge_level_standard.dart \
            lib/services/journey_challenge_engine.dart \
            test/pr208_level_completeness_contract_test.dart
          flutter test --reporter expanded test/pr208_level_completeness_contract_test.dart

      - name: Preserve existing product gates
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter test --reporter expanded test/journey_vocabulary_context_lazy_test.dart
          flutter test --reporter expanded test/founder_story_vocabulary_transition_regression_test.dart
          flutter test --reporter expanded test/founder_device_story_continue_regression_test.dart
          flutter test --reporter expanded test/forbidden_city_story_selection_runtime_test.dart --plain-name "Story progress, completion, resume and Memory are isolated by Story ID"
          flutter analyze

      - name: Commit and push exact validated candidate source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add \
            app/lib/data/forbidden_city_second_story_levels.dart \
            app/lib/data/forbidden_city_story_runtime.dart \
            app/lib/services/forbidden_city_challenge_level_standard.dart \
            app/lib/services/journey_challenge_engine.dart \
            app/test/pr208_level_completeness_contract_test.dart
          if test -n "$(git diff --cached --name-only)"; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m "fix: complete Forbidden City Lv1-Lv10 learning stages"
            git push origin "HEAD:$CANDIDATE_BRANCH"
          fi
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$BASE_PRODUCT_SHA"

      - name: Materialize proven rendered audit harness
        shell: bash
        run: |
          set -euo pipefail
          git show origin/validation/pr208-level-stage-completeness-audit:app/test/pr208_level_stage_runtime_audit_test.dart > app/test/pr208_level_stage_runtime_audit_test.dart
          git show origin/validation/pr208-level-stage-completeness-audit:.github/scripts/pr208_level_stage_audit_analyze.mjs > /tmp/audit.mjs
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/test/pr208_level_stage_runtime_audit_test.dart')
          s = p.read_text()
          old = '''  SharedPreferences.setMockInitialValues(<String, Object>{});
            PhoenixLevelController.instance.setLevel(level);
            final state = AppState();
            await state.load();
            await state.activateJourney(_journeyId, storyId: storyId);'''
          new = '''  SharedPreferences.setMockInitialValues(<String, Object>{});
            final state = AppState();
            await state.load();
            PhoenixLevelController.instance.setLevel(level);
            await state.activateJourney(_journeyId, storyId: storyId);'''
          if old not in s:
              raise SystemExit('Unable to locate audit level setup block')
          s = s.replace(old, new, 1)

          old_expect = "expect(finder, findsOneWidget, reason: 'missing rebuild tile $chunk');"
          old_tap = 'await _tapFinder(tester, finder);'
          if old_expect not in s or old_tap not in s:
              raise SystemExit('Unable to locate rebuild tile harness block')
          s = s.replace(old_expect, old_expect.replace('findsOneWidget', 'findsWidgets'), 1)
          head, separator, tail = s.rpartition(old_tap)
          if not separator:
              raise SystemExit('Unable to isolate final rebuild tile tap')
          s = head + 'await _tapFinder(tester, finder.first);' + tail
          p.write_text(s)

          p = Path('/tmp/audit.mjs')
          s = p.read_text()
          old = """        if (stage === 'Story' && story.id === 'story.forbidden_city.modern_evidence_handoff.v1') {
                    continue;
                  }
                  if (stage === 'Vocabulary' || stage === 'Discovery' || stage === 'Challenge') {"""
          new = """        if ((stage === 'Story' && story.id === 'story.forbidden_city.modern_evidence_handoff.v1') ||
                      stage === 'Memory' || stage === 'Completion') {
                    adjacentDiffs[adjacentDiffs.length - 1].classification = 'INTENTIONALLY SAME';
                    continue;
                  }
                  if (stage === 'Vocabulary' || stage === 'Discovery' || stage === 'Challenge') {"""
          if old in s: s = s.replace(old, new, 1)
          s = s.replace(
              "if (!feedbackColor.includes('ffff5252')) {",
              "if (!feedbackColor.includes('ffff5252') && !feedbackColor.includes('red: 1.0000, green: 0.3216, blue: 0.3216')) {",
              1,
          )
          s = s.replace(
              "if (!correctColor.includes('ff69f0ae')) {",
              "if (!correctColor.includes('ff69f0ae') && !correctColor.includes('red: 0.4118, green: 0.9412, blue: 0.6824')) {",
              1,
          )
          s = s.replace(
          """        } else if (stage === 'Story' && story.id === 'story.forbidden_city.two_routes_one_map.v1') {
                    fail(b, 'RUNTIME WIRING FAILURE', 'primary Story level binding', `Primary Story Lv${level} and Lv${level + 1} render identically.`);
                  } else if (stage === 'Memory' || stage === 'Completion') {
                    fail(b, 'CONTENT STANDARD FAILURE', 'level-aware reflection/completion', `Only UI-level differences or no meaningful content difference found between Lv${level} and Lv${level + 1}.`);
                  }""",
          """        } else if (stage === 'Story' && story.id === 'story.forbidden_city.two_routes_one_map.v1') {
                    fail(b, 'RUNTIME WIRING FAILURE', 'primary Story level binding', `Primary Story Lv${level} and Lv${level + 1} render identically.`);
                  }""",
          )
          s = s.replace(
          """        if (!feedbackColor.includes('ffff5252')) {
                  fail(row, 'CONTENT STANDARD FAILURE', 'WRONG red feedback', `${q.id} wrong feedback color is ${q.feedbackColor}.`);
                }
                if (!correctColor.includes('ff69f0ae')) {
                  fail(row, 'CONTENT STANDARD FAILURE', 'CORRECT green answer feedback', `${q.id} correct answer color is ${q.correctAnswerColor}.`);
                }""",
          """        const wrongIsRedAccent = feedbackColor.includes('ffff5252') || feedbackColor.includes('red: 1.0000, green: 0.3216, blue: 0.3216');
                const correctIsGreenAccent = correctColor.includes('ff69f0ae') || correctColor.includes('red: 0.4118, green: 0.9412, blue: 0.6824');
                if (!wrongIsRedAccent) fail(row, 'CONTENT STANDARD FAILURE', 'WRONG red feedback', `${q.id} wrong feedback color is ${q.feedbackColor}.`);
                if (!correctIsGreenAccent) fail(row, 'CONTENT STANDARD FAILURE', 'CORRECT green answer feedback', `${q.id} correct answer color is ${q.correctAnswerColor}.`);""",
          )
          p.write_text(s)
          PY

      - name: Render final 120-cell level-stage matrix
        working-directory: app
        env:
          PR208_AUDIT_SHA: ${{ steps.commit.outputs.sha }}
          PR208_LEVEL_STAGE_RAW_JSON: ${{ github.workspace }}/level-stage-raw.json
        run: flutter test --reporter expanded test/pr208_level_stage_runtime_audit_test.dart

      - name: Enforce zero-gap final audit
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/audit.mjs level-stage-raw.json level-stage-results.json level-stage-results.md
          cp level-stage-results.json challenge-compliance-results.json
          node - <<'NODE'
          const r=require('./level-stage-results.json');
          console.log(JSON.stringify(r.auditSummary,null,2));
          if(r.auditSummary.failedCells!==0||r.auditSummary.failureCount!==0) process.exit(1);
          if(r.auditSummary['1_are_all_lv1_lv10_implemented']!=='YES') process.exit(1);
          if(r.auditSummary['8_challenge_compliant']!=='YES') process.exit(1);
          if(r.auditSummary['10_completion_blank_counts_correct']!=='YES') process.exit(1);
          if(r.auditSummary['11_grammar_four_categories_present']!=='YES') process.exit(1);
          if(r.auditSummary['12_sentence_rebuild_le_10_and_meaningful']!=='YES') process.exit(1);
          NODE

      - name: Upload final audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr208-level-stage-results-${{ steps.commit.outputs.sha }}
          path: |
            level-stage-results.json
            level-stage-results.md
            level-stage-raw.json
            challenge-compliance-results.json
          if-no-files-found: error

      - name: Final product branch freeze guard
        run: test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$BASE_PRODUCT_SHA"
