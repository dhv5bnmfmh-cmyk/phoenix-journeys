name: All-Gold Challenge After Snapshot Once

on:
  push:
    branches:
      - dev/current

permissions:
  contents: read

jobs:
  snapshot:
    if: contains(github.event.head_commit.message, 'run all-Gold Challenge after snapshot')
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact remediation head
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Export active all-Gold Challenge AFTER snapshot
        working-directory: app
        env:
          PHOENIX_ALL_GOLD_SNAPSHOT_JSON: ${{ github.workspace }}/all-gold-challenge-after.json
        run: >-
          flutter test test/all_gold_challenge_runtime_snapshot_test.dart
          --reporter expanded

      - name: Validate AFTER snapshot shape
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('all-gold-challenge-after.json', 'utf8'));
          if (p.approvedGoldCount !== 12) throw new Error(`unexpected Gold count ${p.approvedGoldCount}`);
          if (p.expectedChallengeUnits !== 360) throw new Error(`unexpected unit count ${p.expectedChallengeUnits}`);
          if (!Array.isArray(p.rows) || p.rows.length !== 360) throw new Error(`unexpected rows ${p.rows?.length}`);
          const human = p.rows.filter(r => [1,5,10].includes(r.level));
          if (human.length !== 108) throw new Error(`unexpected human checkpoints ${human.length}`);
          fs.writeFileSync('all-gold-challenge-human-108.json', JSON.stringify({
            sourceHead: process.env.GITHUB_SHA,
            rows: human
          }, null, 2));
          console.log(`AFTER_SNAPSHOT approved=${p.approvedGoldCount} units=${p.rows.length} human=${human.length}`);
          NODE

      - name: Upload AFTER runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-all-gold-challenge-after-snapshot
          path: |
            all-gold-challenge-after.json
            all-gold-challenge-human-108.json
          if-no-files-found: error
