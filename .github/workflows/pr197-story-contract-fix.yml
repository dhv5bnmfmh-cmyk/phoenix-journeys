name: PR197 Story Contract Fix

on:
  push:
    branches:
      - feature/forbidden-city-content-only-reference

permissions:
  contents: write

jobs:
  align-and-verify:
    if: ${{ !contains(github.event.head_commit.message || '', '[story-contract-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content-only branch
        uses: actions/checkout@v4
        with:
          ref: feature/forbidden-city-content-only-reference
          fetch-depth: 0

      - name: Align stale Story evidence contract
        run: python3 tools/pr197_story_contract_patch.py

      - name: Verify Story culture level standard
        run: node --test worker/story_culture_level_standard.test.mjs

      - name: Verify full Phoenix agent suite
        run: node --test worker/*.test.mjs

      - name: Commit verified contract alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: align Forbidden City Story evidence with locked content [story-contract-applied]"
          git push origin HEAD:feature/forbidden-city-content-only-reference
