name: Mobile Interaction Audit

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'app/**'
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/scripts/verify_mobile_interaction.mjs'
      - '.github/workflows/mobile-interaction-audit.yml'
      - '.github/workflows/preview-cloudflare.yml'

permissions:
  contents: read

concurrency:
  group: mobile-interaction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
  PREVIEW_URL: https://phoenix-journeys-pr-${{ github.event.pull_request.number }}.7hn5tyrjgh.workers.dev/

jobs:
  mobile-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Preflight mobile harness syntax
        run: node --check .github/scripts/verify_mobile_interaction.mjs

      - name: Wait for exact Cloudflare preview release
        shell: bash
        run: |
          set -euo pipefail
          health_url="${PREVIEW_URL}api/health?commit=${CANDIDATE_SHA}"
          verified=false
          for attempt in {1..180}; do
            response="$(curl --fail --silent --show-error "$health_url" || true)"
            if node -e '
              let health;
              try { health = JSON.parse(process.argv[1]); } catch (_) { process.exit(1); }
              const expected = process.argv[2];
              if (!health.ok || !health.ai || health.service !== "phoenix-journeys" || health.release !== expected) process.exit(1);
            ' "$response" "$CANDIDATE_SHA"; then
              verified=true
              break
            fi
            sleep 5
          done
          [[ "$verified" == true ]]

      - name: Install Chromium and WebKit functional drivers
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/mobile-interaction-node" playwright
          "$RUNNER_TEMP/mobile-interaction-node/node_modules/.bin/playwright" install --with-deps chromium webkit

      - name: Run real deployed mobile functional interaction audit
        shell: bash
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/mobile-interaction-node/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          node .github/scripts/verify_mobile_interaction.mjs \
            "$PREVIEW_URL" \
            "$CANDIDATE_SHA"
