name: Mobile Interaction Audit

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'app/**'
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/scripts/**'
      - '.github/workflows/mobile-interaction-audit.yml'
      - '.github/workflows/preview-cloudflare.yml'
      - '.github/workflows/flutter-ci.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: mobile-interaction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
  PREVIEW_URL: https://phoenix-journeys-pr-${{ github.event.pull_request.number }}.7hn5tyrjgh.workers.dev/

jobs:
  mobile-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Cheap mobile harness preflight
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/exact_workflow_contract.mjs
          node --check .github/scripts/flutter_semantics_live.mjs
          node --check .github/scripts/journey_e2e_core.mjs
          node --check .github/scripts/verify_mobile_interaction_live.mjs
          node --test \
            .github/scripts/exact_workflow_contract.test.mjs \
            .github/scripts/flutter_semantics_live.test.mjs \
            .github/scripts/semantic_action_safety_scan.test.mjs
          node .github/scripts/semantic_action_safety_scan.mjs \
            .github/scripts/flutter_semantics_live.mjs \
            .github/scripts/journey_e2e_core.mjs \
            .github/scripts/verify_mobile_interaction_live.mjs

      - name: Resolve successful exact Preview producer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/exact_workflow_contract.mjs \
            await "Cloudflare PR Preview" "$CANDIDATE_SHA" 2700

      - name: Verify exact Preview health identity after producer success
        shell: bash
        run: |
          set -euo pipefail
          health_url="${PREVIEW_URL}api/health?commit=${CANDIDATE_SHA}"
          for attempt in {1..12}; do
            response="$(curl --fail --silent --show-error "$health_url" || true)"
            if RESPONSE="$response" EXPECTED="$CANDIDATE_SHA" node -e '
              const health = JSON.parse(process.env.RESPONSE);
              if (health.ok !== true || health.ai !== true || health.service !== "phoenix-journeys" || health.release !== process.env.EXPECTED) process.exit(1);
            '; then
              echo "EXACT PREVIEW HEALTH = PASS | SHA=$CANDIDATE_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "PREVIEW PRODUCER SUCCEEDED BUT EXACT HEALTH IDENTITY IS UNAVAILABLE" >&2
          exit 1

      - name: Install Chromium and WebKit functional drivers
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/mobile-interaction-node" playwright
          "$RUNNER_TEMP/mobile-interaction-node/node_modules/.bin/playwright" install --with-deps chromium webkit

      - name: Run real deployed generic mobile functional interaction audit
        shell: bash
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/mobile-interaction-node/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          node .github/scripts/verify_mobile_interaction_live.mjs \
            "$PREVIEW_URL" \
            "$CANDIDATE_SHA"
