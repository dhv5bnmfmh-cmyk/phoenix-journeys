name: Mobile Interaction Audit

on:
  push:
    branches:
      - dev/current
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mobile-interaction-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  STABLE_RUNTIME_REF: aaa02d5a08d9c6fef10141125d3906fc1f8909f3

jobs:
  mobile-interaction:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "MOBILE INTERACTION CANDIDATE SHA = $CANDIDATE_SHA"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Chromium and WebKit functional drivers
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/mobile-interaction-node" playwright
          "$RUNNER_TEMP/mobile-interaction-node/node_modules/.bin/playwright" install --with-deps chromium webkit

      - name: Build release web
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter pub get
          flutter build web --release

      - name: Run real mobile functional interaction audit
        shell: bash
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/mobile-interaction-node/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --directory app/build/web >"$RUNNER_TEMP/mobile-interaction-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            curl --fail --silent http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          node .github/scripts/verify_mobile_interaction.mjs \
            http://127.0.0.1:8080/ \
            "$CANDIDATE_SHA"
          kill "$server_pid"
          trap - EXIT

      - name: Enforce stable-product and learner-content firewall
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$STABLE_RUNTIME_REF"
          git cat-file -e "$STABLE_RUNTIME_REF^{commit}"
          if ! git diff --quiet "$STABLE_RUNTIME_REF" "$CANDIDATE_SHA" -- \
            app/lib \
            app/assets \
            app/web; then
            echo 'STABLE PRODUCT RUNTIME DELTA = FAIL'
            git diff --stat "$STABLE_RUNTIME_REF" "$CANDIDATE_SHA" -- app/lib app/assets app/web
            exit 1
          fi
          if ! git diff --quiet "$STABLE_RUNTIME_REF" "$CANDIDATE_SHA" -- \
            'app/lib/data/**' \
            'app/lib/models/**' \
            'app/assets/**' \
            'worker/journey-content/**'; then
            echo 'LEARNER CONTENT DELTA = FAIL'
            git diff --name-only "$STABLE_RUNTIME_REF" "$CANDIDATE_SHA" -- \
              'app/lib/data/**' \
              'app/lib/models/**' \
              'app/assets/**' \
              'worker/journey-content/**'
            exit 1
          fi
          echo 'STABLE PRODUCT RUNTIME DELTA = NONE'
          echo 'LEARNER CONTENT DELTA = NONE'
