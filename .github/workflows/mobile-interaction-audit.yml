name: Mobile Interaction Audit

on:
  push:
    branches:
      - product/city-standard-v1-beijing-forbidden-city
      - validation/founder-preview-closeout-853cd1
    paths:
      - 'app/lib/app.dart'
      - 'app/lib/screens/explore_screen.dart'
      - 'app/lib/screens/journey_screen.dart'
      - 'app/lib/screens/passport_screen.dart'
      - 'app/lib/screens/city_passport_screen.dart'
      - 'app/lib/state/**'
      - 'app/lib/services/phoenix_level_controller.dart'
      - 'app/lib/data/daily_journey_catalog.dart'
      - 'app/lib/data/journey_city_catalog.dart'
      - 'app/lib/data/journey_geography_catalog.dart'
      - 'app/lib/data/journey_publication_catalog.dart'
      - 'app/lib/widgets/journey_picker_sheet.dart'
      - 'app/lib/widgets/journey_progress_header.dart'
      - 'app/web/**'
      - 'app/test/**'
      - '.github/scripts/verify_mobile_interaction.mjs'
      - '.github/scripts/verify_forbidden_city_preview_v2.mjs'
      - '.github/scripts/journey_level_session_harness.mjs'
      - '.github/scripts/enforce_authoritative_story_contract.sh'
      - '.github/workflows/mobile-interaction-audit.yml'
      - '.github/workflows/preview-cloudflare.yml'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'app/lib/app.dart'
      - 'app/lib/screens/explore_screen.dart'
      - 'app/lib/screens/journey_screen.dart'
      - 'app/lib/screens/passport_screen.dart'
      - 'app/lib/screens/city_passport_screen.dart'
      - 'app/lib/state/**'
      - 'app/lib/services/phoenix_level_controller.dart'
      - 'app/lib/data/daily_journey_catalog.dart'
      - 'app/lib/data/journey_city_catalog.dart'
      - 'app/lib/data/journey_geography_catalog.dart'
      - 'app/lib/data/journey_publication_catalog.dart'
      - 'app/lib/widgets/journey_picker_sheet.dart'
      - 'app/lib/widgets/journey_progress_header.dart'
      - 'app/web/**'
      - 'app/test/**'
      - '.github/scripts/verify_mobile_interaction.mjs'
      - '.github/scripts/journey_level_session_harness.mjs'
      - '.github/scripts/enforce_authoritative_story_contract.sh'
      - '.github/workflows/mobile-interaction-audit.yml'
      - '.github/workflows/preview-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-interaction-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 208 }}
  cancel-in-progress: true

env:
  PRODUCT_SHA: 853cd1e627ef43363f9d795f3dcac6720e99190f
  CANDIDATE_SHA: ${{ github.ref_name == 'validation/founder-preview-closeout-853cd1' && '853cd1e627ef43363f9d795f3dcac6720e99190f' || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
  PREVIEW_URL: https://phoenix-journeys-pr-208.7hn5tyrjgh.workers.dev/

jobs:
  mobile-interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Preflight mobile harness syntax
        run: |
          node --check .github/scripts/verify_mobile_interaction.mjs
          node --check .github/scripts/verify_forbidden_city_preview_v2.mjs

      - name: Wait for exact Cloudflare preview release
        shell: bash
        run: |
          set -euo pipefail
          health_url="${PREVIEW_URL}api/health?commit=${CANDIDATE_SHA}"
          verified=false
          for attempt in {1..360}; do
            response="$(curl --fail --silent --show-error "$health_url" || true)"
            if node -e '
              let health;
              try { health = JSON.parse(process.argv[1]); } catch (_) { process.exit(1); }
              const expected = process.argv[2];
              if (!health.ok || !health.ai || health.service !== "phoenix-journeys" || health.release !== expected) process.exit(1);
            ' "$response" "$CANDIDATE_SHA"; then
              verified=true
              break
            fi
            sleep 5
          done
          [[ "$verified" == true ]]

      - name: Install Chromium and WebKit functional drivers
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/mobile-interaction-node" playwright
          "$RUNNER_TEMP/mobile-interaction-node/node_modules/.bin/playwright" install --with-deps chromium webkit

      - name: Run real deployed mobile functional interaction audit
        shell: bash
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/mobile-interaction-node/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          node .github/scripts/verify_mobile_interaction.mjs \
            "$PREVIEW_URL" \
            "$CANDIDATE_SHA"

      - name: Run deployed Golden Challenge 2x6 mobile WebKit audit
        shell: bash
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/mobile-interaction-node/node_modules/playwright/index.mjs
          PHOENIX_BROWSER: webkit
          PHOENIX_TARGET_LEVELS: 1,3,5,7,10
        run: |
          set -euo pipefail
          node .github/scripts/verify_forbidden_city_preview_v2.mjs \
            "$PREVIEW_URL" \
            "$CANDIDATE_SHA"
