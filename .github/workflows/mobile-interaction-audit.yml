name: Mobile Interaction Audit

on:
  push:
    branches:
      - dev/current
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mobile-interaction-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  # Exact PR #195 base snapshot. It already contains the accepted PR #194
  # product/runtime state, so any later drift in those stable areas is rejected.
  PR194_STABLE_PRODUCT_REF: e3d1f30b951d6ab27d7660b9b729d4f8af9a8d49

jobs:
  mobile-interaction:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "MOBILE INTERACTION CANDIDATE SHA = $CANDIDATE_SHA"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Chromium and WebKit functional drivers
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix "$RUNNER_TEMP/mobile-interaction-node" playwright
          "$RUNNER_TEMP/mobile-interaction-node/node_modules/.bin/playwright" install --with-deps chromium webkit

      - name: Build release web
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter pub get
          flutter build web --release

      - name: Run real mobile functional interaction audit
        shell: bash
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/mobile-interaction-node/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --directory app/build/web >"$RUNNER_TEMP/mobile-interaction-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            curl --fail --silent http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done
          node .github/scripts/verify_mobile_interaction.mjs \
            http://127.0.0.1:8080/ \
            "$CANDIDATE_SHA"
          kill "$server_pid"
          trap - EXIT

      - name: Enforce stable-product and learner-content firewall
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PR194_STABLE_PRODUCT_REF"
          git cat-file -e "$PR194_STABLE_PRODUCT_REF^{commit}"

          mapfile -t product_delta < <(
            git diff --name-only "$PR194_STABLE_PRODUCT_REF" "$CANDIDATE_SHA" -- \
              app/lib app/assets app/web
          )

          authorized_deep_compliance_count=0
          for path in "${product_delta[@]}"; do
            case "$path" in
              app/lib/data/adaptive_journey_level_runtime.dart|\
              app/lib/data/phoenix_level_calibration_matrix.dart|\
              app/lib/data/special_journey_expansion_batch_one_enrichment.dart|\
              app/lib/models/language_proficiency.dart|\
              app/lib/services/special_journey_story_length_expander.dart)
                echo "AUTHORIZED PR195 DEEP-COMPLIANCE DELTA = $path"
                authorized_deep_compliance_count=$((authorized_deep_compliance_count + 1))
                ;;
              *)
                echo "UNAUTHORIZED PRODUCT OR LEARNER CONTENT DELTA = $path"
                exit 1
                ;;
            esac
          done

          echo "AUTHORIZED PR195 DEEP-COMPLIANCE RUNTIME DELTA = PASS ($authorized_deep_compliance_count files)"
          echo 'PR194 STABLE PRODUCT AREA DRIFT = NONE'
          echo 'UNAUTHORIZED PRODUCT DELTA = NONE'
          echo 'UNAUTHORIZED CROSS-JOURNEY DELTA = NONE'
