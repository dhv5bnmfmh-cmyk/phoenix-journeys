name: Founder Device Exact Release 49a088

on:
  push:
    branches:
      - validation/founder-device-exact-release-49a088
    paths:
      - '.github/workflows/founder-device-exact-release-49a088.yml'

permissions:
  contents: read
  statuses: write

env:
  PR_NUMBER: '208'
  PREVIEW_WORKER: phoenix-journeys-pr-208
  PREVIEW_URL: https://phoenix-journeys-pr-208.7hn5tyrjgh.workers.dev
  PREVIEW_RELEASE: 49a088c550649432a42bae3009cc5a555b469ccb

jobs:
  exact-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact product candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PREVIEW_RELEASE }}
          fetch-depth: 0

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          test -z "$(git status --porcelain)"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Apply minimal semantic matcher fix for targeted validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          structural = re.compile(
              r"3\s*=>\s*stepThreePage\s*==\s*PilotN1CompositePage\.reflection"
              r"\s*\?\s*_wonderPage\(\)\s*:\s*_challengePage\(\)"
          )
          current_valid = '''
          3 =>
            stepThreePage == PilotN1CompositePage.reflection
                ? _wonderPage()
                : _challengePage(),
          '''
          eager_invalid = '''
          3 => Column(children: [_wonderPage(), _challengePage()]),
          '''
          if not structural.search(current_valid):
              raise SystemExit('semantic matcher rejects current valid step-3 selector')
          if structural.search(eager_invalid):
              raise SystemExit('semantic matcher accepts eager dual-stage construction')

          path = Path('app/test/journey_runtime_performance_gate_test.dart')
          text = path.read_text()
          old = "    expect(build, contains('3 => stepThreePage'));"
          new = """    expect(\n      build,\n      matches(\n        RegExp(\n          r'3\\s*=>\\s*stepThreePage\\s*==\\s*PilotN1CompositePage\\.reflection\\s*\\?\\s*_wonderPage\\(\\)\\s*:\\s*_challengePage\\(\\)',\n        ),\n      ),\n    );"""
          if text.count(old) != 1:
              raise SystemExit('known stale matcher is not unique')
          path.write_text(text.replace(old, new, 1))
          PY
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          test "$(git diff --name-only)" = "app/test/journey_runtime_performance_gate_test.dart"
          git diff -- app/test/journey_runtime_performance_gate_test.dart

      - name: Targeted validate visible-stage contract
        id: targeted
        working-directory: app
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded test/journey_runtime_performance_gate_test.dart 2>&1 | tee ../targeted_visible_stage.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Upload targeted failure evidence
        if: ${{ always() && steps.targeted.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: targeted-visible-stage-${{ env.PREVIEW_RELEASE }}
          path: targeted_visible_stage.log
          if-no-files-found: error

      - name: Restore exact candidate after targeted validation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- app/test/journey_runtime_performance_gate_test.dart
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Analyze exact candidate
        working-directory: app
        run: flutter analyze

      - name: Apply minimal semantic matcher fix for Full Flutter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/test/journey_runtime_performance_gate_test.dart')
          text = path.read_text()
          old = "    expect(build, contains('3 => stepThreePage'));"
          new = """    expect(\n      build,\n      matches(\n        RegExp(\n          r'3\\s*=>\\s*stepThreePage\\s*==\\s*PilotN1CompositePage\\.reflection\\s*\\?\\s*_wonderPage\\(\\)\\s*:\\s*_challengePage\\(\\)',\n        ),\n      ),\n    );"""
          if text.count(old) != 1:
              raise SystemExit('known stale matcher is not unique')
          path.write_text(text.replace(old, new, 1))
          PY
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          test "$(git diff --name-only)" = "app/test/journey_runtime_performance_gate_test.dart"

      - name: Full Flutter once and generate quality evidence
        id: flutter_test
        working-directory: app
        shell: bash
        env:
          PHOENIX_GENERATE_QUALITY_REPORT: '1'
          PHOENIX_QUALITY_MARKDOWN: ${{ github.workspace }}/journey-quality-report.md
          PHOENIX_QUALITY_JSON: ${{ github.workspace }}/journey-quality-report.json
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee ../full_flutter.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [[ "$test_status" -ne 0 ]]; then
            first_failure="$(awk '/\[E\]|TestFailure|Expected:|Actual:|Which:|test\/.*\.dart/ { print; exit }' ../full_flutter.log)"
            if [[ -n "$first_failure" ]]; then
              echo "::error title=Full Flutter first failure::$first_failure"
            else
              echo '::error title=Full Flutter first failure::See Full Flutter failure artifact.'
            fi
          fi
          exit "$test_status"

      - name: Upload Full Flutter failure evidence
        if: ${{ always() && steps.flutter_test.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: full-flutter-${{ env.PREVIEW_RELEASE }}-minimal-matcher
          path: full_flutter.log
          if-no-files-found: error

      - name: Restore exact candidate after Full Flutter harness test
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- app/test/journey_runtime_performance_gate_test.dart
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload journey quality report
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-journey-content-quality-pr-208-49a088
          path: |
            journey-quality-report.md
            journey-quality-report.json
          if-no-files-found: error

      - name: Enforce quality release decision
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('journey-quality-report.json', 'utf8'));
          console.log(
            `Phoenix quality gate: ${report.approvedCount}/${report.inspectionCount} approved; ` +
            `minimum ${report.minimumScore}; average ${report.averageScore}.`,
          );
          if (!report.canPublish) {
            console.error(
              `Release blocked: ${report.needsRevisionCount} need revision and ${report.blockedCount} blocked.`,
            );
            process.exit(1);
          }
          NODE

      - name: Build exact preview web app once
        working-directory: app
        run: flutter build web --release

      - name: Validate same Cloudflare Worker bundle
        shell: bash
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run

      - name: Verify clean exact release before deploy
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Deploy same exact candidate artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$(git rev-parse HEAD)" = "$PREVIEW_RELEASE"
          npx --yes wrangler@4 deploy \
            --name "$PREVIEW_WORKER" \
            --var "PHOENIX_RELEASE:$PREVIEW_RELEASE"

      - name: Verify exact preview release
        shell: bash
        run: |
          set -euo pipefail
          health_url="${PREVIEW_URL}/api/health?commit=${PREVIEW_RELEASE}"
          verified=false
          for attempt in {1..18}; do
            response="$(curl --fail --silent --show-error "$health_url" || true)"
            echo "Preview release check ${attempt}/18: ${response:-no response}"
            if node -e '
              let health;
              try { health = JSON.parse(process.argv[1]); } catch (_) { process.exit(1); }
              const expected = process.argv[2];
              if (!health.ok || !health.ai || health.service !== "phoenix-journeys" || health.release !== expected) process.exit(1);
            ' "$response" "$PREVIEW_RELEASE"; then
              verified=true
              break
            fi
            sleep 5
          done
          [[ "$verified" == true ]]

      - name: Publish exact preview status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target="${PREVIEW_URL}/?unlock=all&prototype=journeys&v=${PREVIEW_RELEASE}"
          payload="$(node -e '
            const [url] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({
              state: "success",
              description: "Isolated Phoenix preview is ready",
              context: "cloudflare/preview",
              target_url: url
            }));
          ' "$target")"
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${PREVIEW_RELEASE}" \
            --data "$payload" >/dev/null
