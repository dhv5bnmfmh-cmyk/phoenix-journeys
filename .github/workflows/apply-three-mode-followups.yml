name: Apply three-mode follow-up fixes

on:
  push:
    branches:
      - preview/stable-journey-bf5fdf
    paths:
      - tools/fix_three_mode_followups.py
      - .github/workflows/apply-three-mode-followups.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR118 branch
        uses: actions/checkout@v4
        with:
          ref: preview/stable-journey-bf5fdf

      - name: Set up Flutter formatter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply follow-up fixes
        run: python3 tools/fix_three_mode_followups.py

      - name: Format changed Dart files
        run: |
          dart format \
            app/lib/widgets/journey_challenge_panel.dart \
            app/lib/widgets/special_journey_passport.dart \
            app/test/journey_challenge_panel_test.dart

      - name: Commit follow-up fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/widgets/journey_challenge_panel.dart \
            app/lib/widgets/special_journey_passport.dart \
            app/test/journey_challenge_panel_test.dart
          if git diff --cached --quiet; then
            echo "No follow-up changes to commit"
            exit 0
          fi
          git commit -m "fix: polish three-mode challenges and special journey entry"
          git push origin HEAD:preview/stable-journey-bf5fdf

# Includes scroll-aware challenge tests for long explanation cards.
