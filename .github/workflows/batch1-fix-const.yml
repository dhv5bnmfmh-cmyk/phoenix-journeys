name: Batch 1 Fix Const

on:
  push:
    branches:
      - preview/batch-1-final-founder-review
    paths:
      - '.github/workflows/batch1-fix-const.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply analyzer-only const fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/lib/screens/journey_screen.dart')
          s = p.read_text()
          old = """            _ForbiddenCityCompleteCard(\n              title: 'Journey Summary',\n              body: forbiddenCityJourneySummary,\n            ),"""
          new = """            const _ForbiddenCityCompleteCard(\n              title: 'Journey Summary',\n              body: forbiddenCityJourneySummary,\n            ),"""
          if old not in s:
              raise SystemExit('const-fix anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit analyzer fix
        run: |
          git config user.name 'Phoenix Preview Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/lib/screens/journey_screen.dart
          git commit -m 'fix: satisfy Forbidden City completion const lint'
          git push
