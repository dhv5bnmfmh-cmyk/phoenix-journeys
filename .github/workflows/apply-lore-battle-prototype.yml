name: Apply lore battle prototype

on:
  push:
    branches:
      - feature/summer-palace-lore-battle-prototype
    paths:
      - .github/apply-lore-battle-prototype

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip lore-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/summer-palace-lore-battle-prototype
          fetch-depth: 0

      - name: Apply integration patch
        run: python3 .github/apply-lore-battle-prototype

      - name: Remove one-shot patch files
        run: |
          rm .github/apply-lore-battle-prototype
          rm .github/workflows/apply-lore-battle-prototype.yml

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/screens/journey_screen.dart .github
          git commit -m "feat: integrate Summer Palace culture battle [skip lore-patch]"
          git push origin HEAD:feature/summer-palace-lore-battle-prototype
