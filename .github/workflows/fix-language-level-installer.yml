name: Fix Phoenix Language Level Installer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fix-language-level-installer.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/summer-palace-story-engine-pilot
          fetch-depth: 0

      - name: Remove unavailable format command
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          installer = Path('.github/workflows/apply-language-level-agent.yml')
          text = installer.read_text()
          block = """      - name: Format Journey screen
                run: dart format app/lib/screens/journey_screen.dart

          """
          if block not in text:
              raise SystemExit('format step not found')
          installer.write_text(text.replace(block, '', 1))
          PY
          rm .github/workflows/fix-language-level-installer.yml

      - name: Commit installer fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-language-level-agent.yml .github/workflows/fix-language-level-installer.yml
          git commit -m "fix: remove unavailable formatter from language agent installer"
          git push origin HEAD:feature/summer-palace-story-engine-pilot
