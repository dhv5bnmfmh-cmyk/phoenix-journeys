name: Batch 1 Final Preview Compose

on:
  push:
    branches:
      - preview/batch-1-final-founder-review
    paths:
      - '.github/workflows/batch1-final-preview-compose.yml'

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compose current Forbidden City with completed Bund package
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff 905369eab00b799c05eacb22093f58a60c45e4c5 92c55199d3142e0b0f9603b5b9b7d2e963a26815 -- app/lib/screens/journey_screen.dart > /tmp/bund-screen.patch

          git checkout origin/main -- \
            app/lib/data/adaptive_journey_level_runtime.dart \
            app/lib/data/beijing_story_catalog.dart \
            app/lib/data/journey_data.dart \
            app/lib/screens/journey_screen.dart \
            app/lib/widgets/journey_challenge_panel.dart \
            content/CN/BJ/CN-BJ-001/journey.json

          for path in \
            app/lib/data/forbidden_city_challenge_package.dart \
            app/lib/data/forbidden_city_journey_runtime.dart \
            app/lib/data/forbidden_city_trace_validation.dart \
            app/lib/data/forbidden_city_word_supplement.dart; do
            git checkout origin/main -- "$path"
          done

          git apply --3way /tmp/bund-screen.patch

          python - <<'PY'
          from pathlib import Path

          p = Path('app/lib/data/batch_one_adaptive_story_levels.dart')
          s = p.read_text()
          s = s.replace(
              "bool isBatchOneGoldJourney(String journeyId) =>\n    batchOneJourneyIds.contains(journeyId);",
              "bool isBatchOneGoldJourney(String journeyId) =>\n    journeyId == 'shanghai-bund';",
          )
          old = "BatchOneJourneyMemorySpec? batchOneMemorySpecFor(String journeyId) {\n  final journey = batchOneRemediationFor(journeyId);"
          new = "BatchOneJourneyMemorySpec? batchOneMemorySpecFor(String journeyId) {\n  if (journeyId != 'shanghai-bund') return null;\n  final journey = batchOneRemediationFor(journeyId);"
          if old not in s:
              raise SystemExit('batchOneMemorySpecFor anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('app/lib/data/adaptive_journey_level_runtime.dart')
          s = p.read_text()
          imp = "import 'all_journey_language_level_catalog.dart';\n"
          if "import 'batch_one_adaptive_story_levels.dart';" not in s:
              s = s.replace(imp, imp + "import 'batch_one_adaptive_story_levels.dart';\n", 1)
          anchor = "  if (experience.id == forbiddenCityJourneyId) {\n    return _resolveForbiddenCityLockedLevel(profile);\n  }\n"
          insert = anchor + "  if (isBatchOneGoldJourney(experience.id)) {\n    return buildBatchOneGoldLevel(\n      experience,\n      profile: profile,\n      knownWords: knownWords,\n    );\n  }\n"
          if anchor not in s:
              raise SystemExit('Forbidden City resolver anchor missing')
          s = s.replace(anchor, insert, 1)
          p.write_text(s)
          PY

          rm -f \
            app/test/batch_one_gold_standard_journey_test.dart \
            app/test/batch_one_journey_remediation_test.dart \
            app/test/batch_one_journey_summary_test.dart

          git diff --check

      - name: Commit composed preview candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Phoenix Preview Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'preview: compose final Forbidden City and Bund candidate'
          git push
