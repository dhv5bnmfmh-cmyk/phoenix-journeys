name: Batch 1 Final Preview Compose

on:
  push:
    branches:
      - preview/batch-1-final-founder-review
    paths:
      - '.github/workflows/batch1-final-preview-compose.yml'

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compose current Forbidden City with completed Bund package
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          git checkout origin/main -- \
            app/lib/data/adaptive_journey_level_runtime.dart \
            app/lib/data/beijing_story_catalog.dart \
            app/lib/data/journey_data.dart \
            app/lib/screens/journey_screen.dart \
            app/lib/widgets/journey_challenge_panel.dart \
            content/CN/BJ/CN-BJ-001/journey.json

          for path in \
            app/lib/data/forbidden_city_challenge_package.dart \
            app/lib/data/forbidden_city_journey_runtime.dart \
            app/lib/data/forbidden_city_trace_validation.dart \
            app/lib/data/forbidden_city_word_supplement.dart; do
            git checkout origin/main -- "$path"
          done

          python - <<'PY'
          from pathlib import Path

          p = Path('app/lib/data/batch_one_adaptive_story_levels.dart')
          s = p.read_text()
          s = s.replace(
              "bool isBatchOneGoldJourney(String journeyId) =>\n    batchOneJourneyIds.contains(journeyId);",
              "bool isBatchOneGoldJourney(String journeyId) =>\n    journeyId == 'shanghai-bund';",
          )
          old = "BatchOneJourneyMemorySpec? batchOneMemorySpecFor(String journeyId) {\n  final journey = batchOneRemediationFor(journeyId);"
          new = "BatchOneJourneyMemorySpec? batchOneMemorySpecFor(String journeyId) {\n  if (journeyId != 'shanghai-bund') return null;\n  final journey = batchOneRemediationFor(journeyId);"
          if old not in s:
              raise SystemExit('batchOneMemorySpecFor anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('app/lib/data/adaptive_journey_level_runtime.dart')
          s = p.read_text()
          imp = "import 'all_journey_language_level_catalog.dart';\n"
          if "import 'batch_one_adaptive_story_levels.dart';" not in s:
              s = s.replace(imp, imp + "import 'batch_one_adaptive_story_levels.dart';\n", 1)
          anchor = "  if (experience.id == forbiddenCityJourneyId) {\n    return _resolveForbiddenCityLockedLevel(profile);\n  }\n"
          insert = anchor + "  if (isBatchOneGoldJourney(experience.id)) {\n    return buildBatchOneGoldLevel(\n      experience,\n      profile: profile,\n      knownWords: knownWords,\n    );\n  }\n"
          if anchor not in s:
              raise SystemExit('Forbidden City resolver anchor missing')
          s = s.replace(anchor, insert, 1)
          p.write_text(s)

          p = Path('app/lib/screens/journey_screen.dart')
          s = p.read_text()
          s = s.replace(
              "import '../data/adaptive_journey_level_runtime.dart';\n",
              "import '../data/adaptive_journey_level_runtime.dart';\nimport '../data/batch_one_adaptive_story_levels.dart';\n",
              1,
          )
          s = s.replace(
              "import '../widgets/city_journey_stamp.dart';\n",
              "import '../widgets/batch_one_journey_summary.dart';\nimport '../widgets/city_journey_stamp.dart';\n",
              1,
          )

          finish_anchor = "  Future<void> _finishJourney() async {\n    await _narration.stop();\n    await _appState.completeJourney(\n      _isForbiddenCity ? forbiddenCityMemoryAnchor : memoryController.text,\n    );"
          finish_new = "  String _batchOneStructuredMemory(BatchOneJourneyMemorySpec spec) {\n    final words = _levelContent.words.map((entry) => entry.word).take(6).join('、');\n    return <String>[\n      '故事结果：${spec.storyResult}',\n      '核心文化点：${spec.culturalPoint}',\n      '重点词汇：${words.isEmpty ? '本级重点词已复习' : words}',\n      'Challenge 表现：段落重组、语法修复、补全句子三种模式全部完成',\n      '长期记忆点：${spec.longTermAnchor}',\n    ].join('\\n');\n  }\n\n  Future<void> _finishJourney() async {\n    await _narration.stop();\n    final batchSpec = batchOneMemorySpecFor(_experience.id);\n    if (batchSpec != null) {\n      memoryController.text = _batchOneStructuredMemory(batchSpec);\n    }\n    await _appState.completeJourney(\n      _isForbiddenCity ? forbiddenCityMemoryAnchor : memoryController.text,\n    );"
          if finish_anchor not in s:
              raise SystemExit('finishJourney anchor missing')
          s = s.replace(finish_anchor, finish_new, 1)

          mem_anchor = "  Widget _memoryPage() {\n    if (_isForbiddenCity) return _forbiddenCityMemoryPage();\n\n    final keyboardVisible = memoryFocusNode.hasFocus;"
          mem_new = "  Widget _memoryPage() {\n    if (_isForbiddenCity) return _forbiddenCityMemoryPage();\n\n    final batchSpec = batchOneMemorySpecFor(_experience.id);\n    if (batchSpec != null) {\n      return _page(\n        title: '旅程回忆',\n        buttonText: '保存回忆并完成',\n        buttonIcon: Icons.flag_rounded,\n        onNext: () => unawaited(_finishJourney()),\n        child: BatchOneJourneySummary(\n          spec: batchSpec,\n          words: _levelContent.words.map((entry) => entry.word).toList(growable: false),\n          challengeCompleted: true,\n          displayText: _appState.displayText,\n        ),\n      );\n    }\n\n    final keyboardVisible = memoryFocusNode.hasFocus;"
          if mem_anchor not in s:
              raise SystemExit('memoryPage anchor missing')
          s = s.replace(mem_anchor, mem_new, 1)

          complete_anchor = "  Widget _completePage() {\n    if (_isForbiddenCity) return _forbiddenCityCompletePage();\n\n    return _page("
          complete_new = "  Widget _completePage() {\n    if (_isForbiddenCity) return _forbiddenCityCompletePage();\n\n    final batchSpec = batchOneMemorySpecFor(_experience.id);\n    if (batchSpec != null) {\n      return _page(\n        title: '${_experience.city}已点亮',\n        buttonText: '返回首页',\n        buttonIcon: Icons.home_outlined,\n        showBack: false,\n        onNext: () => Navigator.of(context).pop(),\n        child: Stack(\n          children: [\n            const Positioned(\n              top: 2,\n              left: 2,\n              child: Text('盖章成功', style: TextStyle(color: PhoenixTheme.red, fontSize: 17, fontWeight: FontWeight.w900)),\n            ),\n            Align(\n              key: const ValueKey('completion-background-stamp'),\n              alignment: Alignment.topRight,\n              child: Padding(\n                padding: const EdgeInsets.only(top: 1, right: 2),\n                child: FittedBox(\n                  fit: BoxFit.contain,\n                  child: AnimatedCityJourneyStamp(journey: _experience, size: 70),\n                ),\n              ),\n            ),\n            Padding(\n              padding: const EdgeInsets.only(top: 34),\n              child: Column(\n                children: [\n                  Expanded(\n                    child: BatchOneJourneySummary(\n                      spec: batchSpec,\n                      words: _levelContent.words.map((entry) => entry.word).toList(growable: false),\n                      challengeCompleted: true,\n                      displayText: _appState.displayText,\n                      completion: true,\n                    ),\n                  ),\n                  const SizedBox(height: 5),\n                  SizedBox(\n                    height: 36,\n                    child: Row(\n                      children: [\n                        Expanded(\n                          child: JourneyShareButton(\n                            isTraditional: _appState.isTraditional,\n                            city: _experience.city,\n                            place: _experience.place,\n                            compact: true,\n                            label: _appState.displayText('分享旅程'),\n                          ),\n                        ),\n                        const SizedBox(width: 6),\n                        Expanded(\n                          child: OutlinedButton.icon(\n                            onPressed: () => unawaited(_restartJourney()),\n                            style: OutlinedButton.styleFrom(visualDensity: VisualDensity.compact, padding: const EdgeInsets.symmetric(horizontal: 8)),\n                            icon: const Icon(Icons.replay_rounded, size: 16),\n                            label: const Text('重新体验', maxLines: 1, overflow: TextOverflow.ellipsis, style: TextStyle(fontSize: 10.5)),\n                          ),\n                        ),\n                      ],\n                    ),\n                  ),\n                ],\n              ),\n            ),\n          ],\n        ),\n      );\n    }\n\n    return _page("
          if complete_anchor not in s:
              raise SystemExit('completePage anchor missing')
          s = s.replace(complete_anchor, complete_new, 1)
          p.write_text(s)
          PY

          rm -f \
            app/test/batch_one_gold_standard_journey_test.dart \
            app/test/batch_one_journey_remediation_test.dart \
            app/test/batch_one_journey_summary_test.dart

          git diff --check

      - name: Commit composed preview candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Phoenix Preview Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'preview: compose final Forbidden City and Bund candidate'
          git push
