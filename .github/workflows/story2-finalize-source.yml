name: Story 2 source finalizer

on:
  push:
    branches:
      - codex/beijing-forbidden-city-story-2

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[story2-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/beijing-forbidden-city-story-2
          fetch-depth: 0
      - name: Apply approved shared multi-story wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          journey = Path('app/lib/screens/journey_screen.dart')
          text = journey.read_text()
          import_anchor = "import '../data/forbidden_city_journey_runtime.dart';\n"
          import_line = "import '../data/journey_story_identity.dart';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('journey import anchor missing')
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          old = "  bool get _isForbiddenCity => _experience.id == forbiddenCityJourneyId;\n"
          new = old + "  bool get _usesAuthoredChallenge =>\n      _experience.id == forbiddenCityJourneyId ||\n      _experience.id == forbiddenCityStoryTwoJourneyId;\n"
          if '_usesAuthoredChallenge' not in text:
              if old not in text:
                  raise SystemExit('forbidden city predicate anchor missing')
              text = text.replace(old, new, 1)
          old_branch = "      child: _isForbiddenCity\n          ? HskStoryChallenge("
          new_branch = "      child: _usesAuthoredChallenge\n          ? HskStoryChallenge("
          if old_branch not in text and new_branch not in text:
              raise SystemExit('challenge branch anchor missing')
          text = text.replace(old_branch, new_branch, 1)
          journey.write_text(text)

          contract = Path('docs/AUTHORITATIVE_STORY_DEVELOPMENT_CONTRACT.md')
          c = contract.read_text()
          marker = '## Active Challenge contract: 2 × 6\n'
          section = '''## Shared multi-Story Destination capability\n\nA Destination MAY contain more than one authored Story. Multi-Story support is a\nshared product capability, never a Story-specific engine or alternate Journey\nshell. A Story is identified within its Destination by stable `destinationId`\nand `storyId` identity, and each Story MUST retain isolated progress, resume,\nChallenge, Memory, narration, and completion state. Multiple Stories MAY bind\nto the same canonical place/GeoNode when their Story identities are distinct.\n\nSingle-Story Destinations retain the existing direct-open behavior. A\nmulti-Story Destination inserts the shared Story-selection step before the\nexisting Level/Journey flow. This exception is limited to shared Destination →\nStory selection and Story-scoped identity/state; it does not authorize a\nStory-specific layout, Challenge engine, page shell, lifecycle, or release path.\nThe Founder-approved Forbidden City Golden Story remains the regression\nreference and its existing behavior/state namespace MUST remain compatible.\n\n'''
          if '## Shared multi-Story Destination capability' not in c:
              if marker not in c:
                  raise SystemExit('contract insertion anchor missing')
              c = c.replace(marker, section + marker, 1)
          contract.write_text(c)

          Path('.github/workflows/story2-finalize-source.yml').unlink()
          PY
      - name: Commit successor source wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/lib/screens/journey_screen.dart docs/AUTHORITATIVE_STORY_DEVELOPMENT_CONTRACT.md .github/workflows/story2-finalize-source.yml
          git commit -m "[story2-finalized] Wire authored challenge and shared multi-story contract"
          git push origin HEAD:codex/beijing-forbidden-city-story-2
