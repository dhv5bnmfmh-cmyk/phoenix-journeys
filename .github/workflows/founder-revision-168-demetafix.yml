name: Founder Revision 168 De-Meta Fix

on:
  push:
    branches:
      - gold/guangzhou-chen-clan-story

permissions:
  contents: write

jobs:
  apply-narrow-founder-revision:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: gold/guangzhou-chen-clan-story
          fetch-depth: 2

      - name: Guard reviewed parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "ffce7043f9061e71010b530c52d20f607310cfe7"

      - name: Apply Founder Revision 1 only
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          story_path = Path('app/lib/data/guangzhou_chen_clan_one_pass.dart')
          semantic_path = Path('app/lib/data/journey_semantic_fingerprint_catalog.dart')
          test_path = Path('app/test/guangzhou_chen_clan_one_pass_gate_test.dart')

          story = story_path.read_text()
          semantic = semantic_path.read_text()
          tests = test_path.read_text()

          replacements = {
          "二十二岁的版画学生梁遥和陶艺同学贺真在广州陈家祠进行跨材料练习。陈家祠集中展示多种岭南装饰工艺，同一建筑中的材料差异让“形式怎样依靠材料成立”变成一个现场可见的问题。两人只观察，不把纸、工具或颜料放到历史装饰表面；全部试切发生在自己的材料上。梁遥的目标是一件单张纸解释：作品离开桌面后仍须完整，贺真也必须能识别她从建筑装饰中观察到的主要形体关系。第一件原型却在剪完时散开。梁遥把每条可见轮廓都当成切割边界，追求字面复制；当最后一段纸被切掉，几个部分立刻断开。她意识到，问题不是需要补一条历史证据，更不是重新分类看到的对象，而是纸的材料限制要求另一种结构编码。":
          "二十二岁的版画学生梁遥和陶艺同学贺真在广州陈家祠进行跨材料练习。陈家祠集中展示多种岭南装饰工艺，同一建筑中的材料差异让“形式怎样依靠材料成立”变成一个现场可见的问题。两人只观察，不把纸、工具或颜料放到历史装饰表面；全部试切发生在自己的材料上。梁遥的目标是一件单张纸解释：作品离开桌面后仍须完整，贺真也必须能识别她从建筑装饰中观察到的主要形体关系。第一件原型却在剪完时散开。梁遥把每条可见轮廓都当成切割边界，追求字面复制；当最后一段纸被切掉，几个部分立刻断开。她把断开的几片重新并在桌上，发现最后被剪掉的正是让整张纸保持相连的部分。原来的形体可以依靠材料和基底保持关系，薄纸却需要自己的连接。",
          "梁遥没有把失败当成值得保留的不完整结果，也没有拒绝继续制作。她换第二张自己的纸，重新编码连接：主要形体的位置、方向和相互靠近方式继续保留，但原本会完全分离的节点留下窄纸桥。纸桥没有冒充历史装饰的真实线条，只负责让纸的结构连续。她剪完第二件原型，从一角提起；整张纸仍完整连在一起。贺真没有看草图，也没有以导师身份给她答案，却准确识别两组主要形体之间的相接关系。改变编码让新的纸对象既能工作又保持可读。梁遥从表面复制者转成材料翻译者，把“逐线照搬”改写成“关系在新媒介里怎样成立”。回到工作室，她拿起一块不同的版材，先标出这种材料必须保留的连接，再开始新的材料研究。":
          "梁遥把散开的第一件放到一边，铺开第二张自己的纸。她重新编码连接：主要形体的位置、方向和相互靠近方式继续保留，但原本会完全分离的节点留下窄纸桥。纸桥没有冒充历史装饰的真实线条，只负责让纸的结构连续。她剪完第二件原型，从一角提起；整张纸仍完整连在一起。贺真把草图扣在桌面，只看成品。几秒后，他准确识别两组主要形体之间的相接关系。改变编码让新的纸对象既能工作又保持可读。梁遥从表面复制者转成材料翻译者，把“逐线照搬”改写成“关系在新媒介里怎样成立”。回到工作室，她拿起一块不同的版材，先标出这种材料必须保留的连接，再开始新的材料研究。",
          "二十二岁的版画学生梁遥和陶艺同学贺真在广州陈家祠观察建筑装饰。陈家祠集中展示多种岭南装饰工艺，正因为材料并不相同，梁遥把“材料怎样让形体相接”当成观察重点。两人只观察，不把纸贴到、压到、描在或摩擦任何历史表面；所有试切都在自己的材料上完成。梁遥想把自己观察到的一组主要形体关系做成一张单张纸的解释，让它既能拿在手里保持为一个整体，又让贺真仍能认出那组关系。她的第一件原型却在桌面上散开：她把每一道看见的轮廓都当成必须照搬的边界，剪到两组形体之间时，纸上原本承担连接的部分也被一起去掉，几个部分随即断开。问题不是她少看了证据，也不是要判断哪一种历史解释更真实；是纸这种材料不能替孤立形体保持原先的连接。字面复制越彻底，单张纸反而越无法成为一件东西。":
          "二十二岁的版画学生梁遥和陶艺同学贺真在广州陈家祠观察建筑装饰。陈家祠集中展示多种岭南装饰工艺，正因为材料并不相同，梁遥把“材料怎样让形体相接”当成观察重点。两人只观察，不把纸贴到、压到、描在或摩擦任何历史表面；所有试切都在自己的材料上完成。梁遥想把自己观察到的一组主要形体关系做成一张单张纸的解释，让它既能拿在手里保持为一个整体，又让贺真仍能认出那组关系。她的第一件原型却在桌面上散开：她把每一道看见的轮廓都当成必须照搬的边界，剪到两组形体之间时，纸上原本承担连接的部分也被一起去掉，几个部分随即断开。她把散开的几片重新并在桌上，发现最后被剪掉的正是让整张纸保持相连的部分。原来的形体可以依靠材料和基底保持关系，单张薄纸却需要自己的连接。字面复制越彻底，单张纸反而越无法成为一件东西。",
          "梁遥没有放弃完整结果，也没有接受一个故意残缺的版本。她停下逐线描摹，在第二张自己的纸上重新编码连接：保留主要形体的相对位置，却在原本会断开的地方留下窄窄的纸桥。纸桥不是她假装在陈家祠装饰上看见的新线，而是纸这种媒介为了保持结构而需要的连接。她剪完第二件原型，从一角把它提起；整张纸没有散开。贺真没有看她的草图，仍指出两组主要形体之间原先最重要的相接关系。新的纸片不是“少复制一点”的妥协，而是因为编码改变，所以同时获得连接性和可识别性。梁遥把第一件散开的碎片收进材料袋，没有给它改分类；她在笔记本上把“照着表面复制”划掉，写下“先问材料怎样连接”。回到工作室，她拿起一块新的版材，先标出这种材料必须保留的连接，再开始下一次材料研究。":
          "梁遥把第一件散开的碎片收到一边，重新铺开第二张纸。她停下逐线描摹，在第二张自己的纸上重新编码连接：保留主要形体的相对位置，却在原本会断开的地方留下窄窄的纸桥。纸桥不是她假装在陈家祠装饰上看见的新线，而是纸这种媒介为了保持结构而需要的连接。她剪完第二件原型，从一角把它提起；整张纸没有散开。贺真把草图扣在桌面，只看成品。几秒后，他准确指出两组主要形体之间原先最重要的相接关系。梁遥改变连接后，纸桥改变了局部轮廓，却让整张纸既能被拿起，也没有丢掉那组相接关系。梁遥把第一件散开的碎片收进材料袋。她在笔记本上把“照着表面复制”划掉，写下“先问材料怎样连接”。回到工作室，她拿起一块新的版材，先标出这种材料必须保留的连接，再开始下一次材料研究。",
          }

          for old, new in replacements.items():
              count = story.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one Story match, found {count}: {old[:40]}')
              story = story.replace(old, new)

          semantic_replacements = {
          "问题不是她少看了证据，也不是要判断哪一种历史解释更真实；是纸这种材料不能替孤立形体保持原先的连接。":
          "她把散开的几片重新并在桌上，发现最后被剪掉的正是让整张纸保持相连的部分。原来的形体可以依靠材料和基底保持关系，单张薄纸却需要自己的连接。",
          "新的纸片不是“少复制一点”的妥协，而是因为编码改变，所以同时获得连接性和可识别性。":
          "梁遥改变连接后，纸桥改变了局部轮廓，却让整张纸既能被拿起，也没有丢掉那组相接关系。",
          }
          for old, new in semantic_replacements.items():
              count = semantic.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one semantic match, found {count}: {old}')
              semantic = semantic.replace(old, new)

          old_peer = "贺真没有看她的草图，仍指出两组主要形体之间原先最重要的相接关系。"
          new_peer = "贺真把草图扣在桌面，只看成品。几秒后，他准确指出两组主要形体之间原先最重要的相接关系。"
          peer_count = semantic.count(old_peer)
          if peer_count != 3:
              raise SystemExit(f'Expected 3 peer evidence matches, found {peer_count}')
          semantic = semantic.replace(old_peer, new_peer)

          marker = "  test('Story explicitly avoids heritage-surface contact', () {"
          if tests.count(marker) != 1:
              raise SystemExit('Focused test insertion marker changed')
          regression = """  test('Lv9/Lv10 reader Story excludes semantic-governance meta language', () {\n    final advancedStory = <String>[\n      ...guangzhouChenClanOnePassLevels[8].storyParagraphs,\n      ...guangzhouChenClanOnePassLevels[9].storyParagraphs,\n    ].join();\n    const forbiddenMeta = <String>[\n      '历史证据',\n      '重新分类',\n      '历史解释',\n      '导师',\n      '妥协',\n      '改分类',\n      '故意残缺',\n    ];\n    for (final phrase in forbiddenMeta) {\n      expect(advancedStory, isNot(contains(phrase)), reason: phrase);\n    }\n    expect(advancedStory, contains('把断开的几片重新并在桌上'));\n    expect(advancedStory, contains('把草图扣在桌面，只看成品'));\n    expect(advancedStory, contains('纸桥改变了局部轮廓'));\n  });\n\n"""
          tests = tests.replace(marker, regression + marker)

          story_path.write_text(story)
          semantic_path.write_text(semantic)
          test_path.write_text(tests)
          PY

      - name: Verify narrow diff and protected scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'app/lib/data/guangzhou_chen_clan_one_pass.dart\napp/lib/data/journey_semantic_fingerprint_catalog.dart\napp/test/guangzhou_chen_clan_one_pass_gate_test.dart'
          git diff -- app/lib/data/guangzhou_chen_clan_one_pass.dart | grep -q '把断开的几片重新并在桌上'
          ! git diff --name-only | grep -Eq 'baseline_snapshot|background|passport|map|location'

      - name: Commit narrow repair to same PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/data/guangzhou_chen_clan_one_pass.dart \
                  app/lib/data/journey_semantic_fingerprint_catalog.dart \
                  app/test/guangzhou_chen_clan_one_pass_gate_test.dart
          git commit -m 'Founder Revision #1: naturalize Guangzhou Lv9-Lv10'
          git push origin HEAD:gold/guangzhou-chen-clan-story
