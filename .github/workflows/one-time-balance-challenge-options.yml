name: One-time balance challenge options

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  patch-and-remove:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/adaptive-level-content-v2
          fetch-depth: 0

      - name: Balance challenge option lengths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/lib/widgets/journey_challenge_panel.dart')
          source = path.read_text()

          option_count_marker = 'const int journeyChallengeOptionCount = 5;\n'
          helper = r'''

          @visibleForTesting
          List<String> selectBalancedChallengeDistractors({
            required Iterable<String> correctAnswers,
            required Iterable<String> candidates,
            required int count,
          }) {
            final correct = correctAnswers
                .map((value) => value.trim())
                .where((value) => value.isNotEmpty)
                .toList(growable: false);
            if (correct.isEmpty) {
              throw StateError('Challenge requires at least one correct answer.');
            }

            final correctSet = correct.toSet();
            final targetLength =
                (correct.fold<int>(0, (sum, value) => sum + _challengeVisibleLength(value)) /
                        correct.length)
                    .round();
            final uniqueCandidates = <String>[];
            for (final candidate in candidates) {
              final value = candidate.trim();
              if (value.isEmpty ||
                  correctSet.contains(value) ||
                  uniqueCandidates.contains(value)) {
                continue;
              }
              uniqueCandidates.add(value);
            }
            if (uniqueCandidates.length < count) {
              throw StateError('Challenge requires $count unique distractors.');
            }

            final ranked = uniqueCandidates.asMap().entries.toList()
              ..sort((left, right) {
                final leftDelta =
                    (_challengeVisibleLength(left.value) - targetLength).abs();
                final rightDelta =
                    (_challengeVisibleLength(right.value) - targetLength).abs();
                final byLength = leftDelta.compareTo(rightDelta);
                return byLength != 0 ? byLength : left.key.compareTo(right.key);
              });
            return ranked
                .take(count)
                .map((entry) => entry.value)
                .toList(growable: false);
          }

          @visibleForTesting
          int challengeOptionLengthSpread(Iterable<String> values) {
            final lengths = values
                .map(_challengeVisibleLength)
                .where((length) => length > 0)
                .toList(growable: false);
            if (lengths.length < 2) return 0;
            lengths.sort();
            return lengths.last - lengths.first;
          }

          int _challengeVisibleLength(String value) =>
              value.replaceAll(RegExp(r'\s+'), '').runes.length;
          '''
          if 'selectBalancedChallengeDistractors({' not in source:
            if option_count_marker not in source:
              raise SystemExit('option count marker not found')
            source = source.replace(option_count_marker, option_count_marker + helper, 1)

          option_container = '''        child: Container(
          width: double.infinity,
          padding: const EdgeInsets.fromLTRB(9, 8, 9, 8),'''
          balanced_container = '''        child: Container(
          width: double.infinity,
          constraints: const BoxConstraints(minHeight: 56),
          padding: const EdgeInsets.fromLTRB(9, 8, 9, 8),'''
          if 'constraints: const BoxConstraints(minHeight: 56)' not in source:
            if option_container not in source:
              raise SystemExit('option container marker not found')
            source = source.replace(option_container, balanced_container, 1)

          paragraph_start = source.index('  static _ChallengeSession _buildParagraph(')
          grammar_start = source.index('  static _ChallengeSession _buildGrammar(', paragraph_start)
          paragraph_method = r'''  static _ChallengeSession _buildParagraph(
            String journeyId,
            List<String> storyParagraphs,
            JourneyChallengeDifficulty difficulty,
            int seed,
          ) {
            final requiredCount = switch (difficulty) {
              JourneyChallengeDifficulty.beginner => 2,
              JourneyChallengeDifficulty.standard => 3,
              JourneyChallengeDifficulty.advanced => 3,
            };
            final source = _extractSentences(storyParagraphs);
            final fallback = <String>[
              '清晨，探索者来到今天的目的地。',
              '他沿着主要路线慢慢向前走。',
              '一路上的景色不断发生变化。',
              '最后，他把最深的发现记了下来。',
            ];
            final correctTexts = <String>[];
            for (final sentence in [...source, ...fallback]) {
              if (correctTexts.length >= requiredCount) break;
              if (!correctTexts.contains(sentence)) correctTexts.add(sentence);
            }
            final correctOptions = <_ChallengeOption>[
              for (var index = 0; index < correctTexts.length; index++)
                _ChallengeOption(
                  id: 'correct-$index',
                  text: correctTexts[index],
                  isCorrect: true,
                ),
            ];
            final distractorTexts = selectBalancedChallengeDistractors(
              correctAnswers: correctTexts,
              candidates: _paragraphDistractors(journeyId),
              count: journeyChallengeOptionCount - correctOptions.length,
            );
            final options = <_ChallengeOption>[
              ...correctOptions,
              for (var index = 0; index < distractorTexts.length; index++)
                _ChallengeOption(
                  id: 'distractor-$index',
                  text: distractorTexts[index],
                ),
            ]..shuffle(math.Random(seed + 17));
            if (_startsWithCorrectOrder(options, correctOptions)) {
              options.add(options.removeAt(0));
            }
            return _ChallengeSession(
              journeyId: journeyId,
              seed: seed,
              type: JourneyChallengeType.paragraphRebuild,
              difficulty: difficulty,
              options: options,
              correctIds: correctOptions.map((option) => option.id).toList(),
              questionTitle: '把散开的故事拼回来',
              instruction: '五个候选句中有 ${correctOptions.length} 句属于原文。请按故事发生的顺序依次点击。',
              explanation: '段落通常先交代地点或时间，再写行动，最后出现观察、变化或决定。',
              memoryTip: '记住“整体 → 行动 → 变化”，不要只看单句是否通顺。',
            );
          }

          '''
          source = source[:paragraph_start] + paragraph_method + source[grammar_start:]

          grammar_start = source.index('  static _ChallengeSession _buildGrammar(')
          missing_start = source.index('  static _ChallengeSession _buildMissing(', grammar_start)
          grammar_method = r'''  static _ChallengeSession _buildGrammar(
            String journeyId,
            JourneyChallengeDifficulty difficulty,
            int seed,
          ) {
            final grammar = _grammarForJourney(journeyId, difficulty, seed);
            final replacementCandidates = <String>[
              ...grammar.distractors,
              grammar.segments[grammar.problemSegmentIndex],
              ...switch (difficulty) {
                JourneyChallengeDifficulty.beginner => <String>[
                    '因此${grammar.correctReplacement}',
                    '而且${grammar.correctReplacement}',
                  ],
                JourneyChallengeDifficulty.standard => <String>[
                    '同时${grammar.correctReplacement}',
                    '${grammar.correctReplacement}还',
                  ],
                JourneyChallengeDifficulty.advanced => <String>[
                    '从而${grammar.correctReplacement}',
                    '由此${grammar.correctReplacement}',
                  ],
              },
            ];
            final distractorTexts = selectBalancedChallengeDistractors(
              correctAnswers: <String>[grammar.correctReplacement],
              candidates: replacementCandidates,
              count: journeyChallengeOptionCount - 1,
            );
            final optionTexts = <String>[
              grammar.correctReplacement,
              ...distractorTexts,
            ];
            final options = <_ChallengeOption>[
              for (var index = 0; index < journeyChallengeOptionCount; index++)
                _ChallengeOption(
                  id: index == 0 ? 'correct' : 'distractor-$index',
                  text: optionTexts[index],
                  isCorrect: index == 0,
                ),
            ]..shuffle(math.Random(seed + 31));

            return _ChallengeSession(
              journeyId: journeyId,
              seed: seed,
              type: JourneyChallengeType.grammarRepair,
              difficulty: difficulty,
              options: options,
              correctIds: const ['correct'],
              questionTitle: '修好这句不自然的话',
              instruction: '先点击病句位置，再从五个长度接近的修改方案中选出最自然的一项。',
              explanation: grammar.whyWrong,
              memoryTip: grammar.memoryTip,
              grammar: grammar,
            );
          }

          '''
          source = source[:grammar_start] + grammar_method + source[missing_start:]

          missing_start = source.index('  static _ChallengeSession _buildMissing(')
          grammar_spec_start = source.index('  static _GrammarSpec _grammarForJourney(', missing_start)
          missing_method = r'''  static _ChallengeSession _buildMissing(
            String journeyId,
            List<String> storyParagraphs,
            List<String> discoveryTexts,
            JourneyChallengeDifficulty difficulty,
            int seed,
          ) {
            final source = _extractSentences(storyParagraphs);
            final before = source.isNotEmpty ? source[0] : '清晨，探索者来到今天的目的地。';
            final correct = source.length >= 2 ? source[1] : '他沿着主要路线慢慢向前走。';
            final after = source.length >= 3 ? source[2] : '一路上的景色因此不断发生变化。';
            final distractors = selectBalancedChallengeDistractors(
              correctAnswers: <String>[correct],
              candidates: _missingDistractors(
                journeyId,
                discoveryTexts,
                difficulty,
              ),
              count: journeyChallengeOptionCount - 1,
            );
            final optionTexts = <String>[correct, ...distractors];
            final options = <_ChallengeOption>[
              for (var index = 0; index < journeyChallengeOptionCount; index++)
                _ChallengeOption(
                  id: index == 0 ? 'correct' : 'distractor-$index',
                  text: optionTexts[index],
                  isCorrect: index == 0,
                ),
            ]..shuffle(math.Random(seed + 47));

            return _ChallengeSession(
              journeyId: journeyId,
              seed: seed,
              type: JourneyChallengeType.missingSentence,
              difficulty: difficulty,
              options: options,
              correctIds: const ['correct'],
              questionTitle: '补回故事中消失的一句',
              instruction: '阅读前后文，从五个长度接近的答案中选出最能连接上下文的一句。',
              explanation: '正确句承接前文的人物与地点，同时为后文的变化、因果或决定铺路。',
              memoryTip: '补句要同时看两边：前一句留下什么，后一句为什么出现。',
              contextBefore: before,
              contextAfter: after,
            );
          }

          '''
          source = source[:missing_start] + missing_method + source[grammar_spec_start:]

          missing_distractors_start = source.index('  static List<String> _missingDistractors(')
          order_start = source.index('  static bool _startsWithCorrectOrder(', missing_distractors_start)
          missing_distractors_method = r'''  static List<String> _missingDistractors(
            String journeyId,
            List<String> discoveries,
            JourneyChallengeDifficulty difficulty,
          ) {
            final specific = switch (journeyId) {
              'literary-roaming' => [
                '他决定统计竹子的数量，不再观察蝴蝶。',
                '梦境立刻消失，故事也不再讨论醒来。',
                '所有路牌都被收走，因此没有出现选择。',
              ],
              'myth-tracing' => [
                '他把遗简交给山下的商店换了一把雨伞。',
                '月光消失以后，海边突然出现现代高楼。',
                '白兔没有等待任何东西，也没有守着空匣。',
              ],
              'strange-night-talks' => [
                '他打开窗户计算雨滴，没有听见任何声音。',
                '客栈立刻变成白天，夜客也离开了故事。',
                '门外的人只询问房价，从未叫出你的名字。',
              ],
              'folk-secret-land' => [
                '他把所有河灯吹灭，河面从此没有倒影。',
                '灯纸上写的是菜单，与前后的名字无关。',
                '河水完全停止流动，因此不存在上游和下游。',
              ],
              _ => [
                '他没有进入景区，直接回到了住处。',
                '所有建筑完全一样，所以不必继续观察。',
                '天气突然改变，但这与前后内容没有关系。',
              ],
            };
            final discoverySentences = _extractSentences(discoveries);
            final discoveryCandidate = discoverySentences.isEmpty
                ? null
                : discoverySentences.last;
            final levelCandidates = switch (difficulty) {
              JourneyChallengeDifficulty.beginner => <String>[
                  ...specific,
                  '他很快离开了这里，故事也在这一刻结束。',
                  '他继续向前走，却没有留意周围发生的变化。',
                ],
              JourneyChallengeDifficulty.standard => <String>[
                  ...specific,
                  if (discoveryCandidate != null) discoveryCandidate,
                  '他停下脚步，把沿途景色逐一写进记录里。',
                  '他沿着原来的路线前进，却忽略了前后线索。',
                ],
              JourneyChallengeDifficulty.advanced => <String>[
                  if (discoveryCandidate != null) discoveryCandidate,
                  ...specific,
                  '他重新检查前文线索，却没有改变原来的判断。',
                  '他看似回应了前文，却无法解释后面出现的结果。',
                ],
            };
            final result = <String>[];
            for (final candidate in levelCandidates) {
              final value = candidate.trim();
              if (value.isEmpty || result.contains(value)) continue;
              result.add(value);
            }
            return result;
          }

          '''
          source = source[:missing_distractors_start] + missing_distractors_method + source[order_start:]

          path.write_text(source)

          test_path = Path('app/test/challenge_option_balance_test.dart')
          test_path.write_text(r'''import 'package:flutter_test/flutter_test.dart';
          import 'package:phoenix_journeys/widgets/journey_challenge_panel.dart';

          void main() {
            test('balanced distractors stay unique and close to answer length', () {
              const correct = '他沿着长廊慢慢向前走。';
              final selected = selectBalancedChallengeDistractors(
                correctAnswers: const <String>[correct],
                candidates: const <String>[
                  '短。',
                  '他沿着长廊缓缓向前走。',
                  '探索者沿着长廊继续向前走。',
                  '沿着长廊，他慢慢向前走。',
                  '他沿长廊向前走去。',
                  '他沿着长廊缓缓向前走。',
                  '这是一个非常非常长并且会明显暴露答案位置的候选句。',
                ],
                count: 4,
              );

              expect(selected, hasLength(4));
              expect(selected.toSet(), hasLength(4));
              expect(selected, isNot(contains(correct)));
              expect(selected, isNot(contains('短。')));
              expect(
                selected,
                isNot(contains('这是一个非常非常长并且会明显暴露答案位置的候选句。')),
              );
              expect(
                challengeOptionLengthSpread(<String>[correct, ...selected]),
                lessThanOrEqualTo(6),
              );
            });

            test('balanced distractors reject an insufficient unique pool', () {
              expect(
                () => selectBalancedChallengeDistractors(
                  correctAnswers: const <String>['正确答案'],
                  candidates: const <String>['正确答案', '同一个答案', '同一个答案'],
                  count: 2,
                ),
                throwsStateError,
              );
            });
          }
          ''')

          rule_path = Path('worker/challenge_option_balance_rule.test.mjs')
          rule_path.write_text(r'''import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import test from 'node:test';

          const panel = readFileSync(
            'app/lib/widgets/journey_challenge_panel.dart',
            'utf8',
          );

          test('all challenge modes select length-balanced unique distractors', () => {
            assert.match(panel, /selectBalancedChallengeDistractors/);
            assert.match(panel, /challengeOptionLengthSpread/);
            assert.equal(
              (panel.match(/selectBalancedChallengeDistractors\(/g) ?? []).length,
              4,
            );
            assert.match(panel, /correctSet\.contains\(value\)/);
            assert.match(panel, /uniqueCandidates\.contains\(value\)/);
            assert.match(panel, /_challengeVisibleLength/);
            assert.doesNotMatch(
              panel,
              /while \(options\.length < journeyChallengeOptionCount\)/,
            );
          });

          test('option cards keep a common visual floor without truncating text', () => {
            assert.match(panel, /BoxConstraints\(minHeight: 56\)/);
            assert.doesNotMatch(panel, /maxLines: 1,[\s\S]{0,120}option\.text/);
            assert.match(panel, /五个长度接近的修改方案/);
            assert.match(panel, /五个长度接近的答案/);
          });
          ''')
          PY

      - name: Commit product changes and remove migration files
        shell: bash
        run: |
          rm -f .github/workflows/one-time-balance-challenge-options.yml
          rm -f docs/trigger-balance-challenge-options.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/widgets/journey_challenge_panel.dart \
            app/test/challenge_option_balance_test.dart \
            worker/challenge_option_balance_rule.test.mjs \
            .github/workflows/one-time-balance-challenge-options.yml \
            docs/trigger-balance-challenge-options.txt
          git commit -m "Balance adaptive challenge answer lengths"
          git push origin HEAD:agent/adaptive-level-content-v2
