name: Diagnose Node rules

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: agent/adaptive-level-content-v2
          fetch-depth: 0

      - name: Write compact failure report
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          report="diagnostics/node-rule-failure.txt"
          : > "$report"
          failed="false"

          for file in worker/*.test.mjs; do
            output="$(mktemp)"
            if node --test "$file" >"$output" 2>&1; then
              rm -f "$output"
              continue
            fi

            failed="true"
            echo "FAIL $file" >> "$report"
            echo "----- compact failure -----" >> "$report"
            tail -n 120 "$output" >> "$report"
            echo "----- end failure -----" >> "$report"
            rm -f "$output"
            break
          done

          if [[ "$failed" == "false" ]]; then
            echo "ALL NODE RULES PASS" >> "$report"
          fi

      - name: Commit report and remove diagnostic workflow
        shell: bash
        run: |
          rm .github/workflows/diagnose-node-rules.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/node-rule-failure.txt .github/workflows/diagnose-node-rules.yml
          git commit -m "Record compact Node rule diagnostics"
          git push origin HEAD:agent/adaptive-level-content-v2
