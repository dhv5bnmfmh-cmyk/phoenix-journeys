name: Batch 1 Story UI Patch

on:
  push:
    branches:
      - preview/batch-1-final-founder-review
    paths:
      - '.github/workflows/batch1-final-preview-validation.yml'

permissions:
  contents: write

jobs:
  patch-story-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v6
        with:
          ref: preview/batch-1-final-founder-review

      - name: Apply focused Forbidden City Story UI patch
        run: python .github/patch_forbidden_city_story_ui.py

      - name: Commit patched runtime
        shell: bash
        run: |
          git config user.name "phoenix-preview-bot"
          git config user.email "phoenix-preview-bot@users.noreply.github.com"
          git add app/lib/screens/journey_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore segmented Forbidden City Story reading UX"
          git push origin HEAD:preview/batch-1-final-founder-review
