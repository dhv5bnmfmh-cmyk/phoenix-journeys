name: Batch 1 Story Segment Binding Patch

on:
  push:
    branches:
      - preview/batch-1-final-founder-review
    paths:
      - '.github/workflows/batch1-final-preview-validation.yml'

permissions:
  contents: write

jobs:
  patch-story-segments:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v6
        with:
          ref: preview/batch-1-final-founder-review

      - name: Restore locked Story paragraph boundaries
        run: python .github/patch_forbidden_city_story_segments.py

      - name: Commit Story runtime binding fix
        shell: bash
        run: |
          git config user.name "phoenix-preview-bot"
          git config user.email "phoenix-preview-bot@users.noreply.github.com"
          git add app/lib/data/forbidden_city_journey_runtime.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix: bind Forbidden City Story to readable segments"
          git push origin HEAD:preview/batch-1-final-founder-review
