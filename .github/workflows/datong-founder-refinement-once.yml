name: Datong Founder Refinement Once

on:
  push:
    branches:
      - dev/current
    paths:
      - .github/workflows/datong-founder-refinement-once.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current Datong line
        uses: actions/checkout@v4
        with:
          ref: dev/current
          fetch-depth: 0
      - name: Apply Datong refinement
        run: python3 tools/datong_founder_refine_once.py
      - name: Format and verify patch
        run: |
          dart format app/lib/data/datong_yungang_gold_content.dart app/lib/widgets/journey_challenge_panel.dart app/test/datong_yungang_gold_runtime_test.dart app/test/datong_yungang_challenge_runtime_test.dart
          git diff --check
      - name: Commit final refinement tree
        run: |
          git config user.name "phoenix-founder-refinement"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/datong-founder-refinement-once.yml tools/datong_founder_refine_once.py
          git add app/lib/data/datong_yungang_gold_content.dart app/lib/widgets/journey_challenge_panel.dart app/test/datong_yungang_gold_runtime_test.dart app/test/datong_yungang_challenge_runtime_test.dart
          git commit -m "refine: deepen Datong history and challenge provenance"
          git push origin HEAD:dev/current
