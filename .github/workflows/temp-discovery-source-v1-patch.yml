name: Temp Discovery Source V1 Patch

on:
  push:
    branches:
      - automation/discovery-source-v1-f749

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/discovery-source-v1-f749
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply minimal product patch
        run: python3 .github/scripts/temp_discovery_source_v1_patch.py

      - name: Targeted tests and analyze
        shell: bash
        run: |
          cd app
          flutter pub get
          flutter test test/forbidden_city_discovery_authoritative_source_v1_test.dart
          flutter test test/founder_device_feedback_4point_regression_test.dart
          flutter analyze

      - name: Commit validated patch
        shell: bash
        run: |
          git rm .github/workflows/temp-discovery-source-v1-patch.yml
          git rm .github/scripts/temp_discovery_source_v1_patch.py
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat: show authoritative Discovery knowledge sources'
          git push origin HEAD:automation/discovery-source-v1-f749
