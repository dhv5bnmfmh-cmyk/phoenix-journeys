name: Trigger shadowing daily plan integration

on:
  push:
    branches:
      - agent/shadowing-pronunciation-diagnosis-v2
    paths:
      - .github/workflows/trigger-shadowing-daily-plan.yml

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shadowing-pronunciation-diagnosis-v2
          fetch-depth: 0
      - name: Trigger integration workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '\n# integration-trigger\n' >> .github/workflows/phoenix-shadowing-daily-plan.yml
          git rm .github/workflows/trigger-shadowing-daily-plan.yml
          git add .github/workflows/phoenix-shadowing-daily-plan.yml
          git commit -m "build: trigger daily plan integration"
          git push origin HEAD:agent/shadowing-pronunciation-diagnosis-v2
