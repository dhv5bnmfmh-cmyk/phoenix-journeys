name: Apply PR118 challenge integration

on:
  push:
    branches:
      - preview/stable-journey-bf5fdf
    paths:
      - tools/apply_pr118_challenge.py
      - .github/workflows/apply-pr118-challenge.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR118 branch
        uses: actions/checkout@v4
        with:
          ref: preview/stable-journey-bf5fdf

      - name: Set up Flutter formatter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply integration patch
        run: python3 tools/apply_pr118_challenge.py

      - name: Format changed Dart files
        run: |
          dart format \
            app/lib/screens/journey_screen.dart \
            app/lib/screens/city_passport_screen.dart \
            app/lib/state/app_state.dart \
            app/lib/widgets/journey_challenge_panel.dart \
            app/lib/widgets/special_journey_passport.dart

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/screens/journey_screen.dart \
            app/lib/screens/city_passport_screen.dart \
            app/lib/state/app_state.dart \
            app/lib/widgets/journey_challenge_panel.dart \
            app/lib/widgets/special_journey_passport.dart
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "feat: integrate adaptive challenges and special journey unlocks"
          git push origin HEAD:preview/stable-journey-bf5fdf
