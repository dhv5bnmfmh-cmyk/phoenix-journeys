name: Apply word sheet compatibility fix

on:
  push:
    branches:
      - feature/summer-palace-story-engine-pilot
    paths:
      - .github/workflows/apply-word-sheet-compat-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/summer-palace-story-engine-pilot
          fetch-depth: 0

      - name: Keep compact layout contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/lib/widgets/word_detail_sheet.dart')
          text = path.read_text()

          def once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'missing block: {label}')
              text = text.replace(old, new, 1)

          once(
          '''    builder: (sheetContext) => FractionallySizedBox(
      heightFactor: .62,
      child: _WordDetailSheet(
        narrationController: speedController,
        entries: studyEntries,
        initialIndex: safeIndex,
        onSpeak: effectiveOnSpeak,
        onSpeakEntry: effectiveOnSpeakEntry,
      ),
    ),
''',
          '''    builder: (sheetContext) {
      final size = MediaQuery.sizeOf(sheetContext);
      final sheetWidth = size.width;
      return ConstrainedBox(
        constraints: BoxConstraints(maxHeight: size.height * .52),
        child: ClipRect(
          child: FittedBox(
            fit: BoxFit.scaleDown,
            alignment: Alignment.topCenter,
            child: SizedBox(
              width: sheetWidth,
              child: _WordDetailSheet(
                narrationController: speedController,
                entries: studyEntries,
                initialIndex: safeIndex,
                onSpeak: effectiveOnSpeak,
                onSpeakEntry: effectiveOnSpeakEntry,
              ),
            ),
          ),
        ),
      );
    },
''',
          'sheet wrapper',
          )

          once(
          '''      child: Column(
        children: [
          _Header(
''',
          '''      child: Column(
        mainAxisSize: MainAxisSize.min,
        children: [
          _Header(
''',
          'content-sized column',
          )

          once(
          '''          Expanded(
            child: SingleChildScrollView(
              child: Column(
                children: [
''',
          '''          SingleChildScrollView(
            child: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
''',
          'remove expanded body',
          )

          once(
          '''                ],
              ),
            ),
          ),
          const SizedBox(height: 8),
''',
          '''              ],
            ),
          ),
          const SizedBox(height: 8),
''',
          'close content body',
          )

          once(
          '''                  label: Text(
                    state.displayText(isSaved ? '已收藏' : '收藏单词'),
                    maxLines: 1,
                    overflow: TextOverflow.ellipsis,
                  ),
''',
          '''                  label: FittedBox(
                    fit: BoxFit.scaleDown,
                    child: Text(
                      state.displayText(isSaved ? '已收藏' : '收藏单词'),
                      maxLines: 1,
                      softWrap: false,
                    ),
                  ),
''',
          'save label',
          )

          once(
          '''                  label: Text(
                    state.displayText('上一个'),
                    maxLines: 1,
                    overflow: TextOverflow.ellipsis,
                  ),
''',
          '''                  label: FittedBox(
                    fit: BoxFit.scaleDown,
                    child: Text(
                      state.displayText('上一个单词'),
                      maxLines: 1,
                      softWrap: false,
                    ),
                  ),
''',
          'previous label',
          )

          once(
          '''                  label: Text(
                    state.displayText(_isLast ? '完成' : '下一个'),
                    maxLines: 1,
                    overflow: TextOverflow.ellipsis,
                  ),
''',
          '''                  label: FittedBox(
                    fit: BoxFit.scaleDown,
                    child: Text(
                      state.displayText(_isLast ? '完成并收起' : '下一个单词'),
                      maxLines: 1,
                      softWrap: false,
                    ),
                  ),
''',
          'next label',
          )

          required = [
              'maxHeight: size.height * .52',
              'fit: BoxFit.scaleDown',
              'mainAxisSize: MainAxisSize.min',
              "state.displayText('上一个单词')",
              "_isLast ? '完成并收起' : '下一个单词'",
              'softWrap: false',
              '_resolveDownloadedExample',
              "state.displayText('已下载例句')",
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing marker after patch: {marker}')
          if 'FractionallySizedBox' in text or 'AI 正在查询实际用法' in text:
              raise SystemExit('stale loading UI remains')

          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/apply-word-sheet-compat-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/widgets/word_detail_sheet.dart .github/workflows/apply-word-sheet-compat-fix.yml
          git commit -m "fix: keep instant vocabulary examples in compact sheet"
          git push origin HEAD:feature/summer-palace-story-engine-pilot
