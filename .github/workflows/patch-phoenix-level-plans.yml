name: Patch Phoenix level plans

on:
  push:
    branches:
      - agent/adaptive-level-content-v2
    paths:
      - tool/patch_phoenix_level_plans.py
      - .github/workflows/patch-phoenix-level-plans.yml

permissions:
  contents: write

concurrency:
  group: patch-phoenix-level-plans
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/adaptive-level-content-v2
          fetch-depth: 0

      - name: Apply compatibility patch
        run: python3 tool/patch_phoenix_level_plans.py

      - name: Commit migrated source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/agents/phoenix_language_level_agent.dart tool/patch_phoenix_level_plans.py .github/workflows/patch-phoenix-level-plans.yml
          git diff --cached --quiet && exit 0
          git commit -m "Preserve legacy language calibration with Phoenix levels"
          git push origin HEAD:agent/adaptive-level-content-v2
