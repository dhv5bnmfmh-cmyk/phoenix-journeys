name: Forbidden City Final UI Test Repair

on:
  push:
    branches:
      - feature/forbidden-city-final-integration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/forbidden-city-final-integration

      - name: Make level selection helper lazy-grid safe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/test/forbidden_city_reference_integration_test.dart')
          text = p.read_text()
          old = '''Future<void> _tapKey(WidgetTester tester, String key) async {
  final finder = find.byKey(ValueKey(key));
  expect(finder, findsOneWidget, reason: key);
  await tester.ensureVisible(finder);
  await tester.tap(finder);
  await tester.pumpAndSettle();
}
'''
          new = '''Future<void> _tapKey(WidgetTester tester, String key) async {
  var finder = find.byKey(ValueKey(key));
  if (finder.evaluate().isEmpty && key.startsWith('forbidden-city-level-')) {
    final grid = find.byType(GridView);
    expect(grid, findsOneWidget, reason: 'level grid');
    for (var attempt = 0; attempt < 5 && finder.evaluate().isEmpty; attempt++) {
      await tester.drag(grid, const Offset(0, -180));
      await tester.pumpAndSettle();
      finder = find.byKey(ValueKey(key));
    }
  }
  expect(finder, findsOneWidget, reason: key);
  await tester.ensureVisible(finder);
  await tester.tap(finder);
  await tester.pumpAndSettle();
}
'''
          if old not in text:
              raise SystemExit('tap helper pattern missing')
          text = text.replace(old, new, 1)
          old2 = '''      final state = await _pumpHarness(tester);
      final level10 = find.byKey(const ValueKey('forbidden-city-level-10'));
      await tester.scrollUntilVisible(
        level10,
        240,
        scrollable: find.byType(Scrollable).first,
      );
      await tester.tap(level10);
      await tester.pumpAndSettle();
      final content = forbiddenCityLevelContent(10);
'''
          new2 = '''      final state = await _pumpHarness(tester);
      await _tapKey(tester, 'forbidden-city-level-10');
      final content = forbiddenCityLevelContent(10);
'''
          if old2 not in text:
              raise SystemExit('language test pattern missing')
          p.write_text(text.replace(old2, new2, 1))
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format and prove targeted language test
        working-directory: app
        run: |
          flutter pub get
          dart format test/forbidden_city_reference_integration_test.dart
          flutter test test/forbidden_city_reference_integration_test.dart --plain-name "runtime exposes Simplified Traditional English Vietnamese and Pinyin"

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/test/forbidden_city_reference_integration_test.dart
          git commit -m "Make Reference level selection tests lazy-grid safe"
          git push origin HEAD:feature/forbidden-city-final-integration
