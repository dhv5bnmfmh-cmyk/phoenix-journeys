name: Phase 3B-1 Object Inspector

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase3b-object-inspector.yml

permissions:
  actions: read
  contents: read

env:
  TARGET_SHA: b2554f2db2d56c898c0603a101c1094c6edd9090
  TARGET_WORKFLOW: phase3b-object-builder.yml

jobs:
  inspect-object-builder:
    runs-on: ubuntu-latest
    steps:
      - name: Locate and wait for object-builder push run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const [owner,repo]=process.env.GITHUB_REPOSITORY.split('/');
          const base=`https://api.github.com/repos/${owner}/${repo}`;
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          async function get(path){const r=await fetch(base+path,{headers});const t=await r.text();if(!r.ok)throw new Error(`${path} ${r.status}: ${t}`);return JSON.parse(t);}
          let run;
          for(let attempt=0;attempt<60;attempt++){
            const data=await get(`/actions/workflows/${process.env.TARGET_WORKFLOW}/runs?event=push&branch=agent%2Fdocumentation-sprint-01-18-recovery&per_page=50`);
            run=data.workflow_runs.find(x=>x.head_sha===process.env.TARGET_SHA);
            if(run&&run.status==='completed') break;
            await new Promise(r=>setTimeout(r,10000));
          }
          if(!run) throw new Error(`No push run found for ${process.env.TARGET_SHA}`);
          const jobs=await get(`/actions/runs/${run.id}/jobs?per_page=100`);
          const artifacts=await get(`/actions/runs/${run.id}/artifacts?per_page=100`);
          const report={run:{id:run.id,name:run.name,status:run.status,conclusion:run.conclusion,html_url:run.html_url},jobs:jobs.jobs.map(j=>({id:j.id,name:j.name,status:j.status,conclusion:j.conclusion,steps:j.steps?.map(s=>({name:s.name,status:s.status,conclusion:s.conclusion}))})),artifacts:artifacts.artifacts.map(a=>({id:a.id,name:a.name,size_in_bytes:a.size_in_bytes,expired:a.expired}))};
          writeFileSync('phase3b-object-inspector.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          if(run.conclusion!=='success') throw new Error(`Object builder conclusion: ${run.conclusion}`);
          NODE

      - name: Upload inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3b-object-inspector-${{ github.sha }}
          path: phase3b-object-inspector.json
          retention-days: 1
          if-no-files-found: error
