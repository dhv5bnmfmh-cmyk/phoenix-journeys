name: phoenix_journeys
description: A language journey app for exploring Chinese through culture, stories, and memories.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.5
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  intl: ^0.19.0
  http: ^1.2.2
  pinyin: ^3.3.0
  share_plus: ^12.0.2
  # Local speech recognition for shadowing practice.
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

