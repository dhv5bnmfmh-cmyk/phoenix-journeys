<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >
  <meta
    name="description"
    content="Phoenix Journeys — 通过语言、故事与文化探索世界。"
  >
  <meta name="theme-color" content="#180908">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Phoenix Journeys">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preload" as="image" href="phoenix-launch-cover.webp" type="image/webp">
  <link rel="manifest" href="manifest.json">

  <title>Phoenix Journeys</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #180908;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #180908;
    }

    body {
      min-height: 100dvh;
    }

    #phoenix-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: end center;
      box-sizing: border-box;
      padding:
        max(34px, env(safe-area-inset-top))
        28px
        max(64px, calc(env(safe-area-inset-bottom) + 38px));
      overflow: hidden;
      background:
        linear-gradient(
          180deg,
          rgba(12, 3, 3, .04) 0%,
          rgba(17, 5, 4, .10) 44%,
          rgba(13, 4, 4, .74) 73%,
          rgba(10, 3, 3, .96) 100%
        ),
        url("phoenix-launch-cover.webp") center 24% / cover no-repeat,
        #180908;
      transition: opacity 360ms ease, visibility 360ms ease;
    }

    #phoenix-loading::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 35%, rgba(224, 166, 72, .13), transparent 31%),
        linear-gradient(90deg, transparent, rgba(231, 184, 100, .12), transparent);
      mix-blend-mode: screen;
      opacity: .8;
    }

    #phoenix-loading.phoenix-loading--hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .phoenix-loading__content {
      position: relative;
      z-index: 1;
      width: min(100%, 380px);
      text-align: center;
      color: #fff8e9;
      text-shadow: 0 2px 14px rgba(0, 0, 0, .72);
    }

    .phoenix-loading__mark {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      margin: 0 auto 16px;
      border: 1px solid rgba(239, 194, 105, .72);
      border-radius: 50%;
      background: rgba(91, 19, 17, .56);
      box-shadow:
        0 0 0 5px rgba(207, 143, 49, .08),
        0 10px 34px rgba(0, 0, 0, .42);
      color: #f1c66d;
      font-family: "Songti SC", "STSong", serif;
      font-size: 25px;
      font-weight: 700;
      backdrop-filter: blur(8px);
    }

    .phoenix-loading__title {
      margin: 0;
      color: #fff8e9;
      font-size: clamp(22px, 6vw, 28px);
      font-weight: 850;
      letter-spacing: .12em;
    }

    .phoenix-loading__text {
      margin: 9px 0 22px;
      color: rgba(255, 238, 205, .78);
      font-size: 14px;
      line-height: 1.5;
      letter-spacing: .08em;
    }

    .phoenix-loading__bar {
      width: 100%;
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(243, 205, 129, .18);
      box-shadow: inset 0 0 0 1px rgba(255, 235, 190, .06);
    }

    .phoenix-loading__bar::after {
      content: "";
      display: block;
      width: 38%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #a76520, #ffd98a, #c88a32);
      box-shadow: 0 0 14px rgba(255, 201, 104, .72);
      animation: phoenix-loading 1.55s cubic-bezier(.4, 0, .2, 1) infinite;
    }

    @keyframes phoenix-loading {
      from { transform: translateX(-125%); }
      to { transform: translateX(365%); }
    }

    @media (max-height: 680px) {
      #phoenix-loading {
        padding-bottom: max(34px, calc(env(safe-area-inset-bottom) + 20px));
      }

      .phoenix-loading__mark {
        width: 46px;
        height: 46px;
        margin-bottom: 12px;
        font-size: 21px;
      }

      .phoenix-loading__text {
        margin-bottom: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .phoenix-loading__bar::after {
        animation-duration: 3s;
      }

      #phoenix-loading {
        transition-duration: 0ms;
      }
    }
  </style>
</head>
<body>
  <div id="phoenix-loading" role="status" aria-live="polite">
    <div class="phoenix-loading__content">
      <div class="phoenix-loading__mark" aria-hidden="true">凤</div>
      <p class="phoenix-loading__title">PHOENIX JOURNEYS</p>
      <p id="phoenix-loading-text" class="phoenix-loading__text">
        正在展开你的语言旅程…
      </p>
      <div class="phoenix-loading__bar" aria-hidden="true"></div>
    </div>
  </div>
  <script src="flutter_bootstrap.js?v={{flutter_service_worker_version}}" async></script>
</body>
</html>
